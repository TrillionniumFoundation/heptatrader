# The IB PAPER authority can observe but never mutate this root-controlled
# kill-switch. Type "f" never rewrites an existing inode, but any explicit
# tmpfiles --create after marker removal safely re-engages PAPER by default.
d /run/hepta/ib-paper-control 0750 root hepta-ib-exec -
f /run/hepta/ib-paper-control/kill-switch 0440 root hepta-ib-exec - engaged
