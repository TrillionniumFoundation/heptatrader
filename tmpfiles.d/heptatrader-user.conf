# Bootstrap fallback until final user deployment binds native-startup-hold.
# Later --create calls also recreate an absent hold. A deployment with the
# exact loaded Execution startup guard should omit only the kill-switch f rule.
d %t/heptatrader 0700 - - -
d %t/heptatrader/control 0750 - - -
f %t/heptatrader/control/kill-switch 0440 - - -
d %t/heptatrader/interlock 0711 - - -
f %t/heptatrader/interlock/session-cleanup.lock 0644 - - -
