# Passive Agent runtime and P1 admission parents only. No token, session, unit
# enablement, campaign, or authority is created here. The private admission
# parent is root-only; public policy and reader parents carry no credentials.
d /run/hepta-agent 0711 root root - -
f /run/hepta-agent/session-lease-terminal-cleanup.lock 0644 root root - -
d /var/lib/hepta/p1-admission 0755 root root - -
d /var/lib/hepta/p1-admission/private 0700 root root - -
d /var/lib/hepta/p1-admission/public 0755 root root - -
d /var/lib/hepta/p1-admission/readers 0755 root root - -
