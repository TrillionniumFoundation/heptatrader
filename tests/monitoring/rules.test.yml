rule_files:
- ../../systemd/monitoring/hepta.rules.yml.example
evaluation_interval: 1s
tests:
- name: dead-collector-exact-threshold
  interval: 1s
  input_series:
  - &id001
    series: up{job="heptatrader",instance="fixture:1"}
    values: 1x60
  - &id002
    series: hepta_gateway_collector_success{job="heptatrader",instance="fixture:1"}
    values: 1x60
  - &id003
    series: hepta_gateway_collector_timestamp_seconds{job="heptatrader",instance="fixture:1"}
    values: 0+1x60
  - &id004
    series: hepta_gateway_sample_timestamp_seconds{job="heptatrader",instance="fixture:1"}
    values: 0+1x60
  - &id005
    series: hepta_gateway_telemetry_fresh{job="heptatrader",instance="fixture:1"}
    values: 1x60
  - series: hepta_oms_collector_success{job="heptatrader",instance="fixture:1"}
    values: 1x60
  - series: hepta_oms_collector_timestamp_seconds{job="heptatrader",instance="fixture:1"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 30s
    alertname: HeptaCollectorStale
    exp_alerts: []
  - eval_time: 31s
    alertname: HeptaCollectorStale
    exp_alerts:
    - exp_labels:
        job: heptatrader
        instance: fixture:1
        severity: warning
        component: oms
      exp_annotations: &id007
        summary: Collector stopped, its clock is invalid, or its timestamp is missing
- name: healthy-heartbeat
  interval: 1s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - series: hepta_oms_collector_success{job="heptatrader",instance="fixture:1"}
    values: 1x60
  - series: hepta_oms_collector_timestamp_seconds{job="heptatrader",instance="fixture:1"}
    values: 0+1x60
  - series: hepta_oms_sample_timestamp_seconds{job="heptatrader",instance="fixture:1"}
    values: 0+1x60
  - series: hepta_oms_telemetry_fresh{job="heptatrader",instance="fixture:1"}
    values: 1x60
  alert_rule_test:
  - eval_time: 31s
    alertname: HeptaCollectorFailed
    exp_alerts: []
  - eval_time: 31s
    alertname: HeptaCollectorStale
    exp_alerts: []
  - eval_time: 31s
    alertname: HeptaObservationStale
    exp_alerts: []
- name: explicit-input-failure
  interval: 1s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - series: hepta_oms_collector_success{job="heptatrader",instance="fixture:1"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 1s
    alertname: HeptaCollectorFailed
    exp_alerts:
    - exp_labels:
        job: heptatrader
        instance: fixture:1
        severity: warning
        component: oms
      exp_annotations: &id006
        summary: Telemetry collection failed or its success signal is missing
- name: missing-input-success-signal
  interval: 1s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  alert_rule_test:
  - eval_time: 1s
    alertname: HeptaCollectorFailed
    exp_alerts:
    - exp_labels:
        job: heptatrader
        instance: fixture:1
        severity: warning
        component: oms
      exp_annotations: *id006
- name: future-collector-clock
  interval: 1s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - series: hepta_oms_collector_timestamp_seconds{job="heptatrader",instance="fixture:1"}
    values: 100x60
  alert_rule_test:
  - eval_time: 1s
    alertname: HeptaCollectorStale
    exp_alerts:
    - exp_labels:
        job: heptatrader
        instance: fixture:1
        severity: warning
        component: oms
      exp_annotations: *id007
- name: stale-sample-with-fresh-collector
  interval: 1s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - series: hepta_oms_collector_success{job="heptatrader",instance="fixture:1"}
    values: 1x60
  - series: hepta_oms_collector_timestamp_seconds{job="heptatrader",instance="fixture:1"}
    values: 0+1x60
  - series: hepta_oms_sample_timestamp_seconds{job="heptatrader",instance="fixture:1"}
    values: '0x60'
  - series: hepta_oms_telemetry_fresh{job="heptatrader",instance="fixture:1"}
    values: 1x60
  alert_rule_test:
  - eval_time: 15s
    alertname: HeptaObservationStale
    exp_alerts: []
  - eval_time: 16s
    alertname: HeptaObservationStale
    exp_alerts:
    - exp_labels:
        job: heptatrader
        instance: fixture:1
        severity: warning
        component: oms
      exp_annotations:
        summary: Daemon observation is stale, missing or future-dated
- name: capacity-inclusive-boundary
  interval: 1s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - series: hepta_oms_bytes{job="heptatrader",instance="fixture:1"}
    values: 800x60
  - series: hepta_oms_max_bytes{job="heptatrader",instance="fixture:1"}
    values: 1000x60
  alert_rule_test:
  - eval_time: 1s
    alertname: HeptaOmsHeadroomLow
    exp_alerts:
    - exp_labels:
        job: heptatrader
        instance: fixture:1
        severity: warning
        component: oms
      exp_annotations:
        summary: OMS history reached entry pause range; plan recovery capacity, do
          not truncate
- name: capacity-below-boundary
  interval: 1s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - series: hepta_oms_bytes{job="heptatrader",instance="fixture:1"}
    values: 799x60
  - series: hepta_oms_max_bytes{job="heptatrader",instance="fixture:1"}
    values: 1000x60
  alert_rule_test:
  - eval_time: 1s
    alertname: HeptaOmsHeadroomLow
    exp_alerts: []
- name: poisoned-writer
  interval: 1s
  input_series:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - series: hepta_oms_writer_poisoned{job="heptatrader",instance="fixture:1"}
    values: 1x60
  alert_rule_test:
  - eval_time: 1s
    alertname: HeptaOmsWriterPoisoned
    exp_alerts:
    - exp_labels:
        job: heptatrader
        instance: fixture:1
        severity: critical
        component: oms
      exp_annotations:
        summary: OMS durability failed; preserve evidence and use fenced recovery
- name: ib-collector-failure
  interval: 1s
  input_series:
  - *id001
  - series: hepta_ib_collector_success{job="heptatrader",instance="fixture:1"}
    values: '0x60'
  alert_rule_test:
  - eval_time: 1s
    alertname: HeptaIbCollectorFailed
    exp_alerts:
    - exp_labels:
        job: heptatrader
        instance: fixture:1
        severity: warning
        component: ib
      exp_annotations:
        summary: IB telemetry collection failed or its success signal is missing
- name: ib-reconciliation-pending
  interval: 1s
  input_series:
  - *id001
  - series: hepta_ib_runtime_telemetry_fresh{job="heptatrader",instance="fixture:1"}
    values: 1x60
  - series: hepta_ib_post_fill_reconciliation_pending{job="heptatrader",instance="fixture:1"}
    values: 1x60
  alert_rule_test:
  - eval_time: 1s
    alertname: HeptaIbReconciliationPending
    exp_alerts:
    - exp_labels:
        job: heptatrader
        instance: fixture:1
        severity: critical
        component: ib
      exp_annotations:
        summary: IB post-fill authoritative reconciliation remains pending
