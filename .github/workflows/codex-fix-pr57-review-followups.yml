name: Remediate PR57 review follow-ups

on:
  push:
    branches:
      - plan/p1-release-package-preflight-20260910
    paths:
      - .github/workflows/codex-fix-pr57-review-followups.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr57-review-followups
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact remediation carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact live branch object
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Repair discovery coverage and Broker probe admission
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one patch anchor, found {count}: {old!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          core = Path("scripts/hepta_preflight_core.py")
          replace_once(
              core,
              '''    manifest_sha256 = ""
    policy = _load_policy(_absolute_path(args.policy))
''',
              '''    manifest_sha256 = ""
    artifact_admitted = False
    policy = _load_policy(_absolute_path(args.policy))
''',
          )
          replace_once(
              core,
              '''        manifest, package_sha256, manifest_sha256 = inspect_archive(
            _absolute_path(args.artifact), args.expected_sha256, policy, args.profile
        )
        record("artifact.integrity", "PASS", "digest, archive, manifest and payload verified")
''',
              '''        manifest, package_sha256, manifest_sha256 = inspect_archive(
            _absolute_path(args.artifact), args.expected_sha256, policy, args.profile
        )
        artifact_admitted = True
        record("artifact.integrity", "PASS", "digest, archive, manifest and payload verified")
''',
          )
          replace_once(
              core,
              '''    if args.probe_broker:
        if args.profile != "ib-paper":
            record("broker.reachability", "FAIL", "Broker probing is valid only for ib-paper")
''',
              '''    if args.probe_broker:
        if not artifact_admitted:
            record(
                "broker.reachability",
                "FAIL",
                "Broker probing requires successful artifact and policy admission",
            )
        elif args.profile != "ib-paper":
            record("broker.reachability", "FAIL", "Broker probing is valid only for ib-paper")
''',
          )

          tests = Path("tests/python/test_hepta_preflight.py")
          text = tests.read_text(encoding="utf-8")
          start_token = "\ndef test_external_policy_must_match_packaged_policy(self) -> None:\n"
          start = text.find(start_token)
          end = text.find('\nif __name__ == "__main__":\n', start + 1)
          if start < 0 or end < 0:
              raise SystemExit("preflight regression block anchors drifted")
          start += 1
          block = text[start:end]
          method_names = (
              "test_external_policy_must_match_packaged_policy",
              "test_policy_cannot_exceed_compiled_archive_ceiling",
              "test_elevated_tar_mode_bits_are_rejected",
              "test_policy_symlink_argument_is_rejected",
              "test_artifact_ancestor_symlink_argument_is_rejected",
              "test_exact_static_host_matches_approved_artifact",
              "test_static_host_content_mutation_fails",
              "test_static_host_mode_mutation_fails",
              "test_static_host_extra_managed_file_fails",
              "test_static_host_build_metadata_mutation_fails",
              "test_static_host_owner_mismatch_is_rejected",
          )
          for name in method_names:
              if block.count(f"def {name}(self) -> None:") != 1:
                  raise SystemExit(f"missing or duplicate regression method: {name}")

          extra = r'''

    def test_declared_preflight_regressions_are_discovered(self) -> None:
        expected = {
            "test_external_policy_must_match_packaged_policy",
            "test_policy_cannot_exceed_compiled_archive_ceiling",
            "test_elevated_tar_mode_bits_are_rejected",
            "test_policy_symlink_argument_is_rejected",
            "test_artifact_ancestor_symlink_argument_is_rejected",
            "test_exact_static_host_matches_approved_artifact",
            "test_static_host_content_mutation_fails",
            "test_static_host_mode_mutation_fails",
            "test_static_host_extra_managed_file_fails",
            "test_static_host_build_metadata_mutation_fails",
            "test_static_host_owner_mismatch_is_rejected",
        }
        suite = unittest.defaultTestLoader.loadTestsFromTestCase(
            HeptaPreflightTests
        )
        discovered = {case.id().rsplit(".", 1)[-1] for case in suite}
        self.assertTrue(expected.issubset(discovered), expected - discovered)

    def test_rejected_artifacts_never_probe_broker(self) -> None:
        with tempfile.TemporaryDirectory() as directory:
            work = Path(directory)
            valid, package = self.valid_package(work / "valid", profile="ib-paper")
            fifo = work / "fifo.tar.gz"
            os.mkfifo(fifo)
            cases = (
                ("digest", valid, "0" * 64),
                ("missing", work / "missing.tar.gz", "0" * 64),
                ("fifo", fifo, "0" * 64),
            )
            for label, artifact, digest in cases:
                with self.subTest(label=label):
                    args = args_for(artifact, digest, profile="ib-paper")
                    args.probe_broker = True
                    with mock.patch.object(
                        preflight.socket, "create_connection"
                    ) as connect:
                        receipt = preflight.run_preflight(args)
                    connect.assert_not_called()
                    self.assertEqual(receipt["result"], "FAIL")
                    self.assertEqual(
                        check(receipt, "artifact.integrity")["status"],
                        "FAIL",
                    )
                    self.assertIn(
                        "successful artifact and policy admission",
                        check(receipt, "broker.reachability")["detail"],
                    )
'''
          repaired = (
              text[:start]
              + textwrap.indent(block, "    ")
              + extra
              + text[end:]
          )
          tests.write_text(repaired, encoding="utf-8")
          PY

      - name: Remove one-shot carrier before whole-tree validation
        run: |
          set -euo pipefail
          rm .github/workflows/codex-fix-pr57-review-followups.yml
          git diff --check

      - name: Run canonical core and all Python contracts
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev
          ./scripts/dev_core.sh
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          python3 -m unittest \
            tests.python.test_hepta_preflight.HeptaPreflightTests.test_declared_preflight_regressions_are_discovered \
            tests.python.test_hepta_preflight.HeptaPreflightTests.test_rejected_artifacts_never_probe_broker \
            -v

      - name: Run non-skipped CMake install integration
        run: |
          set -euo pipefail
          cmake -S . -B build/release-integration -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_IB_PROBE=OFF \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF \
            -DHEPTA_RELEASE_LABEL=0.1.0-beta.1
          cmake --build build/release-integration --parallel 2
          HEPTA_RELEASE_INTEGRATION_BUILD_DIR="$PWD/build/release-integration" \
            python3 -m unittest tests.python.test_cmake_install_integration -v

      - name: Publish final repaired release slice
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            scripts/hepta_preflight_core.py \
            tests/python/test_hepta_preflight.py \
            .github/workflows/codex-fix-pr57-review-followups.yml
          git commit -m 'fix(release): discover regressions and gate Broker probes'
          git push origin "HEAD:$EXPECTED_BRANCH"
