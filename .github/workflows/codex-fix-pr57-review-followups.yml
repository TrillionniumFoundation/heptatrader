name: Remediate PR57 review follow-ups

on:
  push:
    branches:
      - plan/p1-release-package-preflight-20260910
    paths:
      - .github/workflows/codex-fix-pr57-review-followups.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr57-review-followups
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact remediation carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact live branch object
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Repair discovery coverage and Broker probe admission
        env:
          PATCH_GZIP_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import os
          payload = base64.b64decode(os.environ['PATCH_GZIP_B64'], validate=True)
          source = gzip.decompress(payload)
          compile(source, 'fix_pr57.py', 'exec')
          exec(source, {'__name__': '__main__'})
          PY

      - name: Remove one-shot carrier before whole-tree validation
        run: |
          set -euo pipefail
          rm .github/workflows/codex-fix-pr57-review-followups.yml
          git diff --check

      - name: Run canonical core and all Python contracts
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev
          ./scripts/dev_core.sh
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          python3 -m unittest \
            tests.python.test_hepta_preflight.HeptaPreflightTests.test_declared_preflight_regressions_are_discovered \
            tests.python.test_hepta_preflight.HeptaPreflightTests.test_rejected_artifacts_never_probe_broker \
            -v

      - name: Run non-skipped CMake install integration
        run: |
          set -euo pipefail
          cmake -S . -B build/release-integration -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_IB_PROBE=OFF \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF \
            -DHEPTA_RELEASE_LABEL=0.1.0-beta.1
          cmake --build build/release-integration --parallel 2
          HEPTA_RELEASE_INTEGRATION_BUILD_DIR="$PWD/build/release-integration" \
            python3 -m unittest tests.python.test_cmake_install_integration -v

      - name: Publish final repaired release slice
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            scripts/hepta_preflight_core.py \
            tests/python/test_hepta_preflight.py \
            .github/workflows/codex-fix-pr57-review-followups.yml
          git commit -m 'fix(release): discover regressions and gate Broker probes'
          git push origin "HEAD:$EXPECTED_BRANCH"
