name: HeptaDLL branch inventory authoring (one time)
on:
  push:
    branches: [integration/heptadll-modular-20260922]
    paths:
      - .github/heptadll-authoring-once.py
      - .github/workflows/heptadll-authoring-once.yml
permissions:
  contents: read
jobs:
  author:
    if: github.repository == 'TrillionniumFoundation/heptatrader' && github.ref == 'refs/heads/integration/heptadll-modular-20260922'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Install build-model dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake make g++ libssl-dev zlib1g-dev python3-yaml
      - name: Generate source-owned additive inventory
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 .github/heptadll-authoring-once.py
      - name: Commit only to the authorized integration branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: integration/heptadll-modular-20260922
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt docs/build-targets.json docs/module-catalog.json docs/index.md docs/modules/agent-entry.md
          git diff --cached --check
          git commit -s -m 'build: wire SDK-free research targets and generate canonical ownership'
          git push origin "HEAD:refs/heads/$BRANCH"
