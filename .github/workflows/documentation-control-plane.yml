name: Documentation Control Plane

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: heptatrader-documentation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: documentation-control-plane-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install source-model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake make g++ libssl-dev

      # This lane owns source/document/build-model truth only. Core Runtime CI
      # owns the Python regression corpus and runtime/release behavior; those
      # tests are intentionally not repeated here.
      - name: Validate source truth contracts once
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/check_component_coverage.py
          python3 scripts/verify_build_ownership.py
          python3 scripts/check_gap_register.py
          python3 scripts/verify_canonical_ib_paper_profile.py
          python3 scripts/verify_source_gap_closures.py

      - name: Reassert clean source after source-model validation
        if: always()
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
