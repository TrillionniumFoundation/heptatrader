name: documentation-control-plane

on:
  pull_request: {}
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: documentation-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: documentation-control-plane-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install schema validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends python3-jsonschema
      - name: Validate canonical documentation and static module boundaries
        run: |
          git diff --check
          python3 -m py_compile \
            scripts/generate_documentation_views.py \
            scripts/generate_release_evidence.py \
            scripts/hepta_module_boundaries.py \
            scripts/hepta_document_checks.py \
            scripts/hepta_registry_checks.py \
            scripts/check_documentation_control_plane.py \
            scripts/check_repository_integrity.py \
            scripts/check_systemd_documentation.py \
            scripts/check_workflow_check_contexts.py \
            scripts/check_required_context_projections.py \
            scripts/check_github_team_mapping.py \
            scripts/verify_github_governance.py \
            scripts/check_module_discipline.py \
            scripts/check_cmake_module_graph.py \
            scripts/check_change_impact.py
          python3 scripts/generate_documentation_views.py --check
          python3 scripts/check_documentation_control_plane.py
          python3 scripts/check_repository_integrity.py
          python3 scripts/check_systemd_documentation.py
          python3 scripts/check_workflow_check_contexts.py
          python3 scripts/check_required_context_projections.py
          python3 scripts/check_github_team_mapping.py
          python3 scripts/check_module_discipline.py
          python3 -m unittest discover \
            -s tests/python -p 'test_documentation_control_plane.py'
          python3 -m unittest discover \
            -s tests/python -p 'test_module_documentation.py'
          python3 -m unittest discover \
            -s tests/python -p 'test_release_evidence.py'
          python3 -m unittest discover \
            -s tests/python -p 'test_systemd_documentation.py'
          python3 -m unittest discover \
            -s tests/python -p 'test_workflow_check_contexts.py'
          python3 -m unittest discover \
            -s tests/python -p 'test_required_context_projections.py'
          python3 -m unittest discover \
            -s tests/python -p 'test_github_team_mapping.py'
          python3 -m unittest discover \
            -s tests/python -p 'test_github_governance.py'
