name: Documentation Control Plane

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: heptatrader-documentation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documentation:
    name: documentation-control-plane-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Prepare exact tracked-source evidence for offline reproduction
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/heptatrader-source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/heptatrader-source.bundle"
          git rev-parse HEAD > "$RUNNER_TEMP/heptatrader-source.sha"

      - name: Retain source evidence without workspace or host state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-evidence-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/heptatrader-source.bundle
            ${{ runner.temp }}/heptatrader-source.sha
          if-no-files-found: error
          retention-days: 7

      - name: Install build-model validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake make g++ libssl-dev python3-yaml

      - name: Validate documentation and source truth contracts
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/check_qualification_trust_boundary.py
          python3 scripts/check_component_coverage.py
          python3 scripts/check_systemd_units.py
          python3 scripts/verify_build_ownership.py
          python3 scripts/check_gap_register.py
          python3 scripts/verify_canonical_ib_paper_profile.py
          python3 scripts/run_python_tests.py --lane source

      - name: Reassert clean exact source
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
