name: Retry PR57 canonical kill-switch proof

on:
  push:
    branches:
      - plan/p1-release-package-preflight-20260910
    paths:
      - .github/workflows/codex-fix-pr57-canonical-kill-switch-v2.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr57-canonical-kill-switch-v2
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact retry carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact live branch object
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Apply corrected canonical kill-switch patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          carrier = Path(
              '.github/workflows/codex-fix-pr57-canonical-kill-switch.yml'
          ).read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = carrier.index(marker) + len(marker)
          end = carrier.index("\n          PY", start)
          source = textwrap.dedent(carrier[start:end])
          source = source.replace(
              "kill_switch_tests = textwrap.dedent(r'''",
              "kill_switch_tests = r'''",
              1,
          ).replace(
              "    def test_broker_probe_is_rejected_for_core_profile''')\n          sub_once(",
              "    def test_broker_probe_is_rejected_for_core_profile'''\n          sub_once(",
              1,
          )
          compile(source, 'canonical_kill_switch_fix.py', 'exec')
          exec(source, {'__name__': '__main__'})
          PY
          python3 -m py_compile \
            scripts/hepta_preflight_core.py \
            tests/python/test_hepta_preflight.py
          git diff --check

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++ libssl-dev

      - name: Run focused hostile regressions
        run: |
          set -euo pipefail
          python3 -m unittest tests.python.test_hepta_preflight -v
          python3 -m unittest tests.python.test_preflight_special_files -v
          python3 -m unittest tests.python.test_publication_identity -v

      - name: Run complete canonical validation
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          ./scripts/dev_core.sh
          python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Publish repaired product source
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            scripts/hepta_preflight_core.py \
            tests/python/test_hepta_preflight.py \
            docs/operations/preflight.md
          git commit -m 'fix(preflight): authenticate canonical engaged kill switch'
          git push origin "HEAD:$EXPECTED_BRANCH"
