name: Finalize PR57 publication identity and endpoint ceiling

on:
  push:
    branches:
      - plan/p1-release-package-preflight-20260910
    paths:
      - .github/workflows/codex-fix-pr57-publication-endpoints-v3.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr57-publication-endpoints-v3
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact finalization carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact live branch object
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Apply corrected patch and synchronize inherited assertion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          carrier = Path(
              '.github/workflows/codex-fix-pr57-publication-endpoints.yml'
          ).read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = carrier.index(marker) + len(marker)
          end = carrier.index("\n          PY", start)
          source = textwrap.dedent(carrier[start:end])
          source = source.replace(
              'textwrap.dedent(endpoint_old)', 'endpoint_old'
          ).replace(
              'textwrap.dedent(endpoint_new)', 'endpoint_new'
          ).replace(
              'textwrap.dedent(endpoint_test)', 'endpoint_test'
          )
          compile(source, 'pr57_publication_endpoint_fix.py', 'exec')
          exec(source, {'__name__': '__main__'})

          test_path = Path('tests/python/test_hepta_preflight.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = '"outside the PAPER policy"'
          new = '"outside the compiled PAPER endpoint boundary"'
          if test_text.count(old) != 1:
              raise SystemExit(
                  f'expected one inherited endpoint assertion, found {test_text.count(old)}'
              )
          test_path.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused hostile regressions
        run: |
          set -euo pipefail
          python3 -m unittest tests.python.test_publication_identity -v
          python3 -m unittest tests.python.test_release_package -v
          python3 -m unittest tests.python.test_hepta_preflight -v
          python3 -m unittest tests.python.test_preflight_special_files -v

      - name: Build and run complete canonical validation
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev
          ./scripts/dev_core.sh
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          cmake -S . -B build/codex-install -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DBUILD_IB_PROBE=OFF \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF \
            -DHEPTA_RELEASE_LABEL=0.1.0-beta.1
          cmake --build build/codex-install --parallel 2
          HEPTA_RELEASE_INTEGRATION_BUILD_DIR="$PWD/build/codex-install" \
            python3 -m unittest tests.python.test_cmake_install_integration -v
          python3 scripts/check_documentation.py
          python3 scripts/verify_build_ownership.py
          git diff --check

      - name: Publish repaired source and remove all carriers
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          rm \
            .github/workflows/codex-fix-pr57-publication-endpoints-v2.yml \
            .github/workflows/codex-fix-pr57-publication-endpoints-v3.yml
          git diff --check
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            scripts/build_release_package.py \
            scripts/hepta_preflight_core.py \
            tests/python/test_hepta_preflight.py \
            tests/python/test_publication_identity.py \
            docs/operations/release-package.md \
            docs/operations/preflight.md \
            .github/workflows/codex-fix-pr57-publication-endpoints.yml \
            .github/workflows/codex-fix-pr57-publication-endpoints-v2.yml \
            .github/workflows/codex-fix-pr57-publication-endpoints-v3.yml
          git commit -m 'fix(release): bind publication inodes and probe endpoints'
          git push origin "HEAD:$EXPECTED_BRANCH"
