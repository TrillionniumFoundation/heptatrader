name: Retry PR57 source snapshot topology

on:
  push:
    branches:
      - plan/p1-release-package-preflight-20260910
    paths:
      - .github/workflows/codex-fix-pr57-source-snapshot-topology-v2.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr57-source-snapshot-topology-v2
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact retry carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact live branch object
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
          EXPECTED_PARENT: 7e12cd3260b0c5db8b3e92f32c41c4206ed67a1b
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Apply corrected topology patch and preserve discovery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          carrier = Path(
              '.github/workflows/codex-fix-pr57-source-snapshot-topology.yml'
          ).read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = carrier.index(marker) + len(marker)
          end = carrier.index("\n          PY", start)
          source = textwrap.dedent(carrier[start:end])

          old_component = r'''def _canonical_component(name: str, label: str) -> None:
              if (
                  not isinstance(name, str)
                  or not name
                  or name in {".", ".."}
                  or "/" in name
                  or "\\" in name
              ):
                  raise PackageError(f"{label} is not a canonical path component")
              _canonical_path_bytes(name, label)
          '''
          new_component = r'''def _canonical_component(name: str, label: str) -> None:
              # Preserve the canonical forbidden-byte diagnostic before the
              # structural component check so historical hostile contracts
              # keep exercising the same security classification.
              _canonical_path_bytes(name, label)
              if (
                  not isinstance(name, str)
                  or not name
                  or name in {".", ".."}
                  or "/" in name
              ):
                  raise PackageError(f"{label} is not a canonical path component")
          '''
          old_component = textwrap.dedent(old_component)
          new_component = textwrap.dedent(new_component)
          if source.count(old_component) != 1:
              raise SystemExit('canonical component patch anchor drifted')
          source = source.replace(old_component, new_component, 1)

          open_tests = "addition = textwrap.dedent(r'''"
          close_tests = "\n''')\nif text.count(marker) != 1:"
          if source.count(open_tests) != 1 or source.count(close_tests) != 1:
              raise SystemExit('release hostile-test indentation anchor drifted')
          source = source.replace(open_tests, "addition = r'''", 1)
          source = source.replace(
              close_tests,
              "\n'''\nif text.count(marker) != 1:",
              1,
          )

          compile(source, 'source_snapshot_topology_fix.py', 'exec')
          exec(source, {'__name__': '__main__'})

          tests = Path('tests/python/test_release_package.py').read_text(
              encoding='utf-8'
          )
          for name in (
              'test_leaf_replacement_after_snapshot_copy_is_rejected',
              'test_ancestor_directory_replacement_after_copy_is_rejected',
          ):
              if tests.count(f'\n    def {name}(') != 1:
                  raise SystemExit(f'{name} is not a discovered class method')
              if f'\ndef {name}(' in tests:
                  raise SystemExit(f'{name} remains detached at module scope')
          PY
          rm -f \
            .github/workflows/codex-fix-pr57-source-snapshot-topology.yml \
            .github/workflows/codex-fix-pr57-source-snapshot-topology-v2.yml
          python3 -m py_compile \
            scripts/build_release_package.py \
            tests/python/test_release_package.py
          git diff --check

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ libssl-dev

      - name: Prove new hostile tests are individually discoverable
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.python.test_release_package.ReleasePackageTests.test_leaf_replacement_after_snapshot_copy_is_rejected \
            tests.python.test_release_package.ReleasePackageTests.test_ancestor_directory_replacement_after_copy_is_rejected \
            tests.python.test_release_package.ReleasePackageTests.test_forbidden_path_bytes_are_rejected_before_publication \
            -v

      - name: Run complete release and preflight hostile regressions
        run: |
          set -euo pipefail
          python3 -m unittest tests.python.test_release_package -v
          python3 -m unittest tests.python.test_preflight_special_files -v
          python3 -m unittest tests.python.test_publication_identity -v
          python3 -m unittest tests.python.test_hepta_preflight -v

      - name: Run complete canonical validation
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          ./scripts/dev_core.sh
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          HEPTA_RELEASE_INTEGRATION_BUILD_DIR="$PWD/build/core" \
            python3 -m unittest \
              tests.python.test_cmake_install_integration -v

      - name: Publish carrier-free repaired source
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): pin install-root snapshot topology'
          git push origin "HEAD:$EXPECTED_BRANCH"
