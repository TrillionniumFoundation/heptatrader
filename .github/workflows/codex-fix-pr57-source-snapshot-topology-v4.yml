name: Publish PR57 source snapshot topology repair

on:
  push:
    branches:
      - plan/p1-release-package-preflight-20260910
    paths:
      - .github/workflows/codex-fix-pr57-source-snapshot-topology-v4.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr57-source-snapshot-topology-v4
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact publication carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact live branch object
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
          EXPECTED_PARENT: 89e3021a00d836aecc7124396fcdd7ba41d4d2f3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Apply topology patch and exact FIFO test migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          retry = Path(
              '.github/workflows/codex-fix-pr57-source-snapshot-topology-v2.yml'
          ).read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = retry.index(marker) + len(marker)
          end = retry.index("\n          PY", start)
          source = textwrap.dedent(retry[start:end])
          compile(source, 'source_snapshot_topology_retry.py', 'exec')
          exec(source, {'__name__': '__main__'})

          path = Path('tests/python/test_preflight_special_files.py')
          text = path.read_text(encoding='utf-8')
          old = '''                try:
                              module._snapshot_source(source, observed, "payload")
                              raise AssertionError("regular-to-FIFO swap was admitted")
                          except module.PackageError:
                              print("EXPECTED_REJECTION")
          '''
          new = '''                root_fd, root_pinned, root_path = (
                              module._open_directory_absolute(
                                  source.parent, "test install root"
                              )
                          )
                          try:
                              try:
                                  snapshot, _, _ = module._snapshot_source(
                                      root_path,
                                      root_pinned,
                                      root_fd,
                                      root_pinned,
                                      tuple(),
                                      source.name,
                                      observed,
                                      "payload",
                                  )
                                  snapshot.close()
                                  raise AssertionError(
                                      "regular-to-FIFO swap was admitted"
                                  )
                              except module.PackageError:
                                  print("EXPECTED_REJECTION")
                          finally:
                              os.close(root_fd)
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f'FIFO private-call migration anchor count={text.count(old)}'
              )
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          release_tests = Path(
              'tests/python/test_release_package.py'
          ).read_text(encoding='utf-8')
          for name in (
              'test_leaf_replacement_after_snapshot_copy_is_rejected',
              'test_ancestor_directory_replacement_after_copy_is_rejected',
          ):
              if release_tests.count(f'\n    def {name}(') != 1:
                  raise SystemExit(f'{name} is not a class test')
          PY
          rm -f \
            .github/workflows/codex-fix-pr57-source-snapshot-topology.yml \
            .github/workflows/codex-fix-pr57-source-snapshot-topology-v2.yml \
            .github/workflows/codex-fix-pr57-source-snapshot-topology-v3.yml \
            .github/workflows/codex-fix-pr57-source-snapshot-topology-v4.yml
          python3 -m py_compile \
            scripts/build_release_package.py \
            tests/python/test_release_package.py \
            tests/python/test_preflight_special_files.py
          git diff --check

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ libssl-dev

      - name: Prove topology and FIFO hostile regressions
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.python.test_release_package.ReleasePackageTests.test_leaf_replacement_after_snapshot_copy_is_rejected \
            tests.python.test_release_package.ReleasePackageTests.test_ancestor_directory_replacement_after_copy_is_rejected \
            tests.python.test_release_package.ReleasePackageTests.test_forbidden_path_bytes_are_rejected_before_publication \
            tests.python.test_preflight_special_files.SpecialFileAdmissionTests.test_regular_to_fifo_builder_swap_is_rejected_without_blocking \
            -v

      - name: Run complete release and preflight hostile regressions
        run: |
          set -euo pipefail
          python3 -m unittest tests.python.test_release_package -v
          python3 -m unittest tests.python.test_preflight_special_files -v
          python3 -m unittest tests.python.test_publication_identity -v
          python3 -m unittest tests.python.test_hepta_preflight -v

      - name: Run complete canonical validation
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          ./scripts/dev_core.sh
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          HEPTA_RELEASE_INTEGRATION_BUILD_DIR="$PWD/build/core" \
            python3 -m unittest \
              tests.python.test_cmake_install_integration -v

      - name: Publish carrier-free repaired source
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): pin install-root snapshot topology'
          git push origin "HEAD:$EXPECTED_BRANCH"
