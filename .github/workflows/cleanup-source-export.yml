name: Temporary cleanup source snapshot
on:
  push:
    branches: [audit/cleanup-source-20260913]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 010d83cfc709d174017f9e582b46cf844305cbc5
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked public source only
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 010d83cfc709d174017f9e582b46cf844305cbc5
          git merge-base --is-ancestor ce3acda95edb02d93d43c26985bdc7549197e75b HEAD
          mkdir -p /tmp/hepta-cleanup-source
          git bundle create /tmp/hepta-cleanup-source/source.bundle HEAD
          git rev-parse HEAD HEAD^{tree} > /tmp/hepta-cleanup-source/identity.txt
          sha256sum /tmp/hepta-cleanup-source/source.bundle > /tmp/hepta-cleanup-source/source.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cleanup-source-010d83cf
          path: /tmp/hepta-cleanup-source/
          retention-days: 1
          if-no-files-found: error
