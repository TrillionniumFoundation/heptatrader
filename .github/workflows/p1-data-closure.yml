name: p1-data-closure

on:
  push:
    branches:
      - codex/heptatrader-review-p1-work
    paths:
      - .github/workflows/p1-data-closure.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-review-p1-work
          fetch-depth: 0
      - name: Apply data-boundary closure
        run: python3 scripts/p1_data_patch.py
      - name: Commit durable candidate and remove staging tools
        run: |
          set -euo pipefail
          git config user.name "Hepta P1 Closure Bot"
          git config user.email "hepta-p1-closure-bot@users.noreply.github.com"
          rm -f scripts/p1_data_patch.py \
            .github/workflows/p1-callgraph.yml \
            .github/workflows/p1-data-closure.yml
          git add -A
          git commit -m "fix: close fixed numeric and coherent market-data boundaries"
      - name: Validate exact candidate
        env:
          HEPTA_BUILD_DIR: ${{ runner.temp }}/p1-data-core
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: "2"
        run: ./scripts/dev_core.sh
      - name: Publish exact tested revision
        run: git push origin HEAD:codex/heptatrader-review-p1-work
