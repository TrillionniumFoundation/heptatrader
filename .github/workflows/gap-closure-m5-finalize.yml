name: gap-closure-m5-finalize

on:
  push:
    branches:
      - codex/heptatrader-m5-work
    paths:
      - .github/workflows/gap-closure-m5-finalize.yml

permissions:
  contents: write

concurrency:
  group: heptatrader-m5-finalize
  cancel-in-progress: true

jobs:
  finalize-m5:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout M5 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-m5-work
          fetch-depth: 0
      - name: Complete any pending M5 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta Gap Closure Bot"
          git config user.email "hepta-gap-closure-bot@users.noreply.github.com"
          if test -f scripts/m5_repair_patch.py; then
            python3 scripts/m5_repair_patch.py
          elif test -f scripts/m5_patch.py; then
            python3 scripts/m5_patch.py
          fi
          python3 - <<'PY'
          from pathlib import Path
          for relative in (
              'tests/module_lifecycle_tests.cpp',
              'tests/multi_agent_allocation_tests.cpp',
          ):
              path = Path(relative)
              text = path.read_text()
              text = text.replace("Digest('m')", "Digest('d')")
              text = text.replace("Digest('h')", "Digest('e')")
              text = text.replace("char evidence = 'h'", "char evidence = 'e'")
              path.write_text(text)
          PY
          rm -f .github/workflows/gap-closure-m5.yml
          rm -f .github/workflows/gap-closure-m5-repair.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: add module lifecycle and active multi-agent simulator"
          fi
      - name: Merge latest canonical PR head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin codex/heptatrader-documentation-control-plane-v2
          git merge --no-ff --no-edit origin/codex/heptatrader-documentation-control-plane-v2
      - name: Validate synchronized M5 revision
        run: ./scripts/dev_core.sh
      - name: Remove temporary automation and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gap-closure-m5-finalize.yml
          rm -f scripts/m5_patch.py scripts/m5_repair_patch.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: seal tested M5 integration"
          fi
          git push origin HEAD:codex/heptatrader-m5-work
          git push origin HEAD:codex/heptatrader-documentation-control-plane-v2
