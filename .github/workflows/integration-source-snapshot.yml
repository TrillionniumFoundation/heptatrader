name: Integration source snapshot
on:
  push:
    branches: [integration/paper-runtime-closure-20260912]
    paths: [.github/workflows/integration-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export source and branch ancestry only
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/heptatrader-integration.bundle" --all
          git bundle verify "$RUNNER_TEMP/heptatrader-integration.bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-integration-source-${{ github.sha }}
          path: ${{ runner.temp }}/heptatrader-integration.bundle
          retention-days: 1
          if-no-files-found: error
