              text = text.replace(
                  "DeterministicRiskContext risk;\n",
                  "DeterministicRiskContext risk;\n"
                  "    risk.quoteFresh = true;\n"
                  "    risk.portfolioSnapshotComplete = true;\n")
              path.write_text(text, encoding="utf-8")

          for relative in (
              ".github/workflows/dev-portfolio-risk-closure.yml",
              ".github/workflows/dev-intent-gap-closure.yml",
              ".github/workflows/dev-intent-gap-recover.yml",
              ".github/workflows/dev-intent-gap-compile-fix.yml",
              ".github/workflows/dev-intent-gap-type-fix.yml",
              ".github/workflows/dev-gap-closure-run.yml",
              ".github/workflows/dev-gap-closure-recover.yml",
              ".github/workflows/dev-source-export.yml",
          ):
              path = root / relative
              if path.exists():
                  path.unlink()
          PY
      - name: Verify exact resulting tree
        env:
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: "2"
        run: |
          rm -rf build/core-release
          python3 scripts/check_repository_integrity.py
          ./scripts/dev_core.sh
          stage="$RUNNER_TEMP/heptatrader-runtime"
          DESTDIR="$stage" cmake --install build/core-release --component runtime
          test -x "$stage/usr/local/libexec/heptatrader/hepta-executiond"
      - name: Commit verified portfolio/risk closure
        run: |
          git config user.name "Tomasrgbsf"
