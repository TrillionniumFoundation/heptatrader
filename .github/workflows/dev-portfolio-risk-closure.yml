              marker = "add_custom_target(hepta_core_test_binaries\n"
              block = '''add_executable(hepta_portfolio_compiler_tests
    portfolio_compiler_tests.cpp)
target_link_libraries(hepta_portfolio_compiler_tests
    hepta_portfolio_core)
hepta_register_core_test(hepta_portfolio_compiler_tests)

'''
              if marker not in text:
                  raise RuntimeError("core test target marker missing")
              text = text.replace(marker, block + marker, 1)
          text = text.replace(
              "target_link_libraries(hepta_oms_journal_durability_tests pthread)",
