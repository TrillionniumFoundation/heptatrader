name: One-shot convergence materialization

on:
  push:
    branches:
      - remediation/full-convergence-20260916

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout convergence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/full-convergence-20260916
          fetch-depth: 1

      - name: Apply semantic convergence
        run: |
          python3 scripts/_convergence_materialize.py
          python3 scripts/_convergence_fixture_fix.py
          python3 scripts/_convergence_diag_stage.py

      - name: Diagnose native HPM2 convergence
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev zlib1g-dev python3-yaml
          python3 -m py_compile scripts/hepta_oms_lifecycle.py tests/python/test_oms_lifecycle_rotation.py
          python3 -m unittest tests.python.test_oms_lifecycle_rotation
          cmake -S . -B build/diag -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DHEPTA_ENABLE_IBAPI=OFF -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF -DHEPTA_BUILD_LEGACY_MONOLITH=OFF -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF
          cmake --build build/diag --target hepta_execution_coordinator_tests --parallel 2
          ctest --test-dir build/diag --output-on-failure -R '^hepta_execution_coordinator_tests$'

      - name: Commit validated materialized tree
        if: ${{ false }}
        run: |
          rm .github/workflows/convergence-materialize.yml scripts/_convergence_materialize.py scripts/_convergence_fixture_fix.py scripts/_convergence_diag_stage.py
          git config user.name "HeptaTrader convergence materializer"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: converge owner-scoped HPM2 and streaming generation verification"
          git push origin HEAD:remediation/full-convergence-20260916
