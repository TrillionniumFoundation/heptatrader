name: One-shot required-check provenance expansion

on:
  push:
    branches: [codex/full-blocker-closure-20260908]

permissions:
  contents: write
  actions: read

concurrency:
  group: heptatrader-required-check-provenance
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/full-blocker-closure-20260908
          fetch-depth: 2
          persist-credentials: true

      - name: Wait for catalog cleanup to commit
        run: |
          set -euo pipefail
          if test -e .github/workflows/catalog-source-cleanup-controller.yml; then
            echo 'catalog/source cleanup has not committed yet; a later branch push will retry this controller' >&2
            exit 1
          fi

      - name: Wait for exact-head workflows and capture real provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          export SOURCE_SHA="$sha"
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.parse

          repository = os.environ['REPOSITORY']
          source_sha = os.environ['SOURCE_SHA']
          token = os.environ['GH_TOKEN']
          required = {
              '.github/workflows/source-status.yml': 'source-status-exact-head',
              '.github/workflows/install-package-smoke.yml': 'install-package-smoke',
              '.github/workflows/thread-sanitizer.yml': 'thread-sanitizer-core',
          }

          def api(path: str) -> dict:
              url = f'https://api.github.com/repos/{repository}/{path}'
              result = subprocess.run(
                  [
                      'curl', '--fail-with-body', '--silent', '--show-error',
                      '-H', 'Accept: application/vnd.github+json',
                      '-H', f'Authorization: Bearer {token}',
                      '-H', 'X-GitHub-Api-Version: 2022-11-28',
                      url,
                  ],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  check=False,
              )
              if result.returncode:
                  raise RuntimeError(f'GitHub API failed: {result.stdout[-2000:]}')
              return json.loads(result.stdout)

          deadline = time.monotonic() + 60 * 60
          selected = {}
          last = {}
          while time.monotonic() < deadline:
              query = urllib.parse.urlencode({'head_sha': source_sha, 'per_page': 100})
              runs = api(f'actions/runs?{query}').get('workflow_runs', [])
              by_path = {}
              for run in runs:
                  path = run.get('path')
                  if path in required:
                      current = by_path.get(path)
                      if current is None or int(run.get('id', 0)) > int(current.get('id', 0)):
                          by_path[path] = run
              last = {
                  path: {
                      'id': run.get('id'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'event': run.get('event'),
                  }
                  for path, run in by_path.items()
              }
              failed = [
                  path for path, run in by_path.items()
                  if run.get('status') == 'completed' and run.get('conclusion') != 'success'
              ]
              if failed:
                  raise RuntimeError(f'exact-head required candidate failed: {last}')
              if set(by_path) == set(required) and all(
                  run.get('status') == 'completed' and run.get('conclusion') == 'success'
                  for run in by_path.values()
              ):
                  for path, run in by_path.items():
                      jobs = api(f"actions/runs/{run['id']}/jobs?per_page=100").get('jobs', [])
                      named = [
                          job for job in jobs
                          if job.get('name') == required[path]
                          and job.get('status') == 'completed'
                          and job.get('conclusion') == 'success'
                      ]
                      if len(named) != 1:
                          raise RuntimeError(
                              f'{path}: expected one successful job {required[path]!r}, found {named}'
                          )
                      selected[path] = {
                          'workflow_id': int(run['workflow_id']),
                          'workflow_path': path,
                          'job_name': required[path],
                          'run_id': int(run['id']),
                          'event': run.get('event'),
                          'head_sha': run.get('head_sha'),
                      }
                  break
              time.sleep(20)
          else:
              raise RuntimeError(f'timed out waiting for exact-head workflows: {last}')

          Path('/tmp/new-check-provenance.json').write_text(
              json.dumps(selected, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(selected, indent=2, sort_keys=True))
          PY

      - name: Expand required-check source policy with observed IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('.github/required-check-contexts-v1.json')
          policy = json.loads(path.read_text(encoding='utf-8'))
          observed = json.loads(Path('/tmp/new-check-provenance.json').read_text(encoding='utf-8'))
          contexts = {
              item['job_name']: {
                  'workflow_id': item['workflow_id'],
                  'workflow_path': item['workflow_path'],
                  'job_name': item['job_name'],
              }
              for item in observed.values()
          }
          ordered_new = [
              'source-status-exact-head',
              'install-package-smoke',
              'thread-sanitizer-core',
          ]
          for field in (
              'required_branch_contexts',
              'required_pull_request_contexts',
              'required_merge_group_contexts',
          ):
              values = policy[field]
              for context in ordered_new:
                  if context not in values:
                      values.append(context)
          provenance = policy['required_check_provenance']['contexts']
          for context in ordered_new:
              provenance[context] = contexts[context]
          observation = policy.get('non_required_observation_contexts', [])
          policy['non_required_observation_contexts'] = [
              item for item in observation if item not in ordered_new
          ]
          path.write_text(
              json.dumps(policy, indent=2, sort_keys=False) + '\n',
              encoding='utf-8',
          )

          gap_path = Path('docs/gap-register.json')
          register = json.loads(gap_path.read_text(encoding='utf-8'))
          ci_gap = next(item for item in register['gaps'] if item['id'] == 'CI-001')
          summary = ci_gap['summary']
          if 'exact-SHA source-status, package-install and ThreadSanitizer' not in summary:
              ci_gap['summary'] = (
                  summary.rstrip('.') +
                  '; exact-SHA source-status, package-install and ThreadSanitizer '
                  'checks are also required with observed workflow/job provenance.'
              )
          gap_path.write_text(
              json.dumps(register, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Validate qualification and required-check trust boundary
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/check_module_documentation_depth.py
          python3 scripts/check_gap_register.py
          python3 scripts/check_qualification_trust_boundary.py
          python3 -m unittest discover -s tests/python -p 'test_github_governance*.py'
          python3 -m unittest discover -s tests/python -p 'test_qualification_trust_boundary.py'
          python3 -m unittest discover -s tests/python -p 'test_gap_register.py'
          git diff --check

      - name: Delete temporary administration-probe branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/delete-ref.out --write-out '%{http_code}' \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/administration-probe-do-not-use")"
          case "$status" in
            204|404) ;;
            *) cat /tmp/delete-ref.out >&2; exit 1 ;;
          esac

      - name: Commit verified provenance expansion
        run: |
          set -euo pipefail
          rm .github/workflows/required-check-provenance-controller.yml
          git add -A
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: require exact source, package, and thread-safety checks'
          git pull --rebase origin codex/full-blocker-closure-20260908
          git push origin HEAD:codex/full-blocker-closure-20260908
