name: Temporary remediation materializer

on:
  push:
    branches: [remediation/full-priority-cleanup-20260916]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout remediation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev zlib1g-dev python3-yaml

      - name: Apply batch 2
        run: python3 scripts/apply_priority_remediation_batch2.py

      - name: Build and run canonical native core tests
        env:
          HEPTA_BUILD_DIR: ${{ github.workspace }}/build/core
          HEPTA_JOBS: "2"
        run: ./scripts/dev_core.sh

      - name: Commit verified materialization
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HeptaTrade/oms_generation_store.h \
            HeptaTrade/execution/execution_generation_support.inc \
            HeptaTrade/execution/paper_terminal_mutation_manifest.h \
            HeptaTrade/execution/paper_terminal_mutation_manifest.cpp \
            HeptaTrade/execution/ib_paper_execution_runtime_terminal_state.cpp \
            tests/execution_coordinator_tests.cpp \
            tests/terminal_manifest_capacity_cases.h
          git commit -m "refactor: compact permanent terminal history"
          git push origin HEAD:remediation/full-priority-cleanup-20260916
