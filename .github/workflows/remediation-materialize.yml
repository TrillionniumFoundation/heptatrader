name: Temporary remediation materializer

on:
  push:
    branches: [remediation/full-priority-cleanup-20260916]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout remediation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev zlib1g-dev python3-yaml

      # Final materialization preserves V1 private dispatch and removes itself.
      - name: Apply batch 3
        run: python3 scripts/apply_priority_remediation_batch3_fix.py

      - name: Remove remediation-only scaffolding
        run: |
          rm -f .github/workflows/remediation-materialize.yml
          rm -f scripts/apply_priority_remediation_batch1.py
          rm -f scripts/apply_priority_remediation_batch1_fix.py
          rm -f scripts/apply_priority_remediation_batch2.py
          rm -f scripts/apply_priority_remediation_batch3.py
          rm -f scripts/apply_priority_remediation_batch3_fix.py

      - name: Build and run canonical native core tests
        env:
          HEPTA_BUILD_DIR: ${{ github.workspace }}/build/core
          HEPTA_JOBS: "2"
        run: ./scripts/dev_core.sh

      - name: Validate source and documentation contracts
        run: |
          python3 scripts/check_documentation.py
          python3 scripts/check_component_coverage.py
          python3 scripts/run_python_tests.py --lane source

      - name: Commit verified cleanup
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HeptaTrade/CMakeLists.txt \
            HeptaTrade/execution/execution_coordinator_terminal.cpp \
            HeptaTrade/execution/execution_generation_support.cpp \
            docs/build-targets.json docs/gap-register.json \
            docs/modules/execution-service.md docs/modules/oms-journal.md \
            docs/modules/xt-adapter.md \
            docs/technical/oms-recovery-capacity.md \
            docs/technical/runtime-cost-observations.md \
            docs/technical/xtqmt-adapter-contract.md \
            docs/technical/reconciliation-engine.md \
            tests/python/test_recovery_projection.py
          git add -u HeptaTrade/execution .github/workflows scripts
          git commit -m "refactor: remove source formalism and synchronize contracts"
          git push origin HEAD:remediation/full-priority-cleanup-20260916
