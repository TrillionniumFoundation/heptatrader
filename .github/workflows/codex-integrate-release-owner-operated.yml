name: Integrate reviewed release capability into owner-operated head

on:
  push:
    branches:
      - codex/integrate-release-owner-operated-20260909

permissions:
  contents: write

concurrency:
  group: heptatrader-integrate-release-owner-operated
  cancel-in-progress: false

jobs:
  integrate:
    name: integrate-release-owner-operated-exact-tree
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout integration branch with push authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TrillionniumFoundation/heptatrader
          ref: codex/integrate-release-owner-operated-20260909
          fetch-depth: 0
          persist-credentials: true
          clean: true
          submodules: false

      - name: Fetch exact source objects and decode pinned integration controller
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TrillionniumFoundation/heptatrader'
          test "$(git rev-parse --abbrev-ref HEAD)" = 'codex/integrate-release-owner-operated-20260909'
          git fetch --no-tags origin \
            dbeaab22c51c310c3cbe5b370931aa8e617491c6 \
            15f7d9fa73990ab23bea5400c745889e58b910f1
          echo "[PAYLOAD] base64-bytes=$(wc -c < .codex/integrate_release_owner_operated.py.gz.b64)"
          base64 --decode .codex/integrate_release_owner_operated.py.gz.b64 > "$RUNNER_TEMP/integration.py.gz"
          gzip --test "$RUNNER_TEMP/integration.py.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/integration.py.gz" \
            > .codex/integrate_release_owner_operated.py
          test "$(sha256sum .codex/integrate_release_owner_operated.py | awk '{print $1}')" = \
            '02c2a267bdaf73f14cf0985613d3d471cb2d02f4571e6e55bd5eab22f735fabb'
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.codex/integrate_release_owner_operated.py')
          text = path.read_text(encoding='utf-8')

          test_anchor = '        "tests.python.test_release_package",'
          if text.count(test_anchor) != 1:
              raise SystemExit('pinned payload module anchor mismatch')
          anchor_index = text.index(test_anchor)
          start = text.rfind('    run(', 0, anchor_index)
          end_marker = '    )\n'
          end = text.find(end_marker, anchor_index)
          if start < 0 or end < 0:
              raise SystemExit('pinned payload test call boundary missing')
          end += len(end_marker)
          block = text[start:end]
          required = (
              'sys.executable',
              '"-m"',
              '"unittest"',
              '"tests.python.test_release_package"',
              '"tests.python.test_hepta_preflight"',
              '"tests.python.test_cmake_install_integration"',
          )
          if block.count('run(') != 1 or any(token not in block for token in required):
              raise SystemExit('pinned payload test call content mismatch')
          replacement = (
              '    for pattern in (\n'
              '        "test_release_package.py",\n'
              '        "test_hepta_preflight.py",\n'
              '        "test_cmake_install_integration.py",\n'
              '    ):\n'
              '        run(\n'
              '            sys.executable,\n'
              '            "-m",\n'
              '            "unittest",\n'
              '            "discover",\n'
              '            "-s",\n'
              '            "tests/python",\n'
              '            "-p",\n'
              '            pattern,\n'
              '        )\n'
          )
          upgraded = text[:start] + replacement + text[end:]
          if 'tests.python.test_release_package' in upgraded:
              raise SystemExit('old dotted unittest module remains')

          tree_anchor = '        "--expected-tree",'
          if upgraded.count(tree_anchor) != 1:
              raise SystemExit('pinned payload exact-tree anchor mismatch')
          anchor_index = upgraded.index(tree_anchor)
          start = upgraded.rfind('    run(', 0, anchor_index)
          end = upgraded.find(end_marker, anchor_index)
          if start < 0 or end < 0:
              raise SystemExit('pinned payload exact-tree call boundary missing')
          end += len(end_marker)
          block = upgraded[start:end]
          required = (
              'sys.executable',
              '"scripts/verify_exact_git_index.py"',
              '"--root"',
              '"."',
              '"--expected-tree"',
              'tree',
          )
          if block.count('run(') != 1 or any(token not in block for token in required):
              raise SystemExit('pinned payload exact-tree call content mismatch')
          replacement = (
              '    run(\n'
              '        sys.executable,\n'
              '        "scripts/verify_exact_git_index.py",\n'
              '        "--root",\n'
              '        ".",\n'
              '    )\n'
          )
          upgraded = upgraded[:start] + replacement + upgraded[end:]
          if '--expected-tree' in upgraded:
              raise SystemExit('unsupported exact-tree CLI option remains')
          if upgraded.count('"test_release_package.py"') != 1:
              raise SystemExit('upgraded unittest discovery missing')
          path.write_text(upgraded, encoding='utf-8')
          PY
          actual_sha="$(sha256sum .codex/integrate_release_owner_operated.py | awk '{print $1}')"
          actual_bytes="$(wc -c < .codex/integrate_release_owner_operated.py)"
          echo "[PAYLOAD] upgraded-bytes=$actual_bytes sha256=$actual_sha"
          python3 -m py_compile .codex/integrate_release_owner_operated.py
          rm -rf .codex/__pycache__
          test ! -e .codex/__pycache__
          echo '[PAYLOAD] Python syntax and semantic anchors validated'

      - name: Build, test, commit and push exact clean integrated tree
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 .codex/integrate_release_owner_operated.py
