name: Periodic Runtime Resilience
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heptatrader-periodic-resilience
  cancel-in-progress: false
jobs:
  reliability-gcc:
    name: reliability-runtime-sanitizers (g++)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BUILD_PARALLEL: '2'
      HEPTA_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev g++ clang
      - name: Execute the behavior-bearing sanitizer lane
        run: bash scripts/run_runtime_resilience.sh g++
  reliability-clang:
    name: reliability-runtime-sanitizers (clang++)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BUILD_PARALLEL: '2'
      HEPTA_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev g++ clang
      - name: Execute the behavior-bearing sanitizer lane
        run: bash scripts/run_runtime_resilience.sh clang++
