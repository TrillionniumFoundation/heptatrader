name: one-shot-publish-final-exact-head-truth

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/zz-publish-final-truth.yml

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: heptatrader-authoritative-gap-closure
  cancel-in-progress: true

jobs:
  publish-truth:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Cancel temporary runs and commit a clean permanent-workflow tree
        id: clean
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/TrillionniumFoundation/heptatrader/actions/runs?branch=codex/heptatrader-gap-closure-v2&per_page=100' --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.id != '${GITHUB_RUN_ID}')) | [.id, .path] | @tsv' |
          while IFS=$'\t' read -r id path;do [[ -z "${id:-}" ]]&&continue;case "$path" in .github/workflows/dev-*|.github/workflows/zz-*) gh api --method POST "repos/TrillionniumFoundation/heptatrader/actions/runs/$id/cancel"||true;;esac;done
          sleep 30
          git fetch origin codex/heptatrader-gap-closure-v2
          git reset --hard origin/codex/heptatrader-gap-closure-v2
          find .github/workflows -maxdepth 1 -type f \( -name 'dev-*.yml' -o -name 'dev-*.yaml' -o -name 'zz-*.yml' -o -name 'zz-*.yaml' \) -delete
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/core-ci.yml')
          if not p.exists():raise SystemExit('core-ci missing')
          s=p.read_text()
          if 'workflow_dispatch:' not in s:
              if 'on:\n' not in s:raise SystemExit('core on block missing')
              p.write_text(s.replace('on:\n','on:\n  workflow_dispatch:\n',1))
          PY
          if grep -RInE '^\s*(contents|pull-requests|actions|checks):\s*write\s*$|git push|gh pr merge|merge_pull_request|enable_auto_merge' .github/workflows --include='*.yml' --include='*.yaml';then exit 1;fi
          python3 scripts/check_repository_integrity.py
          git diff --check
          git config user.name 'OpenAI Codex';git config user.email 'noreply@openai.com';git add -A .github/workflows
          if git diff --cached --quiet;then sha=$(git rev-parse HEAD);else git commit -s -m 'chore(ci): leave only permanent read-only workflows';git push origin HEAD:codex/heptatrader-gap-closure-v2;sha=$(git rev-parse HEAD);fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Run permanent core on the clean exact head
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.clean.outputs.sha }}
        shell: bash
        run: |
          set +e
          gh api --method POST repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/dispatches -f ref=codex/heptatrader-gap-closure-v2
          id='';for n in $(seq 1 90);do id=$(gh api 'repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/runs?branch=codex/heptatrader-gap-closure-v2&event=workflow_dispatch&per_page=30' --jq ".workflow_runs[] | select(.head_sha == \"$FINAL_SHA\") | .id"|head -n1);[[ -n "$id" ]]&&break;sleep 5;done
          conclusion='missing'
          if [[ -n "$id" ]];then for n in $(seq 1 210);do st=$(gh api "repos/TrillionniumFoundation/heptatrader/actions/runs/$id" --jq .status);co=$(gh api "repos/TrillionniumFoundation/heptatrader/actions/runs/$id" --jq '.conclusion // ""');if [[ "$st" == completed ]];then conclusion="$co";break;fi;sleep 10;done;fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish exact status to PR and enforce Draft/Ready truth
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.clean.outputs.sha }}
          CORE_CONCLUSION: ${{ steps.core.outputs.conclusion }}
          CORE_RUN_ID: ${{ steps.core.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,os
          plan=Path('docs/development/PLAN.md').read_text()
          gaps=dict(re.findall(r'^\| (G-\d{3}) \|.*?\|\s*(planned|in progress|blocked|closed)\s*\|$',plan,re.M))
          failure=Path('docs/development/RUNTIME-CLOSURE-FAILURE.md')
          tail=''
          if failure.exists():tail='\n'.join(failure.read_text(errors='replace').splitlines()[-120:])
          state={'sha':os.environ['FINAL_SHA'],'core_conclusion':os.environ['CORE_CONCLUSION'],'core_run_id':os.environ['CORE_RUN_ID'],'gaps':gaps,'closed_count':sum(v=='closed' for v in gaps.values()),'gap_count':len(gaps),'all_closed':len(gaps)==16 and all(v=='closed' for v in gaps.values()),'diagnostic_tail':tail}
          Path('/tmp/status.json').write_text(json.dumps(state,ensure_ascii=False,indent=2))
          PY
          all_closed=$(jq -r .all_closed /tmp/status.json)
          closed=$(jq -r .closed_count /tmp/status.json)
          count=$(jq -r .gap_count /tmp/status.json)
          old=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .body)
          base=$(printf '%s\n' "$old" | sed '/<!-- HEPTA_FINAL_STATUS_BEGIN -->/,/<!-- HEPTA_FINAL_STATUS_END -->/d')
          diag=$(jq -r .diagnostic_tail /tmp/status.json | tail -c 12000)
          {
            printf '%s\n' "$base"
            echo '<!-- HEPTA_FINAL_STATUS_BEGIN -->'
            echo '## Automated exact-head closure status'
            echo
            echo "- Exact head: \`$FINAL_SHA\`"
            echo "- Canonical gaps closed: **$closed/$count**"
            echo "- Permanent read-only core: **$CORE_CONCLUSION**"
            if [[ -n "$CORE_RUN_ID" ]];then echo "- Core run: https://github.com/TrillionniumFoundation/heptatrader/actions/runs/$CORE_RUN_ID";fi
            echo '- LIVE: unsupported; CTP/XT: fail-closed; IB PAPER still requires external SDK/host certification.'
            if [[ -n "$diag" ]];then echo;echo '<details><summary>Current blocker diagnostic tail</summary>';echo;echo '```text';printf '%s\n' "$diag";echo '```';echo '</details>';fi
            echo '<!-- HEPTA_FINAL_STATUS_END -->'
          } > /tmp/body.md
          gh api --method PATCH repos/TrillionniumFoundation/heptatrader/pulls/4 --input <(jq -n --rawfile body /tmp/body.md '{body:$body}') >/dev/null
          node=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .node_id)
          draft=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .draft)
          if [[ "$all_closed" == true && "$CORE_CONCLUSION" == success ]];then
            if [[ "$draft" == true ]];then gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' -f id="$node" >/dev/null;fi
          else
            if [[ "$draft" == false ]];then gh api graphql -f query='mutation($id:ID!){convertPullRequestToDraft(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' -f id="$node" >/dev/null;fi
          fi
