name: canonical-full-suite

on:
  pull_request: {}
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: canonical-full-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HEPTA_JOBS: "2"

jobs:
  core:
    name: canonical-full-suite-core
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ clang libssl-dev python3 python3-jsonschema
      - name: Validate canonical source tree
        run: |
          git diff --check
          bash -n scripts/dev_core.sh scripts/reliability_core.sh
          python3 -m py_compile \
            scripts/generate_documentation_views.py \
            scripts/hepta_module_boundaries.py \
            scripts/hepta_document_checks.py \
            scripts/hepta_registry_checks.py \
            scripts/check_documentation_control_plane.py \
            scripts/check_repository_integrity.py \
            scripts/check_systemd_documentation.py \
            scripts/check_workflow_check_contexts.py \
            scripts/check_required_context_projections.py \
            scripts/check_github_team_mapping.py \
            scripts/verify_github_governance.py \
            scripts/check_schema_catalog.py \
            scripts/check_module_discipline.py \
            scripts/check_cmake_module_graph.py \
            scripts/check_change_impact.py \
            scripts/check_install_tree.py \
            scripts/resolve_hepta_config.py \
            scripts/hepta_agent_mcp_launcher.py \
            research/protocol_support.py research/run_protocol.py
          python3 scripts/generate_documentation_views.py --check
          python3 scripts/check_documentation_control_plane.py
          python3 scripts/check_repository_integrity.py
          python3 scripts/check_systemd_documentation.py
          python3 scripts/check_workflow_check_contexts.py
          python3 scripts/check_required_context_projections.py
          python3 scripts/check_github_team_mapping.py
          python3 scripts/check_schema_catalog.py
          python3 scripts/check_module_discipline.py
          python3 research/run_protocol.py verify --manifest research/manifest-v1.json
          python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Build and test Release core
        env:
          HEPTA_BUILD_TYPE: Release
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_RUN_PYTHON_TESTS: "0"
        run: ./scripts/dev_core.sh
      - name: Verify canonical install allowlist
        run: |
          stage="$(mktemp -d "$RUNNER_TEMP/heptatrader-runtime.XXXXXX")"
          DESTDIR="$stage" cmake --install build/core-release --component runtime
          test -x "$stage/usr/local/bin/heptactl"
          test -x "$stage/usr/local/bin/hepta-sessionctl"
          test -x "$stage/usr/local/bin/hepta-agent-mcp-launcher"
          test -x "$stage/usr/local/libexec/heptatrader/hepta-tool-gatewayd"
          test -x "$stage/usr/local/libexec/heptatrader/hepta-executiond"
          test -x "$stage/usr/local/libexec/heptatrader/hepta-mcp-server"
          test -f "$stage/usr/local/share/doc/HeptaTrader/README.md"
          test -f "$stage/usr/local/share/doc/HeptaTrader/governance/CONSTITUTION.md"
          test -f "$stage/usr/local/share/doc/HeptaTrader/contracts/contract-registry-v2.json"
          test -f "$stage/usr/local/share/doc/HeptaTrader/modules/module-registry-v2.json"
          test -f "$stage/usr/local/share/doc/HeptaTrader/product/capability-registry-v2.json"
          test ! -e "$stage/usr/local/share/doc/HeptaTrader/development/PLAN.md"
          test ! -e "$stage/usr/local/share/doc/HeptaTrader/AGENT-NATIVE-TRADING-OS-ARCHITECTURE.md"
          grep -F '/usr/local/share/doc/HeptaTrader/README.md' "$stage/usr/local/lib/systemd/system/hepta-tool-gateway.service"
          python3 scripts/check_install_tree.py "$stage"

  reliability:
    name: canonical-full-suite-reliability (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ clang libssl-dev python3 python3-jsonschema
      - name: Run bounded reliability lane
        env:
          CXX: ${{ matrix.compiler }}
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_RELIABILITY_BUILD_DIR: ${{ runner.temp }}/heptatrader-reliability-${{ matrix.compiler }}
        run: ./scripts/reliability_core.sh
