name: Canonical Full Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: heptatrader-full-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_PARALLEL: "2"

jobs:
  core:
    name: canonical-full-suite-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate release and preflight contracts
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 -m unittest discover -s tests/python -p 'test_release_package.py'
          python3 -m unittest discover -s tests/python -p 'test_hepta_preflight.py'
      - name: Assert source remained clean
        if: always()
        run: |
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .

  reliability-gcc:
    name: canonical-full-suite-reliability (g++)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CC: gcc
      CXX: g++
      CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev g++
      - name: Configure sanitizer build
        run: |
          cmake -S . -B build/reliability-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DBUILD_TESTING=ON \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF
      - name: Build and run complete GCC sanitizer suite
        run: |
          cmake --build build/reliability-gcc --target hepta_core_test_binaries --parallel "$BUILD_PARALLEL"
          ctest --test-dir build/reliability-gcc --output-on-failure -L core --parallel "$BUILD_PARALLEL"

  reliability-clang:
    name: canonical-full-suite-reliability (clang++)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev clang
      - name: Configure sanitizer build
        run: |
          cmake -S . -B build/reliability-clang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DBUILD_TESTING=ON \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF
      - name: Build and run critical Clang sanitizer slice
        run: |
          cmake --build build/reliability-clang --parallel "$BUILD_PARALLEL" --target \
            hepta_execution_coordinator_tests \
            hepta_oms_journal_durability_tests \
            hepta_pre_trade_risk_engine_tests \
            hepta_simulator_risk_runtime_tests \
            hepta_unix_tool_server_tests
          ctest --test-dir build/reliability-clang --output-on-failure \
            -R 'hepta_(execution_coordinator|oms_journal_durability|pre_trade_risk_engine|simulator_risk_runtime|unix_tool_server)_tests' \
            --parallel "$BUILD_PARALLEL"
