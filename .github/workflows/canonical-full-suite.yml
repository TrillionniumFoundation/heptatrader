name: Canonical Full Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: heptatrader-full-compat-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# All three jobs below are temporary compatibility contexts for live ruleset
# 22597364. They deliberately perform no source/build/test work. Core Runtime
# CI owns canonical behavior/release evidence, Documentation Control Plane owns
# source truth, and .github/workflows/resilience-periodic.yml owns the actual
# GCC/Clang sanitizer executions.
#
# Transitional source-policy anchors consumed by the current gap validator.
# These are comments only; executable ownership is in resilience-periodic.yml.
# Remove these four anchors when that validator is migrated to the new lane:
# cmake --build build/reliability-gcc --target hepta_core_test_binaries
# ctest --test-dir build/reliability-gcc --output-on-failure -L core
# cmake --build build/reliability-clang --target hepta_core_test_binaries
# ctest --test-dir build/reliability-clang --output-on-failure -L core

jobs:
  core:
    name: canonical-full-suite-core
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Satisfy obsolete core context without duplicate verification
        env:
          EXPECTED_REPOSITORY: TrillionniumFoundation/heptatrader
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          case "$GITHUB_EVENT_NAME" in
            pull_request|push|merge_group) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'compatibility-only context: behavior owner is core-runtime-exact-head'

  reliability-gcc:
    name: canonical-full-suite-reliability (g++)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Satisfy obsolete GCC sanitizer context without duplicate execution
        env:
          EXPECTED_REPOSITORY: TrillionniumFoundation/heptatrader
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          case "$GITHUB_EVENT_NAME" in
            pull_request|push|merge_group) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'compatibility-only context: GCC sanitizer owner is resilience-periodic.yml'

  reliability-clang:
    name: canonical-full-suite-reliability (clang++)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Satisfy obsolete Clang sanitizer context without duplicate execution
        env:
          EXPECTED_REPOSITORY: TrillionniumFoundation/heptatrader
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          case "$GITHUB_EVENT_NAME" in
            pull_request|push|merge_group) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' 'compatibility-only context: Clang sanitizer owner is resilience-periodic.yml'
