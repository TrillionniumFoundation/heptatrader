name: Canonical Full Suite
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: heptatrader-required-resilience-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The server still requires this redundant historical core name. Core CI owns
  # its real behavior; retire this one shim with the server-side context.
  core:
    name: canonical-full-suite-core
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Legacy core context pending ruleset retirement
        run: echo 'compatibility-only context; real core owner is core-runtime-exact-head'
  reliability-gcc:
    name: canonical-full-suite-reliability (g++)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BUILD_PARALLEL: '2'
      HEPTA_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev g++ clang
      - name: Execute the behavior-bearing sanitizer lane
        run: bash scripts/run_runtime_resilience.sh g++
  reliability-clang:
    name: canonical-full-suite-reliability (clang++)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BUILD_PARALLEL: '2'
      HEPTA_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev g++ clang
      - name: Execute the behavior-bearing sanitizer lane
        run: bash scripts/run_runtime_resilience.sh clang++
