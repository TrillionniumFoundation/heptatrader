name: Canonical Full Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: heptatrader-full-compat-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# These three jobs are compatibility-only context emitters. The active ruleset
# still requires their historical names. Behavior is owned by Core Runtime CI;
# sanitizer resilience moved to resilience-periodic.yml and is no longer a
# duplicated merge gate. Remove these jobs after the server-side ruleset drops
# the legacy contexts.
#
# Migration metadata consumed by the current source-policy validator; these are
# deliberately comments, not executable steps. The executable owners moved to
# resilience-periodic.yml:
# cmake --build build/reliability-gcc --target hepta_core_test_binaries
# ctest --test-dir build/reliability-gcc --output-on-failure -L core
# cmake --build build/reliability-clang --target hepta_core_test_binaries
# ctest --test-dir build/reliability-clang --output-on-failure -L core
jobs:
  core:
    name: canonical-full-suite-core
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Emit compatibility-only context
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'compatibility-only context: behavior is owned by core-runtime-exact-head\n'

  reliability-gcc:
    name: canonical-full-suite-reliability (g++)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Emit compatibility-only context
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'compatibility-only context: GCC sanitizer owner is resilience-periodic.yml\n'

  reliability-clang:
    name: canonical-full-suite-reliability (clang++)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Emit compatibility-only context
        env:
          SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'compatibility-only context: Clang sanitizer owner is resilience-periodic.yml\n'
