name: reliability-runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read

concurrency:
  group: reliability-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitizer-crash-fuzz-replay:
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ clang libssl-dev python3
      - name: ASAN/UBSAN, crash replay, malformed protocol and performance fixture
        env:
          CXX: ${{ matrix.compiler }}
          HEPTA_JOBS: "2"
        run: ./scripts/reliability_core.sh
