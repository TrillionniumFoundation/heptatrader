name: External IB Runner Availability Attempt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: heptatrader-external-ib-runner-availability-attempt
  cancel-in-progress: false

jobs:
  probe:
    name: external-ib-runner-availability-attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Dispatch the source-controlled runner availability workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started=$started" >> "$GITHUB_OUTPUT"
          status="$(curl --silent --show-error --output /tmp/dispatch.json --write-out '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/self-hosted-ib-availability.yml/dispatches" \
            -d '{"ref":"main"}')"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status=int(os.environ['STATUS'])
          body=Path('/tmp/dispatch.json').read_text(encoding='utf-8',errors='replace')
          try: parsed=json.loads(body) if body else None
          except json.JSONDecodeError: parsed={'unparsed_tail':body[-2000:]}
          Path('/tmp/ib-runner-dispatch-result.json').write_text(
              json.dumps({'http_status':status,'body':parsed},indent=2)+'\n',encoding='utf-8')
          if status != 204:
              raise SystemExit(f'runner availability dispatch failed with HTTP {status}')
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          STATUS: ${{ steps.dispatch.outputs.unused }}

      - name: Record dispatch result robustly
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          STARTED: ${{ steps.dispatch.outputs.started }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, subprocess, time, urllib.parse
          from pathlib import Path

          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; source=os.environ['SOURCE_SHA']; started=os.environ.get('STARTED','')
          def api(path):
              result=subprocess.run([
                  'curl','--fail-with-body','--silent','--show-error',
                  '-H','Accept: application/vnd.github+json',
                  '-H',f'Authorization: Bearer {token}',
                  '-H','X-GitHub-Api-Version: 2022-11-28',
                  f'https://api.github.com/repos/{repo}/{path}'
              ],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=False)
              if result.returncode: return {'error':result.stdout[-3000:]}
              return json.loads(result.stdout)

          # The dispatch step above may fail before writing a valid status file.
          dispatch_result={'http_status':0,'body':None}
          path=Path('/tmp/ib-runner-dispatch-result.json')
          if path.is_file():
              dispatch_result=json.loads(path.read_text(encoding='utf-8'))
          else:
              # Retry the one safe, mutation-free workflow dispatch and capture its actual status.
              completed=subprocess.run([
                  'curl','--silent','--show-error','--write-out','\n%{http_code}',
                  '-X','POST','-H','Accept: application/vnd.github+json',
                  '-H',f'Authorization: Bearer {token}',
                  '-H','X-GitHub-Api-Version: 2022-11-28',
                  f'https://api.github.com/repos/{repo}/actions/workflows/self-hosted-ib-availability.yml/dispatches',
                  '-d','{"ref":"main"}'
              ],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=False)
              body,_,status=completed.stdout.rpartition('\n')
              try: parsed=json.loads(body) if body else None
              except json.JSONDecodeError: parsed={'unparsed_tail':body[-2000:]}
              dispatch_result={'http_status':int(status) if status.isdigit() else 0,'body':parsed}

          run=None
          if dispatch_result['http_status']==204:
              deadline=time.monotonic()+300
              while time.monotonic()<deadline:
                  runs=api('actions/workflows/self-hosted-ib-availability.yml/runs?event=workflow_dispatch&per_page=10').get('workflow_runs',[])
                  candidates=[item for item in runs if isinstance(item,dict) and item.get('head_branch')=='main']
                  if candidates:
                      run=max(candidates,key=lambda item:int(item.get('id',0)))
                      # A queued self-hosted run is already useful availability evidence.
                      if run.get('status') in {'queued','in_progress','completed','waiting','pending'}:
                          break
                  time.sleep(10)

          jobs=[]
          if run is not None:
              jobs=api(f"actions/runs/{run['id']}/jobs?per_page=100").get('jobs',[])
          report={
              'schema':'heptatrader.ib-runner-availability-attempt.v1',
              'source_sha':source,
              'dispatch':dispatch_result,
              'run':None if run is None else {
                  key:run.get(key) for key in ('id','head_sha','head_branch','event','status','conclusion','created_at','updated_at','path')
              },
              'jobs':[
                  {
                      'id':job.get('id'),'name':job.get('name'),'status':job.get('status'),
                      'conclusion':job.get('conclusion'),'labels':job.get('labels'),
                      'runner_name':job.get('runner_name'),'runner_group_name':job.get('runner_group_name')
                  }
                  for job in jobs if isinstance(job,dict)
              ],
              'broker_mutation_attempted':False,
              'paper_authorized':False,
              'live_authorized':False,
          }
          Path('/tmp/ib-runner-availability-attempt.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          status='dispatch_failed'
          if run is not None:
              status=f"run_{run.get('status')}_{run.get('conclusion')}"
          summary=(
              f"Exact trusted main: `{source}`\n\n"
              f"Self-hosted IB availability probe: `{status}`.\n\n"
              "This probe dispatched only the source-controlled availability workflow; it did not access broker credentials or submit an order. "
              "PAPER and LIVE authorization remain false until protected runner/environment and broker qualification receipts validate.\n"
          )
          Path('/tmp/ib-runner-availability-summary.md').write_text(summary,encoding='utf-8')
          PY

      - name: Comment runner availability evidence on G-IB-001
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -f /tmp/ib-runner-availability-summary.md || exit 0
          BODY="$(cat /tmp/ib-runner-availability-summary.md)" python3 - <<'PY' >/tmp/comment.json
          import json, os
          print(json.dumps({'body':os.environ['BODY']}))
          PY
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -X POST "https://api.github.com/repos/$REPOSITORY/issues/9/comments" \
            --data-binary @/tmp/comment.json >/dev/null

      - name: Upload runner availability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ib-runner-availability-attempt-${{ github.sha }}
          path: /tmp/ib-runner-availability-attempt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed unless the availability run completed successfully
        if: always()
        run: |
          python3 - <<'PY'
          import json
          report=json.load(open('/tmp/ib-runner-availability-attempt.json'))
          run=report.get('run') or {}
          if run.get('status')!='completed' or run.get('conclusion')!='success':
              raise SystemExit('protected IB runner availability is not successfully proven')
          PY
