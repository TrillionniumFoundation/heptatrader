name: dev-research-reliability-fix-history-bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inert-history-bridge:
    if: "${{ false }}"
    runs-on: ubuntu-latest
    steps:
      - name: Historical recovery bridge only
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          root = Path.cwd()
          source = Path(
              ".github/workflows/dev-research-reliability-closure.yml"
          ).read_text(encoding="utf-8")
          marker = "          python3 - <<'PY'\n"
          start = source.find(marker)
          if start < 0:
              raise RuntimeError("research reliability closure marker missing")
          start += len(marker)
          end = source.find("\n          PY\n", start)
          if end < 0:
              raise RuntimeError("research reliability closure terminator missing")
          program = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in source[start:end].splitlines()
          )
          exec(compile(program, "historical-research-reliability-closure", "exec"), {})

          encoded = ""
          target = root / "scripts/generate_tool_catalog.py"
          target.write_bytes(base64.b64decode(encoded))
          target.chmod(0o755)
          compile(target.read_text(encoding="utf-8"), str(target), "exec")
          PY
