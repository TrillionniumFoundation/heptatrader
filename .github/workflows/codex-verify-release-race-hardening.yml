name: Codex Verify Release Race Hardening

on:
  push:
    branches:
      - codex/close-source-blockers-v2-2026-09-08

permissions:
  contents: write

concurrency:
  group: codex-release-race-hardening
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.event.head_commit.message, 'chore: stage follow-up race hardening verification')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Preserve compatibility helpers and rollback identity safety
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/python/test_release_security_races.py
          python3 - <<'PY'
          from pathlib import Path

          build = Path('scripts/build_release_package.py')
          text = build.read_text(encoding='utf-8')
          if 'def sha256_file(path: Path) -> str:' not in text:
              marker = 'def validate_identity('
              helper = '''def sha256_file(path: Path) -> str:\n    descriptor = parent = -1\n    snapshot = None\n    try:\n        descriptor, parent, name, metadata = _open_pinned_regular(path)\n        snapshot, digest = _copy_to_snapshot(\n            descriptor, parent, name, metadata, _absolute_path(path)\n        )\n        return digest\n    finally:\n        if snapshot is not None:\n            snapshot.close()\n        if descriptor >= 0:\n            os.close(descriptor)\n        if parent >= 0:\n            os.close(parent)\n\n\n'''
              if text.count(marker) != 1:
                  raise SystemExit('build validate_identity marker mismatch')
              text = text.replace(marker, helper + marker, 1)
          old = '''        for published in reversed(written):\n            try:\n                _remove_published(published)\n            except OSError:\n                pass\n'''
          new = '''        for published in reversed(written):\n            try:\n                _remove_published(published)\n            except (OSError, PackageError):\n                pass\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('release rollback cleanup marker mismatch')
          build.write_text(text, encoding='utf-8')

          preflight = Path('scripts/hepta_preflight.py')
          text = preflight.read_text(encoding='utf-8')
          if 'def sha256_file(path: Path) -> str:' not in text:
              marker = 'def _write_all(descriptor: int, content: bytes) -> None:'
              helper = '''def sha256_file(path: Path) -> str:\n    pinned = _snapshot_pinned_file(_absolute_path(path), "file")\n    try:\n        return pinned.sha256\n    finally:\n        pinned.close()\n\n\n'''
              if text.count(marker) != 1:
                  raise SystemExit('preflight write helper marker mismatch')
              text = text.replace(marker, helper + marker, 1)
          preflight.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile \
            scripts/build_release_package.py \
            scripts/hepta_preflight.py \
            tests/python/test_release_security_races.py

      - name: Run all Python contracts and documentation validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          python3 scripts/check_documentation.py
          python3 scripts/check_gap_register.py

      - name: Commit verified follow-up and remove one-shot workflow
        shell: bash
        env:
          BRANCH: codex/close-source-blockers-v2-2026-09-08
        run: |
          set -euo pipefail
          git rm .github/workflows/codex-verify-release-race-hardening.yml
          git add scripts/build_release_package.py scripts/hepta_preflight.py
          git diff --cached --check
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'test(release): verify no-replace and pinned-input contracts'
          git push origin "HEAD:$BRANCH"
