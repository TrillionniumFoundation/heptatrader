name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: heptatrader-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc
      CXX: g++
    outputs:
      candidate_sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and record hosted toolchain
        run: >-
          python3 scripts/verify_ci_toolchain.py
          --compiler gcc
          --write-observed "$RUNNER_TEMP/toolchain-observation.json"
      - name: Establish candidate identity and deterministic epoch
        id: identity
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
      - name: Bind tag to qualified current main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '\r\n' < VERSION)"
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          python3 scripts/verify_release_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$CANDIDATE_SHA" \
            --main-sha "$MAIN_SHA"
      - name: Verify repository contracts
        run: |
          python3 scripts/check_repo_contracts.py
          python3 -m unittest discover -s tests/python -p 'test_*.py' -v
      - name: Build and test first release tree
        run: |
          set -euo pipefail
          cmake -S . -B build-a -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF \
            -DHEPTA_ENABLE_HARDENING=ON
          cmake --build build-a --parallel 2
          ctest --test-dir build-a --output-on-failure --parallel 2 -L core
      - name: Build independent second release tree
        run: |
          set -euo pipefail
          cmake -S . -B build-b -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF \
            -DHEPTA_ENABLE_HARDENING=ON
          cmake --build build-b --parallel 2
      - name: Stage and verify both release trees
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          for suffix in a b; do
            stage="$RUNNER_TEMP/stage-$suffix/usr"
            evidence="$RUNNER_TEMP/evidence-$suffix"
            mkdir -p "$evidence"
            cmake --install "build-$suffix" --prefix "$stage"
            python3 scripts/verify_install_tree.py \
              --root "$stage" \
              --logical-root /usr \
              --manifest "$evidence/install-manifest.json"
            python3 scripts/generate_sbom.py \
              --root "$stage" \
              --version-file VERSION \
              --git-sha "$CANDIDATE_SHA" \
              --source-date-epoch "$SOURCE_DATE_EPOCH" \
              --output "$evidence/heptatrader.spdx.json"
            python3 scripts/build_release_archive.py \
              --root "$stage" \
              --prefix usr \
              --source-date-epoch "$SOURCE_DATE_EPOCH" \
              --output "$evidence/heptatrader-${VERSION_VALUE}.tar.gz"
          done
      - name: Prove and seal byte-for-byte reproducibility
        run: |
          set -euo pipefail
          VERSION_VALUE="$(tr -d '\r\n' < VERSION)"
          cmp "$RUNNER_TEMP/evidence-a/install-manifest.json" \
              "$RUNNER_TEMP/evidence-b/install-manifest.json"
          cmp "$RUNNER_TEMP/evidence-a/heptatrader.spdx.json" \
              "$RUNNER_TEMP/evidence-b/heptatrader.spdx.json"
          cmp "$RUNNER_TEMP/evidence-a/heptatrader-${VERSION_VALUE}.tar.gz" \
              "$RUNNER_TEMP/evidence-b/heptatrader-${VERSION_VALUE}.tar.gz"
          mkdir -p dist
          cp "$RUNNER_TEMP/evidence-a/"* dist/
          cp "$RUNNER_TEMP/toolchain-observation.json" dist/
          (cd dist && LC_ALL=C sha256sum * > SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ steps.identity.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: heptatrader-release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ needs.build-candidate.outputs.candidate_sha }}
          path: dist
      - name: Verify protected approval and candidate integrity
        env:
          APPROVED_SHA: ${{ vars.HEPTA_RELEASE_APPROVED_SHA }}
          CANDIDATE_SHA: ${{ needs.build-candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_SHA" = "$CANDIDATE_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
