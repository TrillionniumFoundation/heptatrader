name: Tagged Release Evidence

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    name: tagged-release-package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout tagged source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev zlib1g-dev python3-yaml
      - name: Assert tag and VERSION agree
        id: check-release-tag
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Check blockers declared for this release profile
        run: python3 scripts/check_gap_register.py --release-profile core
      - name: Build tested core
        env:
          HEPTA_BUILD_DIR: ${{ github.workspace }}/build/core
          HEPTA_JOBS: "2"
        run: ./scripts/dev_core.sh
      - name: Verify deployment unit contract
        run: python3 scripts/check_systemd_units.py
      - name: Accept this release artifact through the canonical installed lifecycle
        id: accept-core-artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: python3 scripts/accept_core_release.py --build-dir build/core --output-dir dist --source-sha "$EXPECTED_SHA"
      - name: Bind tag to the accepted package digest
        id: bind-release-manifest
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_SHA" "$GITHUB_REF_NAME" <<'PYTHON'
          import hashlib, json, pathlib, sys
          source, tag = sys.argv[1:]
          version = pathlib.Path("VERSION").read_text().strip()
          if tag != "v" + version:
              raise SystemExit("tag/version mismatch")
          package = pathlib.Path("dist") / f"heptatrader-{version}-core-{source}.tar.gz"
          receipt = json.loads(pathlib.Path(str(package) + ".receipt.json").read_text())
          acceptance = json.loads(pathlib.Path("dist/core-acceptance.json").read_text())
          sha = hashlib.sha256()
          with package.open("rb") as stream:
              for block in iter(lambda: stream.read(1 << 20), b""):
                  sha.update(block)
          for evidence in (receipt, acceptance):
              if (evidence.get("source_sha") != source or evidence.get("version") != version
                  or evidence.get("profile") != "core" or evidence.get("package_sha256") != sha.hexdigest()
                  or evidence.get("authorization_effect") != "NONE"
                  or evidence.get("paper_authorized") is not False or evidence.get("live_authorized") is not False):
                  raise SystemExit("release and accepted artifact identities disagree")
          if acceptance.get("schema") != "heptatrader.core-artifact-acceptance.v1" or acceptance.get("result") != "PASS":
              raise SystemExit("missing successful installed acceptance")
          manifest = {"schema": "heptatrader.tagged-release-manifest.v1", "tag": tag,
                      "source_sha": source, "artifact": receipt, "acceptance": acceptance}
          with pathlib.Path("dist/release-manifest.json").open("x") as stream:
              json.dump(manifest, stream, sort_keys=True, separators=(",", ":"))
              stream.write("\n")
          PYTHON
          sha256sum dist/release-manifest.json > dist/release-manifest.json.sha256
      - name: Retain failed lifecycle diagnostics without publishing a release
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: failed-release-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/core-evidence/
            dist/process-evidence/
            dist/systemd-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-release-${{ github.ref_name }}-${{ github.sha }}
          path: |
            dist/heptatrader-*-core-*.tar.gz
            dist/heptatrader-*-core-*.tar.gz.sha256
            dist/heptatrader-*-core-*.tar.gz.receipt.json
            dist/core-acceptance.json
            dist/release-manifest.json
            dist/release-manifest.json.sha256
            dist/release-simulator-smoke-*.json
            dist/core-evidence/
            dist/process-evidence/
            dist/systemd-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
