name: dev-intent-gap-closure

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/dev-intent-gap-closure.yml

permissions:
  contents: write

jobs:
  close-intent-gaps:
    if: github.repository == 'TrillionniumFoundation/heptatrader' && github.event.head_commit.message == 'chore(dev): launch authoritative intent gap closure'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++ libssl-dev python3
      - name: Apply authoritative snapshot and target-position tool chain
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8-sig")

          def write(path: str, text: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding="utf-8")

          def add_include(path: str, anchor: str, include: str) -> None:
              text = read(path)
              if include in text:
                  return
              if anchor not in text:
                  raise RuntimeError(f"{path}: include anchor missing: {anchor}")
              write(path, text.replace(anchor, anchor + "\n" + include, 1))

          # Recover the first verified slice when a prior runner was interrupted.
          telemetry = ROOT / "HeptaTrade/observability/runtime_telemetry.cpp"
          old_launchers = [
              ROOT / ".github/workflows/dev-gap-closure-run.yml",
              ROOT / ".github/workflows/dev-gap-closure-recover.yml",
          ]
          if not telemetry.exists():
              launcher = next((p for p in old_launchers if p.exists() and
                               "Apply permit lifecycle tests" in p.read_text(encoding="utf-8")), None)
              if launcher is None:
                  raise RuntimeError("permit/telemetry closure slice is absent")
              source = launcher.read_text(encoding="utf-8")
              marker = "          python3 - <<'PY'\n"
              start = source.find(marker)
              start += len(marker)
              end = source.find("\n          PY\n", start)
              if start < len(marker) or end < 0:
                  raise RuntimeError("cannot recover embedded permit closure program")
              lines = [line[10:] if line.startswith("          ") else line
                       for line in source[start:end].splitlines()]
              exec(compile("\n".join(lines), "embedded-permit-closure", "exec"), {})
          telemetry_text = telemetry.read_text(encoding="utf-8")
          if "#include <cctype>" not in telemetry_text:
              telemetry_text = telemetry_text.replace(
                  "#include <algorithm>\n", "#include <algorithm>\n#include <cctype>\n", 1)
              telemetry.write_text(telemetry_text, encoding="utf-8")

          bounded_json_h = r'''#pragma once

#include <cstddef>
#include <cstdint>
#include <map>
#include <string>
#include <vector>

class BoundedJsonValue
{
public:
    enum class Type
    {
        Null = 0,
        Boolean,
        Number,
        String,
        Array,
        Object
    };

    BoundedJsonValue();

    Type GetType() const { return m_type; }
    bool IsNull() const { return m_type == Type::Null; }
    bool IsBoolean() const { return m_type == Type::Boolean; }
    bool IsNumber() const { return m_type == Type::Number; }
    bool IsString() const { return m_type == Type::String; }
    bool IsArray() const { return m_type == Type::Array; }
    bool IsObject() const { return m_type == Type::Object; }

    bool Boolean(bool& out) const;
    bool Number(double& out) const;
    bool Unsigned(std::uint64_t& out) const;
    bool String(std::string& out) const;
    const std::vector<BoundedJsonValue>& Array() const { return m_array; }
    const std::map<std::string, BoundedJsonValue>& Object() const { return m_object; }
    const BoundedJsonValue* Find(const std::string& key) const;

private:
    friend class BoundedJsonParser;
    Type m_type;
    bool m_boolean;
    double m_number;
    std::string m_string;
    std::vector<BoundedJsonValue> m_array;
    std::map<std::string, BoundedJsonValue> m_object;
};

bool ParseBoundedJson(const std::string& input,
                      BoundedJsonValue& value,
                      std::string& reason,
                      std::size_t maximumBytes = 1024u * 1024u,
                      std::size_t maximumDepth = 64,
                      std::size_t maximumNodes = 100000);
'''

          bounded_json_cpp = r'''#include "bounded_json.h"

#include <cerrno>
#include <cmath>
#include <cstdlib>
#include <limits>

BoundedJsonValue::BoundedJsonValue()
    : m_type(Type::Null), m_boolean(false), m_number(0.0)
{
}

bool BoundedJsonValue::Boolean(bool& out) const
{
    if (!IsBoolean()) return false;
    out = m_boolean;
    return true;
}

bool BoundedJsonValue::Number(double& out) const
{
    if (!IsNumber()) return false;
    out = m_number;
    return true;
}

bool BoundedJsonValue::Unsigned(std::uint64_t& out) const
{
    if (!IsNumber() || m_number < 0.0 || !std::isfinite(m_number) ||
        std::floor(m_number) != m_number ||
        m_number > static_cast<double>(std::numeric_limits<std::uint64_t>::max()))
        return false;
    out = static_cast<std::uint64_t>(m_number);
    return true;
}

bool BoundedJsonValue::String(std::string& out) const
{
    if (!IsString()) return false;
    out = m_string;
    return true;
}

const BoundedJsonValue* BoundedJsonValue::Find(const std::string& key) const
{
    if (!IsObject()) return nullptr;
    const std::map<std::string, BoundedJsonValue>::const_iterator found =
        m_object.find(key);
    return found == m_object.end() ? nullptr : &found->second;
}

class BoundedJsonParser
{
public:
    BoundedJsonParser(const std::string& input,
                      std::size_t maximumDepth,
                      std::size_t maximumNodes)
        : m_input(input), m_maximumDepth(maximumDepth),
          m_maximumNodes(maximumNodes)
    {
    }

    bool Parse(BoundedJsonValue& value, std::string& reason)
    {
        SkipWhitespace();
        if (!ParseValue(0, value, reason)) return false;
        SkipWhitespace();
        if (m_offset != m_input.size())
        {
            reason = "JSON_TRAILING_DATA";
            return false;
        }
        reason.clear();
        return true;
    }

private:
    void SkipWhitespace()
    {
        while (m_offset < m_input.size())
        {
            const char c = m_input[m_offset];
            if (c != ' ' && c != '\t' && c != '\r' && c != '\n') break;
            ++m_offset;
        }
    }

    bool Node(std::string& reason)
    {
        if (++m_nodes > m_maximumNodes)
        {
            reason = "JSON_NODE_LIMIT";
            return false;
        }
        return true;
    }

    bool Consume(char value)
    {
        if (m_offset >= m_input.size() || m_input[m_offset] != value)
            return false;
        ++m_offset;
        return true;
    }

    bool ParseString(std::string& output, std::string& reason)
    {
        if (!Consume('"'))
        {
            reason = "JSON_STRING_REQUIRED";
            return false;
        }
        output.clear();
        while (m_offset < m_input.size())
        {
            const unsigned char c = static_cast<unsigned char>(m_input[m_offset++]);
            if (c == '"') return true;
            if (c < 0x20)
            {
                reason = "JSON_CONTROL_CHARACTER";
                return false;
            }
            if (c != '\\')
            {
                output.push_back(static_cast<char>(c));
                continue;
            }
            if (m_offset >= m_input.size())
            {
                reason = "JSON_ESCAPE_TRUNCATED";
                return false;
            }
            const char escaped = m_input[m_offset++];
            if (escaped == '"' || escaped == '\\' || escaped == '/')
                output.push_back(escaped);
            else if (escaped == 'b') output.push_back('\b');
            else if (escaped == 'f') output.push_back('\f');
            else if (escaped == 'n') output.push_back('\n');
            else if (escaped == 'r') output.push_back('\r');
            else if (escaped == 't') output.push_back('\t');
            else if (escaped == 'u')
            {
                if (m_input.size() - m_offset < 4)
                {
                    reason = "JSON_UNICODE_ESCAPE_TRUNCATED";
                    return false;
                }
                unsigned int codepoint = 0;
                for (int i = 0; i < 4; ++i)
                {
                    const char digit = m_input[m_offset++];
                    codepoint <<= 4;
                    if (digit >= '0' && digit <= '9') codepoint += digit - '0';
                    else if (digit >= 'a' && digit <= 'f') codepoint += digit - 'a' + 10;
                    else if (digit >= 'A' && digit <= 'F') codepoint += digit - 'A' + 10;
                    else
                    {
                        reason = "JSON_UNICODE_ESCAPE_INVALID";
                        return false;
                    }
                }
                if (codepoint <= 0x7f)
                    output.push_back(static_cast<char>(codepoint));
                else
                    output.push_back('?');
            }
            else
            {
                reason = "JSON_ESCAPE_INVALID";
                return false;
            }
            if (output.size() > 256u * 1024u)
            {
                reason = "JSON_STRING_LIMIT";
                return false;
            }
        }
        reason = "JSON_STRING_UNTERMINATED";
        return false;
    }

    bool ParseNumber(BoundedJsonValue& value, std::string& reason)
    {
        const std::size_t start = m_offset;
        if (m_offset < m_input.size() && m_input[m_offset] == '-') ++m_offset;
        if (m_offset >= m_input.size())
        {
            reason = "JSON_NUMBER_INVALID";
            return false;
        }
        if (m_input[m_offset] == '0')
        {
            ++m_offset;
            if (m_offset < m_input.size() &&
                m_input[m_offset] >= '0' && m_input[m_offset] <= '9')
            {
                reason = "JSON_NUMBER_INVALID";
                return false;
            }
        }
        else
        {
            if (m_input[m_offset] < '1' || m_input[m_offset] > '9')
            {
                reason = "JSON_NUMBER_INVALID";
                return false;
            }
            while (m_offset < m_input.size() &&
                   m_input[m_offset] >= '0' && m_input[m_offset] <= '9')
                ++m_offset;
        }
        if (m_offset < m_input.size() && m_input[m_offset] == '.')
        {
            ++m_offset;
            const std::size_t digits = m_offset;
            while (m_offset < m_input.size() &&
                   m_input[m_offset] >= '0' && m_input[m_offset] <= '9')
                ++m_offset;
            if (digits == m_offset)
            {
                reason = "JSON_NUMBER_INVALID";
                return false;
            }
        }
        if (m_offset < m_input.size() &&
            (m_input[m_offset] == 'e' || m_input[m_offset] == 'E'))
        {
            ++m_offset;
            if (m_offset < m_input.size() &&
                (m_input[m_offset] == '+' || m_input[m_offset] == '-'))
                ++m_offset;
            const std::size_t digits = m_offset;
            while (m_offset < m_input.size() &&
                   m_input[m_offset] >= '0' && m_input[m_offset] <= '9')
                ++m_offset;
            if (digits == m_offset)
            {
                reason = "JSON_NUMBER_INVALID";
                return false;
            }
        }
        const std::string token = m_input.substr(start, m_offset - start);
        char* end = nullptr;
        errno = 0;
        const double parsed = std::strtod(token.c_str(), &end);
        if (errno != 0 || end == token.c_str() || *end != '\0' ||
            !std::isfinite(parsed))
        {
            reason = "JSON_NUMBER_NONFINITE";
            return false;
        }
        value.m_type = BoundedJsonValue::Type::Number;
        value.m_number = parsed;
        return true;
    }

    bool ParseArray(std::size_t depth,
                    BoundedJsonValue& value,
                    std::string& reason)
    {
        if (!Consume('[')) return false;
        value.m_type = BoundedJsonValue::Type::Array;
        SkipWhitespace();
        if (Consume(']')) return true;
        for (;;)
        {
            BoundedJsonValue member;
            if (!ParseValue(depth + 1, member, reason)) return false;
            value.m_array.push_back(member);
            SkipWhitespace();
            if (Consume(']')) return true;
            if (!Consume(','))
            {
                reason = "JSON_ARRAY_SEPARATOR_REQUIRED";
                return false;
            }
            SkipWhitespace();
        }
    }

    bool ParseObject(std::size_t depth,
                     BoundedJsonValue& value,
                     std::string& reason)
    {
        if (!Consume('{')) return false;
        value.m_type = BoundedJsonValue::Type::Object;
        SkipWhitespace();
        if (Consume('}')) return true;
        for (;;)
        {
            std::string key;
            if (!ParseString(key, reason)) return false;
            SkipWhitespace();
            if (!Consume(':'))
            {
                reason = "JSON_OBJECT_COLON_REQUIRED";
                return false;
            }
            SkipWhitespace();
            BoundedJsonValue member;
            if (!ParseValue(depth + 1, member, reason)) return false;
            if (!value.m_object.insert(std::make_pair(key, member)).second)
            {
                reason = "JSON_DUPLICATE_KEY";
                return false;
            }
            SkipWhitespace();
            if (Consume('}')) return true;
            if (!Consume(','))
            {
                reason = "JSON_OBJECT_SEPARATOR_REQUIRED";
                return false;
            }
            SkipWhitespace();
        }
    }

    bool ParseValue(std::size_t depth,
                    BoundedJsonValue& value,
                    std::string& reason)
    {
        if (depth > m_maximumDepth)
        {
            reason = "JSON_DEPTH_LIMIT";
            return false;
        }
        if (!Node(reason) || m_offset >= m_input.size())
        {
            if (reason.empty()) reason = "JSON_VALUE_REQUIRED";
            return false;
        }
        const char c = m_input[m_offset];
        if (c == '{') return ParseObject(depth, value, reason);
        if (c == '[') return ParseArray(depth, value, reason);
        if (c == '"')
        {
            value.m_type = BoundedJsonValue::Type::String;
            return ParseString(value.m_string, reason);
        }
        if (m_input.compare(m_offset, 4, "true") == 0)
        {
            m_offset += 4;
            value.m_type = BoundedJsonValue::Type::Boolean;
            value.m_boolean = true;
            return true;
        }
        if (m_input.compare(m_offset, 5, "false") == 0)
        {
            m_offset += 5;
            value.m_type = BoundedJsonValue::Type::Boolean;
            value.m_boolean = false;
            return true;
        }
        if (m_input.compare(m_offset, 4, "null") == 0)
        {
            m_offset += 4;
            value.m_type = BoundedJsonValue::Type::Null;
            return true;
        }
        return ParseNumber(value, reason);
    }

    const std::string& m_input;
    std::size_t m_maximumDepth;
    std::size_t m_maximumNodes;
    std::size_t m_offset = 0;
    std::size_t m_nodes = 0;
};

bool ParseBoundedJson(const std::string& input,
                      BoundedJsonValue& value,
                      std::string& reason,
                      std::size_t maximumBytes,
                      std::size_t maximumDepth,
                      std::size_t maximumNodes)
{
    value = BoundedJsonValue();
    if (input.empty() || input.size() > maximumBytes ||
        maximumDepth == 0 || maximumNodes == 0)
    {
        reason = "JSON_INPUT_LIMIT";
        return false;
    }
    BoundedJsonParser parser(input, maximumDepth, maximumNodes);
    return parser.Parse(value, reason);
}
'''
          write("HeptaTrade/intent/bounded_json.h", bounded_json_h)
          write("HeptaTrade/intent/bounded_json.cpp", bounded_json_cpp)

          snapshot_cpp = r'''#include "authoritative_decision_snapshot.h"
#include "bounded_json.h"

#include <cmath>
#include <iomanip>
#include <sstream>
#include <vector>

namespace
{
const std::size_t kMaximumComponentBytes = 256u * 1024u;
const std::size_t kMaximumSnapshotBytes = 1024u * 1024u;

bool Reject(const char* code, const std::string& message,
            std::string& reasonCode, std::string& detail)
{
    reasonCode = code;
    detail = message;
    return false;
}

std::string EscapeJson(const std::string& value)
{
    std::ostringstream out;
    for (std::string::const_iterator it = value.begin(); it != value.end(); ++it)
    {
        const unsigned char c = static_cast<unsigned char>(*it);
        if (c == '"') out << "\\\"";
        else if (c == '\\') out << "\\\\";
        else if (c == '\n') out << "\\n";
        else if (c == '\r') out << "\\r";
        else if (c == '\t') out << "\\t";
        else if (c < 0x20) out << '?';
        else out << *it;
    }
    return out.str();
}

bool ParseObject(const std::string& json,
                 BoundedJsonValue& value,
                 std::string& reason)
{
    return ParseBoundedJson(json, value, reason, kMaximumComponentBytes) &&
        value.IsObject();
}

bool RequiredBool(const BoundedJsonValue& object,
                  const char* key,
                  bool& value)
{
    const BoundedJsonValue* field = object.Find(key);
    return field != nullptr && field->Boolean(value);
}

bool RequiredString(const BoundedJsonValue& object,
                    const char* key,
                    std::string& value)
{
    const BoundedJsonValue* field = object.Find(key);
    return field != nullptr && field->String(value);
}

bool RequiredUnsigned(const BoundedJsonValue& object,
                      const char* key,
                      std::uint64_t& value)
{
    const BoundedJsonValue* field = object.Find(key);
    return field != nullptr && field->Unsigned(value);
}

bool RequiredNumber(const BoundedJsonValue& object,
                    const char* key,
                    double& value)
{
    const BoundedJsonValue* field = object.Find(key);
    return field != nullptr && field->Number(value) && std::isfinite(value);
}

bool Authoritative(const BoundedJsonValue& object)
{
    bool authoritative = false;
    return RequiredBool(object, "authoritative", authoritative) && authoritative;
}

struct HealthIdentity
{
    std::string epoch;
    std::uint64_t fencingGeneration = 0;
    std::uint64_t eventWatermark = 0;
};

bool ParseHealth(const BoundedJsonValue& object, HealthIdentity& identity)
{
    bool ready = false;
    return RequiredBool(object, "remote_execution_ready", ready) && ready &&
        RequiredString(object, "execution_service_epoch", identity.epoch) &&
        !identity.epoch.empty() &&
        RequiredUnsigned(object, "execution_service_fencing_generation",
                         identity.fencingGeneration) &&
        identity.fencingGeneration != 0 &&
        RequiredUnsigned(object, "event_watermark", identity.eventWatermark);
}

void FindInstrumentPositions(const BoundedJsonValue& value,
                             const std::string& instrument,
                             std::vector<double>& quantities)
{
    if (value.IsObject())
    {
        const BoundedJsonValue* instrumentField = value.Find("instrument");
        const BoundedJsonValue* quantityField = value.Find("quantity");
        std::string candidate;
        double quantity = 0.0;
        if (instrumentField != nullptr && quantityField != nullptr &&
            instrumentField->String(candidate) && candidate == instrument &&
            quantityField->Number(quantity) && std::isfinite(quantity))
            quantities.push_back(quantity);
        for (std::map<std::string, BoundedJsonValue>::const_iterator it =
                 value.Object().begin(); it != value.Object().end(); ++it)
            FindInstrumentPositions(it->second, instrument, quantities);
    }
    else if (value.IsArray())
    {
        for (std::vector<BoundedJsonValue>::const_iterator it =
                 value.Array().begin(); it != value.Array().end(); ++it)
            FindInstrumentPositions(*it, instrument, quantities);
    }
}
}

bool AuthoritativeDecisionSnapshotCodec::Build(
    const std::string& agentId,
    const std::string& sessionId,
    const std::string& account,
    const std::string& executionDomain,
    const std::string& instrument,
    std::int64_t collectionStartedAtMs,
    std::int64_t collectionCompletedAtMs,
    std::uint64_t collectionWatermark,
    const AuthoritativeDecisionSnapshotPayloads& payloads,
    TargetPositionDecisionSnapshot& snapshot,
    std::string& outputJson,
    std::string& reasonCode,
    std::string& detail)
{
    snapshot = TargetPositionDecisionSnapshot();
    outputJson.clear();
    if (agentId.empty() || sessionId.empty() || account.empty() ||
        executionDomain.empty() || instrument.empty() ||
        collectionStartedAtMs <= 0 ||
        collectionCompletedAtMs < collectionStartedAtMs ||
        collectionWatermark == 0)
        return Reject("DECISION_SNAPSHOT_REQUEST_INVALID",
                      "snapshot owner, instrument, time or watermark is invalid",
                      reasonCode, detail);

    BoundedJsonValue healthBefore;
    BoundedJsonValue healthAfter;
    BoundedJsonValue quote;
    BoundedJsonValue accountState;
    BoundedJsonValue positions;
    BoundedJsonValue orders;
    BoundedJsonValue riskLimits;
    std::string parseReason;
    if (!ParseObject(payloads.healthBefore, healthBefore, parseReason) ||
        !ParseObject(payloads.healthAfter, healthAfter, parseReason))
        return Reject("DECISION_SNAPSHOT_HEALTH_INVALID", parseReason,
                      reasonCode, detail);

    HealthIdentity before;
    HealthIdentity after;
    if (!ParseHealth(healthBefore, before) || !ParseHealth(healthAfter, after))
        return Reject("DECISION_SNAPSHOT_HEALTH_INVALID",
                      "Gateway health lacks a ready execution identity or event watermark",
                      reasonCode, detail);
    if (before.epoch != after.epoch ||
        before.fencingGeneration != after.fencingGeneration)
        return Reject("DECISION_SNAPSHOT_EXECUTION_IDENTITY_CHANGED",
                      "execution epoch or fencing generation changed during collection",
                      reasonCode, detail);
    if (before.eventWatermark != after.eventWatermark)
        return Reject("DECISION_SNAPSHOT_EVENT_WATERMARK_CHANGED",
                      "an execution event arrived during snapshot collection",
                      reasonCode, detail);

    if (!ParseObject(payloads.quote, quote, parseReason) ||
        !ParseObject(payloads.account, accountState, parseReason) ||
        !ParseObject(payloads.positions, positions, parseReason) ||
        !ParseObject(payloads.orders, orders, parseReason) ||
        !ParseObject(payloads.riskLimits, riskLimits, parseReason))
        return Reject("DECISION_SNAPSHOT_COMPONENT_INVALID", parseReason,
                      reasonCode, detail);
    if (!Authoritative(quote) || !Authoritative(accountState) ||
        !Authoritative(positions) || !Authoritative(orders) ||
        !Authoritative(riskLimits))
        return Reject("DECISION_SNAPSHOT_COMPONENT_INCOMPLETE",
                      "one or more authoritative components are incomplete",
                      reasonCode, detail);

    std::string quoteInstrument;
    std::uint64_t quoteObservedAtMs = 0;
    bool stale = true;
    double bid = 0.0;
    double ask = 0.0;
    if (!RequiredString(quote, "instrument", quoteInstrument) ||
        quoteInstrument != instrument ||
        !RequiredUnsigned(quote, "observed_at_ms", quoteObservedAtMs) ||
        quoteObservedAtMs == 0 ||
        !RequiredBool(quote, "stale", stale) || stale ||
        !RequiredNumber(quote, "bid", bid) ||
        !RequiredNumber(quote, "ask", ask) ||
        !(bid > 0.0) || ask < bid ||
        quoteObservedAtMs > static_cast<std::uint64_t>(collectionCompletedAtMs))
        return Reject("DECISION_SNAPSHOT_QUOTE_INVALID",
                      "quote is stale, malformed or bound to another instrument",
                      reasonCode, detail);

    std::vector<double> matchingPositions;
    FindInstrumentPositions(positions, instrument, matchingPositions);
    if (matchingPositions.size() > 1)
        return Reject("DECISION_SNAPSHOT_POSITION_INVALID",
                      "instrument position is duplicated", reasonCode, detail);
    const double currentPosition = matchingPositions.empty() ?
        0.0 : matchingPositions.front();

    snapshot.agentId = agentId;
    snapshot.sessionId = sessionId;
    snapshot.account = account;
    snapshot.executionDomain = executionDomain;
    snapshot.executionServiceEpoch = before.epoch;
    snapshot.fencingGeneration = before.fencingGeneration;
    snapshot.collectionWatermark = collectionWatermark;
    snapshot.eventWatermark = before.eventWatermark;
    snapshot.snapshotWatermark = collectionWatermark;
    snapshot.instrument = instrument;
    snapshot.collectionStartedAtMs = collectionStartedAtMs;
    snapshot.collectionCompletedAtMs = collectionCompletedAtMs;
    snapshot.quoteObservedAtMs = static_cast<std::int64_t>(quoteObservedAtMs);
    snapshot.bid = bid;
    snapshot.ask = ask;
    snapshot.currentPosition = currentPosition;

    std::ostringstream output;
    output << "{\"schema\":\"hepta.decision-snapshot.v1\","
           << "\"authoritative\":true,\"instrument\":\""
           << EscapeJson(instrument)
           << "\",\"execution_service_epoch\":\""
           << EscapeJson(before.epoch)
           << "\",\"fencing_generation\":" << before.fencingGeneration
           << ",\"collection_watermark\":" << collectionWatermark
           << ",\"event_watermark\":" << before.eventWatermark
           << ",\"snapshot_watermark\":" << collectionWatermark
           << ",\"collection_started_at_ms\":" << collectionStartedAtMs
           << ",\"collection_completed_at_ms\":" << collectionCompletedAtMs
           << ",\"current_position\":" << std::setprecision(17)
           << currentPosition
           << ",\"quote\":" << payloads.quote
           << ",\"account\":" << payloads.account
           << ",\"positions\":" << payloads.positions
           << ",\"orders\":" << payloads.orders
           << ",\"risk_limits\":" << payloads.riskLimits
           << ",\"health\":" << payloads.healthAfter << '}';
    outputJson = output.str();
    if (outputJson.size() > kMaximumSnapshotBytes)
    {
        outputJson.clear();
        return Reject("DECISION_SNAPSHOT_RESPONSE_TOO_LARGE",
                      "compound snapshot exceeds the bounded response size",
                      reasonCode, detail);
    }
    reasonCode.clear();
    detail.clear();
    return true;
}
