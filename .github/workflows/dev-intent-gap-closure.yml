    {
        ExecutionCommandResult result;
        result.status = ExecutionCommandStatus::Accepted;
        result.commandId = command.context.toolCallId;
        result.orderId = command.orderId;
        return result;
    }
    int placeCalls = 0;
    PlaceOrderCommand lastPlace;
};

