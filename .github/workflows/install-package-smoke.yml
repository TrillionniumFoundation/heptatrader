name: Install and Package Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: heptatrader-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: install-package-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build libssl-dev dpkg-dev file

      - name: Configure and build SDK-free runtime
        run: |
          cmake -S . -B build/package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF
          cmake --build build/package --parallel 2

      - name: Validate canonical install tree
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/install-root"
          cmake --install build/package --prefix "$root"
          test -x "$root/bin/hepta_tool_gatewayd"
          test -x "$root/bin/hepta_executiond"
          test -x "$root/bin/heptactl"
          test -x "$root/bin/hepta_sessionctl"
          test ! -e "$root/bin/hepta_ib_executiond"
          test -x "$root/libexec/heptatrader/hepta_mcp_server.py"
          test -f "$root/share/heptatrader/capabilities.json"
          test -f "$root/share/heptatrader/module-catalog.json"
          test -f "$root/share/heptatrader/ib-paper-profile-policy-v1.json"
          test -d "$root/share/heptatrader/systemd"
          test -d "$root/share/heptatrader/tmpfiles.d"
          find "$root" -type l -print -quit | (! grep .)
          ! grep -R --binary-files=without-match --line-number \
            -E '(DU[0-9]{6,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' "$root"

      - name: Build component archives
        run: |
          set -euo pipefail
          cd build/package
          cpack -G TGZ
          find . -maxdepth 1 -type f -name 'heptatrader-*.tar.gz' -print -quit | grep .
          for archive in heptatrader-*.tar.gz; do
            tar -tzf "$archive" >/dev/null
          done

      - name: Reassert clean exact source
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
