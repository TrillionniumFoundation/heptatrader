name: materialize-traceability-patch
on:
  push:
    branches:
      - codex/heptatrader-traceability-patch-export-20260903
permissions:
  contents: read
jobs:
  export:
    name: materialize-traceability-patch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact staging revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c7814ddf7ab1434ccfc04299338676d74a993a0f
          fetch-depth: 1
          persist-credentials: false
      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c7814ddf7ab1434ccfc04299338676d74a993a0f
          cat .materialize/traceability/chunk-* | tr -d '\n' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/traceability.patch"
          test -s "$RUNNER_TEMP/traceability.patch"
          git apply --check "$RUNNER_TEMP/traceability.patch"
          sha256sum "$RUNNER_TEMP/traceability.patch" > "$RUNNER_TEMP/traceability.patch.sha256"
          wc -c "$RUNNER_TEMP/traceability.patch" > "$RUNNER_TEMP/traceability.patch.size"
      - name: Upload immutable decoded patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-traceability-patch
          path: |
            ${{ runner.temp }}/traceability.patch
            ${{ runner.temp }}/traceability.patch.sha256
            ${{ runner.temp }}/traceability.patch.size
          retention-days: 1
          if-no-files-found: error
