name: export-traceability-staging-source

on:
  push:
    branches:
      - codex/heptatrader-traceability-patch-export-20260903

permissions:
  contents: read

jobs:
  export:
    name: export-traceability-staging-source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact staging revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c7814ddf7ab1434ccfc04299338676d74a993a0f
          fetch-depth: 1
          persist-credentials: false
      - name: Archive immutable staging source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c7814ddf7ab1434ccfc04299338676d74a993a0f
          git archive --format=tar.gz --output="$RUNNER_TEMP/traceability-staging-source.tar.gz" HEAD
          printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/source-sha.txt"
          sha256sum "$RUNNER_TEMP/traceability-staging-source.tar.gz" > "$RUNNER_TEMP/archive-sha256.txt"
      - name: Upload immutable source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-traceability-staging-source
          path: |
            ${{ runner.temp }}/traceability-staging-source.tar.gz
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/archive-sha256.txt
          retention-days: 1
          if-no-files-found: error
