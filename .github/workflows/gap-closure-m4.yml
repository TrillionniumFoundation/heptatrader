name: gap-closure-m4

on:
  push:
    branches:
      - codex/heptatrader-m4-work
    paths:
      - .github/workflows/gap-closure-m4.yml

permissions:
  contents: write

jobs:
  global-decision-shadow:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout M4 staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-m4-work
          fetch-depth: 0
      - name: Apply M4 integration
        run: python3 scripts/m4_patch.py
      - name: Validate deterministic core
        run: ./scripts/dev_core.sh
      - name: Commit exact tested implementation
        run: |
          set -euo pipefail
          git config user.name "Hepta Gap Closure Bot"
          git config user.email "hepta-gap-closure-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: add truthful global decision shadow runtime"
          git push origin HEAD:codex/heptatrader-m4-work
