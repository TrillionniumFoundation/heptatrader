name: p1-combined-clean-controller

on:
  push:
    branches:
      - codex/heptatrader-p1-integration-controller
    paths:
      - .github/workflows/p1-combined-clean-controller.yml

permissions:
  contents: write

concurrency:
  group: heptatrader-p1-combined-clean-controller
  cancel-in-progress: true

jobs:
  combine:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-p1-integration-controller
          fetch-depth: 0
      - name: Wait for clean allocation candidate
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/heptatrader-review-p1-allocation-clean
          for attempt in $(seq 1 90); do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "clean allocation candidate was not published" >&2
          exit 1
      - name: Build history-clean combined candidate
        shell: bash
        run: |
          set -euo pipefail
          canonical=codex/heptatrader-documentation-control-plane-v2
          data=codex/heptatrader-review-p1-work
          allocation=codex/heptatrader-review-p1-allocation-clean
          git fetch origin "$canonical" "$data" "$allocation"

          worktree="$RUNNER_TEMP/heptatrader-p1-combined-clean"
          git worktree add --detach "$worktree" "origin/$canonical"
          cd "$worktree"
          git config user.name "Hepta P1 Combined Clean Bot"
          git config user.email "hepta-p1-combined-clean-bot@users.noreply.github.com"

          git merge --squash "origin/$data"
          git commit -m "fix: close fixed numeric and coherent market-data boundaries"
          git merge --squash "origin/$allocation"
          git commit -m "fix: seal allocation provenance and execution context"

          git diff --exit-code "origin/$canonical" -- .github/workflows
          for forbidden in \
            scripts/p1_data_patch.py \
            scripts/p1_allocation_patch.py \
            scripts/p1_allocation_repair.py \
            .github/workflows/p1-callgraph.yml \
            .github/workflows/p1-data-closure.yml \
            .github/workflows/p1-allocation-closure.yml \
            .github/workflows/p1-allocation-repair.yml; do
            test ! -e "$forbidden"
          done
          grep -Fq 'ToDoubleExact' HeptaTrade/numeric/fixed_decimal.h
          grep -Fq 'ValidateSnapshot' HeptaTrade/marketdata/sharded_market_data.cpp
          grep -Fq 'GlobalDecisionReceipt' HeptaTrade/allocation/global_allocator.h
          grep -Fq 'AllocationExecutionContext' HeptaTrade/execution/allocation_plan_revalidator.h
          grep -Fq 'snapshotValidUntilMs' HeptaTrade/proposal/proposal_set.h
          test -z "$(git status --porcelain)"
          printf '%s\n' "$worktree" > "$RUNNER_TEMP/p1-combined-worktree"
      - name: Validate exact combined core
        shell: bash
        run: |
          set -euo pipefail
          worktree="$(cat "$RUNNER_TEMP/p1-combined-worktree")"
          cd "$worktree"
          HEPTA_BUILD_DIR="$RUNNER_TEMP/heptatrader-p1-combined-core" \
          HEPTA_CMAKE_GENERATOR=Ninja HEPTA_JOBS=2 \
            ./scripts/dev_core.sh
          test -z "$(git status --porcelain)"
      - name: Validate exact combined GCC sanitizer
        shell: bash
        run: |
          set -euo pipefail
          worktree="$(cat "$RUNNER_TEMP/p1-combined-worktree")"
          cd "$worktree"
          CXX=g++ HEPTA_CMAKE_GENERATOR=Ninja HEPTA_JOBS=2 \
          HEPTA_RELIABILITY_BUILD_DIR="$RUNNER_TEMP/heptatrader-p1-combined-gcc" \
            ./scripts/reliability_core.sh
          test -z "$(git status --porcelain)"
      - name: Validate exact combined Clang sanitizer
        shell: bash
        run: |
          set -euo pipefail
          worktree="$(cat "$RUNNER_TEMP/p1-combined-worktree")"
          cd "$worktree"
          CXX=clang++ HEPTA_CMAKE_GENERATOR=Ninja HEPTA_JOBS=2 \
          HEPTA_RELIABILITY_BUILD_DIR="$RUNNER_TEMP/heptatrader-p1-combined-clang" \
            ./scripts/reliability_core.sh
          test -z "$(git status --porcelain)"
      - name: Publish exact tested combined candidate
        shell: bash
        run: |
          set -euo pipefail
          worktree="$(cat "$RUNNER_TEMP/p1-combined-worktree")"
          cd "$worktree"
          git push --force origin HEAD:codex/heptatrader-review-p1-integration-clean
