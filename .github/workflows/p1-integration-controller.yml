name: p1-integration-controller

on:
  push:
    branches:
      - codex/heptatrader-p1-integration-controller
    paths:
      - .github/workflows/p1-integration-controller.yml

permissions:
  contents: write

concurrency:
  group: heptatrader-p1-integration-controller
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-p1-integration-controller
          fetch-depth: 0
      - name: Build history-clean combined candidate
        shell: bash
        run: |
          set -euo pipefail
          canonical=codex/heptatrader-documentation-control-plane-v2
          data=codex/heptatrader-review-p1-work
          allocation=codex/heptatrader-review-p1-allocation-work
          git fetch origin "$canonical" "$data" "$allocation"

          for forbidden in \
            scripts/p1_data_patch.py \
            scripts/p1_allocation_patch.py \
            scripts/p1_allocation_repair.py \
            .github/workflows/p1-callgraph.yml \
            .github/workflows/p1-data-closure.yml \
            .github/workflows/p1-allocation-closure.yml \
            .github/workflows/p1-allocation-repair.yml; do
            if git cat-file -e "origin/$data:$forbidden" 2>/dev/null || \
               git cat-file -e "origin/$allocation:$forbidden" 2>/dev/null; then
              echo "repair branch still contains staging artifact: $forbidden" >&2
              exit 1
            fi
          done

          worktree="$RUNNER_TEMP/heptatrader-p1-combined"
          git worktree add --detach "$worktree" "origin/$canonical"
          cd "$worktree"
          git config user.name "Hepta P1 Integration Bot"
          git config user.email "hepta-p1-integration-bot@users.noreply.github.com"

          git merge --squash "origin/$data"
          git commit -m "fix: close fixed numeric and coherent market-data boundaries"
          git merge --squash "origin/$allocation"
          git commit -m "fix: seal allocation provenance and execution context"

          git diff --exit-code "origin/$canonical" -- .github/workflows
          test ! -e scripts/p1_data_patch.py
          test ! -e scripts/p1_allocation_patch.py
          test ! -e scripts/p1_allocation_repair.py
          grep -Fq 'ToDoubleExact' HeptaTrade/numeric/fixed_decimal.h
          grep -Fq 'ValidateSnapshot' HeptaTrade/marketdata/sharded_market_data.cpp
          grep -Fq 'GlobalDecisionReceipt' HeptaTrade/allocation/global_allocator.h
          grep -Fq 'AllocationExecutionContext' HeptaTrade/execution/allocation_plan_revalidator.h
          test -z "$(git status --porcelain)"
          printf '%s\n' "$worktree" > "$RUNNER_TEMP/p1-worktree"
      - name: Validate exact combined core
        shell: bash
        run: |
          set -euo pipefail
          worktree="$(cat "$RUNNER_TEMP/p1-worktree")"
          cd "$worktree"
          HEPTA_BUILD_DIR="$RUNNER_TEMP/heptatrader-p1-core" \
          HEPTA_CMAKE_GENERATOR=Ninja \
          HEPTA_JOBS=2 \
            ./scripts/dev_core.sh
          test -z "$(git status --porcelain)"
      - name: Validate GCC sanitizer lane
        shell: bash
        run: |
          set -euo pipefail
          worktree="$(cat "$RUNNER_TEMP/p1-worktree")"
          cd "$worktree"
          CXX=g++ \
          HEPTA_CMAKE_GENERATOR=Ninja \
          HEPTA_JOBS=2 \
          HEPTA_RELIABILITY_BUILD_DIR="$RUNNER_TEMP/heptatrader-p1-reliability-gcc" \
            ./scripts/reliability_core.sh
          test -z "$(git status --porcelain)"
      - name: Validate Clang sanitizer lane
        shell: bash
        run: |
          set -euo pipefail
          worktree="$(cat "$RUNNER_TEMP/p1-worktree")"
          cd "$worktree"
          CXX=clang++ \
          HEPTA_CMAKE_GENERATOR=Ninja \
          HEPTA_JOBS=2 \
          HEPTA_RELIABILITY_BUILD_DIR="$RUNNER_TEMP/heptatrader-p1-reliability-clang" \
            ./scripts/reliability_core.sh
          test -z "$(git status --porcelain)"
      - name: Publish exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          worktree="$(cat "$RUNNER_TEMP/p1-worktree")"
          cd "$worktree"
          git push origin HEAD:codex/heptatrader-review-p1-integration
