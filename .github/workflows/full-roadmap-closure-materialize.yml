name: Full Roadmap Closure Materializer

on:
  push:
    branches: [remediation/full-roadmap-closure-20260916]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/full-roadmap-closure-20260916
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch reviewed PR95 source line
        run: git fetch --no-tags origin remediation/full-priority-cleanup-20260916:refs/remotes/origin/remediation/full-priority-cleanup-20260916

      - name: Install core validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev zlib1g-dev python3-yaml

      - name: Apply deterministic roadmap patch
        run: |
          python3 scripts/.full_roadmap_patch.py
          python3 scripts/.full_roadmap_patch_fix.py
          git rm scripts/.full_roadmap_patch.py scripts/.full_roadmap_patch_fix.py
          git add -A
          git diff --cached --check

      - name: Run focused OMS lifecycle regressions
        run: python3 -m unittest tests.python.test_oms_lifecycle_rotation

      - name: Build and run canonical native core
        id: core
        env:
          HEPTA_BUILD_DIR: ${{ github.workspace }}/build/roadmap-core
          HEPTA_JOBS: "2"
        run: |
          set +e
          ./scripts/dev_core.sh > roadmap-core.log 2>&1
          code=$?
          cat roadmap-core.log
          exit "$code"

      - name: Retain native diagnostics on failure
        if: failure() && steps.core.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: roadmap-core-${{ github.run_id }}
          path: roadmap-core.log
          if-no-files-found: error
          retention-days: 2

      - name: Run documentation and Python source/core lanes
        run: |
          python3 scripts/check_documentation.py
          python3 scripts/check_component_coverage.py
          python3 scripts/check_gap_register.py
          python3 scripts/run_python_tests.py --lane source
          python3 scripts/run_python_tests.py --lane core

      - name: Commit exact validated product tree
        env:
          BRANCH: remediation/full-roadmap-closure-20260916
        run: |
          set -euo pipefail
          rm .github/workflows/full-roadmap-closure-materialize.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: close OMS rotation restart and history maintenance gaps'
          git push origin "HEAD:$BRANCH"
