name: apply-risk-parity

on:
  push:
    branches: [codex/close-all-runtime-gaps]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/close-all-runtime-gaps
          fetch-depth: 0
          persist-credentials: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ libssl-dev python3

      - name: Repair deterministic refactor patch boundaries
        run: python3 scripts/fix_risk_patch.py

      - name: Apply deterministic risk parity refactor
        run: python3 scripts/apply_risk_parity.py

      - name: Build and run all core contracts
        env:
          HEPTA_JOBS: "2"
          HEPTA_CMAKE_GENERATOR: Ninja
        run: ./scripts/dev_core.sh

      - name: Verify staged runtime assembly
        run: |
          stage="$RUNNER_TEMP/runtime"
          DESTDIR="$stage" cmake --install build/core-release --component runtime
          test -x "$stage/usr/local/libexec/heptatrader/hepta-executiond"

      - name: Commit successful refactor and remove one-shot machinery
        run: |
          rm \
            scripts/apply_risk_parity.py \
            scripts/fix_risk_patch.py \
            .github/workflows/apply-risk-parity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: unify deterministic risk across simulator and IB PAPER'
          git push origin HEAD:codex/close-all-runtime-gaps
