name: Temporary Exact Source Export

on:
  push:
    branches:
      - codex/close-architecture-docs-ci-risk-gaps-20260907
    paths:
      - '.github/workflows/source-export-temporary.yml'

permissions:
  contents: read

jobs:
  export:
    name: export-current-exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Package exact source
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          tar -czf "$RUNNER_TEMP/heptatrader-exact-source.tgz" \
            --exclude=.git --exclude=build .
      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-exact-source-${{ github.sha }}
          path: ${{ runner.temp }}/heptatrader-exact-source.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
