name: Temporary Flatten Capacity Materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: validate-and-publish-flatten-capacity-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}" --depth=1
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_SHA"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++ libssl-dev

      - name: Materialize final clean source tree
        run: |
          set -euo pipefail
          python3 scripts/apply_flatten_capacity_fix.py
          python3 scripts/fix_flatten_verifier.py
          rm -f \
            .github/workflows/flatten-capacity-materialize.yml \
            scripts/apply_flatten_capacity_fix.py \
            scripts/fix_flatten_verifier.py
          git diff --check
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/flatten-capacity-materialize.yml \
            HeptaTrade/simulator/deterministic_execution_venue.cpp \
            HeptaTrade/simulator/deterministic_execution_venue.h \
            docs/modules/simulator.md \
            scripts/apply_flatten_capacity_fix.py \
            scripts/fix_flatten_verifier.py \
            scripts/verify_source_gap_closures.py \
            tests/simulator_risk_runtime_tests.cpp | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Execute final-tree source and runtime verification
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/verify_build_ownership.py
          python3 scripts/check_gap_register.py
          python3 scripts/verify_source_gap_closures.py
          python3 scripts/verify_canonical_ib_paper_profile.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          ./scripts/dev_core.sh
          git diff --check

      - name: Publish only the verified fast-forward source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}" --depth=1
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_SHA"
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/flatten-capacity-materialize.yml \
            HeptaTrade/simulator/deterministic_execution_venue.cpp \
            HeptaTrade/simulator/deterministic_execution_venue.h \
            docs/modules/simulator.md \
            scripts/apply_flatten_capacity_fix.py \
            scripts/fix_flatten_verifier.py \
            scripts/verify_source_gap_closures.py \
            tests/simulator_risk_runtime_tests.cpp | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'heptatrader-gap-closure-bot'
          git config user.email 'heptatrader-gap-closure-bot@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'risk: reserve aggregate flatten capacity across pending exits'
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Record terminal worktree state
        if: always()
        run: |
          git status --short
          git log -2 --format='%H %s'
