name: Temporary Flatten Capacity Materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize:
    name: materialize-flatten-capacity-repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++ libssl-dev

      - name: Apply exact flatten-capacity repair
        run: |
          set -euo pipefail
          python3 scripts/apply_flatten_capacity_fix.py
          git diff --check

      - name: Execute source and runtime verification
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/verify_build_ownership.py
          python3 scripts/check_gap_register.py
          python3 scripts/verify_source_gap_closures.py
          python3 scripts/verify_canonical_ib_paper_profile.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          ./scripts/dev_core.sh

      - name: Package modified exact-source files and logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flatten-capacity-result/HeptaTrade/simulator"
          mkdir -p "$RUNNER_TEMP/flatten-capacity-result/tests"
          mkdir -p "$RUNNER_TEMP/flatten-capacity-result/docs/modules"
          mkdir -p "$RUNNER_TEMP/flatten-capacity-result/scripts"
          cp HeptaTrade/simulator/deterministic_execution_venue.h \
             "$RUNNER_TEMP/flatten-capacity-result/HeptaTrade/simulator/"
          cp HeptaTrade/simulator/deterministic_execution_venue.cpp \
             "$RUNNER_TEMP/flatten-capacity-result/HeptaTrade/simulator/"
          cp tests/simulator_risk_runtime_tests.cpp \
             "$RUNNER_TEMP/flatten-capacity-result/tests/"
          cp docs/modules/simulator.md \
             "$RUNNER_TEMP/flatten-capacity-result/docs/modules/"
          cp scripts/verify_source_gap_closures.py \
             "$RUNNER_TEMP/flatten-capacity-result/scripts/"
          git diff --binary > "$RUNNER_TEMP/flatten-capacity-result/repair.patch"
          git status --short > "$RUNNER_TEMP/flatten-capacity-result/status.txt"
          sha256sum \
            HeptaTrade/simulator/deterministic_execution_venue.h \
            HeptaTrade/simulator/deterministic_execution_venue.cpp \
            tests/simulator_risk_runtime_tests.cpp \
            docs/modules/simulator.md \
            scripts/verify_source_gap_closures.py \
            > "$RUNNER_TEMP/flatten-capacity-result/SHA256SUMS"
          tar -czf "$RUNNER_TEMP/heptatrader-flatten-capacity-result.tgz" \
            -C "$RUNNER_TEMP/flatten-capacity-result" .

      - name: Upload materialized repair
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-flatten-capacity-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/heptatrader-flatten-capacity-result.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
