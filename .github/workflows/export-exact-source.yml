name: Materialize reviewed source objects
on:
  push:
    branches: [work/exact-source-export-20260914]
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository == 'TrillionniumFoundation/heptatrader' && github.actor_id == '102159240'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: carrier
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 049d9fa5d5d4602c1661a844b0800e6a309b0e33
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify patch and create blobs and tree only
        env:
          OBJECT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, io, json, os, pathlib, subprocess, urllib.request
          base = '049d9fa5d5d4602c1661a844b0800e6a309b0e33'
          base_tree = 'd0546a509d62e2eb22cd86808696c73bad4a719f'
          expected = 'ef2594681c48fe0a327c234e7795cc9110b62890'
          repo = 'TrillionniumFoundation/heptatrader'
          if os.environ['GITHUB_REPOSITORY'] != repo or os.environ['GITHUB_REF'] != 'refs/heads/work/exact-source-export-20260914':
              raise SystemExit('unexpected transport scope')
          def git(*args, data=None):
              return subprocess.run(['git', '-C', 'source', *args], input=data, check=True, stdout=subprocess.PIPE, timeout=60).stdout
          if git('rev-parse', 'HEAD').decode().strip() != base or git('rev-parse', 'HEAD^{tree}').decode().strip() != base_tree:
              raise SystemExit('source identity mismatch')
          encoded = ''.join((pathlib.Path('carrier/.development-transfer') / ('part' + str(i))).read_text() for i in range(6))
          if len(encoded) != 14376:
              raise SystemExit('encoded patch size mismatch')
          compressed = base64.b64decode(encoded, validate=True)
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
              patch = stream.read(1048577)
          if len(patch) > 1048576 or hashlib.sha256(patch).hexdigest() != '66f06997bdb0e2b407471cffc7de0d8e6a6e360707415379fe48e08d4326122c':
              raise SystemExit('patch digest mismatch')
          git('apply', '--index', '--whitespace=error', '-', data=patch)
          if git('write-tree').decode().strip() != expected:
              raise SystemExit('derived tree differs from locally tested tree')
          changed = [p.decode() for p in git('diff', '--cached', '--no-renames', '--name-only', '-z').split(b'\0') if p]
          allowed = {'.github/workflows/documentation-control-plane.yml', 'HeptaTrade/oms_recover.cpp', 'HeptaTrade/oms_recover.h', 'docs/OMS-EVENT-SCHEMA.md', 'docs/build-targets.json', 'docs/module-catalog.json', 'docs/modules/oms-journal.md', 'docs/modules/repository-control.md', 'docs/technical/component-coverage.md', 'docs/technical/runtime-engineering-map.md', 'scripts/README.md', 'scripts/check_component_coverage.py', 'scripts/check_documentation.py', 'scripts/check_gap_register.py', 'scripts/plan_owner_ruleset.py', 'scripts/run_python_tests.py', 'scripts/source_json.py', 'scripts/verify_build_ownership.py', 'tests/CMakeLists.txt', 'tests/compat/oms_recover.cpp', 'tests/compat/oms_recover.h', 'tests/execution_coordinator_tests.cpp', 'tests/python/test_owner_ruleset_plan.py', 'tests/python/test_source_json.py'}
          if set(changed) != allowed or len(changed) != len(allowed):
              raise SystemExit('unexpected change surface')
          def create(kind, value):
              if kind not in ('blobs', 'trees'):
                  raise ValueError('only data objects may be created')
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/git/' + kind,
                  data=json.dumps(value).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['OBJECT_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          index = {}
          for row in git('ls-files', '--stage', '-z').split(b'\0'):
              if not row:
                  continue
              metadata, path = row.split(b'\t', 1)
              mode, sha, stage = metadata.decode().split()
              if stage != '0':
                  raise SystemExit('nonzero index stage')
              index[path.decode()] = (mode, sha)
          entries = []
          for path in changed:
              if path not in index:
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode, sha = index[path]
              if mode not in ('100644', '100755'):
                  raise SystemExit('special mode rejected')
              content = git('cat-file', 'blob', sha)
              result = create('blobs', {'encoding': 'base64', 'content': base64.b64encode(content).decode()})
              if result['sha'] != sha:
                  raise SystemExit('created blob mismatch')
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
          tree = create('trees', {'base_tree': base_tree, 'tree': entries})
          if tree['sha'] != expected:
              raise SystemExit('remote tree mismatch')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-object-result.json'
          out.write_text(json.dumps({'base': base, 'tree': expected, 'paths': changed,
              'created_git_objects_only': True, 'authorization_effect': 'NONE'}, indent=2) + '\n')
          print('Materialized verified Git objects only; no refs, rules, deployment or Broker action.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-object-result-${{ github.run_id }}
          path: ${{ runner.temp }}/source-object-result.json
          if-no-files-found: error
          retention-days: 1
