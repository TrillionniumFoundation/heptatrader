name: HeptaDLL platform object authoring (temporary data only)
on:
  push:
    branches: [integration/heptadll-modular-20260920]
    paths: [.github/workflows/heptadll-platform-objects.yml]
permissions:
  contents: write
jobs:
  objects:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a982b4c40bf93a6de02c5516320a7bb3a2a34997
          persist-credentials: false
          fetch-depth: 1
      - name: Apply reviewed bytes and upload objects only; never execute candidate code or update refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request, zlib
          packed = ''''''
          # Fail before any write if the data was damaged in transit.
          patch = zlib.decompress(base64.b64decode(packed, validate=True))
          assert len(patch) == 22679
          assert hashlib.sha256(patch).hexdigest() == 'aab12b92387baf235925d954ca77a528ab25afa735fb7f25497aeb994f23a97d'
          expected = {'.github/workflows/heptadll-integration.yml':'462fd90ebd6e69baefee400fe8e57ec2d82bd2e5','docs/technical/heptadll-consumers.md':'6554832bf195b3b61e2643e1a9955ce3ce832f0f','research/PLATFORMS.md':'f94b22ddc97a2ebe1439e9dfb93af6604fcea761','research/cmake/HeptaResearchInstall.cmake':'cd0bcd83cb6c333a268748d3e978f2f680d09dee','tests/research/model_cli_behavior.py':'aa3707f40a2d7dc5c90c31a827b306b641a0dcc1','tests/research/platform_sdk_acceptance.py':'6cb78e91bfb3a4b7af7ea6abe4b23d768321a61c','tests/research/sdk_package_behavior.py':'25a6d8582f9f30648c374dac065c527ee61c028e'}
          def git(*args): return subprocess.check_output(['git', *args]).decode().strip()
          assert git('rev-parse','HEAD') == 'a982b4c40bf93a6de02c5516320a7bb3a2a34997'
          subprocess.run(['git','apply','--index','--binary','-'], input=patch, check=True)
          assert set(git('diff','--cached','--name-only').splitlines()) == set(expected)
          assert git('write-tree') == '8c9be5a14981911e780119f0a9e4febb783a9995'
          def post(kind, payload):
              request=urllib.request.Request('https://api.github.com/repos/TrillionniumFoundation/heptatrader/git/'+kind, data=json.dumps(payload).encode(), headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}, method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: return json.load(response)
          elements=[]
          for path, sha in sorted(expected.items()):
              assert git('rev-parse',':'+path) == sha
              entry=git('ls-files','-s','--',path).split()
              assert entry[0]=='100644' and entry[2]=='0'
              content=subprocess.check_output(['git','show',':'+path])
              assert post('blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})['sha']==sha
              elements.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          result=post('trees',{'base_tree':'6a77df2c741c109932a4731c0cde597d1a798f6a','tree':elements})
          assert result['sha']=='8c9be5a14981911e780119f0a9e4febb783a9995'
          print(json.dumps({'tree':result['sha'],'blobs':expected,'executed_candidate_code':False,'updated_refs':False},sort_keys=True))
          PY
