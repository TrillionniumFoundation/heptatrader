name: IB PAPER Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/github-governance-qualification.yml'
      - '.github/workflows/ib-paper-qualification.yml'
      - '.github/github-governance-policy-v1.json'
      - '.github/required-check-contexts-v1.json'
      - 'scripts/github_qualification_evidence.py'
      - 'scripts/verify_github_governance.py'
      - 'scripts/verify_ib_paper_qualification.py'
      - 'scripts/verify_ib_candidate_artifact.py'
      - 'scripts/verify_qualification_candidate.py'
      - 'scripts/build_ib_candidate_artifact.sh'
      - 'scripts/run_ib_paper_artifact_qualification.sh'
      - 'scripts/check_qualification_trust_boundary.py'
      - 'tests/python/test_github_governance.py'
      - 'tests/python/test_ib_paper_qualification.py'
      - 'tests/python/test_qualification_trust_boundary.py'
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request whose exact reviewed head may be qualified
        required: true
        type: string
      candidate_sha:
        description: Exact candidate source SHA, used only as untrusted build data
        required: true
        type: string
      mutation_mode:
        description: Explicitly approve the bounded real PAPER campaign
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: heptatrader-ib-paper-qualification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bootstrap-audit:
    if: github.event_name == 'pull_request'
    name: ib-paper-workflow-bootstrap-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact bootstrap pull-request head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact bootstrap revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Confirm Docker hostile-isolation dependency
        run: |
          set -euo pipefail
          docker version
      - name: Validate trusted harnesses and hostile candidate isolation
        run: |
          set -euo pipefail
          git diff --check
          bash -n scripts/build_ib_candidate_artifact.sh
          bash -n scripts/run_ib_paper_artifact_qualification.sh
          python3 -m py_compile \
            scripts/github_qualification_evidence.py \
            scripts/verify_github_governance.py \
            scripts/verify_ib_paper_qualification.py \
            scripts/verify_ib_candidate_artifact.py \
            scripts/verify_qualification_candidate.py \
            scripts/check_qualification_trust_boundary.py
          python3 scripts/check_qualification_trust_boundary.py --self-test
          python3 -m unittest discover -s tests/python -p 'test_github_governance.py'
          python3 -m unittest discover -s tests/python -p 'test_ib_paper_qualification.py'
          python3 -m unittest discover -s tests/python -p 'test_qualification_trust_boundary.py'
          printf '%s\n' \
            'Trusted qualification boundary audit passed.' \
            'No secret, Broker credential or candidate mutation was used.' \
            >> "$GITHUB_STEP_SUMMARY"

  build-candidate:
    if: github.event_name == 'workflow_dispatch'
    name: ib-paper-candidate-artifact-build
    runs-on: [self-hosted, linux, x64, heptatrader-ib-builder]
    timeout-minutes: 100
    env:
      HEPTA_IB_BUILD_SDK_ROOT: ${{ vars.HEPTA_IB_BUILD_SDK_ROOT }}
      HEPTA_IB_BUILD_QUOTA_ROOT: ${{ vars.HEPTA_IB_BUILD_QUOTA_ROOT }}
      HEPTA_IB_BUILDER_IMAGE: ${{ vars.HEPTA_IB_BUILDER_IMAGE }}
    steps:
      - name: Require trusted main dispatch and canonical candidate identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_REF: ${{ github.ref }}
          MUTATION_MODE: ${{ inputs.mutation_mode }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$MUTATION_MODE" = 'true'
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout trusted default-branch builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Admit exact reviewed candidate with trusted code only
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "${{ github.sha }}"
          receipt="$RUNNER_TEMP/builder-admission.json"
          python3 trusted/scripts/verify_qualification_candidate.py \
            --pull-number "$PULL_NUMBER" \
            --candidate-sha "$CANDIDATE_SHA" \
            --output "$receipt"
          test -s "$receipt"
          test "$(stat -c '%a' "$receipt")" = '600'
      - name: Checkout candidate as untrusted source input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Build content-addressed binary in bounded digest-pinned OCI sandbox
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          artifact="$RUNNER_TEMP/ib-paper-candidate-$CANDIDATE_SHA.tar"
          trusted/scripts/build_ib_candidate_artifact.sh candidate "$CANDIDATE_SHA" "$artifact"
          test -s "$artifact"
          test ! -L "$artifact"
      - name: Upload immutable no-secret candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ib-paper-candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ib-paper-candidate-${{ inputs.candidate_sha }}.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  qualify:
    if: github.event_name == 'workflow_dispatch'
    needs: build-candidate
    name: ib-paper-exact-artifact-qualification
    runs-on: [self-hosted, linux, x64, heptatrader-ib-paper]
    environment: ib-paper
    timeout-minutes: 90
    env:
      HEPTA_IB_BUILDER_IMAGE: ${{ vars.HEPTA_IB_BUILDER_IMAGE }}
    steps:
      - name: Require trusted main dispatch and explicit protected approval
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          DISPATCH_REF: ${{ github.ref }}
          MUTATION_MODE: ${{ inputs.mutation_mode }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$MUTATION_MODE" = 'true'
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout only the trusted default-branch qualification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Record pre-campaign exact admission
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "${{ github.sha }}"
          python3 trusted/scripts/verify_qualification_candidate.py \
            --pull-number "$PULL_NUMBER" \
            --candidate-sha "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/pre-campaign-admission.json"
      - name: Download immutable candidate artifact from no-secret build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ib-paper-candidate-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-download
      - name: Verify and extract candidate as hostile data
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/candidate-download/ib-paper-candidate-$CANDIDATE_SHA.tar"
          destination="$RUNNER_TEMP/verified-ib-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 trusted/scripts/verify_ib_candidate_artifact.py verify \
            --archive "$archive" \
            --expected-candidate-sha "$CANDIDATE_SHA" \
            --expected-builder-image "$HEPTA_IB_BUILDER_IMAGE" \
            --trusted-root trusted \
            --destination "$destination"
          printf '%s\n' "$destination" > "$RUNNER_TEMP/verified-ib-candidate-dir"
      - name: Run controlled PAPER campaign through trusted external harness
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HEPTA_IB_PAPER_QUALIFIER: ${{ vars.HEPTA_IB_PAPER_QUALIFIER }}
          HEPTA_IB_PAPER_QUALIFIER_SHA256: ${{ vars.HEPTA_IB_PAPER_QUALIFIER_SHA256 }}
          HEPTA_QUALIFICATION_MUTATIONS: '1'
        run: |
          set -euo pipefail
          artifact_dir="$(cat "$RUNNER_TEMP/verified-ib-candidate-dir")"
          evidence="$RUNNER_TEMP/heptatrader-ib-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trusted/scripts/run_ib_paper_artifact_qualification.sh \
            "$artifact_dir" "$CANDIDATE_SHA" "$evidence"
          printf '%s\n' "$evidence" > "$RUNNER_TEMP/heptatrader-ib-evidence-dir"
      - name: Re-admit unchanged candidate after Broker campaign
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/verify_qualification_candidate.py \
            --pull-number "$PULL_NUMBER" \
            --candidate-sha "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/post-campaign-admission.json"
          python3 trusted/scripts/verify_qualification_candidate.py \
            --compare-before "$RUNNER_TEMP/pre-campaign-admission.json" \
            --compare-after "$RUNNER_TEMP/post-campaign-admission.json" \
            --comparison-output "$RUNNER_TEMP/campaign-admission-pair.json"
      - name: Issue final receipt only after stable post-campaign admission
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          HEPTA_IB_PAPER_QUALIFIER: ${{ vars.HEPTA_IB_PAPER_QUALIFIER }}
        run: |
          set -euo pipefail
          artifact_dir="$(cat "$RUNNER_TEMP/verified-ib-candidate-dir")"
          evidence="$(cat "$RUNNER_TEMP/heptatrader-ib-evidence-dir")"
          test -s "$RUNNER_TEMP/campaign-admission-pair.json"
          test ! -e "$evidence/qualification-verification.json"
          python3 trusted/scripts/verify_ib_paper_qualification.py \
            --result "$evidence/qualification-result.json" \
            --evidence-root "$evidence" \
            --expected-git-sha "$CANDIDATE_SHA" \
            --expected-binary "$artifact_dir/hepta-ib-executiond" \
            --expected-harness "$HEPTA_IB_PAPER_QUALIFIER" \
            --receipt "$evidence/qualification-verification.json"
          test -s "$evidence/qualification-verification.json"
      - name: Upload immutable qualification and admission evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ib-paper-qualification-${{ github.sha }}-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/heptatrader-ib-evidence-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/pre-campaign-admission.json
            ${{ runner.temp }}/post-campaign-admission.json
            ${{ runner.temp }}/campaign-admission-pair.json
          if-no-files-found: error
          retention-days: 90
