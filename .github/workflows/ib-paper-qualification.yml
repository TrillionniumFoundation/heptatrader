name: IB PAPER Qualification

on:
  workflow_dispatch:
    inputs:
      mutation_mode:
        description: Explicitly approve the bounded real PAPER mutation campaign
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: heptatrader-ib-paper-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, linux, x64, heptatrader-ib-paper]
    environment: ib-paper
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require explicit bounded mutation approval
        env:
          MUTATION_MODE: ${{ inputs.mutation_mode }}
        run: |
          set -euo pipefail
          if [[ "$MUTATION_MODE" != "true" ]]; then
            echo "IB PAPER qualification requires mutation_mode=true and protected environment approval" >&2
            exit 78
          fi
      - name: Validate controlled runner inputs
        run: |
          set -euo pipefail
          test -n "${IBAPI_ROOT:-}"
          test -d "$IBAPI_ROOT"
          test ! -L "$IBAPI_ROOT"
          test -n "${HEPTA_IB_PAPER_QUALIFIER:-}"
          test -f "$HEPTA_IB_PAPER_QUALIFIER"
          test -x "$HEPTA_IB_PAPER_QUALIFIER"
          test ! -L "$HEPTA_IB_PAPER_QUALIFIER"
      - name: Configure broker-enabled build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DHEPTA_ENABLE_IBAPI=ON
          -DIBAPI_ROOT="$IBAPI_ROOT"
          -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF
          -DHEPTA_BUILD_LEGACY_MONOLITH=OFF
          -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF
          -DHEPTA_ENABLE_HARDENING=ON
      - name: Build broker authority and core tests
        run: >-
          cmake --build build --parallel 2 --target
          hepta_ib_executiond
          hepta_core_test_binaries
      - name: Run deterministic tests
        run: ctest --test-dir build --output-on-failure --parallel 1 -L core
      - name: Validate IB-enabled install tree
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/heptatrader-ib-stage"
          cmake --install build --prefix "$RUNNER_TEMP/heptatrader-ib-stage/usr"
          python3 scripts/verify_install_tree.py \
            --root "$RUNNER_TEMP/heptatrader-ib-stage/usr" \
            --logical-root /usr \
            --ib-enabled \
            --manifest "$RUNNER_TEMP/heptatrader-ib-stage/install-manifest.json"
      - name: Run and independently verify controlled PAPER qualification
        env:
          HEPTA_QUALIFICATION_MUTATIONS: '1'
        run: >-
          ./scripts/run_ib_paper_qualification.sh
          build
          "$RUNNER_TEMP/heptatrader-ib-evidence"
      - name: Re-verify committed qualification artifact
        run: |
          set -euo pipefail
          GIT_SHA="$(git rev-parse HEAD)"
          BINARY="$(find build -type f -name hepta-ib-executiond -perm -u+x -print -quit)"
          test -n "$BINARY"
          python3 scripts/verify_ib_paper_qualification.py \
            --result "$RUNNER_TEMP/heptatrader-ib-evidence/qualification-result.json" \
            --evidence-root "$RUNNER_TEMP/heptatrader-ib-evidence" \
            --expected-git-sha "$GIT_SHA" \
            --expected-binary "$BINARY" \
            --expected-harness "$HEPTA_IB_PAPER_QUALIFIER"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ib-paper-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/heptatrader-ib-evidence/
          if-no-files-found: error
          retention-days: 90
