name: IB PAPER Qualification

on:
  push:
    branches:
      - codex/ib-paper-canonical-runner-probe-20260902

permissions:
  contents: read

concurrency:
  group: heptatrader-ib-paper-canonical-runner-probe
  cancel-in-progress: false

jobs:
  probe:
    name: ib-paper-canonical-runner-probe
    runs-on: [self-hosted, linux, x64, heptatrader-ib-paper]
    environment: ib-paper
    timeout-minutes: 10
    steps:
      - name: Record non-sensitive canonical-path readiness
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ib-paper-canonical-runner-probe.json"
          python3 - <<'PY' > "$receipt"
          import hashlib
          import json
          import os
          from pathlib import Path
          import socket
          import stat

          def inspect(name):
              raw = os.environ.get(name, "")
              result = {
                  "present": bool(raw),
                  "directory": False,
                  "regular_file": False,
                  "executable": False,
                  "symlink": False,
              }
              if not raw:
                  return result
              path = Path(raw)
              try:
                  info = path.lstat()
              except OSError:
                  return result
              result["directory"] = stat.S_ISDIR(info.st_mode)
              result["regular_file"] = stat.S_ISREG(info.st_mode)
              result["executable"] = bool(info.st_mode & 0o111)
              result["symlink"] = stat.S_ISLNK(info.st_mode)
              return result

          ports = {}
          for port in (4001, 4002, 7496, 7497):
              client = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              client.settimeout(0.2)
              try:
                  ports[str(port)] = client.connect_ex(("127.0.0.1", port)) == 0
              finally:
                  client.close()

          print(json.dumps({
              "schema": "heptatrader.ib-paper-canonical-runner-probe.v1",
              "trigger_sha": os.environ.get("GITHUB_SHA", ""),
              "runner": {
                  "name_sha256": hashlib.sha256(
                      os.environ.get("RUNNER_NAME", "").encode("utf-8")
                  ).hexdigest(),
                  "os": os.environ.get("RUNNER_OS", ""),
                  "arch": os.environ.get("RUNNER_ARCH", ""),
              },
              "ibapi_root": inspect("IBAPI_ROOT"),
              "qualifier": inspect("HEPTA_IB_PAPER_QUALIFIER"),
              "loopback_gateway_ports": ports,
          }, sort_keys=True, separators=(",", ":")))
          PY
          chmod 0600 "$receipt"

      - name: Upload immutable probe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ib-paper-canonical-runner-probe-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ib-paper-canonical-runner-probe.json
          if-no-files-found: error
          retention-days: 7
