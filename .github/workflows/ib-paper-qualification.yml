name: IB PAPER Qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact dispatch-main SHA to qualify
        required: true
        type: string
      mutation_mode:
        description: Explicitly approve the bounded real PAPER campaign
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: heptatrader-ib-paper-qualification
  cancel-in-progress: false

jobs:
  build-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'TrillionniumFoundation/heptatrader' && github.actor == 'ProfHepta' && github.actor_id == 102159240 && github.triggering_actor == 'ProfHepta' && inputs.mutation_mode == true && inputs.candidate_sha == github.sha
    name: ib-paper-candidate-artifact-build
    runs-on:
      group: trillionnium-ib-paper
      labels: [self-hosted, linux, x64, heptatrader-ib-builder]
    timeout-minutes: 100
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HEPTA_IB_BUILD_SDK_ROOT: ${{ vars.HEPTA_IB_BUILD_SDK_ROOT }}
      HEPTA_IB_BUILD_QUOTA_ROOT: ${{ vars.HEPTA_IB_BUILD_QUOTA_ROOT }}
      HEPTA_IB_BUILDER_IMAGE: ${{ vars.HEPTA_IB_BUILDER_IMAGE }}
    steps:
      - name: Bind dispatch authority to immutable owner identity
        id: bind-owner
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$DISPATCH_ACTOR" = 'ProfHepta'
          test "$DISPATCH_ACTOR_ID" = '102159240'
          test "$TRIGGERING_ACTOR" = 'ProfHepta'

      - name: Checkout trusted dispatch-main builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Checkout exact dispatch-main candidate as build input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false
          clean: true
          submodules: false

      - name: Verify exact clean trusted and candidate trees before build
        id: verify-source-before-build
        run: |
          set -euo pipefail
          python3 trusted/scripts/verify_exact_git_index.py --root trusted
          python3 trusted/scripts/verify_exact_git_index.py --root candidate

      - name: Build content-addressed binary
        id: build-artifact
        env:
          CANDIDATE_ARCHIVE: ${{ runner.temp }}/ib-paper-candidate-${{ github.sha }}.tar
        run: trusted/scripts/build_ib_candidate_artifact.sh candidate "$GITHUB_SHA" "$CANDIDATE_ARCHIVE"

      - name: Reverify immutable checkouts after build
        id: verify-source-after-build
        run: |
          set -euo pipefail
          python3 trusted/scripts/verify_exact_git_index.py --root trusted
          python3 trusted/scripts/verify_exact_git_index.py --root candidate

      - name: Upload immutable no-secret candidate artifact
        id: upload-candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ib-paper-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ib-paper-candidate-${{ github.sha }}.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  qualify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'TrillionniumFoundation/heptatrader' && github.actor == 'ProfHepta' && github.actor_id == 102159240 && github.triggering_actor == 'ProfHepta' && inputs.mutation_mode == true && inputs.candidate_sha == github.sha
    needs: build-candidate
    name: ib-paper-exact-artifact-qualification
    environment: ib-paper
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    runs-on:
      group: trillionnium-ib-paper
      labels: [self-hosted, linux, x64, heptatrader-ib-paper]
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      HEPTA_IB_BUILDER_IMAGE: ${{ vars.HEPTA_IB_BUILDER_IMAGE }}
    steps:
      - name: Bind dispatch authority to immutable owner identity
        id: bind-owner
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          DISPATCH_ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          test "$DISPATCH_ACTOR" = 'ProfHepta'
          test "$DISPATCH_ACTOR_ID" = '102159240'
          test "$TRIGGERING_ACTOR" = 'ProfHepta'

      - name: Checkout trusted dispatch-main qualification harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify exact clean trusted harness before Broker campaign
        id: verify-source-before-campaign
        run: |
          set -euo pipefail
          python3 trusted/scripts/verify_exact_git_index.py --root trusted

      - name: Download immutable candidate artifact
        id: download-candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ib-paper-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-download

      - name: Verify and extract candidate as hostile data
        id: verify-artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/verified-ib-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          CANDIDATE_ARCHIVE: ${{ runner.temp }}/candidate-download/ib-paper-candidate-${{ github.sha }}.tar
        run: >-
          python3 trusted/scripts/verify_ib_candidate_artifact.py verify
          --archive "$CANDIDATE_ARCHIVE"
          --expected-candidate-sha "$GITHUB_SHA"
          --expected-builder-image "$HEPTA_IB_BUILDER_IMAGE"
          --trusted-root trusted
          --destination "$ARTIFACT_DIR"

      - name: Run controlled PAPER campaign through trusted external harness
        id: run-campaign
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/verified-ib-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}/heptatrader-ib-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          HEPTA_IB_PAPER_QUALIFIER: ${{ vars.HEPTA_IB_PAPER_QUALIFIER }}
          HEPTA_IB_PAPER_QUALIFIER_SHA256: ${{ vars.HEPTA_IB_PAPER_QUALIFIER_SHA256 }}
          HEPTA_QUALIFICATION_MUTATIONS: '1'
        run: trusted/scripts/run_ib_paper_artifact_qualification.sh "$ARTIFACT_DIR" "$GITHUB_SHA" "$EVIDENCE_DIR"

      - name: Reverify immutable trusted harness after Broker campaign
        id: verify-source-after-campaign
        run: |
          set -euo pipefail
          python3 trusted/scripts/verify_exact_git_index.py --root trusted

      - name: Issue final exact-artifact Broker receipt
        id: verify-qualification
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/verified-ib-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          EVIDENCE_DIR: ${{ runner.temp }}/heptatrader-ib-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          HEPTA_IB_PAPER_QUALIFIER: ${{ vars.HEPTA_IB_PAPER_QUALIFIER }}
        run: >-
          python3 trusted/scripts/verify_ib_paper_qualification.py
          --result "$EVIDENCE_DIR/evidence/qualification-result.json"
          --evidence-root "$EVIDENCE_DIR/evidence"
          --expected-git-sha "$GITHUB_SHA"
          --expected-binary "$ARTIFACT_DIR/hepta-ib-executiond"
          --expected-harness "$HEPTA_IB_PAPER_QUALIFIER"
          --receipt "$EVIDENCE_DIR/evidence/qualification-verification.json"
          --attempt "$EVIDENCE_DIR/attempt.json"
          --publication-archive "$EVIDENCE_DIR/verified-evidence.tar"

      - name: Attest final exact-artifact PAPER receipt
        id: attest-ib-paper-receipt
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763
        with:
          subject-path: ${{ runner.temp }}/heptatrader-ib-evidence-${{ github.run_id }}-${{ github.run_attempt }}/evidence/qualification-verification.json
          show-summary: false

      - name: Upload immutable qualification evidence
        id: publish-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ib-paper-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/heptatrader-ib-evidence-${{ github.run_id }}-${{ github.run_attempt }}/attempt.json
            ${{ runner.temp }}/heptatrader-ib-evidence-${{ github.run_id }}-${{ github.run_attempt }}/verified-evidence.tar
            ${{ steps.attest-ib-paper-receipt.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
