name: IB PAPER Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Final pull request number targeting protected main
        required: true
        type: string
      expected_head_sha:
        description: Exact unchanged source head to qualify, treated only as API data
        required: true
        type: string
      merge_group_sha:
        description: Exact live merge-queue revision for that PR/head/base
        required: true
        type: string
      mutation_mode:
        description: Run the restricted external PAPER mutation campaign
        required: true
        type: boolean
        default: false
      acknowledge_paper_only:
        description: Confirm the target account and credentials are PAPER-only
        required: true
        type: boolean
        default: false
      acknowledge_no_bypass:
        description: Confirm this run did not use a governance bypass
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: heptatrader-ib-paper-qualification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HEPTA_IB_BUILDER_IMAGE: ghcr.io/trillionniumfoundation/heptatrader-ib-builder@sha256:7f847ed6aef58d39ab799417b16b24286a5b443f70154bdf03240eebbbfb49d9
  HEPTA_IB_EXTERNAL_QUALIFIER_SHA256: 8b39cbf12c555f5d85bb9a418ce86cc6b39179b50ec637f78fe22710f0d89dae
  HEPTA_IB_SDK_VERSION: '10.40.01'
  HEPTA_IB_SDK_SHA256: 8413cf056a735d671f71b5c51905429aa35cc29bd5bfd49315e245c90c26f9f1

jobs:
  bootstrap-audit:
    if: github.event_name == 'pull_request'
    name: ib-paper-workflow-bootstrap-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact bootstrap pull-request head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact bootstrap revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Confirm Docker hostile-isolation dependency
        run: |
          set -euo pipefail
          docker version
      - name: Validate PAPER qualification harnesses and hostile isolation
        run: |
          set -euo pipefail
          git diff --check
          bash -n scripts/build_ib_candidate_artifact.sh
          bash -n scripts/run_ib_paper_artifact_qualification.sh
          python3 -m py_compile \
            scripts/verify_ib_paper_qualification.py \
            scripts/verify_ib_candidate_artifact.py \
            scripts/verify_qualification_candidate.py \
            scripts/check_qualification_trust_boundary.py
          python3 scripts/check_qualification_trust_boundary.py --self-test
          python3 -m unittest discover -s tests/python -p 'test_ib_paper_qualification.py'
          python3 -m unittest discover -s tests/python -p 'test_qualification_trust_boundary.py'
          printf '%s\n' \
            'IB qualification workflow source and hostile trust-boundary tests passed.' \
            'No Broker credential, candidate build or PAPER mutation was used.' \
            >> "$GITHUB_STEP_SUMMARY"

  build-candidate:
    if: github.event_name == 'workflow_dispatch'
    name: ib-paper-candidate-builder
    runs-on: [self-hosted, linux, x64, heptatrader-ib-builder]
    environment: repository-governance
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      artifact_sha256: ${{ steps.metadata.outputs.artifact_sha256 }}
      candidate_head_sha: ${{ steps.metadata.outputs.candidate_head_sha }}
      candidate_source_tree: ${{ steps.metadata.outputs.candidate_source_tree }}
      trusted_harness_sha: ${{ steps.metadata.outputs.trusted_harness_sha }}
    steps:
      - name: Require trusted main dispatch and immutable data inputs
        env:
          ACKNOWLEDGE_NO_BYPASS: ${{ inputs.acknowledge_no_bypass }}
          ACKNOWLEDGE_PAPER_ONLY: ${{ inputs.acknowledge_paper_only }}
          DISPATCH_REF: ${{ github.ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          MERGE_GROUP_SHA: ${{ inputs.merge_group_sha }}
          MUTATION_MODE: ${{ inputs.mutation_mode }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$ACKNOWLEDGE_NO_BYPASS" = 'true'
          test "$ACKNOWLEDGE_PAPER_ONLY" = 'true'
          test "$MUTATION_MODE" = 'true'
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_GROUP_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout only trusted main harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Assert trusted harness identity and static boundary
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$DISPATCH_SHA"
          python3 trusted/scripts/check_qualification_trust_boundary.py --root trusted
      - name: Fetch candidate as untrusted source data
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          git init candidate
          git -C candidate remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C candidate -c protocol.version=2 fetch \
            --no-tags --depth=1 origin \
            "+refs/pull/${PULL_NUMBER}/head:refs/remotes/origin/candidate"
          test "$(git -C candidate rev-parse refs/remotes/origin/candidate)" = "$EXPECTED_HEAD_SHA"
          git -C candidate checkout --detach refs/remotes/origin/candidate
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Build immutable candidate inside pinned builder image
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          HEPTA_IB_SDK_ARCHIVE: ${{ vars.HEPTA_IB_SDK_ARCHIVE }}
          HEPTA_IB_SDK_SHA256: ${{ env.HEPTA_IB_SDK_SHA256 }}
          HEPTA_IB_SDK_VERSION: ${{ env.HEPTA_IB_SDK_VERSION }}
        run: |
          set -euo pipefail
          image="${HEPTA_IB_BUILDER_IMAGE}"
          test -n "$image"
          test -n "$HEPTA_IB_SDK_ARCHIVE"
          case "$HEPTA_IB_SDK_ARCHIVE" in
            /*) ;;
            *) echo 'HEPTA_IB_SDK_ARCHIVE must be an absolute path on the isolated builder' >&2; exit 1 ;;
          esac
          test -f "$HEPTA_IB_SDK_ARCHIVE"
          docker pull "$image"
          docker inspect --format='{{index .RepoDigests 0}}' "$image" | grep -Fx "$image"
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --tmpfs /work/out:rw,nosuid,nodev,size=512m \
            -u "$(id -u):$(id -g)" \
            -e EXPECTED_HEAD_SHA="$EXPECTED_HEAD_SHA" \
            -e HEPTA_IB_SDK_VERSION="$HEPTA_IB_SDK_VERSION" \
            -e HEPTA_IB_SDK_SHA256="$HEPTA_IB_SDK_SHA256" \
            -v "$GITHUB_WORKSPACE/trusted:/work/trusted:ro" \
            -v "$GITHUB_WORKSPACE/candidate:/work/candidate:ro" \
            -v "$HEPTA_IB_SDK_ARCHIVE:/work/ib-api.zip:ro" \
            -v "$RUNNER_TEMP:/work/out" \
            "$image" \
            /work/trusted/scripts/build_ib_candidate_artifact.sh \
            --candidate-root /work/candidate \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --ib-api-archive /work/ib-api.zip \
            --ib-api-sha256 "$HEPTA_IB_SDK_SHA256" \
            --ib-api-version "$HEPTA_IB_SDK_VERSION" \
            --output /work/out/ib-paper-candidate.tar
      - name: Verify candidate metadata and expose exact identities
        id: metadata
        env:
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ib-paper-candidate.tar"
          manifest="$RUNNER_TEMP/ib-paper-candidate-manifest.json"
          test -s "$archive"
          test -s "$manifest"
          artifact_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          candidate_head_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate_head_sha"])' "$manifest")"
          candidate_source_tree="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate_source_tree"])' "$manifest")"
          trusted_harness_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["trusted_harness_sha"])' "$manifest")"
          test "$candidate_head_sha" = "$EXPECTED_HEAD_SHA"
          artifact_name="ib-paper-candidate-${candidate_head_sha}-${candidate_source_tree}-${trusted_harness_sha}-${artifact_sha256}"
          {
            echo "artifact_name=$artifact_name"
            echo "artifact_sha256=$artifact_sha256"
            echo "candidate_head_sha=$candidate_head_sha"
            echo "candidate_source_tree=$candidate_source_tree"
            echo "trusted_harness_sha=$trusted_harness_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Upload exact immutable candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/ib-paper-candidate.tar
            ${{ runner.temp }}/ib-paper-candidate-manifest.json
          if-no-files-found: error
          retention-days: 30

  paper-qualification:
    if: github.event_name == 'workflow_dispatch'
    needs: build-candidate
    name: ib-paper-external-qualification
    runs-on: [self-hosted, linux, x64, heptatrader-ib-paper]
    environment: ib-paper
    timeout-minutes: 180
    steps:
      - name: Require PAPER qualification inputs
        env:
          ACKNOWLEDGE_NO_BYPASS: ${{ inputs.acknowledge_no_bypass }}
          ACKNOWLEDGE_PAPER_ONLY: ${{ inputs.acknowledge_paper_only }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          MERGE_GROUP_SHA: ${{ inputs.merge_group_sha }}
          MUTATION_MODE: ${{ inputs.mutation_mode }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          test "$ACKNOWLEDGE_NO_BYPASS" = 'true'
          test "$ACKNOWLEDGE_PAPER_ONLY" = 'true'
          test "$MUTATION_MODE" = 'true'
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_GROUP_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout only trusted main harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Assert trusted harness identity and static boundary
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$DISPATCH_SHA"
          python3 trusted/scripts/check_qualification_trust_boundary.py --root trusted
      - name: Download exact candidate artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: ${{ needs.build-candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/candidate
      - name: Verify immutable candidate before Broker access
        env:
          EXPECTED_ARTIFACT_SHA256: ${{ needs.build-candidate.outputs.artifact_sha256 }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HARNESS_SHA: ${{ needs.build-candidate.outputs.trusted_harness_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.build-candidate.outputs.candidate_source_tree }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/verify_ib_candidate_artifact.py \
            --archive "$RUNNER_TEMP/candidate/ib-paper-candidate.tar" \
            --manifest "$RUNNER_TEMP/candidate/ib-paper-candidate-manifest.json" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-source-tree "$EXPECTED_SOURCE_TREE" \
            --expected-trusted-harness-sha "$EXPECTED_HARNESS_SHA" \
            --expected-artifact-sha256 "$EXPECTED_ARTIFACT_SHA256" \
            --extract-to "$RUNNER_TEMP/verified-candidate"
      - name: Run external PAPER campaign
        env:
          EXPECTED_ARTIFACT_SHA256: ${{ needs.build-candidate.outputs.artifact_sha256 }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.build-candidate.outputs.candidate_source_tree }}
          HEPTA_IB_ACCOUNT_ID: ${{ secrets.HEPTA_IB_ACCOUNT_ID }}
          HEPTA_IB_GATEWAY_HOST: ${{ secrets.HEPTA_IB_GATEWAY_HOST }}
          HEPTA_IB_GATEWAY_PORT: ${{ secrets.HEPTA_IB_GATEWAY_PORT }}
          HEPTA_IB_QUALIFIER_COMMAND: ${{ vars.HEPTA_IB_QUALIFIER_COMMAND }}
          HEPTA_IB_QUALIFIER_SHA256: ${{ env.HEPTA_IB_EXTERNAL_QUALIFIER_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$HEPTA_IB_ACCOUNT_ID"
          test -n "$HEPTA_IB_GATEWAY_HOST"
          test -n "$HEPTA_IB_GATEWAY_PORT"
          test -n "$HEPTA_IB_QUALIFIER_COMMAND"
          case "$HEPTA_IB_QUALIFIER_COMMAND" in
            /*) ;;
            *) echo 'HEPTA_IB_QUALIFIER_COMMAND must be an absolute path' >&2; exit 1 ;;
          esac
          test -x "$HEPTA_IB_QUALIFIER_COMMAND"
          actual_qualifier_sha256="$(sha256sum "$HEPTA_IB_QUALIFIER_COMMAND" | awk '{print $1}')"
          test "$actual_qualifier_sha256" = "$HEPTA_IB_QUALIFIER_SHA256"
          output="$RUNNER_TEMP/ib-paper-qualification-observation.json"
          "$HEPTA_IB_QUALIFIER_COMMAND" \
            --candidate-root "$RUNNER_TEMP/verified-candidate" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-source-tree "$EXPECTED_SOURCE_TREE" \
            --expected-artifact-sha256 "$EXPECTED_ARTIFACT_SHA256" \
            --account-id "$HEPTA_IB_ACCOUNT_ID" \
            --gateway-host "$HEPTA_IB_GATEWAY_HOST" \
            --gateway-port "$HEPTA_IB_GATEWAY_PORT" \
            --paper-only \
            --output "$output"
          test -s "$output"
          test ! -L "$output"
      - name: Revalidate source and artifact after Broker campaign
        env:
          EXPECTED_ARTIFACT_SHA256: ${{ needs.build-candidate.outputs.artifact_sha256 }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_HARNESS_SHA: ${{ needs.build-candidate.outputs.trusted_harness_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.build-candidate.outputs.candidate_source_tree }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/verify_ib_candidate_artifact.py \
            --archive "$RUNNER_TEMP/candidate/ib-paper-candidate.tar" \
            --manifest "$RUNNER_TEMP/candidate/ib-paper-candidate-manifest.json" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-source-tree "$EXPECTED_SOURCE_TREE" \
            --expected-trusted-harness-sha "$EXPECTED_HARNESS_SHA" \
            --expected-artifact-sha256 "$EXPECTED_ARTIFACT_SHA256" \
            --verify-extracted-root "$RUNNER_TEMP/verified-candidate"
      - name: Verify PAPER observation and emit receipt
        env:
          EXPECTED_ARTIFACT_SHA256: ${{ needs.build-candidate.outputs.artifact_sha256 }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.build-candidate.outputs.candidate_source_tree }}
          MERGE_GROUP_SHA: ${{ inputs.merge_group_sha }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ib-paper-qualification-receipt.json"
          python3 trusted/scripts/verify_ib_paper_qualification.py \
            --observation "$RUNNER_TEMP/ib-paper-qualification-observation.json" \
            --pull-number "$PULL_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --expected-source-tree "$EXPECTED_SOURCE_TREE" \
            --merge-group-sha "$MERGE_GROUP_SHA" \
            --expected-artifact-sha256 "$EXPECTED_ARTIFACT_SHA256" \
            --output "$receipt"
          test -s "$receipt"
          test ! -L "$receipt"
          test "$(stat -c '%a' "$receipt")" = '600'
      - name: Upload immutable PAPER qualification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ib-paper-qualification-${{ github.sha }}-${{ inputs.expected_head_sha }}-${{ needs.build-candidate.outputs.candidate_source_tree }}-${{ inputs.merge_group_sha }}-${{ needs.build-candidate.outputs.artifact_sha256 }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ib-paper-qualification-receipt.json
          if-no-files-found: error
          retention-days: 90
