name: gap-closure-sync

on:
  push:
    branches:
      - codex/heptatrader-m3-work
    paths:
      - .github/workflows/gap-closure-sync.yml

permissions:
  contents: write

jobs:
  sync-m3-with-pr-head:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout M3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-m3-work
          fetch-depth: 0
      - name: Merge latest canonical PR head
        run: |
          set -euo pipefail
          git config user.name "Hepta Gap Closure Bot"
          git config user.email "hepta-gap-closure-bot@users.noreply.github.com"
          git fetch origin codex/heptatrader-documentation-control-plane-v2
          git merge --no-ff --no-edit origin/codex/heptatrader-documentation-control-plane-v2
          rm .github/workflows/gap-closure-sync.yml
          git add -A
          git commit --amend --no-edit
      - name: Validate synchronized exact revision
        run: ./scripts/dev_core.sh
      - name: Push synchronized branch
        run: git push origin HEAD:codex/heptatrader-m3-work
