name: gap-closure-patch

on:
  push:
    branches:
      - codex/heptatrader-documentation-control-plane-v2
    paths:
      - .github/workflows/gap-closure-patch.yml

permissions:
  contents: write

jobs:
  apply-m2-dedupe:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-documentation-control-plane-v2
          fetch-depth: 0
      - name: Repair patch parser
        run: python3 scripts/fix_m2_patch_parser.py
      - name: Apply M2 single-compilation patch
        run: python3 scripts/m2_dedupe_patch.py
      - name: Validate deterministic core
        run: ./scripts/dev_core.sh
      - name: Commit exact tested repair
        run: |
          set -euo pipefail
          git config user.name "Hepta Gap Closure Bot"
          git config user.email "hepta-gap-closure-bot@users.noreply.github.com"
          git add -A
          git commit -m "refactor: compile production sources through module targets"
          git push origin HEAD:codex/heptatrader-documentation-control-plane-v2
