"""Mechanically validate canonical tool/schema bindings across languages."""

from __future__ import annotations

import hashlib
import json
from pathlib import Path
import re
import sys

ROOT = Path(__file__).resolve().parents[1]


def validate() -> list[str]:
    errors: list[str] = []
    catalog_path = ROOT / "schemas/tool-catalog-v1.json"
    try:
        catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
    except Exception as error:
        return [f"tool catalog invalid: {error}"]
    if catalog.get("schema") != "heptatrader.tool-catalog.v1":
        errors.append("tool catalog schema mismatch")
    tools = catalog.get("tools")
    if not isinstance(tools, list):
        return errors + ["tool catalog tools must be a list"]
    names = [tool.get("name") for tool in tools if isinstance(tool, dict)]
    if len(names) != len(set(names)) or any(not isinstance(name, str) for name in names):
        errors.append("tool catalog names are invalid or duplicated")

    canonical = json.dumps(catalog, sort_keys=True, separators=(",", ":"))
    expected_digest = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
    actual_digest = (ROOT / "schemas/tool-catalog-v1.sha256").read_text().strip()
    if actual_digest != expected_digest:
        errors.append("tool catalog digest drift")

    registry = (ROOT / "HeptaTrade/tools/trading_tool_registry.cpp").read_text(
        encoding="utf-8-sig")
    header = (ROOT / "HeptaTrade/tools/trading_tool_registry.h").read_text(
        encoding="utf-8-sig")
    for tool in tools:
        name = tool["name"]
        capability = tool["capability"]
        if f'"{name}"' not in registry:
            errors.append(f"C++ registry missing tool: {name}")
        if f'"{capability}"' not in registry and f'"{capability}"' not in header:
            errors.append(f"C++ registry missing capability: {name} -> {capability}")
        if tool["visibility"] == "operator" and not capability.startswith("operator."):
            errors.append(f"raw operator tool has non-operator capability: {name}")
    for forbidden in ("LIVE_REDUCE_ONLY", "LIVE_CAPPED"):
        if forbidden in registry:
            errors.append(f"active Registry accepts dormant LIVE state: {forbidden}")
    environment_guard = re.search(
        r'EnvironmentAllows[\s\S]{0,1800}session\.environment != "WATCH"[\s\S]{0,200}'
        r'session\.environment != "PAPER"', registry)
    if environment_guard is None:
        errors.append("Registry lacks explicit WATCH/PAPER-only environment guard")
    if 'place.requiredCapability = "operator.trade.place";' not in registry:
        errors.append("raw place is not operator-only")
    if 'applyTarget.requiredCapability = "intent.apply";' not in registry:
        errors.append("target apply capability binding is missing")

    mcp = (ROOT / "adapters/mcp/hepta_mcp_server.py").read_text(encoding="utf-8-sig")
    if "system.tools.list" not in mcp or "system.tools.describe" not in mcp:
        errors.append("MCP bridge does not use runtime discovery")
    if re.search(r"broker.*credential|credential.*broker", mcp, re.IGNORECASE):
        errors.append("MCP bridge contains broker credential surface")

    ordinary_pattern = re.compile(r"(?:^|[,\s])(trade\.place|operator\.trade\.place)(?:[,\s]|$)")
    for path in (ROOT / "systemd").glob("*agent*env.example"):
        if "operator" not in path.name and ordinary_pattern.search(path.read_text()):
            errors.append(f"ordinary Agent example exposes raw place: {path.name}")
    return errors


def main() -> int:
    errors = validate()
    for error in errors:
        print(f"[SCHEMA-CATALOG] {error}", file=sys.stderr)
    if errors:
        return 1
    print("[SCHEMA-CATALOG] PASS")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
