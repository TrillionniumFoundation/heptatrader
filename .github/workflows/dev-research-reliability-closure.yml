    missing = sorted(required_names - present)
    if missing:
        print(f"[INSTALL-TREE] required files missing: {missing}", file=sys.stderr)
        return 1
    forbidden_names = {
        "hepta-ib-executiond", "HeptaTrader.sln", "Instrument.xml",
        ".env.hepta.example",
    }
    found = sorted(forbidden_names & present)
    if found:
        print(f"[INSTALL-TREE] forbidden files installed: {found}", file=sys.stderr)
        return 1
    examples = [path for path in prefix.rglob("*")
                if path.is_file() and "examples" in path.parts]
    forbidden_tokens = (
        "AllowLiveTrading", "LIVE_CAPPED", "LIVE_REDUCE_ONLY",
        "HEPTA_MD_FRONT", "HEPTA_TD_FRONT", "D:\\quant",
    )
    for path in examples:
        text = path.read_text(encoding="utf-8-sig", errors="replace")
        for token in forbidden_tokens:
            if token in text:
                print(f"[INSTALL-TREE] {path}: forbidden token {token}", file=sys.stderr)
                return 1
    for path in prefix.rglob("legacy"):
        if path.exists():
            print(f"[INSTALL-TREE] legacy surface installed: {path}", file=sys.stderr)
            return 1
    print("[INSTALL-TREE] PASS")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
'''
