name: dev-research-reliability-closure

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/dev-research-reliability-closure.yml

permissions:
  contents: write

jobs:
  close-research-schema-reliability:
    if: github.repository == 'TrillionniumFoundation/heptatrader' && github.event.head_commit.message == 'chore(dev): launch research schema and reliability closure'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for earlier closure slices and fast-forward
        run: |
          sleep 180
          git fetch origin codex/heptatrader-gap-closure-v2
          git reset --hard origin/codex/heptatrader-gap-closure-v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ clang libssl-dev python3
      - name: Recover verified prerequisite slices and add remaining runtime assets
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path.cwd()

          TEMP_WORKFLOWS = (
              ".github/workflows/dev-source-export.yml",
              ".github/workflows/dev-gap-closure-run.yml",
              ".github/workflows/dev-gap-closure-recover.yml",
              ".github/workflows/dev-intent-gap-closure.yml",
              ".github/workflows/dev-intent-gap-recover.yml",
              ".github/workflows/dev-intent-gap-compile-fix.yml",
              ".github/workflows/dev-intent-gap-type-fix.yml",
              ".github/workflows/dev-portfolio-risk-closure.yml",
              ".github/workflows/dev-research-reliability-closure.yml",
          )

          def historical_text(path: str) -> str:
              commits = subprocess.check_output(
                  ["git", "rev-list", "--all", "--", path], text=True
              ).splitlines()
              for commit in commits:
                  process = subprocess.run(
                      ["git", "show", f"{commit}:{path}"],
                      text=True, capture_output=True
                  )
                  if process.returncode == 0 and process.stdout:
                      return process.stdout
              raise RuntimeError(f"no historical contents for {path}")

          def execute_embedded(source: str, label: str) -> None:
              marker = "          python3 - <<'PY'\n"
              start = source.find(marker)
              if start < 0:
                  raise RuntimeError(f"embedded Python marker missing in {label}")
              start += len(marker)
              end = source.find("\n          PY\n", start)
              if end < 0:
                  raise RuntimeError(f"embedded Python terminator missing in {label}")
              lines = [line[10:] if line.startswith("          ") else line
                       for line in source[start:end].splitlines()]
              exec(compile("\n".join(lines), label, "exec"), {})

          def materialize_historical(path: str) -> None:
              target = ROOT / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(historical_text(path), encoding="utf-8")

          # Recover permit/telemetry.
          if not (ROOT / "HeptaTrade/observability/runtime_telemetry.cpp").exists():
              execute_embedded(
                  historical_text(".github/workflows/dev-gap-closure-run.yml"),
                  "historical-permit-telemetry-closure")

          # Recover target-position chain and apply all accumulated type fixes.
          if not (ROOT / "tests/target_position_tool_tests.cpp").exists():
              materialize_historical(".github/workflows/dev-intent-gap-closure.yml")
              execute_embedded(
                  historical_text(".github/workflows/dev-intent-gap-closure.yml"),
                  "historical-intent-closure")
          materialize_historical(".github/workflows/dev-intent-gap-closure.yml")
          execute_embedded(
              historical_text(".github/workflows/dev-intent-gap-type-fix.yml"),
              "historical-intent-type-fix")

          # Recover deterministic portfolio compiler.
          if not (ROOT / "tests/portfolio_compiler_tests.cpp").exists():
              materialize_historical(".github/workflows/dev-portfolio-risk-closure.yml")
              execute_embedded(
                  historical_text(".github/workflows/dev-portfolio-risk-closure.yml"),
                  "historical-portfolio-risk-closure")

          # Final idempotent source repairs for all prerequisite slices.
          telemetry = ROOT / "HeptaTrade/observability/runtime_telemetry.cpp"
          text = telemetry.read_text(encoding="utf-8")
          if "#include <cctype>" not in text:
              text = text.replace(
                  "#include <algorithm>\n",
                  "#include <algorithm>\n#include <cctype>\n", 1)
          text = re.sub(
              r"out << '[^'\n]*\\\"' << EscapeJson",
              "out << '\"' << EscapeJson", text)
          telemetry.write_text(text, encoding="utf-8")

          registry_h = ROOT / "HeptaTrade/tools/trading_tool_registry.h"
          text = registry_h.read_text(encoding="utf-8")
          text = text.replace("long long expiresAtMs = 0;",
                              "std::int64_t expiresAtMs = 0;")
          text = text.replace(
              '''    TradingToolResult InvokeTargetPreview(
        const TradingToolSession& session,
        const TradingToolCall& call);''',
              '''    TradingToolResult InvokeTargetPreview(
        const TradingToolSession& session,
        const TradingToolCall& call) const;''')
          text = text.replace(
              '''    TradingToolResult InvokeTargetApply(
        const TradingToolSession& session,
        const TradingToolCall& call);''',
              '''    TradingToolResult InvokeTargetApply(
        const TradingToolSession& session,
        const TradingToolCall& call) const;''')
          text = text.replace(
              "    std::unordered_map<std::string, TargetPreviewRecord> m_targetPreviews;",
              "    mutable std::unordered_map<std::string, TargetPreviewRecord> m_targetPreviews;")
          registry_h.write_text(text, encoding="utf-8")

          registry_cpp = ROOT / "HeptaTrade/tools/trading_tool_registry.cpp"
          text = registry_cpp.read_text(encoding="utf-8")
          for include, anchor in (
              ("#include <cstdint>", "#include <cstring>\n"),
              ("#include <exception>", "#include <cstring>\n"),
              ("#include <limits>", "#include <iomanip>\n"),
          ):
              if include not in text:
                  text = text.replace(anchor, anchor + include + "\n", 1)
          text = text.replace("long long EpochMs()", "std::int64_t EpochMs()")
          text = text.replace("long long& value)", "std::int64_t& value)")
          text = text.replace("std::numeric_limits<long long>::min()",
                              "std::numeric_limits<std::int64_t>::min()")
          text = text.replace("std::numeric_limits<long long>::max()",
                              "std::numeric_limits<std::int64_t>::max()")
          text = text.replace("static_cast<long long>(number)",
                              "static_cast<std::int64_t>(number)")
          text = text.replace("const long long started", "const std::int64_t started")
          text = text.replace("const long long completed", "const std::int64_t completed")
          text = text.replace("const long long now", "const std::int64_t now")
          text = text.replace("long long permitExpiry", "std::int64_t permitExpiry")
          text = text.replace(
              "std::chrono::milliseconds(std::max(1LL, record.expiresAtMs - now))",
              "std::chrono::milliseconds(\n"
              "            std::max<std::int64_t>(1, record.expiresAtMs - now))")
          text = text.replace(
              '''TradingToolResult TradingToolRegistry::InvokeTargetPreview(
    const TradingToolSession& session,
    const TradingToolCall& call)
{''',
              '''TradingToolResult TradingToolRegistry::InvokeTargetPreview(
    const TradingToolSession& session,
    const TradingToolCall& call) const
{''')
          text = text.replace(
              '''TradingToolResult TradingToolRegistry::InvokeTargetApply(
    const TradingToolSession& session,
    const TradingToolCall& call)
{''',
              '''TradingToolResult TradingToolRegistry::InvokeTargetApply(
    const TradingToolSession& session,
    const TradingToolCall& call) const
{''')
          registry_cpp.write_text(text, encoding="utf-8")

          for test_name in (
              "tests/execution_preview_permit_tests.cpp",
              "tests/target_position_tool_tests.cpp",
          ):
              path = ROOT / test_name
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              text = text.replace("long long NowMs()", "std::int64_t NowMs()")
              text = text.replace("long long& expiresAtMs", "std::int64_t& expiresAtMs")
              text = text.replace("long long expiry = 0;", "std::int64_t expiry = 0;")
              text = text.replace("long long expires", "std::int64_t expires")
              text = text.replace("const long long expires", "const std::int64_t expires")
              if "#include <cstdint>" not in text:
                  text = text.replace(
                      "#include <chrono>\n", "#include <chrono>\n#include <cstdint>\n", 1)
              path.write_text(text, encoding="utf-8")

          target_test = ROOT / "tests/target_position_tool_tests.cpp"
          text = target_test.read_text(encoding="utf-8")
          if "std::int64_t quoteObservedAtMs" not in text:
              text = text.replace(
                  "    double ask = 1.1002;\n",
                  "    double ask = 1.1002;\n"
                  "    std::int64_t quoteObservedAtMs = NowMs() - 10;\n", 1)
          text = text.replace("std::to_string(NowMs() - 1)",
                              "std::to_string(quoteObservedAtMs)")
          target_test.write_text(text, encoding="utf-8")

          bounded = ROOT / "HeptaTrade/intent/bounded_json.cpp"
          text = bounded.read_text(encoding="utf-8")
          if "#include <utility>" not in text:
              text = text.replace(
                  "#include <limits>\n", "#include <limits>\n#include <utility>\n", 1)
          bounded.write_text(text, encoding="utf-8")

          tests_cmake = ROOT / "tests/CMakeLists.txt"
          text = tests_cmake.read_text(encoding="utf-8")
          text = text.replace(
              "target_link_libraries(hepta_oms_journal_durability_tests pthread)",
              "target_link_libraries(hepta_oms_journal_durability_tests\n"
              "    pthread hepta_observability_core)")
          if ("../HeptaTrade/intent/authoritative_decision_snapshot.cpp\n"
              "    ../HeptaTrade/intent/bounded_json.cpp") not in text:
              text = text.replace(
                  "    ../HeptaTrade/intent/authoritative_decision_snapshot.cpp\n"
                  "    ../HeptaTrade/intent/target_position_intent.cpp)",
                  "    ../HeptaTrade/intent/authoritative_decision_snapshot.cpp\n"
                  "    ../HeptaTrade/intent/bounded_json.cpp\n"
                  "    ../HeptaTrade/intent/target_position_intent.cpp)", 1)
          tests_cmake.write_text(text, encoding="utf-8")

          # -----------------------------------------------------------------
          # Executable research protocol.
          # -----------------------------------------------------------------
          research_protocol = r'''#!/usr/bin/env python3
"""Deterministic, capability-free research run protocol.

The module implements the canonical RunManifest -> EventLog -> RunSummary path.
It deliberately has no broker, session, permit, promotion or deployment APIs.
"""

from __future__ import annotations

import argparse
from bisect import bisect_right
from dataclasses import dataclass
from decimal import Decimal, getcontext
import hashlib
import json
from pathlib import Path
from typing import Any, Iterable, Mapping, Sequence

getcontext().prec = 50


class ResearchProtocolError(ValueError):
    def __init__(self, code: str, detail: str = "") -> None:
        super().__init__(f"{code}: {detail}" if detail else code)
        self.code = code
        self.detail = detail


def canonical_json(value: Any) -> str:
    return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=False)


def sha256_json(value: Any) -> str:
    return "sha256:" + hashlib.sha256(canonical_json(value).encode("utf-8")).hexdigest()


def decimal_value(value: Any, field: str) -> Decimal:
    try:
        parsed = Decimal(str(value))
    except Exception as error:
        raise ResearchProtocolError("RESEARCH_DECIMAL_INVALID", field) from error
    if not parsed.is_finite():
        raise ResearchProtocolError("RESEARCH_DECIMAL_NONFINITE", field)
    return parsed


def decimal_text(value: Decimal) -> str:
    if value == 0:
        return "0"
    normalized = value.normalize()
    text = format(normalized, "f")
    if "." in text:
        text = text.rstrip("0").rstrip(".")
    return text


def canonical_sha256(value: Any) -> bool:
    return isinstance(value, str) and len(value) == 71 and value.startswith("sha256:") and all(
        character in "0123456789abcdef" for character in value[7:]
    )


@dataclass(frozen=True)
class EventRecord:
    sequence: int
    kind: str
    authoritative_ts_ms: int
    payload: Mapping[str, Any]
    previous_digest: str
    digest: str

    def as_dict(self) -> dict[str, Any]:
        return {
            "sequence": self.sequence,
            "kind": self.kind,
            "authoritative_ts_ms": self.authoritative_ts_ms,
            "payload": dict(self.payload),
            "previous_digest": self.previous_digest,
            "digest": self.digest,
        }


class EventLog:
    def __init__(self) -> None:
        self._events: list[EventRecord] = []
        self._last_ts = -1
        self._at_timestamp: dict[tuple[str, int], str] = {}

    @property
    def events(self) -> tuple[EventRecord, ...]:
        return tuple(self._events)

    @property
    def digest(self) -> str:
        return self._events[-1].digest if self._events else "sha256:" + "0" * 64

    def append(self, kind: str, authoritative_ts_ms: int,
               payload: Mapping[str, Any]) -> EventRecord:
        if not kind or len(kind) > 64 or not isinstance(authoritative_ts_ms, int) or authoritative_ts_ms < 0:
            raise ResearchProtocolError("RESEARCH_EVENT_INVALID")
        if authoritative_ts_ms < self._last_ts:
            raise ResearchProtocolError("RESEARCH_EVENT_OUT_OF_ORDER")
        normalized_payload = json.loads(canonical_json(dict(payload)))
        signature = sha256_json({"kind": kind, "payload": normalized_payload})
        key = (kind, authoritative_ts_ms)
        previous = self._at_timestamp.get(key)
        if previous is not None:
            if previous != signature:
                raise ResearchProtocolError("RESEARCH_CHANGED_DUPLICATE_TIMESTAMP")
            for event in reversed(self._events):
                if event.kind == kind and event.authoritative_ts_ms == authoritative_ts_ms:
                    return event
            raise AssertionError("event signature index lost its record")
        previous_digest = self.digest
        sequence = len(self._events) + 1
        body = {
            "sequence": sequence,
            "kind": kind,
            "authoritative_ts_ms": authoritative_ts_ms,
            "payload": normalized_payload,
            "previous_digest": previous_digest,
        }
        event = EventRecord(
            sequence=sequence,
            kind=kind,
            authoritative_ts_ms=authoritative_ts_ms,
            payload=normalized_payload,
            previous_digest=previous_digest,
            digest=sha256_json(body),
        )
        self._events.append(event)
        self._at_timestamp[key] = signature
        self._last_ts = authoritative_ts_ms
        return event


def validate_static_manifest(document: Mapping[str, Any], root: Path) -> None:
    if document.get("schema") != "heptatrader.research-manifest.v1":
        raise ResearchProtocolError("RESEARCH_MANIFEST_SCHEMA_INVALID")
    if document.get("mode") != "shadow":
        raise ResearchProtocolError("RESEARCH_MODE_NOT_SHADOW")
    contract = document.get("run_contract")
    if not isinstance(contract, Mapping) or contract.get("campaign_or_finalizer_required") is not False:
        raise ResearchProtocolError("RESEARCH_RUN_CONTRACT_INVALID")
    capability = document.get("capability")
    if not isinstance(capability, Mapping) or any(value is not False for value in capability.values()):
        raise ResearchProtocolError("RESEARCH_CAPABILITY_FORBIDDEN")
    strategy = document.get("strategy")
    if not isinstance(strategy, Mapping):
        raise ResearchProtocolError("RESEARCH_STRATEGY_MISSING")
    for field in ("definition", "implementation", "context_builder", "replay_evaluator"):
        relative = strategy.get(field)
        if not isinstance(relative, str) or not (root / relative).is_file():
            raise ResearchProtocolError("RESEARCH_STRATEGY_INPUT_MISSING", field)


def validate_run_manifest(document: Mapping[str, Any]) -> None:
    required_strings = (
        "run_id", "source_revision", "strategy_digest", "config_digest",
        "calendar", "session_semantics", "symbol_mapping",
    )
    if document.get("schema") != "heptatrader.run-manifest.v1":
        raise ResearchProtocolError("RUN_MANIFEST_SCHEMA_INVALID")
    if document.get("mode") != "shadow":
        raise ResearchProtocolError("RUN_MANIFEST_MODE_INVALID")
    for field in required_strings:
        value = document.get(field)
        if not isinstance(value, str) or not value:
            raise ResearchProtocolError("RUN_MANIFEST_FIELD_MISSING", field)
    for field in ("strategy_digest", "config_digest"):
        if not canonical_sha256(document[field]):
            raise ResearchProtocolError("RUN_MANIFEST_DIGEST_INVALID", field)
    datasets = document.get("datasets")
    if not isinstance(datasets, Sequence) or not datasets:
        raise ResearchProtocolError("RUN_MANIFEST_DATASETS_MISSING")
    for dataset in datasets:
        if not isinstance(dataset, Mapping) or not dataset.get("uri") or not canonical_sha256(dataset.get("sha256")):
            raise ResearchProtocolError("RUN_MANIFEST_DATASET_INVALID")
    costs = document.get("costs")
    capacity = document.get("capacity")
    if not isinstance(costs, Mapping) or not isinstance(capacity, Mapping):
        raise ResearchProtocolError("RUN_MANIFEST_ECONOMICS_MISSING")
    for field in ("commission_per_unit", "slippage_bps", "impact_bps"):
        if decimal_value(costs.get(field), field) < 0:
            raise ResearchProtocolError("RUN_MANIFEST_COST_INVALID", field)
    if int(costs.get("decision_to_fill_delay_ms", -1)) < 0:
        raise ResearchProtocolError("RUN_MANIFEST_DELAY_INVALID")
    max_order = decimal_value(capacity.get("max_order_quantity"), "max_order_quantity")
    liquidity = decimal_value(capacity.get("available_liquidity"), "available_liquidity")
    participation = decimal_value(capacity.get("max_participation"), "max_participation")
    if max_order <= 0 or liquidity <= 0 or participation <= 0 or participation > 1:
        raise ResearchProtocolError("RUN_MANIFEST_CAPACITY_INVALID")
    validate_folds(
        document.get("folds", ()),
        int(document.get("feature_horizon_ms", -1)),
        int(document.get("label_horizon_ms", -1)),
        int(document.get("purge_ms", -1)),
        int(document.get("embargo_ms", -1)),
    )


def validate_folds(folds: Sequence[Mapping[str, Any]],
                   feature_horizon_ms: int,
                   label_horizon_ms: int,
                   purge_ms: int,
                   embargo_ms: int) -> None:
    if not folds:
        raise ResearchProtocolError("RESEARCH_FOLDS_MISSING")
    horizon = max(feature_horizon_ms, label_horizon_ms)
    if horizon < 0 or purge_ms < horizon or embargo_ms < horizon:
        raise ResearchProtocolError("RESEARCH_PURGE_EMBARGO_INSUFFICIENT")
    previous_test_end = -1
    for index, fold in enumerate(folds):
        try:
            train_start = int(fold["train_start_ms"])
            train_end = int(fold["train_end_ms"])
            test_start = int(fold["test_start_ms"])
            test_end = int(fold["test_end_ms"])
        except Exception as error:
            raise ResearchProtocolError("RESEARCH_FOLD_INVALID", str(index)) from error
        if not (0 <= train_start < train_end < test_start < test_end):
            raise ResearchProtocolError("RESEARCH_FOLD_ORDER_INVALID", str(index))
        if test_start - train_end < purge_ms:
            raise ResearchProtocolError("RESEARCH_FOLD_PURGE_VIOLATION", str(index))
        if previous_test_end >= 0 and test_start <= previous_test_end:
            raise ResearchProtocolError("RESEARCH_FOLD_TEST_OVERLAP", str(index))
        previous_test_end = test_end


def _normalize_quotes(quotes: Sequence[Mapping[str, Any]], log: EventLog) -> list[dict[str, Any]]:
    normalized: list[dict[str, Any]] = []
    previous_ts = -1
    previous_canonical = ""
    for raw in quotes:
        try:
            ts = int(raw["ts_ms"])
            bid = decimal_value(raw["bid"], "bid")
            ask = decimal_value(raw["ask"], "ask")
        except Exception as error:
            if isinstance(error, ResearchProtocolError):
                raise
            raise ResearchProtocolError("RESEARCH_QUOTE_INVALID") from error
        if ts < 0 or bid <= 0 or ask < bid:
            raise ResearchProtocolError("RESEARCH_QUOTE_INVALID")
        canonical = canonical_json({"ts_ms": ts, "bid": decimal_text(bid), "ask": decimal_text(ask)})
        if ts < previous_ts:
            raise ResearchProtocolError("RESEARCH_QUOTE_OUT_OF_ORDER")
        if ts == previous_ts:
            if canonical != previous_canonical:
                raise ResearchProtocolError("RESEARCH_CHANGED_DUPLICATE_TIMESTAMP")
            continue
        quote = {"ts_ms": ts, "bid": bid, "ask": ask}
        normalized.append(quote)
        log.append("quote", ts, {"bid": decimal_text(bid), "ask": decimal_text(ask)})
        previous_ts = ts
        previous_canonical = canonical
    if not normalized:
        raise ResearchProtocolError("RESEARCH_QUOTES_MISSING")
    return normalized


def evaluate_run(manifest: Mapping[str, Any],
                 quotes: Sequence[Mapping[str, Any]],
                 targets: Sequence[Mapping[str, Any]]) -> dict[str, Any]:
    validate_run_manifest(manifest)
    log = EventLog()
    normalized_quotes = _normalize_quotes(quotes, log)
    quote_times = [quote["ts_ms"] for quote in normalized_quotes]
    costs = manifest["costs"]
    capacity = manifest["capacity"]
    commission = decimal_value(costs["commission_per_unit"], "commission_per_unit")
    slippage_bps = decimal_value(costs["slippage_bps"], "slippage_bps")
    impact_bps = decimal_value(costs["impact_bps"], "impact_bps")
    delay_ms = int(costs["decision_to_fill_delay_ms"])
    max_order = decimal_value(capacity["max_order_quantity"], "max_order_quantity")
    available_liquidity = decimal_value(capacity["available_liquidity"], "available_liquidity")
    max_participation = decimal_value(capacity["max_participation"], "max_participation")
    max_quote_age_ms = int(manifest.get("max_quote_age_ms", 60000))

    position = Decimal(0)
    cash = Decimal(0)
    explicit_cost = Decimal(0)
    turnover = Decimal(0)
    peak_equity = Decimal(0)
    max_drawdown = Decimal(0)
    previous_target_ts = -1
    seen_targets: dict[tuple[str, int], str] = {}
    trade_count = 0

    for raw_target in targets:
        instrument = str(raw_target.get("instrument", ""))
        ts = int(raw_target.get("ts_ms", -1))
        target = decimal_value(raw_target.get("target_position"), "target_position")
        if not instrument or ts < previous_target_ts:
            raise ResearchProtocolError("RESEARCH_TARGET_OUT_OF_ORDER")
        signature = sha256_json({
            "instrument": instrument,
            "target_position": decimal_text(target),
        })
        key = (instrument, ts)
        if key in seen_targets:
            if seen_targets[key] != signature:
                raise ResearchProtocolError("RESEARCH_CHANGED_DUPLICATE_TIMESTAMP")
            continue
        seen_targets[key] = signature
        previous_target_ts = ts

        quote_index = bisect_right(quote_times, ts) - 1
        if quote_index < 0:
            raise ResearchProtocolError("RESEARCH_LOOKAHEAD_REQUIRED")
        quote = normalized_quotes[quote_index]
        if ts - quote["ts_ms"] > max_quote_age_ms:
            raise ResearchProtocolError("RESEARCH_QUOTE_STALE")
        fill_at = ts + delay_ms
        fill_index = bisect_right(quote_times, fill_at) - 1
        if fill_index < 0:
            raise ResearchProtocolError("RESEARCH_FILL_QUOTE_MISSING")
        fill_quote = normalized_quotes[fill_index]
        if fill_at - fill_quote["ts_ms"] > max_quote_age_ms:
            raise ResearchProtocolError("RESEARCH_FILL_QUOTE_STALE")

        delta = target - position
        log.append("target", ts, {
            "instrument": instrument,
            "target_position": decimal_text(target),
            "current_position": decimal_text(position),
            "delta": decimal_text(delta),
        })
        if delta == 0:
            continue
        absolute_delta = abs(delta)
        participation_limit = available_liquidity * max_participation
        if absolute_delta > max_order or absolute_delta > participation_limit:
            raise ResearchProtocolError("RESEARCH_CAPACITY_EXCEEDED")
        utilization = absolute_delta / available_liquidity
        adverse_bps = slippage_bps + impact_bps * utilization
        if delta > 0:
            base_price = fill_quote["ask"]
            fill_price = base_price * (Decimal(1) + adverse_bps / Decimal(10000))
        else:
            base_price = fill_quote["bid"]
            fill_price = base_price * (Decimal(1) - adverse_bps / Decimal(10000))
        if fill_price <= 0:
            raise ResearchProtocolError("RESEARCH_FILL_PRICE_INVALID")
        commission_cost = absolute_delta * commission
        slippage_cost = absolute_delta * abs(fill_price - base_price)
        cost = commission_cost + slippage_cost
        cash -= delta * fill_price
        cash -= commission_cost
        explicit_cost += cost
        turnover += absolute_delta * fill_price
        position = target
        trade_count += 1
        log.append("fill", fill_at, {
            "instrument": instrument,
            "quantity": decimal_text(delta),
            "fill_price": decimal_text(fill_price),
            "commission": decimal_text(commission_cost),
            "slippage_and_impact": decimal_text(slippage_cost),
        })
        mark = (fill_quote["bid"] + fill_quote["ask"]) / Decimal(2)
        equity = cash + position * mark
        peak_equity = max(peak_equity, equity)
        max_drawdown = max(max_drawdown, peak_equity - equity)

    last_quote = normalized_quotes[-1]
    last_mark = (last_quote["bid"] + last_quote["ask"]) / Decimal(2)
    net_pnl = cash + position * last_mark
    summary_without_digest = {
        "schema": "heptatrader.run-summary.v1",
        "run_id": manifest["run_id"],
        "status": "VALID",
        "event_count": len(log.events),
        "event_log_digest": log.digest,
        "net_pnl": decimal_text(net_pnl),
        "explicit_cost": decimal_text(explicit_cost),
        "turnover": decimal_text(turnover),
        "trade_count": trade_count,
        "final_position": decimal_text(position),
        "max_drawdown": decimal_text(max_drawdown),
        "source_revision": manifest["source_revision"],
        "manifest_digest": sha256_json(manifest),
    }
    summary = dict(summary_without_digest)
    summary["output_digest"] = sha256_json({
        "manifest": manifest,
        "events": [event.as_dict() for event in log.events],
        "summary": summary_without_digest,
    })
    return summary


