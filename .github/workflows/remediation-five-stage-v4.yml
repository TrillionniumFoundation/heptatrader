name: Five-stage remediation materializer v4

on:
  push:
    branches:
      - remediation/full-five-stage-closure-20260916

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/full-five-stage-closure-20260916
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev zlib1g-dev python3-yaml

      - name: Reapply validated remediation source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/remediation-five-stage-v3.yml').read_text()
          start = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          body = workflow[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(body, 'remediation-five-stage-v3', 'exec'), {})

          checker = Path('scripts/check_documentation.py')
          text = checker.read_text()
          text = text.replace(
              'CANONICAL_FILES = (\n    Path("README.md"),\n    Path("docs/index.md"),\n    Path("docs/DOCUMENTATION-POLICY.md"),\n)',
              'CANONICAL_FILES = (\n    Path("docs/index.md"),\n    Path("docs/DOCUMENTATION-POLICY.md"),\n)')
          text = text.replace(
              '    readme = _read_text(root / "README.md", "README.md", errors)\n    if not readme.strip():\n        errors.append("README.md: project entry point is missing")\n',
              '    entry = _read_text(root / "docs/index.md", "docs/index.md", errors)\n    if not entry.strip():\n        errors.append("docs/index.md: project documentation entry point is missing")\n')
          checker.write_text(text)
          PY
          rm -f .github/workflows/remediation-five-stage-v3.yml
          rm -f .github/workflows/remediation-five-stage-v4.yml
          git diff --check

      - name: Build and run focused native regression
        run: |
          cmake -S . -B build/remediation -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/remediation --target hepta_simulator_risk_runtime_tests -j2
          ctest --test-dir build/remediation --output-on-failure -R '^hepta_simulator_risk_runtime_tests$'

      - name: Run lifecycle and repository suites
        run: |
          python3 -m unittest tests.python.test_oms_lifecycle_rotation
          python3 scripts/check_documentation.py
          python3 scripts/run_python_tests.py --lane core
          python3 scripts/run_python_tests.py --lane source

      - name: Commit validated product tree
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add -A
          test ! -e .github/workflows/remediation-five-stage-v3.yml
          test ! -e .github/workflows/remediation-five-stage-v4.yml
          git diff --cached --check
          git commit -m "fix: close simulator generation restart and lifecycle growth gaps"
          git push origin HEAD:refs/heads/remediation/full-five-stage-closure-20260916
