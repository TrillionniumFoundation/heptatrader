name: Temporary read-only audit source export
on:
  push:
    branches: [audit/source-export-20260912]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9286bd74025009383ad92f1fa6d4624196c9560a
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact public source and Git identity for local integration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9286bd74025009383ad92f1fa6d4624196c9560a
          mkdir -p /tmp/hepta-source-export
          git archive --format=tar HEAD | gzip -n > /tmp/hepta-source-export/source.tar.gz
          git ls-files --stage > /tmp/hepta-source-export/index.txt
          git cat-file commit HEAD > /tmp/hepta-source-export/commit.txt
          sha256sum /tmp/hepta-source-export/source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-audit-source-9286bd74
          path: /tmp/hepta-source-export/
          retention-days: 1
          if-no-files-found: error
