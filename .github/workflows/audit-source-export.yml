name: audit-source-export

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: audit-source-export-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  export:
    name: exact-head-source-export
    if: github.event.pull_request.head.ref == 'codex/full-gap-closure-20260901'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Create bounded source archive
        run: |
          set -euo pipefail
          tar --exclude=.git --exclude=build --exclude='*.tar.gz' \
            -czf "$RUNNER_TEMP/heptatrader-source-${GITHUB_SHA}.tar.gz" .
      - name: Publish source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/heptatrader-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
