name: Temporary Branch Consolidation Inventory

on:
  push:
    branches:
      - codex/branch-consolidation-inventory-20260908

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read every branch and bind it to the current main identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_MAIN_SHA: cc67cb231620363624b0efcfc6934e9a4b3297cc
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          expected_main = os.environ["EXPECTED_MAIN_SHA"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "heptatrader-branch-consolidation-inventory",
          }

          def request(path):
              req = urllib.request.Request(api + path, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          main_ref = request("/git/ref/heads/main")
          main_sha = main_ref["object"]["sha"]
          if main_sha != expected_main:
              raise SystemExit(f"main moved: {main_sha} != {expected_main}")
          main_commit = request(f"/git/commits/{main_sha}")
          main_tree = main_commit["tree"]["sha"]

          branches = []
          page = 1
          while True:
              values = request(f"/branches?per_page=100&page={page}")
              if not values:
                  break
              branches.extend(values)
              if len(values) < 100:
                  break
              page += 1

          inventory = []
          for branch in sorted(branches, key=lambda item: item["name"].encode("utf-8")):
              name = branch["name"]
              sha = branch["commit"]["sha"]
              commit = request(f"/git/commits/{sha}")
              encoded_base = urllib.parse.quote(sha, safe="")
              encoded_head = urllib.parse.quote(main_sha, safe="")
              comparison = request(f"/compare/{encoded_base}...{encoded_head}")
              inventory.append({
                  "branch": name,
                  "sha": sha,
                  "tree_sha": commit["tree"]["sha"],
                  "same_tree_as_main": commit["tree"]["sha"] == main_tree,
                  "relation_branch_to_main": {
                      "status": comparison["status"],
                      "ahead_by": comparison["ahead_by"],
                      "behind_by": comparison["behind_by"],
                      "total_commits": comparison["total_commits"],
                  },
              })

          document = {
              "schema": "heptatrader.branch-consolidation-inventory.v1",
              "repository": repository,
              "main_sha": main_sha,
              "main_tree_sha": main_tree,
              "branch_count": len(inventory),
              "branches": inventory,
          }
          encoded = (json.dumps(document, indent=2, sort_keys=True) + "\n").encode("utf-8")
          open("branch-consolidation-inventory.json", "wb").write(encoded)
          open("branch-consolidation-inventory.json.sha256", "w", encoding="ascii").write(
              hashlib.sha256(encoded).hexdigest() + "  branch-consolidation-inventory.json\n"
          )
          print(f"inventoried {len(inventory)} branches at main {main_sha}")
          PY
      - name: Upload immutable inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-branch-consolidation-inventory-${{ github.sha }}
          path: |
            branch-consolidation-inventory.json
            branch-consolidation-inventory.json.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
