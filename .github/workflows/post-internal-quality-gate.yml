name: post-internal-quality-gate

on:
  push:
    branches:
      - codex/heptatrader-p1-integration-controller
    paths:
      - .github/workflows/post-internal-quality-gate.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: heptatrader-post-internal-quality
  cancel-in-progress: true

jobs:
  enforce:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-p1-integration-controller
          fetch-depth: 0
      - name: Wait for canonical internal closure
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/heptatrader-documentation-control-plane-v2
          for attempt in $(seq 1 600); do
            git fetch origin "$branch" >/dev/null 2>&1
            base_sha="$(git rev-parse "origin/$branch")"
            if git show "$base_sha:docs/program/gap-registry-v2.json" 2>/dev/null | grep -Fq G-OPT-007; then
              break
            fi
            sleep 10
          done
          git show "$base_sha:docs/program/gap-registry-v2.json" | grep -Fq G-OPT-007
          worktree="$RUNNER_TEMP/heptatrader-post-internal-quality"
          git worktree add --detach "$worktree" "$base_sha"
          cd "$worktree"
          git config user.name "Hepta Internal Quality Bot"
          git config user.email "hepta-internal-quality-bot@users.noreply.github.com"

          python3 - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          root = Path('.')
          numeric = root / 'docs/architecture/NUMERIC-POLICY.md'
          text = numeric.read_text(encoding='utf-8')
          corrected = text.replace('microunuit', 'microunit')
          if corrected != text:
              numeric.write_text(corrected, encoding='utf-8')

          evidence = root / 'tests/python/test_internal_verification_evidence.py'
          source = evidence.read_text(encoding='utf-8')
          if 'issubset({"G-IB-001", "G-TEAM-001"})' not in source:
              old = '''        self.assertEqual(
            remaining,
            {"G-IB-001": "in-progress", "G-TEAM-001": "in-progress"},
        )
'''
              new = '''        self.assertTrue(
            set(remaining).issubset({"G-IB-001", "G-TEAM-001"})
        )
        for state in remaining.values():
            self.assertEqual(state, "in-progress")
'''
              if old not in source:
                  raise SystemExit('unrecognized external-gap assertion')
              evidence.write_text(source.replace(old, new, 1), encoding='utf-8')

          gaps = json.loads((root / 'docs/program/gap-registry-v2.json').read_text())
          remaining = {
              item['id']: item['state']
              for item in gaps['gaps']
              if item.get('state') != 'closed'
          }
          if not set(remaining).issubset({'G-IB-001', 'G-TEAM-001'}):
              raise SystemExit('unexpected open gaps: ' + repr(remaining))
          if any(state != 'in-progress' for state in remaining.values()):
              raise SystemExit('external gaps must remain explicitly in-progress')

          matrix = json.loads((root / 'docs/verification/test-matrix-v2.json').read_text())
          unexpected = [
              (item.get('id'), item.get('state'), item.get('lane'))
              for item in matrix['checks']
              if item.get('state') != 'implemented'
              and not (
                  item.get('state') == 'external'
                  and item.get('lane') == 'D-external-qualification'
              )
          ]
          if unexpected:
              raise SystemExit('unexpected non-implemented checks: ' + repr(unexpected))
          PY

          for forbidden in \
            scripts/p1_data_patch.py \
            scripts/p1_allocation_patch.py \
            scripts/p1_allocation_repair.py \
            scripts/m7_integration_patch.py \
            .github/workflows/p1-data-closure.yml \
            .github/workflows/p1-allocation-closure.yml \
            .github/workflows/p1-allocation-repair.yml \
            .github/workflows/m7-integration.yml; do
            test ! -e "$forbidden"
          done

          python3 scripts/generate_documentation_views.py --write
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: finalize monotonic internal closure quality"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          python3 -m py_compile tests/python/test_internal_verification_evidence.py
          test -z "$(git status --porcelain)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "worktree=$worktree" >> "$GITHUB_OUTPUT"
      - name: Validate exact quality core
        if: steps.candidate.outputs.changed == 'true'
        env:
          WORKTREE: ${{ steps.candidate.outputs.worktree }}
        run: |
          cd "$WORKTREE"
          HEPTA_BUILD_DIR="$RUNNER_TEMP/heptatrader-post-internal-quality-core" \
          HEPTA_CMAKE_GENERATOR=Ninja HEPTA_JOBS=2 ./scripts/dev_core.sh
      - name: Validate exact quality GCC sanitizer
        if: steps.candidate.outputs.changed == 'true'
        env:
          WORKTREE: ${{ steps.candidate.outputs.worktree }}
        run: |
          cd "$WORKTREE"
          CXX=g++ HEPTA_CMAKE_GENERATOR=Ninja HEPTA_JOBS=2 \
          HEPTA_RELIABILITY_BUILD_DIR="$RUNNER_TEMP/heptatrader-post-internal-quality-gcc" \
            ./scripts/reliability_core.sh
      - name: Validate exact quality Clang sanitizer
        if: steps.candidate.outputs.changed == 'true'
        env:
          WORKTREE: ${{ steps.candidate.outputs.worktree }}
        run: |
          cd "$WORKTREE"
          CXX=clang++ HEPTA_CMAKE_GENERATOR=Ninja HEPTA_JOBS=2 \
          HEPTA_RELIABILITY_BUILD_DIR="$RUNNER_TEMP/heptatrader-post-internal-quality-clang" \
            ./scripts/reliability_core.sh
      - name: Publish exact quality revision
        if: steps.candidate.outputs.changed == 'true'
        env:
          WORKTREE: ${{ steps.candidate.outputs.worktree }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
        run: |
          cd "$WORKTREE"
          head_sha="$(git rev-parse HEAD)"
          git push --force origin "$head_sha:refs/heads/codex/heptatrader-post-internal-quality-candidate"
          git push \
            --force-with-lease="refs/heads/codex/heptatrader-documentation-control-plane-v2:$BASE_SHA" \
            origin "$head_sha:refs/heads/codex/heptatrader-documentation-control-plane-v2"
      - name: Record failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/issues/7/comments" \
            -f body="<!-- post-internal-quality-failure:$GITHUB_RUN_ID -->

          The post-internal quality gate stopped fail-closed. Inspect $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID." || true
