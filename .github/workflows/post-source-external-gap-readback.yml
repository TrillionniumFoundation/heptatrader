name: Post-source External Gap Readback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: heptatrader-post-source-external-readback
  cancel-in-progress: false

jobs:
  readback:
    name: post-source-external-gap-readback
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact trusted main without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Skip until source candidate reaches main
        id: source
        run: |
          if test -f docs/modules/source-status.md && test -f .github/workflows/source-admission.yml; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Canonical source candidate has not reached main; external readback deferred.'
          fi

      - name: Read live governance and qualification control surfaces
        if: steps.source.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, subprocess, urllib.parse
          from pathlib import Path

          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; sha=os.environ['SOURCE_SHA']
          def request(path: str):
              result=subprocess.run([
                  'curl','--silent','--show-error','--write-out','\n%{http_code}',
                  '-H','Accept: application/vnd.github+json',
                  '-H',f'Authorization: Bearer {token}',
                  '-H','X-GitHub-Api-Version: 2022-11-28',
                  f'https://api.github.com/repos/{repo}/{path}'
              ],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=False)
              body, _, code=result.stdout.rpartition('\n')
              try: payload=json.loads(body) if body else None
              except json.JSONDecodeError: payload={'unparsed':body[-2000:]}
              return {'http_status':int(code) if code.isdigit() else 0,'body':payload}

          branch=request('branches/main')
          rulesets=request('rulesets?includes_parents=true&per_page=100')
          environments=request('environments?per_page=100')
          teams=request('teams?per_page=100')
          runners=request('actions/runners?per_page=100')
          runs=request('actions/runs?branch=main&per_page=100')

          b=branch.get('body') if isinstance(branch.get('body'),dict) else {}
          rbody=rulesets.get('body')
          active_rulesets=[item for item in rbody if isinstance(item,dict) and item.get('enforcement')=='active'] if isinstance(rbody,list) else []
          ebody=environments.get('body') if isinstance(environments.get('body'),dict) else {}
          environment_names=sorted(
              item.get('name') for item in ebody.get('environments',[])
              if isinstance(item,dict) and isinstance(item.get('name'),str)
          )
          tbody=teams.get('body')
          team_names=sorted(
              item.get('slug') for item in tbody
              if isinstance(item,dict) and isinstance(item.get('slug'),str)
          ) if isinstance(tbody,list) else []
          runner_body=runners.get('body') if isinstance(runners.get('body'),dict) else {}
          runner_count=runner_body.get('total_count') if runners.get('http_status')==200 else None
          run_body=runs.get('body') if isinstance(runs.get('body'),dict) else {}
          merge_group_runs=[
              {'id':item.get('id'),'head_sha':item.get('head_sha'),'status':item.get('status'),'conclusion':item.get('conclusion'),'path':item.get('path')}
              for item in run_body.get('workflow_runs',[])
              if isinstance(item,dict) and item.get('event')=='merge_group'
          ]
          gaps=[]
          if not b.get('protected'): gaps.append('main_not_protected')
          if not active_rulesets: gaps.append('no_active_repository_ruleset')
          if 'repository-governance' not in environment_names: gaps.append('repository_governance_environment_not_visible')
          if 'ib-paper' not in environment_names: gaps.append('ib_paper_environment_not_visible')
          if teams['http_status']!=200 or not team_names: gaps.append('repository_team_readback_unavailable_or_empty')
          if runners['http_status']!=200 or not runner_count: gaps.append('runner_readback_unavailable_or_empty')
          if not any(item.get('conclusion')=='success' for item in merge_group_runs): gaps.append('no_successful_merge_group_readback')

          report={
              'schema':'heptatrader.external-gap-readback.v1',
              'source_sha':sha,
              'repository':repo,
              'branch':{'http_status':branch['http_status'],'protected':b.get('protected'),'name':b.get('name')},
              'rulesets':{'http_status':rulesets['http_status'],'active_count':len(active_rulesets),'ids':[item.get('id') for item in active_rulesets]},
              'environments':{'http_status':environments['http_status'],'names':environment_names},
              'teams':{'http_status':teams['http_status'],'slugs':team_names},
              'runners':{'http_status':runners['http_status'],'total_count':runner_count},
              'successful_merge_group_present':any(item.get('conclusion')=='success' for item in merge_group_runs),
              'gaps':gaps,
              'paper_authorized':False,
              'live_authorized':False,
          }
          Path('/tmp/external-gap-readback.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          Path('/tmp/external-gap-summary.txt').write_text(
              'Exact trusted main: '+sha+'\n'
              'Live external-gap readback: '+(', '.join(gaps) if gaps else 'all queried predicates visible; run canonical verifiers')+'\n'
              'PAPER and LIVE authorization remain false until verifier-issued receipts validate.\n',
              encoding='utf-8'
          )
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Comment exact readback on external gap issues
        if: steps.source.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body="$(cat /tmp/external-gap-summary.txt)"
          for issue in 8 9; do
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -X POST "https://api.github.com/repos/$REPOSITORY/issues/$issue/comments" \
              -d "$(BODY="$body" python3 - <<'PY'
          import json, os
          print(json.dumps({'body':os.environ['BODY']}))
          PY
          )" >/dev/null
          done

      - name: Upload readback artifact
        if: steps.source.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-gap-readback-${{ github.sha }}
          path: /tmp/external-gap-readback.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed while live predicates are absent
        if: steps.source.outputs.present == 'true'
        run: |
          python3 - <<'PY'
          import json
          report=json.load(open('/tmp/external-gap-readback.json'))
          if report['gaps']:
              raise SystemExit('external gaps remain: '+', '.join(report['gaps']))
          PY
