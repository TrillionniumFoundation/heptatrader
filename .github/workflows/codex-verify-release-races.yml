name: Codex Verify Release Race Boundaries

on:
  push:
    branches: [codex/close-source-blockers-v2-2026-09-08]

permissions:
  contents: write

concurrency:
  group: heptatrader-codex-release-race-verifier
  cancel-in-progress: false

jobs:
  verify-or-apply:
    if: github.event.head_commit.message == 'chore: verify release race remediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact verifier staging revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify or apply release race remediation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          if grep -Fq 'class PinnedSnapshot:' scripts/hepta_preflight.py \
             && grep -Fq 'def _publish_noreplace(' scripts/build_release_package.py \
             && test -f tests/python/test_release_security_races.py; then
            echo 'release race remediation is already present'
          else
            test -f scripts/codex_fix_release_races.py
            python3 scripts/codex_fix_release_races.py
          fi
          rm -f \
            scripts/codex_fix_release_races.py \
            .github/workflows/codex-fix-release-races.yml \
            .github/workflows/codex-verify-release-races.yml
          chmod 0755 scripts/build_release_package.py scripts/hepta_preflight.py
          git diff --check

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev

      - name: Run focused race and descriptor tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_release_package.py scripts/hepta_preflight.py tests/python/test_release_security_races.py
          python3 -m unittest discover -s tests/python -p 'test_release_security_races.py'

      - name: Run complete repository validation
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/verify_build_ownership.py
          python3 scripts/check_gap_register.py
          python3 scripts/verify_canonical_ib_paper_profile.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          ./scripts/dev_core.sh
          git diff --check

      - name: Publish clean verified commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): verify pinned no-replace publication'
          git push origin HEAD:codex/close-source-blockers-v2-2026-09-08
