name: final-one-shot-semantic-truth-audit

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/zz-final-truth-audit.yml

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: heptatrader-authoritative-gap-closure
  cancel-in-progress: true

jobs:
  final-truth-audit:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Cancel stale temporary runs and lock current branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/TrillionniumFoundation/heptatrader/actions/runs?branch=codex/heptatrader-gap-closure-v2&per_page=100' --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.id != '${GITHUB_RUN_ID}')) | [.id, .path] | @tsv' |
          while IFS=$'\t' read -r id path;do [[ -z "${id:-}" ]]&&continue;case "$path" in .github/workflows/dev-*|.github/workflows/zz-*) gh api --method POST "repos/TrillionniumFoundation/heptatrader/actions/runs/$id/cancel"||true;;esac;done
          sleep 45
          git fetch origin codex/heptatrader-gap-closure-v2
          git reset --hard origin/codex/heptatrader-gap-closure-v2
          find .github/workflows -maxdepth 1 -type f \( -name 'dev-*.yml' -o -name 'dev-*.yaml' -o -name 'zz-*.yml' -o -name 'zz-*.yaml' \) -print -delete
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/core-ci.yml')
          if not p.exists():raise SystemExit('core-ci missing')
          s=p.read_text()
          if 'workflow_dispatch:' not in s:
              if 'on:\n' not in s:raise SystemExit('core on block missing')
              p.write_text(s.replace('on:\n','on:\n  workflow_dispatch:\n',1))
          PY
          if grep -RInE '^\s*(contents|pull-requests|actions|checks):\s*write\s*$|git push|gh pr merge|merge_pull_request|enable_auto_merge' .github/workflows --include='*.yml' --include='*.yaml';then exit 1;fi

      - name: Install deterministic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++ clang libssl-dev python3 jq

      - name: Execute exact semantic proofs and complete matrix
        id: gates
        env:
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: '2'
        shell: bash
        run: |
          set +e
          {
            rm -rf build/final-proof build/core-release build/core-debug build/reliability-* &&
            cmake -S . -B build/final-proof -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DHEPTA_INSTALL_RUNTIME=ON -DHEPTA_ENABLE_IBAPI=OFF &&
            cmake --build build/final-proof --parallel 2 &&
            ctest --test-dir build/final-proof -N | tee /tmp/final-test-list.txt &&
            grep -F 'hepta_target_protocol_idempotency_tests' /tmp/final-test-list.txt &&
            grep -F 'hepta_target_permit_lifecycle_tests' /tmp/final-test-list.txt &&
            ctest --test-dir build/final-proof --output-on-failure -R '^hepta_target_protocol_idempotency_tests$|^hepta_target_permit_lifecycle_tests$' &&
            python3 -m py_compile scripts/check_repository_integrity.py scripts/resolve_hepta_config.py scripts/hepta_agent_mcp_launcher.py &&
            python3 scripts/generate_tool_catalog.py --check &&
            python3 scripts/check_repository_integrity.py &&
            python3 scripts/check_schema_catalog.py &&
            python3 scripts/check_module_discipline.py &&
            python3 scripts/check_gap_closure.py &&
            python3 research/run_protocol.py verify --manifest research/manifest-v1.json &&
            python3 -m unittest discover -s tests/python -p 'test_*.py' &&
            ./scripts/dev_core.sh &&
            stage="$RUNNER_TEMP/heptatrader-runtime" && rm -rf "$stage" &&
            DESTDIR="$stage" cmake --install build/core-release --component runtime &&
            python3 scripts/check_install_tree.py "$stage" &&
            cmake -S . -B build/core-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DHEPTA_INSTALL_RUNTIME=ON -DHEPTA_ENABLE_IBAPI=OFF &&
            cmake --build build/core-debug --parallel 2 &&
            ctest --test-dir build/core-debug --output-on-failure &&
            CXX=g++ HEPTA_JOBS=2 ./scripts/reliability_core.sh &&
            CXX=clang++ HEPTA_JOBS=2 ./scripts/reliability_core.sh
          } > final-truth-audit.log 2>&1
          code=$?
          if [[ $code -eq 0 ]];then echo 'passed=true' >> "$GITHUB_OUTPUT";else echo 'passed=false' >> "$GITHUB_OUTPUT";fi
          exit 0

      - name: Commit truthful failure state
        if: steps.gates.outputs.passed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('docs/development/PLAN.md');s=p.read_text()
          for g in ('G-001','G-006','G-007','G-008','G-015'):
              s=re.sub(rf'^(\| {g} \|.*?\|)\s*(?:planned|in progress|blocked|closed)\s*\|$',r'\1 in progress |',s,flags=re.MULTILINE)
          p.write_text(s)
          audit={'schema':'heptatrader.remote-closure-audit.v1','status':'FAIL','affected_gaps':['G-001','G-006','G-007','G-008','G-015'],'required_semantic_proofs':['hepta_target_protocol_idempotency_tests','hepta_target_permit_lifecycle_tests'],'plan_closed':False,'capability_limits':{'live':'unsupported','ctp':'unsupported_fail_closed','xt_qmt':'unsupported_fail_closed','ib_paper':'external_sdk_and_host_certification_required'}}
          Path('docs/development/REMOTE-CLOSURE-AUDIT.json').write_text(json.dumps(audit,sort_keys=True,indent=2)+'\n')
          PY
          { echo '# Remaining final truth-audit blocker';echo;echo 'Status: current; affected canonical gaps remain in progress.';echo 'Applies to: the first failing exact semantic proof or unchanged full-matrix command.';echo 'Verification: final truth audit.';echo;echo '```text';tail -n 2200 final-truth-audit.log;echo '```';} > docs/development/RUNTIME-CLOSURE-FAILURE.md
          rm -f final-truth-audit.log
          git config user.name 'OpenAI Codex';git config user.email 'noreply@openai.com';git add -A;git diff --cached --check;git commit -s -m 'chore: record truthful remaining closure blocker';git push origin HEAD:codex/heptatrader-gap-closure-v2
          exit 1

      - name: Commit truthful PASS state
        if: steps.gates.outputs.passed == 'true'
        id: final
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/development/RUNTIME-CLOSURE-FAILURE.md final-truth-audit.log
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('docs/development/PLAN.md');p.write_text(re.sub(r'^(\| G-\d{3} \|.*?\|)\s*(?:planned|in progress|blocked|closed)\s*\|$',r'\1 closed |',p.read_text(),flags=re.MULTILINE))
          status=Path('docs/development/CLOSURE-STATUS.json')
          try:s=json.loads(status.read_text()) if status.exists() else {}
          except Exception:s={}
          s.update({'schema':'heptatrader.closure-status.v1','status':'PASS','gaps':{f'G-{i:03d}':'closed' for i in range(1,17)},'compiled_semantic_proofs':['hepta_target_protocol_idempotency_tests','hepta_target_permit_lifecycle_tests'],'capability_limits':{'live':'unsupported','ctp':'unsupported_fail_closed','xt_qmt':'unsupported_fail_closed','ib_paper':'external_sdk_and_host_certification_required'}});status.write_text(json.dumps(s,sort_keys=True,indent=2)+'\n')
          audit={'schema':'heptatrader.remote-closure-audit.v1','status':'LOCAL_MATRIX_PASS','gaps':{f'G-{i:03d}':'closed' for i in range(1,17)},'compiled_semantic_proofs':['hepta_target_protocol_idempotency_tests','hepta_target_permit_lifecycle_tests'],'permanent_exact_head_core':'pending_after_commit','capability_limits':s['capability_limits']};Path('docs/development/REMOTE-CLOSURE-AUDIT.json').write_text(json.dumps(audit,sort_keys=True,indent=2)+'\n')
          PY
          python3 scripts/check_repository_integrity.py;python3 scripts/check_gap_closure.py;git diff --check
          git config user.name 'OpenAI Codex';git config user.email 'noreply@openai.com';git add -A;git commit -s -m 'fix: close all canonical gaps after final truth audit';git push origin HEAD:codex/heptatrader-gap-closure-v2;echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require permanent read-only core on exact PASS SHA
        if: steps.gates.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/dispatches -f ref=codex/heptatrader-gap-closure-v2
          id='';for n in $(seq 1 90);do id=$(gh api 'repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/runs?branch=codex/heptatrader-gap-closure-v2&event=workflow_dispatch&per_page=30' --jq ".workflow_runs[] | select(.head_sha == \"$FINAL_SHA\") | .id"|head -n1);[[ -n "$id" ]]&&break;sleep 5;done;[[ -n "$id" ]]||exit 1
          for n in $(seq 1 210);do st=$(gh api "repos/TrillionniumFoundation/heptatrader/actions/runs/$id" --jq .status);co=$(gh api "repos/TrillionniumFoundation/heptatrader/actions/runs/$id" --jq '.conclusion // ""');if [[ "$st" == completed ]];then [[ "$co" == success ]];exit;fi;sleep 10;done;exit 1

      - name: Mark PR ready after exact-head PASS
        if: steps.gates.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .node_id);draft=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .draft);if [[ "$draft" == true ]];then gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' -f id="$id" >/dev/null;fi
