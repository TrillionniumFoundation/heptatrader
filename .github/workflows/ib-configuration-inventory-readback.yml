name: IB Configuration Inventory Readback

on:
  push:
    branches:
      - codex/ib-protected-environment-readback-20260906
    paths:
      - '.github/workflows/ib-configuration-inventory-readback.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: heptatrader-ib-configuration-inventory-readback
  cancel-in-progress: false

jobs:
  inventory:
    name: ib-configuration-inventory-readback
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query and sanitize repository and environment metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ib-configuration-inventory-readback.json"
          python3 - <<'PY' > "$out"
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          base = f'https://api.github.com/repos/{repository}'
          endpoints = {
              'repository_variables': f'{base}/actions/variables?per_page=100',
              'ib_paper_environment': f'{base}/environments/ib-paper',
              'ib_paper_variables': f'{base}/environments/ib-paper/variables?per_page=100',
          }

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as error:
                  try:
                      payload = json.loads(error.read())
                  except Exception:
                      payload = {}
                  return error.code, payload

          result = {
              'schema': 'heptatrader.ib-configuration-inventory-readback.v1',
              'repository': repository,
              'endpoints': {},
          }
          required_names = {
              'HEPTA_IB_BUILD_SDK_ROOT',
              'HEPTA_IB_BUILD_QUOTA_ROOT',
              'HEPTA_IB_BUILDER_IMAGE',
              'HEPTA_IB_PAPER_QUALIFIER',
              'HEPTA_IB_PAPER_QUALIFIER_SHA256',
          }
          for key, url in endpoints.items():
              status, payload = get(url)
              item = {'http_status': status}
              if key.endswith('variables') and status == 200 and isinstance(payload, dict):
                  names = {
                      entry.get('name')
                      for entry in payload.get('variables', [])
                      if isinstance(entry, dict) and isinstance(entry.get('name'), str)
                  }
                  item['required_names_present'] = {
                      name: name in names for name in sorted(required_names)
                  }
                  item['variable_count'] = payload.get('total_count', len(names))
              elif key == 'ib_paper_environment' and status == 200 and isinstance(payload, dict):
                  rules = payload.get('protection_rules', [])
                  item['protection_rule_types'] = sorted(
                      str(rule.get('type'))
                      for rule in rules
                      if isinstance(rule, dict) and rule.get('type') is not None
                  )
                  item['can_admins_bypass'] = payload.get('can_admins_bypass')
              else:
                  item['error_message'] = str(payload.get('message', ''))[:256] if isinstance(payload, dict) else ''
              result['endpoints'][key] = item
          print(json.dumps(result, sort_keys=True, separators=(',', ':')))
          PY
          chmod 0600 "$out"

      - name: Upload sanitized configuration inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ib-configuration-inventory-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ib-configuration-inventory-readback.json
          if-no-files-found: error
          retention-days: 7
