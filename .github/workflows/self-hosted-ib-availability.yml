name: Self-hosted IB runner availability

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this bounded IB-runner probe is being requested
        required: false
        default: operator-check
        type: string

# Dispatch-only, tokenless and checkout-free. The runner group must remain
# restricted to this exact trusted-main workflow, and only runner x230 may carry
# the dedicated heptatrader-x230-probe routing label.
permissions: {}

concurrency:
  group: heptatrader-self-hosted-ib-availability
  cancel-in-progress: false

jobs:
  ib-runner-probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: X230 IB runner probe
    runs-on:
      group: trillionnium-ib-paper
      labels: [self-hosted, linux, x64, heptatrader-x230-probe]
    permissions: {}
    timeout-minutes: 10
    steps:
      - name: Verify trusted manual main invocation
        shell: bash
        env:
          PROBE_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = x230
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          [[ "$PROBE_REASON" =~ ^[A-Za-z0-9._:-]{1,80}$ ]]
          printf 'runner=%s\nos=%s\narch=%s\nref=%s\nreason=%s\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            "$PROBE_REASON"

      - name: Read-only IB Gateway reachability snapshot
        shell: bash
        run: |
          set -euo pipefail
          if command -v nc >/dev/null 2>&1; then
            nc -z -w 3 127.0.0.1 4002
          else
            timeout 3 bash -c '</dev/tcp/127.0.0.1/4002'
          fi
