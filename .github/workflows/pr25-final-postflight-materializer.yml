name: PR25 immutable final-postflight materializer

on:
  push:
    branches:
      - codex/pr25-final-postflight-staging-20260906
    paths:
      - '.github/workflows/pr25-final-postflight-materializer.yml'
      - 'scripts/materialize_final_postflight.py'
      - 'scripts/verify_bootstrap_postflight_contract.py'
      - 'tests/python/test_bootstrap_postflight_contract.py'

permissions:
  contents: write

concurrency:
  group: pr25-immutable-final-postflight-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging source without persistent credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/pr25-final-postflight-staging-20260906
          fetch-depth: 2
          persist-credentials: false
      - name: Materialize, parse and hostile-test both final workflows
        id: materialize
        env:
          EXPECTED_GOVERNANCE_BASE_BLOB: 0079d1f9828a9a5d09c1ead2f59027ef18031ea7
          EXPECTED_IB_BASE_BLOB: 6946d0c4b02d0c433cce4dd680d30e859a0cff6e
          EXPECTED_MATERIALIZER_BLOB: 73b8ea656ffcf10d502e512caf5fe65bba976f74
          EXPECTED_CONTRACT_BLOB: 899f93ac03201a9eebef82616b23e43fb85d2b0d
          EXPECTED_TEST_BLOB: 4ea2113e3bd7caec01d49b72927dfb0697ad8fe5
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/github-governance-qualification.yml)" = "$EXPECTED_GOVERNANCE_BASE_BLOB"
          test "$(git hash-object .github/workflows/ib-paper-qualification.yml)" = "$EXPECTED_IB_BASE_BLOB"
          test "$(git hash-object scripts/materialize_final_postflight.py)" = "$EXPECTED_MATERIALIZER_BLOB"
          test "$(git hash-object scripts/verify_bootstrap_postflight_contract.py)" = "$EXPECTED_CONTRACT_BLOB"
          test "$(git hash-object tests/python/test_bootstrap_postflight_contract.py)" = "$EXPECTED_TEST_BLOB"
          python3 scripts/materialize_final_postflight.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/github-governance-qualification.yml'); YAML.load_file('.github/workflows/ib-paper-qualification.yml')"
          python3 -m py_compile \
            scripts/materialize_final_postflight.py \
            scripts/verify_bootstrap_postflight_contract.py \
            tests/python/test_bootstrap_postflight_contract.py
          python3 scripts/verify_bootstrap_postflight_contract.py --self-test
          python3 scripts/check_bootstrap_postflight.py
          python3 scripts/check_qualification_trust_boundary.py --self-test
          python3 -m unittest discover -s tests/python -p 'test_bootstrap_postflight.py'
          python3 -m unittest discover -s tests/python -p 'test_bootstrap_postflight_contract.py'
          git diff --check
          governance_blob="$(git hash-object .github/workflows/github-governance-qualification.yml)"
          ib_blob="$(git hash-object .github/workflows/ib-paper-qualification.yml)"
          test "$governance_blob" != "$EXPECTED_GOVERNANCE_BASE_BLOB"
          test "$ib_blob" != "$EXPECTED_IB_BASE_BLOB"
          GOVERNANCE_BLOB="$governance_blob" IB_BLOB="$ib_blob" python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import urllib.request

          items = (
              (Path('.github/workflows/github-governance-qualification.yml'), os.environ['GOVERNANCE_BLOB']),
              (Path('.github/workflows/ib-paper-qualification.yml'), os.environ['IB_BLOB']),
          )
          for path, expected in items:
              payload = json.dumps({
                  'content': base64.b64encode(path.read_bytes()).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
                  data=payload,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.load(response)
              if body.get('sha') != expected:
                  raise SystemExit(f"{path}: expected {expected}, got {body.get('sha')}")
          output = Path(os.environ['RUNNER_TEMP'], 'final-postflight-blobs.json')
          output.write_text(json.dumps({
              'governance_blob': os.environ['GOVERNANCE_BLOB'],
              'ib_blob': os.environ['IB_BLOB'],
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write(f"governance_blob={os.environ['GOVERNANCE_BLOB']}\n")
              stream.write(f"ib_blob={os.environ['IB_BLOB']}\n")
          print(f"FINAL_GOVERNANCE_BLOB={os.environ['GOVERNANCE_BLOB']}")
          print(f"FINAL_IB_BLOB={os.environ['IB_BLOB']}")
          PY
          cp .github/workflows/github-governance-qualification.yml "$RUNNER_TEMP/github-governance-qualification.yml"
          cp .github/workflows/ib-paper-qualification.yml "$RUNNER_TEMP/ib-paper-qualification.yml"
      - name: Upload exact final bytes and identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr25-final-postflight-${{ steps.materialize.outputs.governance_blob }}-${{ steps.materialize.outputs.ib_blob }}
          path: |
            ${{ runner.temp }}/github-governance-qualification.yml
            ${{ runner.temp }}/ib-paper-qualification.yml
            ${{ runner.temp }}/final-postflight-blobs.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
