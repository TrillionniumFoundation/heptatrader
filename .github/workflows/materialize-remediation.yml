name: Materialize reviewed remediation source (temporary)
on:
  push:
    branches: [remediation/remaining-blockers-20260914]
    paths: [.github/remediation-transfer.*, .github/workflows/materialize-remediation.yml]
permissions:
  contents: read
jobs:
  materialize:
    if: github.repository_id == '1350235228' && github.ref == 'refs/heads/remediation/remaining-blockers-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Materialize hash-bound Git objects only; no candidate execution or ref writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          REPO = 'TrillionniumFoundation/heptatrader'
          BASE = '5409e0911afa405f2413d69e33d0c0df3cf1fcad'
          BASE_TREE = '54c23c0a9d25e99fc722e79879ec9e2323c9ea31'
          TREE = '195fabf7c0fb9a2cba5ccebbb84260f393a50af6'
          PATCH_SHA = '53cbb54bba6a1de85362c903cc3c7b112213dc2b50c319f9e3594480b8fdf8cd'
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/remediation/remaining-blockers-20260914'
          def git(*args, data=None):
              return subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', '-c', 'core.fsmonitor=false', *args], input=data, check=True, stdout=subprocess.PIPE).stdout
          assert git('rev-parse', 'HEAD^').decode().strip() == BASE
          assert git('rev-parse', BASE + '^{tree}').decode().strip() == BASE_TREE
          encoded = ''.join(pathlib.Path(f'.github/remediation-transfer.{i}').read_text().strip() for i in range(3))
          assert len(encoded) == 23380
          compressed = base64.b64decode(encoded, validate=True)
          assert len(compressed) == 17533
          patch = gzip.decompress(compressed)
          assert len(patch) == 65816 and hashlib.sha256(patch).hexdigest() == PATCH_SHA
          git('read-tree', BASE)
          git('apply', '--cached', '--check', data=patch)
          git('apply', '--cached', data=patch)
          assert git('write-tree').decode().strip() == TREE
          def inventory(tree):
              result = {}
              for row in git('ls-tree', '-r', '-z', tree).split(b'\0'):
                  if not row: continue
                  identity, name = row.split(b'\t', 1)
                  mode, kind, sha = identity.decode().split()
                  assert kind == 'blob' and mode in ('100644', '100755')
                  result[name.decode('utf-8')] = (mode, sha)
              return result
          def post(endpoint, payload):
              assert endpoint in ('blobs', 'trees')
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/git/' + endpoint,
                  data=json.dumps(payload).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          before, after = inventory(BASE), inventory(TREE)
          changed = [p for p in sorted(set(before) | set(after)) if before.get(p) != after.get(p)]
          assert len(changed) == 29 and all(not p.startswith('.github/') for p in changed)
          entries = []
          for path in changed:
              assert path in after
              mode, sha = after[path]
              data = git('cat-file', 'blob', sha)
              created = post('blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              assert created['sha'] == sha
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': sha})
          created = post('trees', {'base_tree': BASE_TREE, 'tree': entries})
          assert created['sha'] == TREE
          receipt = {'result': 'PASS', 'source_tree': TREE, 'base_source_sha': BASE,
              'patch_sha256': PATCH_SHA, 'changed_files': 29, 'candidate_executed': False,
              'refs_modified': False, 'ruleset_modified': False, 'authorization_effect': 'NONE'}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'remediation-objects.json').write_text(json.dumps(receipt, indent=2)+'\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remediation-objects-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/remediation-objects.json
          if-no-files-found: error
          retention-days: 7
