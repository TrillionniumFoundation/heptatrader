name: core-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DHEPTA_ENABLE_IBAPI=OFF
          -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF
          -DHEPTA_BUILD_LEGACY_MONOLITH=OFF
          -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF

      - name: Build core test binaries
        run: cmake --build build --target hepta_core_test_binaries --parallel 2

      - name: Run core runtime tests
        run: ctest --test-dir build --output-on-failure --parallel 2 -L core
