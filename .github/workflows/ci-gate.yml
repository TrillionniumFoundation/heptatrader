name: ci-gate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master, round38-consolidation ]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  clean-source-ci-references:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate archive-reproducible CI inputs and quality budgets
        shell: bash
        run: >-
          python3 scripts/check_heptatrader_code_quality.py
          --root .
          --check-ci-archive
          --strict

  agent-os-linux:
    runs-on: ubuntu-latest
    # The single authoritative IB-off CTest matrix includes the Python
    # contract/evidence suites and routinely exceeds twenty minutes on a
    # shared runner.  Keep one full run, but give it a bounded certification
    # window instead of allowing a duplicate retry lane.
    # One fresh build plus the eight-round canonical CTest soak is close to
    # thirty minutes on shared runners; leave bounded headroom for the
    # no-Git/install smoke and evidence indexing without adding a duplicate
    # retry lane.
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Initialize external build path
        shell: bash
        run: >-
          printf 'HEPTA_REPOSITORY_IB_OFF_BUILD=%s\n'
          "$RUNNER_TEMP/heptatrader-repository-ibapi-off"
          >> "$GITHUB_ENV"

      - name: Configure Agent OS tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          soak_profile=release
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            soak_profile=pr-smoke
          fi
          cmake -S . -B "$HEPTA_REPOSITORY_IB_OFF_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DHEPTA_SOAK_PROFILE="$soak_profile" \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF
          # CMake commonly creates CMakeCache.txt as 0664 even under umask
          # 077.  Seal the cache before the soak records its provenance.
          chmod 600 "$HEPTA_REPOSITORY_IB_OFF_BUILD/CMakeCache.txt"

      - name: Build Agent OS test binaries
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cmake --build "$HEPTA_REPOSITORY_IB_OFF_BUILD" \
            --target hepta_agent_os_test_binaries --parallel 2

      - name: Validate exact repository CTest inventory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/check_heptatrader_ctest_inventory.py \
            --build-dir "$HEPTA_REPOSITORY_IB_OFF_BUILD"

      - name: Run Agent OS CTest suite (includes IB-off install contract)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # The long P1 synthetic auditor/handoff tests are retained in the
          # inventory but run only on release/nightly lanes.  The parameterized
          # execution soak itself remains in this single CTest invocation.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ctest --test-dir "$HEPTA_REPOSITORY_IB_OFF_BUILD" \
              --output-on-failure --label-exclude p1-synthetic
          else
            ctest --test-dir "$HEPTA_REPOSITORY_IB_OFF_BUILD" \
              --output-on-failure
          fi

      - name: Enforce repository governance and source-baseline gates
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version=0.1.0-beta.1-round122
          baseline="release-manifests/heptatrader-agent-os-v0.1.0-beta.1-round122/manifest.json"
          # Repository layout/quality/direct-broker checks are represented by
          # the canonical CTest gates above.  Keep this step for release
          # evidence and registry/source-boundary checks only; invoking the
          # same static checkers a second time made the gate needlessly slow
          # and could produce two non-identical reports.
          python3 scripts/hepta_ops.py status
          python3 scripts/hepta_ops.py install --output compat/hepta-ops-generated --check
          python3 scripts/converge_ctp_vendor_headers.py --check-forwarders-only
          python3 scripts/verify_heptatrader_vendor_assets.py --payload-mode absent
          python3 scripts/verify_heptatrader_prebuilt_assets.py --payload-mode absent
          python3 scripts/verify_heptatrader_source_baseline.py --root . --baseline "$baseline" --expected-version "$version"

      - name: Run canonical native Linux release check (rc phase)
        shell: bash
        run: |
          set -euo pipefail
          # Keep PR feedback short while retaining the full certification for
          # pushes, scheduled nightlies, and manual release runs.  The phase
          # gate consumes the report emitted by the single CTest soak above;
          # it never starts a second runner.
          soak_profile=release
          phase=rc
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            soak_profile=pr-smoke
            # The two-round PR profile is diagnostic feedback, not an RC
            # promotion input.  The CTest step above still executes it;
            # use the offline dev summary here so the PR remains green.
            phase=dev
          fi
          python3 scripts/hepta_ops.py release check \
            --phase "$phase" \
            --build-dir "$HEPTA_REPOSITORY_IB_OFF_BUILD" \
            --soak-profile "$soak_profile" \
            --soak-report "$HEPTA_REPOSITORY_IB_OFF_BUILD/execution-gateway-short-soak.json" \
            --report "$HEPTA_REPOSITORY_IB_OFF_BUILD/ci-release-check.json"

      - name: Validate canonical release check summary
        shell: bash
        run: python3 -c 'import json, os; report=json.load(open(os.environ["HEPTA_REPOSITORY_IB_OFF_BUILD"] + "/ci-release-check.json", encoding="utf-8")); assert report.get("schema") == "hepta.release-check.v1"; assert report.get("phase") == "dev" or report.get("phase") == "rc"'

      - name: Build and verify content-addressed CI evidence index
        shell: bash
        run: |
          python3 scripts/hepta_ops.py run evidence.index.build -- \
            --evidence-root "$HEPTA_REPOSITORY_IB_OFF_BUILD" \
            --output evidence-indexes/ci-execution-gateway-soak-v2.json \
            --path execution-gateway-short-soak.json
          python3 scripts/hepta_ops.py run evidence.index.verify -- \
            --evidence-root "$HEPTA_REPOSITORY_IB_OFF_BUILD" \
            --index evidence-indexes/ci-execution-gateway-soak-v2.json

      - name: Upload current evidence and verified pending index
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: execution-gateway-soak-v11-verified-index
          path: |
            ${{ runner.temp }}/heptatrader-repository-ibapi-off/ci-release-check.json
            ${{ runner.temp }}/heptatrader-repository-ibapi-off/execution-gateway-short-soak.json
            evidence-indexes/ci-execution-gateway-soak-v2.json
          if-no-files-found: error
          retention-days: 30

  agent-os-no-git-ib-off:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Initialize external build path
        shell: bash
        run: >-
          printf 'HEPTA_AGENT_NOGIT_IB_OFF_BUILD=%s\n'
          "$RUNNER_TEMP/heptatrader-agent-nogit-ibapi-off"
          >> "$GITHUB_ENV"

      - name: Build and verify strict and Agent-OS-only source bundles
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version=0.1.0-beta.1-round122
          stage="$(mktemp -d)"
          echo "HEPTA_SOURCE_STAGE=$stage" >> "$GITHUB_ENV"
          python3 scripts/build_heptatrader_clean_source_bundle.py \
            --root . \
            --version "$version" \
            --output "$stage/strict-source.tar" \
            --manifest "$stage/strict-source-manifest.json"
          python3 scripts/verify_heptatrader_clean_source_bundle.py \
            --bundle "$stage/strict-source.tar" \
            --manifest "$stage/strict-source-manifest.json"
          python3 scripts/build_heptatrader_agent_os_source_bundle.py \
            --strict-source-tar "$stage/strict-source.tar" \
            --strict-source-manifest "$stage/strict-source-manifest.json" \
            --version "$version" \
            --output "$stage/agent-os-source.tar" \
            --manifest "$stage/agent-os-source-manifest.json"
          python3 scripts/verify_heptatrader_agent_os_source_bundle.py \
            --bundle "$stage/agent-os-source.tar" \
            --manifest "$stage/agent-os-source-manifest.json" \
            --strict-source-tar "$stage/strict-source.tar" \
            --strict-source-manifest "$stage/strict-source-manifest.json"
          mkdir "$stage/extracted"
          tar --same-permissions -xf \
            "$stage/agent-os-source.tar" -C "$stage/extracted"
          test ! -e \
            "$stage/extracted/heptatrader-agent-os-$version/.git"

      - name: Configure no-Git Agent OS source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version=0.1.0-beta.1-round122
          cmake \
            -S "$HEPTA_SOURCE_STAGE/extracted/heptatrader-agent-os-$version" \
            -B "$HEPTA_AGENT_NOGIT_IB_OFF_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF

      - name: Build and smoke-test no-Git Agent OS source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version=0.1.0-beta.1-round122
          source="$HEPTA_SOURCE_STAGE/extracted/heptatrader-agent-os-$version"
          build="$HEPTA_AGENT_NOGIT_IB_OFF_BUILD"
          cmake --build "$build" \
            --target hepta_agent_os_test_binaries --parallel 2
          python3 "$source/scripts/check_heptatrader_ctest_inventory.py" \
            --build-dir "$build"
          # no-Git is a portability/protocol/install smoke lane.  The full
          # CTest matrix is authoritative only in the repository IB-off lane.
          python3 "$source/tests/check_hepta_execution_install_tree.py" \
            --build-dir "$build"

  ctp-windows-source-boundary:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The canonical 6.7.7 headers are an unlicensed, nonredistributable
      # overlay and must not be materialized by source CI. A real header
      # compile is an external release gate that requires an independently
      # provisioned overlay matching manifest-v1.json.
      - name: Validate CTP 6.7.7 source-only forwarding boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'third_party/ctp/6.7.7/include') {
            throw 'Nonredistributable CTP canonical overlay entered source checkout'
          }
          $manifest = Get-Content -Raw -LiteralPath `
            'third_party/ctp/6.7.7/manifest-v1.json' | ConvertFrom-Json
          if ($manifest.schema -ne 'hepta.vendor-asset-manifest.v1' -or
              $manifest.version -ne '6.7.7' -or
              $manifest.distribution_authorized -ne $false -or
              $manifest.license_review_required -ne $true -or
              $manifest.capability_status -ne 'disabled-experimental' -or
              $manifest.canonical_headers.Count -ne 4) {
            throw 'CTP manifest authorization boundary drift'
          }
          $names = @(
            'ThostFtdcMdApi.h',
            'ThostFtdcTraderApi.h',
            'ThostFtdcUserApiDataType.h',
            'ThostFtdcUserApiStruct.h'
          )
          $directories = @(
            'Interface/CTPTradeApi32',
            'Interface/CTPTradeApi64',
            'Interface/CTPTradeApiLinux'
          )
          $count = 0
          foreach ($directory in $directories) {
            foreach ($name in $names) {
              $path = Join-Path $directory $name
              $actual = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
              $expected = "#pragma once`n#include `"../../third_party/ctp/6.7.7/include/$name`"`n"
              if ($actual -ne $expected) {
                throw "CTP compatibility forwarder drift: $path"
              }
              $count++
            }
          }
          if ($count -ne 12) {
            throw 'CTP compatibility forwarder matrix is incomplete'
          }

  # Mandatory real-IB build/install gate. The licensed SDK is not vendored, so
  # the masked SDK URL secret and pinned repository SHA are required. Missing
  # or partial
  # configuration fails closed instead of skipping broker-authority coverage.
  ibapi-linux-compile:
    if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    runs-on: [self-hosted, linux, x64, heptatrader-ib-sdk-v1]
    environment: heptatrader-ib-sdk-v1
    timeout-minutes: 45
    env:
      HEPTA_IBAPI_SDK_SHA256: ${{ vars.HEPTA_IBAPI_SDK_SHA256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Initialize external build paths
        shell: bash
        run: |
          printf 'HEPTA_REPOSITORY_IB_ON_BUILD=%s\n' \
            "$RUNNER_TEMP/heptatrader-repository-ibapi-on" >> "$GITHUB_ENV"
          printf 'HEPTA_AGENT_NOGIT_IB_ON_BUILD=%s\n' \
            "$RUNNER_TEMP/heptatrader-agent-nogit-ibapi-on" >> "$GITHUB_ENV"

      - name: Validate pinned IB SDK configuration
        shell: bash
        env:
          HEPTA_IBAPI_SDK_URL: ${{ secrets.HEPTA_IBAPI_SDK_URL }}
        run: |
          test -n "$HEPTA_IBAPI_SDK_URL" || {
            echo "HEPTA_IBAPI_SDK_URL is required by the mandatory IB gate" >&2
            exit 1
          }
          test -n "$HEPTA_IBAPI_SDK_SHA256" || {
            echo "HEPTA_IBAPI_SDK_SHA256 must pin the configured SDK archive" >&2
            exit 1
          }
          case "$HEPTA_IBAPI_SDK_URL" in
            https://*) ;;
            *) echo "HEPTA_IBAPI_SDK_URL must use HTTPS" >&2; exit 1 ;;
          esac
          [[ "$HEPTA_IBAPI_SDK_SHA256" =~ ^[0-9A-Fa-f]{64}$ ]] || {
            echo "HEPTA_IBAPI_SDK_SHA256 must be exactly 64 hexadecimal characters" >&2
            exit 1
          }

      - name: Fetch and verify pinned IB C++ SDK
        shell: bash
        env:
          HEPTA_IBAPI_SDK_URL: ${{ secrets.HEPTA_IBAPI_SDK_URL }}
        run: |
          archive="$RUNNER_TEMP/hepta-ibapi-sdk.zip"
          sdk_dir="$RUNNER_TEMP/hepta-ibapi-sdk"
          # The URL is a masked Actions secret. Keep it in the environment and
          # never print it or enable shell tracing.
          curl --silent --show-error --fail --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            --output "$archive" "$HEPTA_IBAPI_SDK_URL"
          printf '%s  %s\n' "$HEPTA_IBAPI_SDK_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$sdk_dir"
          unzip -q "$archive" -d "$sdk_dir"

          mapfile -t sdk_roots < <(
            find "$sdk_dir" -type f -name EClientSocket.cpp -printf '%h\n'
          )
          if (( ${#sdk_roots[@]} != 1 )); then
            echo "Expected exactly one CppClient source root; found ${#sdk_roots[@]}" >&2
            exit 1
          fi
          printf 'IBAPI_ROOT=%s\n' "${sdk_roots[0]}" >> "$GITHUB_ENV"

      - name: Configure real IB-on Release target
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cmake -S . -B "$HEPTA_REPOSITORY_IB_ON_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DHEPTA_ENABLE_IBAPI=ON \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF \
            -DIBAPI_ROOT="$IBAPI_ROOT"

      - name: Compile real IB closure and offline test graph
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cmake --build "$HEPTA_REPOSITORY_IB_ON_BUILD" \
            --target hepta_agent_os_test_binaries \
            --parallel 2

      - name: Validate exact real-IB repository CTest inventory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/check_heptatrader_ctest_inventory.py \
            --build-dir "$HEPTA_REPOSITORY_IB_ON_BUILD"

      - name: Run targeted real-IB runtime and security tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ctest --test-dir "$HEPTA_REPOSITORY_IB_ON_BUILD" \
            --output-on-failure \
            --parallel 2 \
            --tests-regex '^hepta_(ib_order_lifecycle_tests|ib_authoritative_event_queue_tests|ib_paper_execution_profile_tests|ib_paper_execution_runtime_config_tests|ib_paper_execution_runtime_composition_tests|ib_paper_execution_process_e2e_tests|ib_paper_agent_tool_e2e_tests|ib_paper_kill_switch_tests|ib_authoritative_order_projector_tests|ib_authoritative_account_position_consumer_tests|ib_authoritative_open_order_consumer_tests|ib_authoritative_quote_subscription_set_tests|ib_authoritative_recovery_coordinator_tests|ib_authoritative_recovery_event_consumer_tests|ib_connection_lifecycle_state_machine_tests|broker_network_policy_gate|no_direct_broker_paths_gate|tool_gateway_forbidden_symbols_tests|tool_gateway_runtime_composition_tests)$'

      - name: Verify broker symbols and runtime linkage
        shell: bash
        run: |
          binary="$HEPTA_REPOSITORY_IB_ON_BUILD/bin/Release/hepta-ib-executiond"
          test -x "$binary"

          nm -C --defined-only "$binary" > "$RUNNER_TEMP/hepta-ibapi-symbols.txt"
          grep -Fq 'EClientSocket::' "$RUNNER_TEMP/hepta-ibapi-symbols.txt" || {
            echo "IB SDK symbols are absent; refusing a stub binary" >&2
            exit 1
          }
          if readelf -d "$binary" | grep -Eq '(RPATH|RUNPATH)'; then
            echo "Unexpected RPATH/RUNPATH in IB execution daemon" >&2
            exit 1
          fi
          if ldd "$binary" | grep -Fq 'not found'; then
            echo "Unresolved runtime dependency in IB execution daemon" >&2
            ldd "$binary" >&2
            exit 1
          fi

      - name: Validate full IB-on execution install component
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tests/check_hepta_execution_install_tree.py \
            --build-dir "$HEPTA_REPOSITORY_IB_ON_BUILD" \
            --ibapi-enabled

      - name: Build and verify no-Git Agent-OS source for IB-on
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version=0.1.0-beta.1-round122
          stage="$(mktemp -d)"
          echo "HEPTA_IB_NOGIT_STAGE=$stage" >> "$GITHUB_ENV"
          python3 scripts/build_heptatrader_clean_source_bundle.py \
            --root . \
            --version "$version" \
            --output "$stage/strict-source.tar" \
            --manifest "$stage/strict-source-manifest.json"
          python3 scripts/verify_heptatrader_clean_source_bundle.py \
            --bundle "$stage/strict-source.tar" \
            --manifest "$stage/strict-source-manifest.json"
          python3 scripts/build_heptatrader_agent_os_source_bundle.py \
            --strict-source-tar "$stage/strict-source.tar" \
            --strict-source-manifest "$stage/strict-source-manifest.json" \
            --version "$version" \
            --output "$stage/agent-os-source.tar" \
            --manifest "$stage/agent-os-source-manifest.json"
          python3 scripts/verify_heptatrader_agent_os_source_bundle.py \
            --bundle "$stage/agent-os-source.tar" \
            --manifest "$stage/agent-os-source-manifest.json" \
            --strict-source-tar "$stage/strict-source.tar" \
            --strict-source-manifest "$stage/strict-source-manifest.json"
          mkdir "$stage/extracted"
          tar --same-permissions -xf \
            "$stage/agent-os-source.tar" -C "$stage/extracted"
          test ! -e \
            "$stage/extracted/heptatrader-agent-os-$version/.git"

      - name: Configure no-Git real IB-on Release target
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version=0.1.0-beta.1-round122
          cmake \
            -S "$HEPTA_IB_NOGIT_STAGE/extracted/heptatrader-agent-os-$version" \
            -B "$HEPTA_AGENT_NOGIT_IB_ON_BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DHEPTA_ENABLE_IBAPI=ON \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF \
            -DIBAPI_ROOT="$IBAPI_ROOT"

      - name: Build and smoke-test no-Git real IB-on source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version=0.1.0-beta.1-round122
          source="$HEPTA_IB_NOGIT_STAGE/extracted/heptatrader-agent-os-$version"
          build="$HEPTA_AGENT_NOGIT_IB_ON_BUILD"
          cmake --build "$build" \
            --target hepta_agent_os_test_binaries --parallel 2
          python3 "$source/scripts/check_heptatrader_ctest_inventory.py" \
            --build-dir "$build"
          python3 "$source/tests/check_hepta_execution_install_tree.py" \
            --build-dir "$build" --ibapi-enabled
          binary="$build/bin/Release/hepta-ib-executiond"
          test -x "$binary"
          nm -C --defined-only "$binary" |
            grep -Fq 'EClientSocket::' || {
              echo "IB SDK symbols are absent from no-Git binary" >&2
              exit 1
            }

  # The historical OpenClaw/OOS script forest is maintained on the private
  # research lineage. Product CI intentionally exercises only versioned,
  # archive-reproducible Agent-OS contracts.
  agent-os-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate versioned Agent-OS source contracts
        shell: bash
        run: |
          python3 tests/heptatrader_agent_os_source_bundle_tests.py
          python3 tests/heptatrader_ctest_inventory_tests.py

  nightly-native-sanitizers:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan
            flags: -O1 -g -fno-omit-frame-pointer -fsanitize=address
          - sanitizer: ubsan
            flags: -O1 -g -fno-omit-frame-pointer -fsanitize=undefined
          - sanitizer: tsan
            flags: -O1 -g -fno-omit-frame-pointer -fsanitize=thread

    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
      CXXFLAGS: ${{ matrix.flags }}
      LDFLAGS: ${{ matrix.flags }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build strict no-Git sanitizer source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version=0.1.0-beta.1-round122
          stage="$RUNNER_TEMP/heptatrader-${{ matrix.sanitizer }}-source"
          artifact_root="$RUNNER_TEMP/heptatrader-${{ matrix.sanitizer }}-evidence"
          build="$RUNNER_TEMP/heptatrader-${{ matrix.sanitizer }}-build"
          tool_root="$RUNNER_TEMP/heptatrader-${{ matrix.sanitizer }}-tools"
          cmake_version="$(
            cmake --version |
              sed -n '1s/^cmake version \([0-9]*\.[0-9]*\).*/\1/p'
          )"
          ctest_version="$(
            ctest --version |
              sed -n '1s/^ctest version \([0-9]*\.[0-9]*\).*/\1/p'
          )"
          test -n "$cmake_version"
          test "$ctest_version" = "$cmake_version"
          install -d -m 700 \
            "$stage" "$artifact_root" "$tool_root/bin" \
            "$tool_root/share/cmake-$cmake_version/Modules"
          install -m 700 "$(command -v ctest)" "$tool_root/bin/ctest"
          install -m 600 /dev/null \
            "$tool_root/share/cmake-$cmake_version/Modules/CMake.cmake"
          python3 scripts/build_heptatrader_clean_source_bundle.py \
            --root . \
            --version "$version" \
            --output "$stage/strict-source.tar" \
            --manifest "$stage/strict-source-manifest.json"
          python3 scripts/verify_heptatrader_clean_source_bundle.py \
            --bundle "$stage/strict-source.tar" \
            --manifest "$stage/strict-source-manifest.json"
          install -d -m 700 "$stage/extracted"
          tar --same-permissions -xf \
            "$stage/strict-source.tar" -C "$stage/extracted"
          source="$stage/extracted/heptatrader-$version"
          test ! -e "$source/.git"
          {
            echo "HEPTA_SANITIZER_ARTIFACT_ROOT=$artifact_root"
            echo "HEPTA_SANITIZER_BUILD=$build"
            echo "HEPTA_SANITIZER_CTEST=$tool_root/bin/ctest"
            echo "HEPTA_SANITIZER_SOURCE=$source"
            echo "HEPTA_SANITIZER_SOURCE_MANIFEST=$stage/strict-source-manifest.json"
          } >> "$GITHUB_ENV"

      - name: Configure ${{ matrix.sanitizer }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cmake -S "$HEPTA_SANITIZER_SOURCE" -B "$HEPTA_SANITIZER_BUILD" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CTEST_COMMAND="$HEPTA_SANITIZER_CTEST" \
            -DBUILD_TESTING=ON \
            -DHEPTA_SOAK_PROFILE=nightly \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF

      - name: Validate private CTest inventory path
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$HEPTA_SANITIZER_CTEST" \
            --test-dir "$HEPTA_SANITIZER_BUILD" \
            --show-only=json-v1 \
            -E '(^|_)(baseline|fixture|guard|selftest|static_gate|source_gate)($|_)' \
            > /dev/null

      - name: Build ${{ matrix.sanitizer }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cmake --build "$HEPTA_SANITIZER_BUILD" \
            --target hepta_agent_os_test_binaries \
            --parallel 2

      - name: Run and seal ${{ matrix.sanitizer }} suite
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          runner=(
            python3
            "$HEPTA_SANITIZER_SOURCE/scripts/run_heptatrader_ctest_evidence.py"
            --label "${{ matrix.sanitizer }}"
            --expected-count 104
            --build-dir "$HEPTA_SANITIZER_BUILD"
            --artifact-root "$HEPTA_SANITIZER_ARTIFACT_ROOT"
            --stdout "${{ matrix.sanitizer }}.stdout.txt"
            --inventory "${{ matrix.sanitizer }}.inventory.json"
            --sidecar "${{ matrix.sanitizer }}.sidecar.json"
            --cache-output "${{ matrix.sanitizer }}.CMakeCache.txt"
            --source-manifest "$HEPTA_SANITIZER_SOURCE_MANIFEST"
            --source-manifest-output
              "${{ matrix.sanitizer }}.source-manifest.json"
          )
          if [[ "${{ matrix.sanitizer }}" == tsan ]]; then
            setarch "$(uname -m)" -R "${runner[@]}"
          else
            "${runner[@]}"
          fi

      - name: Upload sealed ${{ matrix.sanitizer }} evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heptatrader-${{ matrix.sanitizer }}-sealed-evidence
          path: ${{ runner.temp }}/heptatrader-${{ matrix.sanitizer }}-evidence
          if-no-files-found: error
          retention-days: 30

  nightly-native-coverage:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, x64, heptatrader-coverage-v1]
    timeout-minutes: 35
    env:
      CXXFLAGS: -O0 -g --coverage
      HEPTA_COVERAGE_PYTHON: /opt/heptatrader/coverage-v1/bin/python
      LDFLAGS: --coverage

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preflight controlled coverage toolchain
        shell: bash
        run: >-
          "$HEPTA_COVERAGE_PYTHON"
          scripts/build_heptatrader_verification_evidence.py
          --kind coverage-toolchain
          --coverage-policy policies/heptatrader-code-quality-v1.json

      - name: Build strict no-Git coverage source
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          version=0.1.0-beta.1-round122
          stage="$RUNNER_TEMP/heptatrader-coverage-source"
          artifact_root="$RUNNER_TEMP/heptatrader-coverage-evidence"
          build="$RUNNER_TEMP/heptatrader-coverage-build"
          tool_root="$RUNNER_TEMP/heptatrader-coverage-tools"
          cmake_version="$(
            cmake --version |
              sed -n '1s/^cmake version \([0-9]*\.[0-9]*\).*/\1/p'
          )"
          ctest_version="$(
            ctest --version |
              sed -n '1s/^ctest version \([0-9]*\.[0-9]*\).*/\1/p'
          )"
          test -n "$cmake_version"
          test "$ctest_version" = "$cmake_version"
          install -d -m 700 \
            "$stage" "$artifact_root" "$tool_root/bin" \
            "$tool_root/share/cmake-$cmake_version/Modules"
          install -m 700 "$(command -v ctest)" "$tool_root/bin/ctest"
          install -m 600 /dev/null \
            "$tool_root/share/cmake-$cmake_version/Modules/CMake.cmake"
          "$HEPTA_COVERAGE_PYTHON" \
            scripts/build_heptatrader_clean_source_bundle.py \
            --root . \
            --version "$version" \
            --output "$stage/strict-source.tar" \
            --manifest "$stage/strict-source-manifest.json"
          "$HEPTA_COVERAGE_PYTHON" \
            scripts/verify_heptatrader_clean_source_bundle.py \
            --bundle "$stage/strict-source.tar" \
            --manifest "$stage/strict-source-manifest.json"
          install -d -m 700 "$stage/extracted"
          tar --same-permissions -xf \
            "$stage/strict-source.tar" -C "$stage/extracted"
          source="$stage/extracted/heptatrader-$version"
          test ! -e "$source/.git"
          {
            echo "HEPTA_COVERAGE_ARTIFACT_ROOT=$artifact_root"
            echo "HEPTA_COVERAGE_BUILD=$build"
            echo "HEPTA_COVERAGE_CTEST=$tool_root/bin/ctest"
            echo "HEPTA_COVERAGE_SOURCE=$source"
            echo "HEPTA_COVERAGE_SOURCE_MANIFEST=$stage/strict-source-manifest.json"
          } >> "$GITHUB_ENV"

      - name: Configure coverage build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cmake -S "$HEPTA_COVERAGE_SOURCE" -B "$HEPTA_COVERAGE_BUILD" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_CTEST_COMMAND="$HEPTA_COVERAGE_CTEST" \
            -DBUILD_TESTING=ON \
            -DHEPTA_SOAK_PROFILE=nightly \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF

      - name: Validate private CTest inventory path
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$HEPTA_COVERAGE_CTEST" \
            --test-dir "$HEPTA_COVERAGE_BUILD" \
            --show-only=json-v1 \
            -E '(^|_)(baseline|fixture|guard|selftest|static_gate|source_gate)($|_)' \
            > /dev/null

      - name: Build coverage suite
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cmake --build "$HEPTA_COVERAGE_BUILD" \
            --target hepta_agent_os_test_binaries \
            --parallel 2

      - name: Run and seal coverage evidence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$HEPTA_COVERAGE_PYTHON" \
            "$HEPTA_COVERAGE_SOURCE/scripts/run_heptatrader_coverage_evidence.py" \
            --build-dir "$HEPTA_COVERAGE_BUILD" \
            --strict-source-manifest "$HEPTA_COVERAGE_SOURCE_MANIFEST" \
            --artifact-root "$HEPTA_COVERAGE_ARTIFACT_ROOT" \
            --stdout coverage.stdout.txt \
            --inventory coverage.inventory.json \
            --coverage-stdout coverage.gcovr.stdout.txt \
            --coverage-xml coverage.xml \
            --cache-output coverage.CMakeCache.txt \
            --source-manifest-output coverage.source-manifest.json \
            --policy-output coverage.policy.json \
            --raw-manifest coverage.raw-manifest.json \
            --raw-archive coverage.raw-archive.tar \
            --sidecar coverage.sidecar.json
          minimum_line_rate="$(
            "$HEPTA_COVERAGE_PYTHON" -c \
              'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["coverage"]["line_minimum_percent"] / 100)' \
              "$HEPTA_COVERAGE_SOURCE/policies/heptatrader-code-quality-v1.json"
          )"
          "$HEPTA_COVERAGE_PYTHON" \
            "$HEPTA_COVERAGE_SOURCE/scripts/build_heptatrader_verification_evidence.py" \
            --kind coverage \
            --artifact-root "$HEPTA_COVERAGE_ARTIFACT_ROOT" \
            --coverage-sidecar coverage.sidecar.json \
            --minimum-line-rate "$minimum_line_rate" \
            --output coverage.verification-report.json

      - name: Upload sealed coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heptatrader-coverage-sealed-evidence
          path: ${{ runner.temp }}/heptatrader-coverage-evidence
          if-no-files-found: error
          retention-days: 30
