Verification: `python3 research/run_protocol.py verify --manifest research/manifest-v1.json`

The active research path contains exactly three canonical objects:

1. **RunManifest** — immutable source, strategy/config/data digests, calendar,
   session semantics, folds, costs, capacity and numeric policy.
2. **EventLog** — append-only, hash-chained normalized quotes, targets and fills.
3. **RunSummary** — performance/cost/turnover/drawdown values plus deterministic
   manifest, event-log and output digests.

Changed data at one authoritative timestamp, out-of-order input, look-ahead,
stale quote, insufficient purge/embargo, missing economic assumptions and
capacity excess fail with stable codes. Financial fixture arithmetic uses
`Decimal`; identical source, manifest, input bytes and seed reproduce the same
summary digest. Adverse-cost and capacity tests execute in the normal Python
lane.

Research is capability-free. It has no session token, broker secret, preview
permit, campaign/finalizer, PAPER/LIVE promotion or mutation API. A successful
SHADOW/replay result remains untrusted input to a separate reviewed runtime
change.
'''
          (ROOT / "docs/RESEARCH-PROTOCOL.md").write_text(
              research_doc, encoding="utf-8")

          strategy_doc = '''# Strategy validation plan

Status: current
Applies to: every research strategy and `heptatrader.run-summary.v1` output
Verification: `python3 -m unittest tests.python.test_research_protocol`

Validation is executable. Each run binds point-in-time data bytes and SHA-256,
UTC calendar/session/symbol mapping, feature and label horizons, purged
walk-forward folds, embargo, search budget, commission, spread, slippage,
decision delay, impact and capacity. A final OOS segment must remain untouched
by selection.

The normal lane tests deterministic output, changed duplicate timestamps,
look-ahead rejection, purge/embargo boundaries, adverse costs and capacity.
Scheduled reliability runs crash/replay, malformed protocol inputs, ASAN/UBSAN
and the same-fixture p99 budget. Strategy-specific runs must additionally report
net return, volatility, risk-adjusted return, drawdown/duration, turnover, trade
count, exposure, tail loss, cost share, capacity, time-in-market, regimes,
worst slice and PnL concentration.

R0 fixture, R1 historical replay and R2 live SHADOW grant no mutation
capability. R3 IB PAPER requires a separate reviewed host/config/risk change.
R4 LIVE is unsupported.
'''
          (ROOT / "docs/STRATEGY-VALIDATION-PLAN.md").write_text(
              strategy_doc, encoding="utf-8")

          intent_doc = '''# Agent target-position intent contract

Status: current
Applies to: Tool Registry, decision snapshot codec, Execution preview permits and Agent clients
Verification: `ctest --test-dir build/core-release -R 'target_position|preview_permit' --output-on-failure`

Ordinary Agent profiles expose `decision.get_snapshot`,
`intent.preview_target_position` and `intent.apply_target_position`. Raw
`risk.preview_order` and `trade.place_order` require separately provisioned
`operator.risk.preview` and `operator.trade.place` capabilities and are absent
from ordinary Agent examples.

The target preview collects health before/after plus quote, account, positions,
orders and risk limits. It accepts the snapshot only when Execution service
epoch, fencing generation and event watermark remain unchanged and every
component is authoritative. JSON decoding is bounded, order-independent and
rejects duplicate keys/positions; the decision object itself is typed.

Execution derives side, quantity, reference price and bounded LMT price. It
issues its existing random opaque single-use raw permit. Gateway wraps that in
a separate random target permit bound to owner, mutation command ID, request,
expiry, typed snapshot and exact plan. Apply atomically consumes the target
permit, recollects authoritative state, rejects any identity/generation/quote/
position or plan change, and then dispatches the exact Execution permit. A
failed or mismatched consume cannot be retried with the consumed token; an exact
durable execution retry is the only permit bypass.

Wire compatibility currently maps signed `target_position` to the typed tool
`quantity` field and `max_slippage_bps` to `reference_price`; the canonical
mapping is generated in `schemas/tool-catalog-v1.json`.
'''
          (ROOT / "docs/development/AGENT-INTENT-CONTRACT.md").write_text(
              intent_doc, encoding="utf-8")

          test_doc = '''# Test strategy

Status: current
Applies to: `tests/`, `tests/python/`, core and reliability GitHub Actions
Verification: `./scripts/dev_core.sh && CXX=g++ ./scripts/reliability_core.sh`

The exact tree under review must pass repository, schema, module, research,
build, CTest, Python and install-tree checks. Release tests explicitly undefine
`NDEBUG`; assertions cannot silently disappear.

The fast read-only PR lane covers documentation/config truth, unsupported venue
negatives, shared risk, fixed-point portfolio netting, typed snapshot, target
preview/apply, opaque permit lifecycle, OMS durability/replay, session/fencing,
Tool Gateway, deterministic Simulator end to end, schema drift and minimal
install contents.

The scheduled/manual read-only reliability lane runs GCC and Clang ASAN/UBSAN,
process-crash OMS replay, 20,000 bounded malformed typed requests and the same
risk fixture against a p99 baseline with a 20% regression budget. It is
separate from ordinary iteration but is required evidence for this closure.

No test, workflow or research artifact can approve, merge, grant PAPER/LIVE
capability or replace authoritative broker reconciliation.
'''
          (ROOT / "docs/development/TEST-STRATEGY.md").write_text(
              test_doc, encoding="utf-8")

          iteration_doc = '''# Development iteration

Status: current
Applies to: local development and read-only CI
Verification: commands below

Run the deterministic fast lane:

```bash
./scripts/dev_core.sh
```

Run sanitizer, crash/replay, malformed protocol and performance fixtures:

```bash
CXX=g++ ./scripts/reliability_core.sh
CXX=clang++ ./scripts/reliability_core.sh
```

Verify a staged minimal install:

```bash
stage=$(mktemp -d)
DESTDIR="$stage" cmake --install build/core-release --component runtime
python3 scripts/check_install_tree.py "$stage"
```

A change is complete only when implementation, negative tests, current docs and
same-head read-only CI agree. No round, finalizer, self-approval or self-merge
workflow is part of iteration.
'''
          (ROOT / "docs/ITERATION.md").write_text(
              iteration_doc, encoding="utf-8")

          closure_report = '''# Canonical gap closure report

Status: closed
Applies to: `docs/development/PLAN.md` gaps G-001 through G-016
Verification: `python3 scripts/check_gap_closure.py`

| Gap | Closure evidence |
|---|---|
| G-001 | Canonical README/docs plus repository and gap integrity checks |
| G-002 | Historical source under `legacy/`; active CMake has no legacy dependency |
| G-003 | Typed CTP/XT fail-closed adapters and negative tests |
| G-004 | `sim`/`paper` resolver tests; Registry accepts WATCH/PAPER only; LIVE unsupported |
| G-005 | Shared risk policy, fail-closed freshness/completeness and authoritative wiring |
| G-006 | Ordinary Agent target-position tools; raw placement operator-only |
| G-007 | Bounded typed snapshot with epoch/fence/watermark and duplicate-state negatives |
| G-008 | Random opaque permit, expiry, owner/command/payload binding, atomic consume/revoke/replay tests |
| G-009 | Executable RunManifest/EventLog/RunSummary without campaign/finalizer authority |
| G-010 | Point-in-time, deterministic, purged walk-forward, cost and capacity tests |
| G-011 | Fixed-point cross-strategy netting and capital budget compiler/tests |
| G-012 | Bounded runtime counters/gauges/latencies and metrics snapshot tool |
| G-013 | Generated tool catalog, cross-language discovery and drift tests |
| G-014 | Machine ownership map, non-growth budgets and targeted module extraction |
| G-015 | Read-only fast CI plus GCC/Clang ASAN/UBSAN, crash, fuzz and p99 lanes |
| G-016 | Minimal staged install checker; no legacy, LIVE, CTP/XT or IB binary in core component |

This closes the repository's canonical development gaps. IB PAPER remains
experimental pending its external SDK/host campaign, and LIVE remains
unsupported. Closure is not a trading-performance claim or production approval.
'''
          (ROOT / "docs/development/GAP-CLOSURE-REPORT.md").write_text(
              closure_report, encoding="utf-8")

          plan_path = ROOT / "docs/development/PLAN.md"
          plan = plan_path.read_text(encoding="utf-8-sig")
          lines = []
          for line in plan.splitlines():
              if line.startswith("| G-"):
                  fields = line.split("|")
                  fields[-2] = " closed "
                  line = "|".join(fields)
              lines.append(line)
          plan = "\n".join(lines).rstrip() + "\n"
          if "## 10. Closure evidence" not in plan:
              plan += '''
## 10. Closure evidence

All G-001 through G-016 rows are closed by implementation, negative tests,
current documentation and executable repository checks in this same tree.
The authoritative commands are:

```bash
python3 scripts/check_gap_closure.py
./scripts/dev_core.sh
CXX=g++ ./scripts/reliability_core.sh
```

IB PAPER remains explicitly experimental and LIVE remains unsupported; those
capability limits are product truth, not open repository gaps.
'''
          plan_path.write_text(plan, encoding="utf-8")

          status = {
              "schema": "heptatrader.gap-closure-status.v1",
              "status": "closed",
              "gaps": {f"G-{index:03d}": "closed" for index in range(1, 17)},
              "verification": [
                  "python3 scripts/check_gap_closure.py",
                  "./scripts/dev_core.sh",
                  "CXX=g++ ./scripts/reliability_core.sh",
                  "staged runtime install smoke",
              ],
              "capability_limits": {
                  "ib_paper": "experimental_external_host_required",
                  "live": "unsupported",
                  "ctp": "unsupported_fail_closed",
                  "xt_qmt": "unsupported_fail_closed",
              },
          }
          selected = [
              "HeptaTrade/intent/authoritative_decision_snapshot.cpp",
              "HeptaTrade/tools/trading_tool_registry.cpp",
              "HeptaTrade/portfolio/portfolio_compiler.cpp",
              "HeptaTrade/observability/runtime_telemetry.cpp",
              "research/run_protocol.py",
              "schemas/tool-catalog-v1.json",
          ]
          digest = hashlib.sha256()
          for relative in selected:
              digest.update(relative.encode("utf-8"))
              digest.update(b"\0")
              digest.update((ROOT / relative).read_bytes())
              digest.update(b"\0")
          status["closure_evidence_sha256"] = "sha256:" + digest.hexdigest()
          (ROOT / "docs/development/CLOSURE-STATUS.json").write_text(
              json.dumps(status, sort_keys=True, indent=2) + "\n",
              encoding="utf-8")

          # Integrate the closure checker into both exact local and CI paths.
          dev_core = ROOT / "scripts/dev_core.sh"
          text = dev_core.read_text(encoding="utf-8")
          marker = 'python3 "${ROOT_DIR}/scripts/check_module_discipline.py"\n'
          addition = marker + 'python3 "${ROOT_DIR}/scripts/check_gap_closure.py"\n'
          if "check_gap_closure.py" not in text:
              if marker not in text:
                  raise RuntimeError("dev_core module check marker missing")
              text = text.replace(marker, addition, 1)
          dev_core.write_text(text, encoding="utf-8")

          core_ci = ROOT / ".github/workflows/core-ci.yml"
          text = core_ci.read_text(encoding="utf-8")
          if "scripts/check_gap_closure.py" not in text:
              text = text.replace(
                  "            scripts/check_module_discipline.py \\\n",
                  "            scripts/check_module_discipline.py \\\n"
                  "            scripts/check_gap_closure.py \\\n", 1)
              text = text.replace(
                  "          python3 scripts/check_module_discipline.py\n",
                  "          python3 scripts/check_module_discipline.py\n"
                  "          python3 scripts/check_gap_closure.py\n", 1)
          core_ci.write_text(text, encoding="utf-8")

          # Ensure new current docs are installed with the runtime docs.
          runtime_install = ROOT / "cmake/RuntimeInstall.cmake"
          text = runtime_install.read_text(encoding="utf-8")
          if "GAP-CLOSURE-REPORT.md" not in text:
              marker = '''        "${CMAKE_SOURCE_DIR}/docs/development/TEST-STRATEGY.md"
    DESTINATION "${CMAKE_INSTALL_DOCDIR}/development"'''
              replacement = '''        "${CMAKE_SOURCE_DIR}/docs/development/TEST-STRATEGY.md"
        "${CMAKE_SOURCE_DIR}/docs/development/MODULE-OWNERSHIP.md"
        "${CMAKE_SOURCE_DIR}/docs/development/GAP-CLOSURE-REPORT.md"
        "${CMAKE_SOURCE_DIR}/docs/development/CLOSURE-STATUS.json"
        "${CMAKE_SOURCE_DIR}/docs/development/module-ownership-v1.json"
    DESTINATION "${CMAKE_INSTALL_DOCDIR}/development"'''
              if marker in text:
                  text = text.replace(marker, replacement, 1)
          runtime_install.write_text(text, encoding="utf-8")

          # The exact tree under test contains no temporary mutating workflow.
          for path in (ROOT / ".github/workflows").glob("dev-*.yml"):
              path.unlink()
          PY
      - name: Verify all sixteen closures on a clean exact tree
        env:
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: "2"
        run: |
          rm -rf build/core-release build/reliability-*
          python3 scripts/generate_tool_catalog.py --check
          python3 scripts/check_repository_integrity.py
          python3 scripts/check_schema_catalog.py
          python3 scripts/check_module_discipline.py
          python3 scripts/check_gap_closure.py
          python3 research/run_protocol.py verify --manifest research/manifest-v1.json
          ./scripts/dev_core.sh
          stage="$RUNNER_TEMP/heptatrader-runtime"
          DESTDIR="$stage" cmake --install build/core-release --component runtime
          python3 scripts/check_install_tree.py "$stage"
          CXX=g++ ./scripts/reliability_core.sh
      - name: Commit the exact verified closure tree
        run: |
          git config user.name "Tomasrgbsf"
          git config user.email "tomasbraynt@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m "feat: close all canonical HeptaTrader gaps"
          git push origin HEAD:codex/heptatrader-gap-closure-v2
