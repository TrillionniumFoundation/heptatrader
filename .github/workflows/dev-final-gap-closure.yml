          readme = '''# HeptaTrader

HeptaTrader is a **model-agnostic deterministic trading control and execution
runtime for AI agents**, plus a capability-free reproducible quantitative
research plane. Models are replaceable clients. They never own broker
credentials, authoritative portfolio state, final risk decisions, OMS state or
venue sessions.

## Capability truth

| Capability | State |
|---|---|
| Typed Tool Gateway, native client and MCP discovery | Implemented |
| Session, peer-UID, capability, framing and fencing enforcement | Implemented |
| Generation-consistent decision snapshot | Implemented |
| Target-position preview/apply with opaque single-use permit | Implemented |
| Raw order preview/place | Operator-only; absent from ordinary Agent profiles |
| Deterministic Simulator, OMS replay and safe exits | Implemented |
| Shared deterministic risk and fixed-point portfolio compiler | Implemented |
| Bounded counters, gauges and transition latencies | Implemented |
| RunManifest → EventLog → RunSummary research protocol | Implemented for SHADOW/replay |
| IB PAPER | Experimental; requires separately pinned SDK and reviewed host configuration |
| CTP and XT/QMT transport | Unsupported and fail-closed |
| LIVE mutation | Unsupported |

The canonical capability matrix is
[`docs/CAPABILITY-MATRIX.md`](docs/CAPABILITY-MATRIX.md). The gap registry is
[`docs/development/PLAN.md`](docs/development/PLAN.md); all sixteen repository
implementation gaps are closed on this candidate branch and are continuously
checked by `scripts/check_gap_closure.py`.

## Authority boundary

```text
Agent / operator
    -> bounded MCP/native tools
    -> Tool Gateway (identity, session, capability, schema, queue bounds)
    -> Execution Service (authoritative state, risk, permits, OMS, reconciliation)
    -> Simulator or explicitly provisioned PAPER adapter
```

Only Execution Service performs venue mutation. Every new mutation is durably
journaled before send. Unknown identity, quote, state, generation, persistence
or reconciliation fails closed. Exact retries reuse the same command ID and
normalized payload. Safe cancel, strict reduction and authoritative flatten
remain available whenever their safety can be proved.

## Verification

```bash
./scripts/dev_core.sh
CXX=g++ ./scripts/reliability_core.sh
cmake --install build/core-release --component runtime
python3 scripts/check_install_tree.py <DESTDIR>
```

The normal and scheduled GitHub Actions workflows are read-only. They contain no
self-approval, self-merge, release-round, finalizer or evidence-closure authority.

## Repository map

```text
HeptaTrade/   active deterministic Gateway, Execution, OMS, risk, state and adapters
adapters/     unprivileged MCP adapter
portfolio/    represented by HeptaTrade/portfolio fixed-point compiler
research/     executable capability-free run protocol and manifest
schemas/      mechanically checked protocol/tool catalogs
scripts/      bounded development, validation and runtime utilities
tests/        unit, integration, failure, crash, fuzz and performance fixtures
docs/         current contracts, proposals and historical documentation
legacy/       inactive historical source; active targets may not depend on it
```
'''
