          risk_doc = '''# Deterministic risk model

Status: current
Applies to: `HeptaTrade/risk/`, `HeptaTrade/portfolio/`, Simulator and IB PAPER policy authorities
Verification: `ctest --test-dir build/core-release -R 'risk|portfolio' --output-on-failure`

`DeterministicRiskPolicy` is the common venue-independent pre-trade authority.
A venue may add stricter contract, tick, session, quote-generation or transport
rules; it may never bypass or weaken the common result.

Every evaluation receives finite quantity/price/projection fields plus explicit
`quoteFresh` and `portfolioSnapshotComplete` values. Both booleans default to
false. Missing quote, snapshot, generation, PnL, position or projection input
therefore fails closed instead of inheriting an optimistic default.

The policy covers order quantity/notional, rolling attempts, active orders,
gross/net position, strategy gross budget, daily loss, drawdown, quote freshness,
snapshot completeness, price deviation and strict no-cross-zero reduction. Safe
exit exemptions require a mathematically verified exact gross reduction.

`PortfolioCompiler` uses signed 64-bit fixed-point microunits. It binds every
strategy target to the same authoritative generation, rejects duplicate
strategy/instrument intents, performs overflow-safe cross-strategy netting,
enforces per-strategy and portfolio budgets and emits deterministic deltas from
a complete authoritative position snapshot. Venue-specific conversion from
quantity, multiplier, currency and FX is an explicit boundary step; no silent
floating-point currency aggregation is performed by the compiler.
'''
          (ROOT / "docs/RISK-MODEL.md").write_text(risk_doc, encoding="utf-8")

          portfolio_doc = '''# Portfolio and capital authority

Status: current
Applies to: `HeptaTrade/portfolio/portfolio_compiler.*`, target-position intents and risk policy
Verification: `ctest --test-dir build/core-release -R hepta_portfolio_compiler_tests --output-on-failure`

Strategy clients submit desired positions, not independent broker orders. Each
`StrategyTargetIntent` identifies strategy, instrument, exact fixed-point target
and authoritative snapshot generation. `PortfolioCompiler` sorts the input,
rejects duplicates and generation mismatch, applies strategy budgets, nets
opposing targets by instrument and applies a global gross capital budget.

All compiler arithmetic is checked signed 64-bit microunits. Overflow,
`INT64_MIN` absolute value, missing budget, incomplete state, too many strategies
or instruments and changed generation are stable fail-closed outcomes. The
output contains net targets, strategy gross usage, portfolio gross usage and the
exact delta from authoritative current positions.

The compiler is deterministic policy, not venue authority. Execution Service
still obtains quotes/contracts, runs the shared risk policy, issues the opaque
permit, journals the command and owns the venue session.
'''
