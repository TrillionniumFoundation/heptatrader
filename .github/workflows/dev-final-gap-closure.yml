          observability_doc = '''# Runtime observability and SLO contract

Status: current
Applies to: Gateway, Execution Service, OMS, risk, Simulator and IB PAPER
Verification: `ctest --test-dir build/core-release -R hepta_runtime_telemetry_tests --output-on-failure`

The runtime records bounded process-local counters, gauges and fixed-bucket
latency histograms. Label values are allow-listed/sanitized; unsafe or unbounded
values are represented by a stable hash. Account secrets, credentials, tokens,
raw prompts and free-form broker text are never labels. A hard series limit
prevents cardinality exhaustion.

Implemented counters include tool outcomes, session/capability rejection, risk
decisions, execution command states, OMS failures, venue send attempts,
execution events, reconciliation outcomes, state breaks and kill-switch
transitions. Gauges cover OMS backlog, write failures and poisoned state.
Latency scopes cover tool execution, risk decision, OMS append and replay; the
scheduled same-fixture risk test enforces the documented p99 baseline plus 20%.

Gateway clients with `system.read` may call `system.get_metrics`. Execution,
OMS and risk components use the same in-process snapshot interface, allowing a
service health collector or journal exporter to consume canonical JSON without
adding secret-bearing labels.

P1 conditions remain journal-before-send violation, poisoned journal, open risk
during authoritative state break, unreadable kill switch, accepted stale quote,
fencing mismatch or an unresolved uncertain command beyond its deadline.
Correctness and fail-closed behavior take precedence over latency.
'''
