name: dev-final-gap-closure

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/dev-final-gap-closure.yml

permissions:
  contents: write

jobs:
  close-canonical-registry:
    if: github.repository == 'TrillionniumFoundation/heptatrader' && github.event.head_commit.message == 'chore(dev): launch final canonical gap closure'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Wait for prior verified slices and reset to latest branch
        run: |
          sleep 600
          git fetch origin codex/heptatrader-gap-closure-v2
          git reset --hard origin/codex/heptatrader-gap-closure-v2
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ clang libssl-dev python3
      - name: Recover prerequisites, expose bounded metrics and close documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess

          ROOT = Path.cwd()

          def historical(path: str) -> str:
              commits = subprocess.check_output(
                  ["git", "rev-list", "--all", "--", path], text=True
              ).splitlines()
              for commit in commits:
                  result = subprocess.run(
                      ["git", "show", f"{commit}:{path}"],
                      capture_output=True, text=True
                  )
                  if result.returncode == 0 and result.stdout:
                      return result.stdout
              raise RuntimeError(f"historical file unavailable: {path}")

          def execute(source: str, label: str) -> None:
              marker = "          python3 - <<'PY'\n"
              start = source.find(marker)
              if start < 0:
                  raise RuntimeError(f"embedded program unavailable: {label}")
              start += len(marker)
              end = source.find("\n          PY\n", start)
              if end < 0:
                  raise RuntimeError(f"embedded terminator unavailable: {label}")
              program = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in source[start:end].splitlines()
              )
              exec(compile(program, label, "exec"), {})

          # The immediately preceding fix workflow is the canonical recovery
          # program for every implementation slice. It only runs when its
          # outputs are absent, so a previously verified tree is left intact.
          if not (ROOT / "research/run_protocol.py").exists() or \
             not (ROOT / "tests/portfolio_compiler_tests.cpp").exists() or \
             not (ROOT / "tests/target_position_tool_tests.cpp").exists():
              execute(
                  historical(".github/workflows/dev-research-reliability-fix.yml"),
                  "historical-research-reliability-fix")

          # Expose bounded Gateway-process metrics through the same typed tool
          # boundary. Execution/OMS/risk instrumentation remains process-local
          # and uses the identical bounded snapshot interface.
          registry = ROOT / "HeptaTrade/tools/trading_tool_registry.cpp"
          text = registry.read_text(encoding="utf-8")
          if '#include "../observability/runtime_telemetry.h"' not in text:
              text = text.replace(
                  '#include "../intent/bounded_json.h"',
                  '#include "../intent/bounded_json.h"\n'
                  '#include "../observability/runtime_telemetry.h"', 1)
          if '"system.get_metrics"' not in text:
              marker = '''    RegisterReadTool(
        "decision.get_snapshot",'''
              block = '''    RegisterReadTool(
        "system.get_metrics",
        "Read the bounded process-local runtime metrics snapshot.",
        "system.read", 16000,
        "{\\\"type\\\":\\\"object\\\",\\\"properties\\\":{},"
        "\\\"additionalProperties\\\":false}", ReadHandler());

    RegisterReadTool(
        "decision.get_snapshot",'''
              if marker not in text:
                  raise RuntimeError("decision snapshot registration marker missing")
              text = text.replace(marker, block, 1)
          metrics_dispatch = '''    if (call.name == "system.get_metrics")
    {
        TradingToolResult metrics;
        metrics.status = TradingToolCallStatus::Ok;
        metrics.toolName = call.name;
        metrics.payloadJson = RuntimeTelemetry::Global().SnapshotJson();
        return metrics;
    }
'''
          if metrics_dispatch not in text:
              marker = '''    if (call.name == "decision.get_snapshot")
        return InvokeDecisionSnapshot(session, call);
'''
              if marker not in text:
                  raise RuntimeError("decision snapshot dispatch marker missing")
              text = text.replace(marker, metrics_dispatch + marker, 1)
          registry.write_text(text, encoding="utf-8")
          subprocess.run(
              ["python3", "scripts/generate_tool_catalog.py", "--write"],
              cwd=ROOT, check=True)

          # Machine-checkable closure registry. This script deliberately checks
          # implementation and negative-test evidence rather than trusting prose.
          gap_check = r'''#!/usr/bin/env python3
"""Verify every G-001..G-016 closure condition in the canonical plan."""

from __future__ import annotations

import json
from pathlib import Path
import re
import subprocess
import sys

ROOT = Path(__file__).resolve().parents[1]


def text(path: str) -> str:
    return (ROOT / path).read_text(encoding="utf-8-sig")


def require(errors: list[str], condition: bool, message: str) -> None:
    if not condition:
        errors.append(message)


def main() -> int:
    errors: list[str] = []
    plan = text("docs/development/PLAN.md")
    rows = [line for line in plan.splitlines() if line.startswith("| G-")]
    require(errors, len(rows) == 16, "canonical gap registry must contain 16 gaps")
    for row in rows:
        require(errors, row.rstrip().endswith("| closed |"),
                f"gap is not closed: {row}")

    current_docs = [
        path for path in (ROOT / "docs").rglob("*.md")
        if "legacy" not in path.parts and "proposals" not in path.parts and
           "adr" not in path.parts
    ]
    for path in current_docs:
        body = path.read_text(encoding="utf-8-sig")
        relative = path.relative_to(ROOT)
        require(errors, "Status:" in body, f"{relative}: missing Status metadata")
        require(errors, "Applies to:" in body, f"{relative}: missing Applies to metadata")
        require(errors, "Verification:" in body, f"{relative}: missing Verification metadata")

    # G-001/G-002/G-003/G-004/G-016: repository, legacy, venue, profile and install truth.
    require(errors, "model-agnostic deterministic trading control" in text("README.md"),
            "README product truth missing")
    active_build = "\n".join([
        text("CMakeLists.txt"), text("HeptaTrade/CMakeLists.txt"),
        text("cmake/RuntimeInstall.cmake"), text("tests/CMakeLists.txt"),
    ])
    require(errors, "legacy/" not in active_build, "active build depends on legacy/")
    require(errors, "UNSUPPORTED" in text("HeptaTrade/adapter_ctp/ctp_gateway_adapter.cpp"),
            "CTP adapter is not visibly fail-closed")
    require(errors, "UNSUPPORTED" in text("HeptaTrade/adapter_xt/xt_gateway_adapter.cpp"),
            "XT adapter is not visibly fail-closed")
    require(errors, (ROOT / "tests/unsupported_venue_adapter_tests.cpp").is_file(),
            "unsupported venue negative tests missing")
    resolver = text("scripts/resolve_hepta_config.py")
    require(errors, "sim" in resolver and "paper" in resolver and "live" in resolver,
            "profile resolver truth missing")
    require(errors, (ROOT / "tests/python/test_config_resolver.py").is_file(),
            "profile resolver tests missing")
    require(errors, (ROOT / "scripts/check_install_tree.py").is_file(),
            "install-tree negative checker missing")

    # G-005/G-011: shared risk, authoritative defaults and portfolio compiler.
    risk_header = text("HeptaTrade/risk/deterministic_risk_policy.h")
    require(errors, "bool quoteFresh = false;" in risk_header,
            "risk quote freshness is not fail-closed by default")
    require(errors, "bool portfolioSnapshotComplete = false;" in risk_header,
            "risk snapshot completeness is not fail-closed by default")
    require(errors, "DeterministicRiskPolicy::Evaluate" in
            text("HeptaTrade/execution/execution_service_runtime_composition.cpp"),
            "Simulator does not use common risk policy")
    require(errors, "DeterministicRiskPolicy::Evaluate" in
            text("HeptaTrade/execution/ib_paper_execution_profile.cpp"),
            "IB PAPER does not use common risk policy")
    require(errors, (ROOT / "HeptaTrade/portfolio/portfolio_compiler.cpp").is_file(),
            "portfolio compiler missing")
    require(errors, (ROOT / "tests/portfolio_compiler_tests.cpp").is_file(),
            "portfolio compiler tests missing")

    # G-006/G-007/G-008: Agent intent, typed snapshot and permit lifecycle.
    registry = text("HeptaTrade/tools/trading_tool_registry.cpp")
    for name in ("decision.get_snapshot", "intent.preview_target_position",
                 "intent.apply_target_position"):
        require(errors, f'"{name}"' in registry, f"Agent intent tool missing: {name}")
    require(errors, 'place.requiredCapability = "operator.trade.place";' in registry,
            "raw place is not operator-only")
    require(errors, 'applyTarget.requiredCapability = "intent.apply";' in registry,
            "target apply capability missing")
    require(errors, (ROOT / "HeptaTrade/intent/bounded_json.cpp").is_file(),
            "bounded typed JSON codec missing")
    require(errors, "DECISION_SNAPSHOT_EXECUTION_IDENTITY_CHANGED" in
            text("HeptaTrade/intent/authoritative_decision_snapshot.cpp"),
            "snapshot epoch/fence consistency check missing")
    require(errors, "DECISION_SNAPSHOT_EVENT_WATERMARK_CHANGED" in
            text("HeptaTrade/intent/authoritative_decision_snapshot.cpp"),
            "snapshot watermark consistency check missing")
    require(errors, (ROOT / "tests/target_position_tool_tests.cpp").is_file(),
            "target-position end-to-end tests missing")
    permit_test = text("tests/execution_preview_permit_tests.cpp")
    for evidence in ("SingleUse", "Expiry", "Revocation", "DurableReplay"):
        require(errors, evidence in permit_test,
                f"preview permit negative evidence missing: {evidence}")

    # G-009/G-010: executable, capability-free research validation.
    research = text("research/run_protocol.py")
    for evidence in ("RunManifest", "EventLog", "RunSummary",
                     "RESEARCH_LOOKAHEAD_REQUIRED",
                     "RESEARCH_CAPACITY_EXCEEDED",
                     "RESEARCH_PURGE_EMBARGO_INSUFFICIENT"):
        require(errors, evidence in research,
                f"research protocol evidence missing: {evidence}")
    require(errors, (ROOT / "tests/python/test_research_protocol.py").is_file(),
            "research protocol tests missing")
    manifest = json.loads(text("research/manifest-v1.json"))
    require(errors, all(value is False for value in manifest["capability"].values()),
            "research manifest carries runtime capability")

    # G-012: bounded runtime observability.
    telemetry = text("HeptaTrade/observability/runtime_telemetry.cpp")
    for metric in (
        "hepta_tool_calls_total", "hepta_session_rejections_total",
        "hepta_risk_decisions_total", "hepta_execution_commands_total",
        "hepta_oms_journal_failures_total", "hepta_venue_sends_total",
        "hepta_execution_events_total", "hepta_reconcile_runs_total",
        "hepta_state_breaks_total", "hepta_kill_switch_transitions_total",
    ):
        require(errors, metric in telemetry, f"runtime metric missing: {metric}")
    require(errors, '"system.get_metrics"' in registry,
            "bounded metrics read tool missing")
    require(errors, (ROOT / "tests/runtime_telemetry_tests.cpp").is_file(),
            "runtime telemetry tests missing")

    # G-013/G-014: schema drift and module ownership.
    for path in (
        "schemas/tool-catalog-v1.json", "schemas/execution-wire-v1.json",
        "schemas/research-run-v1.json", "scripts/generate_tool_catalog.py",
        "scripts/check_schema_catalog.py", "scripts/check_module_discipline.py",
        "docs/development/MODULE-OWNERSHIP.md",
        "docs/development/module-ownership-v1.json",
    ):
        require(errors, (ROOT / path).is_file(), f"schema/module evidence missing: {path}")

    # G-015: exact fast lane plus read-only scheduled reliability lanes.
    core_ci = text(".github/workflows/core-ci.yml")
    reliability_ci = text(".github/workflows/reliability-ci.yml")
    require(errors, "contents: read" in core_ci and "contents: write" not in core_ci,
            "core CI is not read-only")
    require(errors, "contents: read" in reliability_ci and
            "contents: write" not in reliability_ci,
            "reliability CI is not read-only")
    require(errors, "sanitize" in reliability_ci.lower() and
            "reliability_core.sh" in reliability_ci,
            "sanitizer reliability lane missing")
    for path in (
        "tests/oms_crash_replay_tests.cpp",
        "tests/protocol_fuzz_smoke_tests.cpp",
        "tests/risk_latency_fixture_tests.cpp",
        "benchmarks/core-latency-baseline-v1.json",
    ):
        require(errors, (ROOT / path).is_file(), f"reliability evidence missing: {path}")

    temporary = list((ROOT / ".github/workflows").glob("dev-*.yml"))
    require(errors, not temporary,
            f"temporary mutating workflows remain: {[p.name for p in temporary]}")
    for workflow in (ROOT / ".github/workflows").glob("*.yml"):
        body = workflow.read_text(encoding="utf-8-sig")
        require(errors, "self-merge" not in body.lower() and
                "pull_request_review" not in body,
                f"self-approval/merge workflow forbidden: {workflow.name}")

    for command in (
        [sys.executable, "scripts/check_schema_catalog.py"],
        [sys.executable, "scripts/check_module_discipline.py"],
        [sys.executable, "research/run_protocol.py", "verify",
         "--manifest", "research/manifest-v1.json"],
    ):
        if subprocess.run(command, cwd=ROOT).returncode != 0:
            errors.append(f"closure subcheck failed: {' '.join(command)}")

    for error in errors:
        print(f"[GAP-CLOSURE] {error}", file=sys.stderr)
    if errors:
        return 1
    print("[GAP-CLOSURE] PASS: G-001..G-016")
    return 0


if __name__ == "__main__":
    raise SystemExit(main())
'''
          gap_path = ROOT / "scripts/check_gap_closure.py"
          gap_path.write_text(gap_check, encoding="utf-8")
          gap_path.chmod(0o755)

          gap_test = '''from __future__ import annotations

