name: export-traceability-stage
on:
  push:
    branches:
      - codex/heptatrader-traceability-stage-export-20260903
permissions:
  contents: read
jobs:
  export:
    name: export-traceability-stage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact stage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8217d8cac0e7943c8c5e466458fd7b4c7bc5764e
          fetch-depth: 1
          persist-credentials: false
      - name: Archive stage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8217d8cac0e7943c8c5e466458fd7b4c7bc5764e
          git archive --format=tar.gz --output="$RUNNER_TEMP/heptatrader-stage.tar.gz" HEAD
          printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/source-sha.txt"
          sha256sum "$RUNNER_TEMP/heptatrader-stage.tar.gz" > "$RUNNER_TEMP/archive-sha256.txt"
      - name: Upload stage source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-traceability-stage-source
          path: |
            ${{ runner.temp }}/heptatrader-stage.tar.gz
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/archive-sha256.txt
          retention-days: 1
          if-no-files-found: error
