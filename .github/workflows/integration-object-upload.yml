name: Pinned integration object upload
on:
  push:
    branches: [integration/heptadll-upload-20260921]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5ba71a660e44fe59371a903fb7d2aaab59417362
          fetch-depth: 1
          persist-credentials: false
      - name: Upload only five tested blobs and their exact tree; never move a ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, os, subprocess, urllib.request, zlib
          from pathlib import Path
          repo = "TrillionniumFoundation/heptatrader"
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == "refs/heads/integration/heptadll-upload-20260921"
          base = "5ba71a660e44fe59371a903fb7d2aaab59417362"
          base_tree = "47aab2d079f04cfe6c3bc0174e88933138f43445"
          expected_tree = "2473f4bffc755db66e16e99c2cec1b56cc7fa581"
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          assert git("rev-parse", "HEAD") == base
          assert git("rev-parse", "HEAD^{tree}") == base_tree
          assert not git("status", "--porcelain")
          patch = zlib.decompress(base64.b64decode("", validate=True))
          assert hashlib.sha256(patch).hexdigest() == "e807bb7f7b1131a19d77df99a022d0fe32c9bd652ae6c00de0ea04abc001f664"
          subprocess.run(["git", "apply", "--check", "--index", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "--index", "-"], input=patch, check=True)
          assert git("write-tree") == expected_tree
          paths = ["docs/modules/research-sdk.md", "scripts/hepta_oms_lifecycle.py",
                   "tests/python/test_installed_runtime_processes.py",
                   "tests/python/test_oms_generation_process.py",
                   "tests/python/test_oms_lifecycle_rotation.py"]
          assert git("diff", "--cached", "--name-only").splitlines() == paths
          def post(endpoint, payload):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/git/" + endpoint,
                  data=json.dumps(payload).encode(), method="POST",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries = []
          for path in paths:
              data = Path(path).read_bytes()
              blob = post("blobs", {"content": base64.b64encode(data).decode(), "encoding": "base64"})
              assert blob["sha"] == git("hash-object", path)
              mode = git("ls-files", "--stage", "--", path).split()[0]
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})
          tree = post("trees", {"base_tree": base_tree, "tree": entries})
          assert tree["sha"] == expected_tree
          receipt = {"base": base, "tree": tree["sha"], "files": entries, "refs_changed": False}
          output = Path(os.environ["RUNNER_TEMP"]) / "integration-object-upload.json"
          output.write_text(json.dumps(receipt, indent=2) + "\n")
          print("UPLOAD_RESULT " + json.dumps(receipt, sort_keys=True))
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-object-upload
          path: ${{ runner.temp }}/integration-object-upload.json
          if-no-files-found: error
          retention-days: 1
