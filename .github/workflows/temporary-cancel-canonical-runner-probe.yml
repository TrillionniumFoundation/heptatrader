name: temporary-cancel-canonical-runner-probe

on:
  push:
    branches:
      - codex/cancel-obsolete-self-hosted-runs-20260902

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    name: cancel-canonical-runner-probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel diagnostic probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/cancel.json" \
            --write-out '%{http_code}' --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/33600253827/cancel")"
          case "$code" in 202|409) ;; *) cat "$RUNNER_TEMP/cancel.json" >&2; exit 1 ;; esac
