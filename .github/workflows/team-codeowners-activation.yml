name: Team CODEOWNERS Activation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/CODEOWNERS'
      - '.github/CODEOWNERS.team-template'
      - '.github/github-team-mapping-v1.json'
      - '.github/github-governance-policy-v1.json'
      - '.github/workflows/team-codeowners-activation.yml'
      - 'scripts/verify_team_codeowners_activation.py'
      - 'tests/python/test_team_codeowners_activation.py'
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - '.github/CODEOWNERS'
      - '.github/CODEOWNERS.team-template'
      - '.github/github-team-mapping-v1.json'
      - '.github/github-governance-policy-v1.json'
      - '.github/workflows/team-codeowners-activation.yml'
      - 'scripts/verify_team_codeowners_activation.py'
      - 'tests/python/test_team_codeowners_activation.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: heptatrader-team-codeowners-activation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-activation-audit:
    name: team-codeowners-activation-static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify deterministic team-only activation bytes
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile scripts/verify_team_codeowners_activation.py
          python3 scripts/verify_team_codeowners_activation.py
          python3 -m unittest discover \
            -s tests/python -p 'test_team_codeowners_activation.py'
          printf '%s\n' \
            'Static team CODEOWNERS activation contract passed.' \
            'Live team existence, staffing, visibility and repository permission remain external governance evidence.' \
            >> "$GITHUB_STEP_SUMMARY"
