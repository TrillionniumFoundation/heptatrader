# Exact-head bootstrap audit trigger after temporary materialization removal.
# Stable-head audit trigger after fail-closed CODEOWNERS verifier repair.
name: GitHub Governance Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/CODEOWNERS'
      - '.github/CODEOWNERS.team-template'
      - '.github/github-team-mapping-v1.json'
      - '.github/workflows/github-governance-qualification.yml'
      - '.github/workflows/ib-paper-qualification.yml'
      - '.github/github-governance-policy-v1.json'
      - '.github/required-check-contexts-v1.json'
      - 'scripts/github_qualification_evidence.py'
      - 'scripts/verify_github_governance.py'
      - 'scripts/verify_ib_paper_qualification.py'
      - 'scripts/verify_ib_candidate_artifact.py'
      - 'scripts/verify_qualification_candidate.py'
      - 'scripts/verify_team_codeowners_activation.py'
      - 'scripts/build_ib_candidate_artifact.sh'
      - 'scripts/run_ib_paper_artifact_qualification.sh'
      - 'scripts/check_qualification_trust_boundary.py'
      - 'tests/python/test_github_governance.py'
      - 'tests/python/test_ib_paper_qualification.py'
      - 'tests/python/test_qualification_trust_boundary.py'
      - 'tests/python/test_team_codeowners_activation.py'
  workflow_dispatch:
    inputs:
      pull_number:
        description: Final pull request number targeting protected main
        required: true
        type: string
      expected_head_sha:
        description: Exact unchanged source head, treated only as API data
        required: true
        type: string
      merge_group_sha:
        description: Exact live merge-queue revision for that PR/head/base
        required: true
        type: string
      acknowledge_no_bypass:
        description: Confirm this evidence run did not use a bypass
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: heptatrader-github-governance-qualification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-audit:
    if: github.event_name == 'pull_request'
    name: github-governance-workflow-bootstrap-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact bootstrap pull-request head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact bootstrap revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Confirm Docker hostile-isolation dependency
        run: |
          set -euo pipefail
          docker version
      - name: Validate trusted harnesses, provenance, team activation and hostile isolation
        run: |
          set -euo pipefail
          git diff --check
          bash -n scripts/build_ib_candidate_artifact.sh
          bash -n scripts/run_ib_paper_artifact_qualification.sh
          python3 -m py_compile \
            scripts/github_qualification_evidence.py \
            scripts/verify_github_governance.py \
            scripts/verify_ib_paper_qualification.py \
            scripts/verify_ib_candidate_artifact.py \
            scripts/verify_qualification_candidate.py \
            scripts/verify_team_codeowners_activation.py \
            scripts/check_qualification_trust_boundary.py
          python3 scripts/check_qualification_trust_boundary.py --self-test
          python3 scripts/verify_team_codeowners_activation.py
          python3 -m unittest discover -s tests/python -p 'test_github_governance.py'
          python3 -m unittest discover -s tests/python -p 'test_ib_paper_qualification.py'
          python3 -m unittest discover -s tests/python -p 'test_qualification_trust_boundary.py'
          python3 -m unittest discover -s tests/python -p 'test_team_codeowners_activation.py'
          printf '%s\n' \
            'Trusted qualification boundary and static team CODEOWNERS activation audits passed.' \
            'No secret, Broker credential or candidate mutation was used.' \
            'Live team existence, staffing, visibility and repository permission remain external governance evidence.' \
            >> "$GITHUB_STEP_SUMMARY"

  qualify:
    if: github.event_name == 'workflow_dispatch'
    name: github-governance-exact-artifact-verification
    runs-on: ubuntu-24.04
    environment: repository-governance
    timeout-minutes: 20
    steps:
      - name: Require trusted main dispatch and immutable data inputs
        env:
          ACKNOWLEDGE_NO_BYPASS: ${{ inputs.acknowledge_no_bypass }}
          DISPATCH_REF: ${{ github.ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          MERGE_GROUP_SHA: ${{ inputs.merge_group_sha }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = 'refs/heads/main'
          test "$ACKNOWLEDGE_NO_BYPASS" = 'true'
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_GROUP_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PULL_NUMBER" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout only the trusted default-branch harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Assert trusted harness identity and static boundary
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$DISPATCH_SHA"
          python3 -m py_compile \
            trusted/scripts/github_qualification_evidence.py \
            trusted/scripts/verify_github_governance.py
          python3 trusted/scripts/check_qualification_trust_boundary.py --root trusted
      - name: Collect fully paginated live evidence with trusted code only
        env:
          HEPTA_GOVERNANCE_TOKEN: ${{ secrets.HEPTA_GOVERNANCE_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          MERGE_GROUP_SHA: ${{ inputs.merge_group_sha }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/github-governance-receipt.json"
          python3 trusted/scripts/verify_github_governance.py \
            --pull-number "$PULL_NUMBER" \
            --expected-head-sha "$EXPECTED_HEAD_SHA" \
            --merge-group-sha "$MERGE_GROUP_SHA" \
            --output "$receipt"
          test -s "$receipt"
          test ! -L "$receipt"
          test "$(stat -c '%a' "$receipt")" = '600'
      - name: Upload immutable governance receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-governance-${{ github.sha }}-${{ inputs.expected_head_sha }}-${{ inputs.merge_group_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/github-governance-receipt.json
          if-no-files-found: error
          retention-days: 90
