name: Full Gap Closure Materializer

on:
  push:
    branches: [remediation/full-gap-closure-20260916-v2]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/full-gap-closure-20260916-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev zlib1g-dev python3-yaml

      - name: Apply deterministic closure patch
        run: |
          set +e
          python3 scripts/.full_gap_patch_fix.py > materializer.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            python3 scripts/.full_gap_patch.py >> materializer.log 2>&1
            code=$?
          fi
          cat materializer.log
          exit "$code"

      - name: Retain patch diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-gap-materializer-${{ github.run_id }}
          path: materializer.log
          if-no-files-found: warn
          retention-days: 2

      - name: Validate OMS lifecycle regressions
        run: python3 -m unittest tests.python.test_oms_lifecycle_rotation

      - name: Build and run canonical core tests
        id: core
        env:
          HEPTA_BUILD_DIR: ${{ github.workspace }}/build/core
          HEPTA_JOBS: "2"
        run: |
          set +e
          ./scripts/dev_core.sh > core.log 2>&1
          code=$?
          cat core.log
          exit "$code"

      - name: Retain native diagnostics on failure
        if: failure() && steps.core.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-gap-core-${{ github.run_id }}
          path: core.log
          if-no-files-found: error
          retention-days: 2

      - name: Run canonical source and core Python lanes
        run: |
          python3 scripts/check_documentation.py
          python3 scripts/check_component_coverage.py
          python3 scripts/check_gap_register.py
          python3 scripts/run_python_tests.py --lane source
          python3 scripts/run_python_tests.py --lane core

      - name: Remove materializer and commit exact result
        env:
          BRANCH: remediation/full-gap-closure-20260916-v2
        run: |
          set -euo pipefail
          rm .github/workflows/full-gap-closure-materialize.yml
          rm scripts/.full_gap_patch.py scripts/.full_gap_patch_fix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: bound OMS maintenance and terminal owner scope'
          git push origin "HEAD:$BRANCH"
