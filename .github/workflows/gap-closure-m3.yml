name: gap-closure-m3

on:
  push:
    branches:
      - codex/heptatrader-m3-work
    paths:
      - .github/workflows/gap-closure-m3.yml

permissions:
  contents: write

jobs:
  generated-bindings-and-numeric:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout M3 staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-m3-work
          fetch-depth: 0
      - name: Apply M3-A integration
        run: python3 scripts/m3a_patch.py
      - name: Declare transitive numeric consumers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('hepta-gateway-runtime.json', 'hepta-client-runtime.json'):
              path = Path('docs/modules/manifests') / name
              value = json.loads(path.read_text())
              dependencies = value.setdefault('allowed_dependencies', [])
              if 'hepta.numeric.core' not in dependencies:
                  dependencies.append('hepta.numeric.core')
                  dependencies.sort()
              path.write_text(json.dumps(value, indent=2) + '\n')
          PY
      - name: Validate exact decimal and deterministic core
        run: ./scripts/dev_core.sh
      - name: Commit exact tested implementation
        run: |
          set -euo pipefail
          git config user.name "Hepta Gap Closure Bot"
          git config user.email "hepta-gap-closure-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: generate wire bindings and enforce fixed numeric boundary"
          git push origin HEAD:codex/heptatrader-m3-work
