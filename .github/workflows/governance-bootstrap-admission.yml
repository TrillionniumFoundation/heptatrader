name: Governance Bootstrap Admission

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: heptatrader-governance-bootstrap-admission-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admission:
    name: governance-bootstrap-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact pull-request or merge-group identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          case "$EVENT_NAME" in
            pull_request)
              test "$EVENT_BASE_REF" = main
              ;;
            merge_group)
              [[ "$EVENT_REF" == refs/heads/gh-readonly-queue/main/pr-* ]]
              ;;
            *)
              echo "unsupported event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

      - name: Verify privileged workflows and context registry as immutable data
        shell: bash
        env:
          GOVERNANCE_SHA256: 0df855faa0345f81ce350e41f2fe860118b517cd68c0823ff2b4992415e58918
          IB_PAPER_SHA256: b413e5e7cb5ca0a109937d3d54c6820efd1cd42406033306517d201801821a5c
          X230_PROBE_SHA256: 9efc491558eb1af64930fbfc9d1ae8344214ab7680b9f026221ca0d7ddaabbf0
          CONTEXTS_SHA256: 67c82dac9d08c123133d47d94a8a4872a45b40bab461a2861c658861772d2cb7
        run: |
          set -euo pipefail
          export LC_ALL=C

          verify_regular_file() {
            local target="$1"
            local expected="$2"
            test -f "$target"
            test ! -L "$target"
            test "$(git ls-tree HEAD -- "$target" | wc -l)" -eq 1
            test "$(git ls-tree HEAD -- "$target" | awk '{print $1}')" = 100644
            git cat-file blob "HEAD:$target" |
              sha256sum --check <(printf '%s  -\n' "$expected")
            printf '%s  %s\n' "$expected" "$target" |
              sha256sum --check --strict
          }

          verify_dispatch_workflow() {
            local target="$1"
            local expected="$2"
            local events
            verify_regular_file "$target" "$expected"
            test "$(grep -Fxc 'on:' "$target")" -eq 1
            events="$(
              awk '
                $0 == "on:" { in_on = 1; next }
                in_on && /^[^[:space:]]/ { exit }
                in_on && /^  [A-Za-z_][A-Za-z0-9_-]*:/ {
                  key = $0
                  sub(/^  /, "", key)
                  sub(/:.*/, "", key)
                  print key
                }
              ' "$target"
            )"
            test "$events" = workflow_dispatch
          }

          verify_dispatch_workflow \
            .github/workflows/github-governance-qualification.yml \
            "$GOVERNANCE_SHA256"
          verify_dispatch_workflow \
            .github/workflows/ib-paper-qualification.yml \
            "$IB_PAPER_SHA256"
          verify_dispatch_workflow \
            .github/workflows/self-hosted-ib-availability.yml \
            "$X230_PROBE_SHA256"
          verify_regular_file \
            .github/required-check-contexts-v1.json \
            "$CONTEXTS_SHA256"

          test "$(grep -Fc 'group: trillionnium-ib-paper' \
            .github/workflows/ib-paper-qualification.yml)" -eq 2
          grep -Fq 'heptatrader-ib-builder' \
            .github/workflows/ib-paper-qualification.yml
          grep -Fq 'heptatrader-ib-paper' \
            .github/workflows/ib-paper-qualification.yml
          test "$(grep -Fc 'group: trillionnium-ib-paper' \
            .github/workflows/self-hosted-ib-availability.yml)" -eq 1
          ! grep -Fq 'uses: actions/checkout@' \
            .github/workflows/self-hosted-ib-availability.yml
          ! grep -Fq 'self-hosted' \
            .github/workflows/github-governance-qualification.yml

          contexts=.github/required-check-contexts-v1.json
          test "$(grep -Fcx '    "governance-bootstrap-admission",' "$contexts")" -eq 1
          test "$(grep -Fcx '    "github-governance-exact-artifact-verification",' "$contexts")" -eq 1
          test "$(grep -Fcx '    "ib-paper-exact-artifact-qualification"' "$contexts")" -eq 1
          ! grep -Fq '"github-governance-workflow-bootstrap-audit"' "$contexts"
          ! grep -Fq '"ib-paper-workflow-bootstrap-audit"' "$contexts"

      - name: Validate bounded event subject without candidate execution
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git ls-files --unmerged)"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Reassert immutable event subject
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
