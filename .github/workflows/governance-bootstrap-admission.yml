name: Governance Bootstrap Admission

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: heptatrader-governance-bootstrap-admission-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admission:
    name: governance-bootstrap-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact pull-request or merge-group identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          case "$EVENT_NAME" in
            pull_request)
              test "$EVENT_BASE_REF" = main
              ;;
            merge_group)
              [[ "$EVENT_REF" == refs/heads/gh-readonly-queue/main/pr-* ]]
              ;;
            *)
              echo "unsupported event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

      - name: Verify dispatch-only workflow as immutable data
        shell: bash
        env:
          TARGET: .github/workflows/self-hosted-ib-availability.yml
          EXPECTED_DISPATCH_WORKFLOW_SHA256: 9efc491558eb1af64930fbfc9d1ae8344214ab7680b9f026221ca0d7ddaabbf0
        run: |
          set -euo pipefail
          test -f "$TARGET"
          test ! -L "$TARGET"
          test "$(git ls-tree HEAD -- "$TARGET" | awk '{print $1}')" = 100644
          test "$(git ls-tree HEAD -- "$TARGET" | wc -l)" -eq 1
          git cat-file blob "HEAD:$TARGET" | sha256sum --check <(
            printf '%s  -\n' "$EXPECTED_DISPATCH_WORKFLOW_SHA256"
          )
          printf '%s  %s\n' "$EXPECTED_DISPATCH_WORKFLOW_SHA256" "$TARGET" |
            sha256sum --check --strict

      - name: Validate bounded event subject without candidate execution
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git ls-files --unmerged)"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"

      - name: Reassert immutable event subject
        if: always()
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored=matching)"
