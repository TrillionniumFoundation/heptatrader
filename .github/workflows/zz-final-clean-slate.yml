name: one-shot-final-clean-slate

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/zz-final-clean-slate.yml

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: heptatrader-authoritative-gap-closure
  cancel-in-progress: true

jobs:
  clean-and-recheck:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Cancel stale temporary runs and lock current branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/TrillionniumFoundation/heptatrader/actions/runs?branch=codex/heptatrader-gap-closure-v2&per_page=100' \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.id != '${GITHUB_RUN_ID}')) | [.id, .path] | @tsv' |
          while IFS=$'\t' read -r run_id path; do
            [[ -z "${run_id:-}" ]] && continue
            case "$path" in
              .github/workflows/dev-*|.github/workflows/zz-*)
                gh api --method POST "repos/TrillionniumFoundation/heptatrader/actions/runs/$run_id/cancel" || true
                ;;
            esac
          done
          sleep 30
          git fetch origin codex/heptatrader-gap-closure-v2
          git reset --hard origin/codex/heptatrader-gap-closure-v2
      - name: Remove all temporary writable workflows
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'dev-*.yml' -o -name 'dev-*.yaml' -o -name 'zz-*.yml' -o -name 'zz-*.yaml' \) \
            -print -delete
          python3 - <<'PY'
          from pathlib import Path
          core = Path('.github/workflows/core-ci.yml')
          if not core.exists():
              raise SystemExit('core-ci.yml missing')
          text = core.read_text()
          if 'workflow_dispatch:' not in text:
              if 'on:\n' not in text:
                  raise SystemExit('core-ci.yml on block missing')
              core.write_text(text.replace('on:\n', 'on:\n  workflow_dispatch:\n', 1))
          PY
          if grep -RInE '^\s*(contents|pull-requests|actions|checks):\s*write\s*$|git push|gh pr merge|merge_pull_request|enable_auto_merge' \
              .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'permanent writable or self-mutating workflow remains' >&2
            exit 1
          fi
          python3 scripts/check_repository_integrity.py
          git diff --check
      - name: Commit clean candidate
        id: final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A .github/workflows
          if git diff --cached --quiet; then
            sha=$(git rev-parse HEAD)
          else
            git commit -s -m 'chore(ci): remove temporary writable workflows'
            git push origin HEAD:codex/heptatrader-gap-closure-v2
            sha=$(git rev-parse HEAD)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Dispatch and require permanent core on clean exact head
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/dispatches \
            -f ref=codex/heptatrader-gap-closure-v2
          run_id=''
          for attempt in $(seq 1 75); do
            run_id=$(gh api \
              'repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/runs?branch=codex/heptatrader-gap-closure-v2&event=workflow_dispatch&per_page=30' \
              --jq ".workflow_runs[] | select(.head_sha == \"$FINAL_SHA\") | .id" | head -n1)
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || exit 1
          for attempt in $(seq 1 150); do
            status=$(gh api "repos/TrillionniumFoundation/heptatrader/actions/runs/$run_id" --jq .status)
            conclusion=$(gh api "repos/TrillionniumFoundation/heptatrader/actions/runs/$run_id" --jq '.conclusion // ""')
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]]
              exit
            fi
            sleep 10
          done
          exit 1
      - name: Mark PR ready only when clean exact-head core is green
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node_id=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .node_id)
          draft=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .draft)
          if [[ "$draft" == true ]]; then
            gh api graphql \
              -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' \
              -f id="$node_id" >/dev/null
          fi
