name: Converge refs after PR 62

on:
  pull_request:
    branches:
      - ops/queue-control-base-20260911
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ops-converge-pr62-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.repository == 'TrillionniumFoundation/heptatrader' &&
      github.event.pull_request.user.login == 'Franksudoman' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/queue-pr62-20260911' &&
      github.event.pull_request.base.ref == 'ops/queue-control-base-20260911'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Wait for exact hardened tree to enter protected main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: '62'
          TARGET_HEAD: 535315a2be529b9fe1b73a4d700dcf88e1c4c557
          TARGET_TREE: cd8d0575f632b150b8f3d68d971f8d6e94a806af
        shell: bash
        run: |
          set -euo pipefail
          merged=0
          for attempt in $(seq 1 480); do
            target="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}")"
            jq -e --arg head "${TARGET_HEAD}" '
              .head.sha == $head and
              .base.ref == "main"
            ' <<<"${target}" >/dev/null

            if jq -e '.merged_at != null' <<<"${target}" >/dev/null; then
              main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
              main_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${main_sha}" --jq '.tree.sha')"
              test "${main_tree}" = "${TARGET_TREE}"

              gap_json="$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/gap-register.json?ref=main" --jq '.content' | tr -d '\n' | base64 -d)"
              jq -e '
                .authorization.source_state == "READY" and
                .authorization.paper_authorized == false and
                .authorization.live_authorized == false and
                ([.gaps[] | select(.state != "CLOSED_SOURCE" or .blocking_authorization != false)] | length) == 0
              ' <<<"${gap_json}" >/dev/null
              merged=1
              break
            fi
            sleep 5
          done
          test "${merged}" -eq 1

      - name: Close controller and delete absorbed non-main refs
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/pulls/${CONTROL_PR}" -f state=closed >/dev/null

          for branch in \
            hardening/behavior-over-formalism-20260911 \
            ops/queue-pr62-20260911 \
            ops/queue-control-base-20260911 \
            ops/queue-pr59-20260911 \
            plan/p0-owner-operated-truth-ci-20260910; do
            encoded="${branch//\//%2F}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}" >/dev/null
            fi
          done

          for attempt in $(seq 1 24); do
            mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
            extras=()
            for branch in "${branches[@]}"; do
              test "${branch}" = main || extras+=("${branch}")
            done
            if test "${#extras[@]}" -eq 0; then
              exit 0
            fi
            printf 'remaining non-main refs: %s\n' "${extras[*]}" >&2
            sleep 5
          done
          echo 'non-main refs remain after cleanup window' >&2
          exit 1
