name: IB PAPER Custom Label Probe

on:
  push:
    branches:
      - codex/ib-paper-label-only-probe-20260902

permissions:
  contents: read

concurrency:
  group: heptatrader-ib-paper-label-only-probe
  cancel-in-progress: false

jobs:
  probe:
    name: ib-paper-label-only-probe
    runs-on: heptatrader-ib-paper
    timeout-minutes: 10
    steps:
      - name: Record non-sensitive runner and gateway state
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/heptatrader-ib-paper-label-only-probe.json"
          python3 - <<'PY' > "$receipt"
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import socket
          import stat

          def state(name):
              raw = os.environ.get(name, "")
              result = {
                  "present": bool(raw),
                  "directory": False,
                  "regular_file": False,
                  "executable": False,
                  "symlink": False,
              }
              if not raw:
                  return result
              path = Path(raw)
              try:
                  info = path.lstat()
              except OSError:
                  return result
              result["directory"] = stat.S_ISDIR(info.st_mode)
              result["regular_file"] = stat.S_ISREG(info.st_mode)
              result["executable"] = bool(info.st_mode & 0o111)
              result["symlink"] = stat.S_ISLNK(info.st_mode)
              return result

          ports = {}
          for port in (4001, 4002, 7496, 7497):
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(0.25)
              try:
                  ports[str(port)] = sock.connect_ex(("127.0.0.1", port)) == 0
              finally:
                  sock.close()

          payload = {
              "schema": "heptatrader.ib-paper-label-only-probe.v1",
              "trigger_sha": os.environ.get("GITHUB_SHA", ""),
              "runner": {
                  "name_sha256": hashlib.sha256(
                      os.environ.get("RUNNER_NAME", "").encode()
                  ).hexdigest(),
                  "os": os.environ.get("RUNNER_OS", ""),
                  "arch": os.environ.get("RUNNER_ARCH", ""),
              },
              "ibapi_root": state("IBAPI_ROOT"),
              "qualifier": state("HEPTA_IB_PAPER_QUALIFIER"),
              "loopback_gateway_ports": ports,
              "tools": {
                  name: bool(shutil.which(name))
                  for name in ("cmake", "ninja", "g++", "python3")
              },
          }
          print(json.dumps(payload, sort_keys=True, separators=(",", ":")))
          PY
          chmod 0600 "$receipt"

      - name: Upload probe receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ib-paper-label-only-probe-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/heptatrader-ib-paper-label-only-probe.json
          if-no-files-found: error
          retention-days: 7
