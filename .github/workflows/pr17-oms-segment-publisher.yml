name: PR17 OMS segmented journal staging publisher ubuntu22

on:
  push:
    branches:
      - codex/pr17-oms-segment-publisher-ubuntu22-20260905

env:
  EXPECTED_HELPER_PARENT: 538528ad585a59280ac6fc12c7c5ea6baff5d45f
  EXPECTED_TARGET_PARENT: a4ed2c344aff3691da55846616a8ad65bb260477
  TARGET_BRANCH: codex/pr17-oms-segment-stage-20260905
  B64_SHA256: 1ffcb80fcdff0f15d0b6d5a6215f7e7e6ebc39472d8011a375cda2ee788edfac
  GZIP_SHA256: 548c6ae8e5cb73f173217a5aab7f4b1f3f9c5d4f655f60e2cfc7d8d27332ffe3
  PATCH_SHA256: 60ef5b3d5a6fcac8880da799a8710b6df01fcc7c2a86d33dcae4122d4bd5b70c

jobs:
  publish-stage:
    name: Publish exact candidate to isolated staging on ubuntu22
    if: >-
      github.repository == 'TrillionniumFoundation/heptatrader' &&
      github.ref == 'refs/heads/codex/pr17-oms-segment-publisher-ubuntu22-20260905'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout immutable publisher payload without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: publisher
          fetch-depth: 2
          persist-credentials: false
      - name: Authenticate patch payload
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/pr17-oms-segment-publisher-ubuntu22-20260905
          test "$(git -C publisher rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C publisher rev-parse HEAD^)" = "$EXPECTED_HELPER_PARENT"
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          root = Path('publisher/.publisher/pr17-oms-segment')
          encoded = b''.join(path.read_bytes() for path in sorted(root.glob('patch.gz.b64.*')))
          assert hashlib.sha256(encoded).hexdigest() == os.environ['B64_SHA256']
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == os.environ['GZIP_SHA256']
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
          (Path(os.environ['RUNNER_TEMP']) / 'oms-segments.patch').write_bytes(patch)
          PY
      - name: Checkout isolated staging branch with write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: target
          fetch-depth: 2
          persist-credentials: true
      - name: Publish once or verify an identical winning publisher
        shell: bash
        run: |
          set -euo pipefail
          current="$(git -C target rev-parse HEAD)"
          verify_candidate() {
            while read -r expected path; do
              test "$(git -C target hash-object "$path")" = "$expected"
            done <<'EOF'
          6b7f20d38bed0c334bfe3d0842bfef3603cf5502 HeptaTrade/oms_journal.cpp
          5b580059f6316ef2cf3fe85447d2c06d85285173 HeptaTrade/oms_journal.h
          672c141b161deafb449ee0cfd1969dedda9e92d6 tests/oms_journal_durability_tests.cpp
          3d83728238f1bd70adab05e6c9f8a7b8b73a648d docs/contracts/OMS-JOURNAL-CONTRACT.md
          32881fbd8d496f96c3821f5afab37f945903db8e docs/modules/manifests/hepta-execution-runtime.json
          a41a8a3642d2b4bb73326a1f90a971552e2057ca docs/modules/technical/hepta-execution-runtime.md
          EOF
          }
          if test "$current" != "$EXPECTED_TARGET_PARENT"; then
            test "$(git -C target rev-parse HEAD^)" = "$EXPECTED_TARGET_PARENT"
            verify_candidate
            git -C target diff --name-only "$EXPECTED_TARGET_PARENT..HEAD" | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
            cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          HeptaTrade/oms_journal.cpp
          HeptaTrade/oms_journal.h
          docs/contracts/OMS-JOURNAL-CONTRACT.md
          docs/modules/manifests/hepta-execution-runtime.json
          docs/modules/technical/hepta-execution-runtime.md
          tests/oms_journal_durability_tests.cpp
          EOF
            diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
            exit 0
          fi
          test -z "$(git -C target status --porcelain=v1 --untracked-files=all)"
          while read -r expected path; do
            test "$(git -C target hash-object "$path")" = "$expected"
          done <<'EOF'
          3b44b6ab2565b604993dd6dbcb96dfea318f2301 HeptaTrade/oms_journal.cpp
          f148acebdfeb102c6cd233d139fc41de6c196e07 HeptaTrade/oms_journal.h
          0a931159480edf331262e9b71c8e3798cdf8ffec tests/oms_journal_durability_tests.cpp
          79bdcc6b2c968daa78c924ab323106211fcfa4b0 docs/contracts/OMS-JOURNAL-CONTRACT.md
          ad92ac4f54d8e097effd2555c95000893e7f6d4f docs/modules/manifests/hepta-execution-runtime.json
          50de4c33b0467c5283b0fed3c5f2e49f4d632f76 docs/modules/technical/hepta-execution-runtime.md
          EOF
          patch="$RUNNER_TEMP/oms-segments.patch"
          git -C target apply --check --index "$patch"
          git -C target apply --index "$patch"
          git -C target diff --cached --check
          verify_candidate
          git -C target diff --cached --name-only | LC_ALL=C sort > "$RUNNER_TEMP/actual-paths"
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          HeptaTrade/oms_journal.cpp
          HeptaTrade/oms_journal.h
          docs/contracts/OMS-JOURNAL-CONTRACT.md
          docs/modules/manifests/hepta-execution-runtime.json
          docs/modules/technical/hepta-execution-runtime.md
          tests/oms_journal_durability_tests.cpp
          EOF
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git -C target config user.name 'OpenAI Codex'
          git -C target config user.email 'noreply@openai.com'
          git -C target commit -F - <<'EOF'
          feat(oms): add bounded segmented journal rotation

          Add an opt-in segmented OMS journal with private directory ownership,
          retained nonblocking writer lock, contiguous sequence/count/SHA-256
          sealed names, rename-noreplace publication, directory durability,
          restart recovery and bounded cross-segment atomic replay.

          Preserve the legacy single-file journal and physical record schema 4.
          Execution Runtime advances to 1.3.0. The exact candidate is bound to
          the retained 31-group source durability evidence package.

          This source commit does not claim power-loss qualification, deployed
          retention policy, governance, IB PAPER/LIVE, release or production
          authority. G-TEAM-001 and G-IB-001 remain fail-closed.

          Signed-off-by: OpenAI Codex <noreply@openai.com>
          EOF
          test "$(git -C target rev-parse HEAD^)" = "$EXPECTED_TARGET_PARENT"
          git -C target push origin "HEAD:refs/heads/$TARGET_BRANCH"
