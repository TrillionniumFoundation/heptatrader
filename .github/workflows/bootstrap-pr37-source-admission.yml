name: Bootstrap PR37 Source Admission

on:
  pull_request_target:
    types: [synchronize, reopened, ready_for_review]

concurrency:
  group: heptatrader-bootstrap-pr37-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event.pull_request.number == 37 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/full-blocker-closure-20260908'
    name: bootstrap-pr37-readonly-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact candidate identity
        id: identity
        working-directory: candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "candidate_sha=$actual" >> "$GITHUB_OUTPUT"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build make g++ libssl-dev dpkg-dev file

      - name: Reject temporary or self-authorizing source
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(find .github/workflows -maxdepth 1 -name '*controller.yml' | wc -l)" -eq 0
          test ! -e .github/workflows/source-snapshot-export.yml
          test ! -e .github/CODEOWNERS.team-template
          test ! -e docs/administration-probe.md
          test ! -e scripts/verify_github_governance_legacy.py
          test "$(python3 - <<'PY'
          import json
          print(len(json.load(open('docs/module-catalog.json'))['modules']))
          PY
          )" -eq 16
          python3 - <<'PY'
          import json
          catalog=json.load(open('docs/module-catalog.json'))
          assert all(item.get('production_authorized') is False for item in catalog['modules'])
          capabilities=json.load(open('docs/capabilities.json'))
          assert capabilities.get('live_trading_authorized') is False
          PY

      - name: Validate source contracts and generated bindings
        working-directory: candidate
        run: |
          set -euo pipefail
          python3 scripts/generate_tool_protocol_fields.py --check
          python3 scripts/check_documentation.py
          python3 scripts/check_module_documentation_depth.py
          python3 scripts/verify_build_ownership.py
          python3 scripts/check_gap_register.py
          python3 scripts/verify_canonical_ib_paper_profile.py
          python3 scripts/verify_source_gap_closures.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Build and run canonical optimized core
        working-directory: candidate
        env:
          HEPTA_JOBS: '2'
        run: ./scripts/dev_core.sh

      - name: Validate SDK-free install and package boundary
        working-directory: candidate
        run: |
          set -euo pipefail
          cmake -S . -B build/bootstrap-package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DHEPTA_ENABLE_IBAPI=OFF -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF
          cmake --build build/bootstrap-package --parallel 2
          root="$RUNNER_TEMP/bootstrap-install"
          cmake --install build/bootstrap-package --prefix "$root"
          test -x "$root/bin/hepta_tool_gatewayd"
          test -x "$root/bin/hepta_executiond"
          test -x "$root/bin/heptactl"
          test -x "$root/bin/hepta_sessionctl"
          test ! -e "$root/bin/hepta_ib_executiond"
          test -f "$root/libexec/heptatrader/hepta_tool_protocol_fields.py"
          find "$root" -type l -print -quit | (! grep .)
          ! grep -R --binary-files=without-match --line-number \
            -E '(DU[0-9]{6,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' "$root"
          (cd build/bootstrap-package && cpack -G TGZ)
          for archive in build/bootstrap-package/heptatrader-*.tar.gz; do
            tar -tzf "$archive" >/dev/null
          done

      - name: Reassert immutable candidate bytes
        if: always()
        working-directory: candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .

  merge:
    name: bootstrap-pr37-exact-merge
    needs: validate
    if: needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Re-read PR and wait for independent sanitizer checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, subprocess, time, urllib.parse
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; number=os.environ['PR_NUMBER']; expected=os.environ['EXPECTED_SHA']
          required={
            'canonical-full-suite-reliability (g++)': '.github/workflows/canonical-full-suite.yml',
            'canonical-full-suite-reliability (clang++)': '.github/workflows/canonical-full-suite.yml',
            'thread-sanitizer-core': '.github/workflows/thread-sanitizer.yml',
            'source-admission-exact-head': '.github/workflows/source-admission.yml',
          }
          def api(path):
            result=subprocess.run([
              'curl','--fail-with-body','--silent','--show-error',
              '-H','Accept: application/vnd.github+json',
              '-H',f'Authorization: Bearer {token}',
              '-H','X-GitHub-Api-Version: 2022-11-28',
              f'https://api.github.com/repos/{repo}/{path}'
            ],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=False)
            if result.returncode: raise RuntimeError(result.stdout[-4000:])
            return json.loads(result.stdout)
          pr=api(f'pulls/{number}')
          if pr.get('state')!='open' or pr.get('head',{}).get('sha')!=expected:
            raise RuntimeError('PR state or exact head changed after read-only validation')
          deadline=time.monotonic()+55*60; last={}
          while time.monotonic()<deadline:
            query=urllib.parse.urlencode({'head_sha':expected,'per_page':100})
            runs=api(f'actions/runs?{query}').get('workflow_runs',[])
            latest={}
            for run in runs:
              path=run.get('path')
              if path not in set(required.values()): continue
              if path not in latest or int(run.get('id',0))>int(latest[path].get('id',0)): latest[path]=run
            successful=set(); failed=[]; last={}
            for path,run in latest.items():
              last[path]={'id':run.get('id'),'status':run.get('status'),'conclusion':run.get('conclusion'),'event':run.get('event')}
              if run.get('status')=='completed' and run.get('conclusion')!='success': failed.append(path)
              if run.get('status')!='completed' or run.get('conclusion')!='success': continue
              jobs=api(f"actions/runs/{run['id']}/jobs?per_page=100").get('jobs',[])
              for job in jobs:
                name=job.get('name')
                if name in required and required[name]==path and job.get('conclusion')=='success': successful.add(name)
            if failed: raise RuntimeError(f'independent candidate workflow failed: {last}')
            if successful==set(required): break
            time.sleep(20)
          else: raise RuntimeError(f'timed out waiting for independent checks: {last}')
          print(json.dumps({'exact_sha':expected,'successful_contexts':sorted(successful),'runs':last},indent=2))
          PY

      - name: Mark ready and squash exact admitted head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -X POST https://api.github.com/graphql \
            -d "$(python3 - <<'PY'
          import json, os
          print(json.dumps({'query':'mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}','variables':{'id':os.environ['PR_NODE_ID']}}))
          PY
          )" >/tmp/ready.json
          python3 - <<'PY'
          import json
          value=json.load(open('/tmp/ready.json'))
          if value.get('errors'): raise SystemExit(value['errors'])
          PY

          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -X PUT "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/merge" \
            -d "$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'sha':os.environ['EXPECTED_SHA'],
            'merge_method':'squash',
            'commit_title':'refactor: close source blockers and harden HeptaTrader delivery (#37)',
            'commit_message':'Trusted default-branch bootstrap admitted the exact PR head after source, core, package, ASan/UBSan and ThreadSanitizer verification. PAPER and LIVE authorization remain false pending non-forgeable external receipts.'
          }))
          PY
          )" >/tmp/merge.json
          python3 - <<'PY'
          import json
          value=json.load(open('/tmp/merge.json'))
          if value.get('merged') is not True: raise SystemExit(value)
          print(value)
          PY
