name: Finalize PR58 V5 envelope

on:
  push:
    branches:
      - plan/p2-bounded-paper-v5-source-20260910
    paths:
      - .github/workflows/codex-finalize-pr58-v5-envelope.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr58-v5-envelope
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout current stack head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: plan/p2-bounded-paper-v5-source-20260910
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest release slice
        run: |
          set -euo pipefail
          git fetch origin \
            plan/p1-release-package-preflight-20260910 \
            plan/p2-bounded-paper-v5-source-20260910
          git checkout -B plan/p2-bounded-paper-v5-source-20260910 \
            origin/plan/p2-bounded-paper-v5-source-20260910
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git merge --no-edit origin/plan/p1-release-package-preflight-20260910

      - name: Enforce an atomically flattenable V5 envelope and regressions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          profile = Path('HeptaTrade/execution/ib_paper_execution_profile.cpp')
          source = profile.read_text(encoding='utf-8')
          old = '''            maxGrossPosition > kQualificationMaximumGrossPosition ||\n            maxOrderQuantity > maxGrossPosition ||\n'''
          new = '''            maxGrossPosition > kQualificationMaximumGrossPosition ||\n            maxOrderQuantity != maxGrossPosition ||\n'''
          if old in source:
              source = source.replace(old, new, 1)
          if new not in source:
              raise SystemExit('V5 atomic envelope predicate is absent')
          profile.write_text(source, encoding='utf-8')

          test_path = Path('tests/ib_paper_execution_profile_tests.cpp')
          test = test_path.read_text(encoding='utf-8')
          if '#include <memory>\n' not in test:
              test = test.replace(
                  '#include <map>\n', '#include <map>\n#include <memory>\n', 1
              )

          rejection = '''    // An atomic V5 flatten must cover every reachable position.\n    values = QualificationValues();\n    values["HEPTA_IB_PAPER_MAX_ORDER_QTY"] = "250000";\n    assert(!IbPaperExecutionProfileConfig::FromValues(values, config, reason));\n    assert(reason == "IB_PAPER_QUALIFICATION_ORDER_MODE_LIMITS_INVALID");\n\n'''
          if 'An atomic V5 flatten must cover every reachable position.' not in test:
              anchor = '''    values = QualificationValues();\n    values["HEPTA_IB_PAPER_MAX_GROSS_POSITION"] = "999999";\n    assert(!IbPaperExecutionProfileConfig::FromValues(values, config, reason));\n    assert(reason == "IB_PAPER_QUALIFICATION_ORDER_MODE_LIMITS_INVALID");\n\n'''
              if anchor not in test:
                  raise SystemExit('profile rejection test anchor drifted')
              test = test.replace(anchor, anchor + rejection, 1)

          helper_and_test = r'''
class MutableKillSwitchReader final : public IbPaperKillSwitchReader
{
public:
    explicit MutableKillSwitchReader(IbPaperKillSwitchState state)
        : m_state(state) {}

    void SetState(IbPaperKillSwitchState state) { m_state = state; }

    IbPaperKillSwitchObservation Observe() const override
    {
        IbPaperKillSwitchObservation observation;
        observation.state = m_state;
        if (m_state == IbPaperKillSwitchState::Engaged)
            observation.reasonCode = "IB_PAPER_KILL_SWITCH_ENGAGED";
        else if (m_state == IbPaperKillSwitchState::Uncertain)
            observation.reasonCode = "IB_PAPER_KILL_SWITCH_STATE_UNCERTAIN";
        return observation;
    }

private:
    IbPaperKillSwitchState m_state;
};

IbPlaceOrderCommand QualificationOrder(const char* side, double quantity)
{
    IbPlaceOrderCommand command;
    command.context.account = "DU123456";
    command.context.venue = "IB";
    command.context.executionDomain = "PAPER";
    command.contract.symbol = "EUR";
    command.contract.currency = "USD";
    command.contract.secType = "CASH";
    command.contract.exchange = "IDEALPRO";
    command.instrument = "EUR.USD";
    command.order.action = side;
    command.order.orderType = "LMT";
    command.order.totalQuantity = quantity;
    command.order.lmtPrice = 1.10;
    command.referencePrice = 1.10;
    command.timeInForce = "DAY";
    return command;
}

AuthoritativeFlattenPlan QualificationFlatten(double position)
{
    AuthoritativeFlattenPlan plan;
    plan.profileOrderMode = "EXTERNAL_QUALIFICATION_LMT_DAY";
    plan.timeInForce = "DAY";
    plan.expectedPositionQuantity = position;
    plan.order.action = position > 0.0 ? "SELL" : "BUY";
    plan.order.orderType = "LMT";
    plan.order.totalQuantity = std::fabs(position);
    plan.quoteSubscriptionId = "qualification-quote";
    plan.quoteObservedAtMs = 1000;
    plan.quoteStaleAfterMs = 5000;
    plan.quoteBid = 1.10;
    plan.quoteAsk = 1.11;
    plan.order.lmtPrice = position > 0.0 ? plan.quoteBid : plan.quoteAsk;
    plan.referencePrice = plan.order.lmtPrice;
    return plan;
}

void TestSequentialFillsRemainAtomicallyFlattenable()
{
    std::map<std::string, std::string> values = QualificationValues();
    values["HEPTA_IB_PAPER_MAX_ORDER_QTY"] = "250000";
    values["HEPTA_IB_PAPER_MAX_GROSS_POSITION"] = "250000";
    IbPaperExecutionProfileConfig config;
    std::string reason;
    assert(IbPaperExecutionProfileConfig::FromValues(values, config, reason));
    assert(config.maxOrderQuantity == config.maxGrossPosition);
    assert(config.maxActiveOrders == 1);
    assert(config.qualificationQuoteContracts ==
        "EUR.USD|EUR|CASH|IDEALPRO|USD");

    const std::shared_ptr<MutableKillSwitchReader> switchReader(
        new MutableKillSwitchReader(IbPaperKillSwitchState::Disarmed));
    IbPaperExecutionGuard guard(config, switchReader);
    IbPaperAuthoritativeRiskSnapshot risk;
    risk.complete = true;
    risk.activeOrderCount = 0;

    // Two sequential completed fills can reach, but never exceed, the exact
    // one-order recovery envelope.
    risk.grossAbsolutePosition = 0.0;
    const IbPlaceOrderCommand first = QualificationOrder("BUY", 125000.0);
    assert(guard.AllowPlaceAtAuthoritativePrice(
        first, risk, 1.10, 2000, reason));
    risk.grossAbsolutePosition = 125000.0;
    const IbPlaceOrderCommand second = QualificationOrder("BUY", 125000.0);
    assert(guard.AllowPlaceAtAuthoritativePrice(
        second, risk, 1.10, 2100, reason));
    risk.grossAbsolutePosition = 250000.0;
    const IbPlaceOrderCommand overflow = QualificationOrder("BUY", 1.0);
    assert(!guard.AllowPlaceAtAuthoritativePrice(
        overflow, risk, 1.10, 2200, reason));
    assert(reason == "IB_PAPER_MAX_GROSS_POSITION_EXCEEDED");

    switchReader->SetState(IbPaperKillSwitchState::Engaged);
    FlattenPositionCommand flatten;
    flatten.context.account = config.account;
    flatten.context.venue = "IB";
    flatten.context.executionDomain = "PAPER";
    flatten.context.allowCancelAny = false;
    AuthoritativeFlattenPlan longPlan = QualificationFlatten(250000.0);
    assert(guard.AllowFlatten(flatten, longPlan, risk, 2300, reason));
    assert(reason.empty());

    // A signed partial fill remains an exact, no-over-close reduction too.
    risk.grossAbsolutePosition = 125000.0;
    AuthoritativeFlattenPlan shortPartial = QualificationFlatten(-125000.0);
    assert(guard.AllowFlatten(flatten, shortPartial, risk, 2400, reason));
    assert(reason.empty());

    AuthoritativeFlattenPlan unreachable = QualificationFlatten(250001.0);
    assert(!guard.AllowFlatten(flatten, unreachable, risk, 2500, reason));
    assert(reason == "IB_PAPER_EXTERNAL_FLATTEN_POSITION_LIMIT_EXCEEDED");
}
'''
          # Replace the earlier, narrower helper/test when present; otherwise
          # insert the canonical sequential-fill regression before namespace end.
          start = test.find('class FixedKillSwitchReader final')
          if start >= 0:
              end = test.find('\n}\n\nint main()', start)
              if end < 0:
                  raise SystemExit('existing V5 test block terminator drifted')
              test = test[:start] + helper_and_test + test[end:]
          elif 'class MutableKillSwitchReader final' not in test:
              marker = '\n}\n\nint main()\n'
              if marker not in test:
                  raise SystemExit('test namespace terminator drifted')
              test = test.replace(marker, '\n' + helper_and_test + marker, 1)

          if 'TestSequentialFillsRemainAtomicallyFlattenable();' not in test:
              call_anchor = '    TestQualificationProfileRejectsWiderOrAmbiguousAuthority();\n'
              if call_anchor not in test:
                  raise SystemExit('test main anchor drifted')
              test = test.replace(
                  call_anchor,
                  call_anchor + '    TestSequentialFillsRemainAtomicallyFlattenable();\n',
                  1,
              )
          # Remove a stale call if the narrower function was replaced.
          test = test.replace(
              '    TestQualificationEnvelopeAlwaysHasAnAtomicFlattenPath();\n', ''
          )
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Run canonical core and Python suites
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev
          ./scripts/dev_core.sh
          python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Publish final PR58 source and remove remediation carriers
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/codex-fix-pr58-v5-envelope.yml \
            .github/workflows/codex-finalize-pr58-v5-envelope.yml
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo 'No source delta remains after validation.'
            exit 0
          fi
          git commit -m 'fix(ib-paper): close atomic V5 recovery envelope'
          git push origin HEAD:plan/p2-bounded-paper-v5-source-20260910
