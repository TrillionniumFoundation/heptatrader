name: Native quote diagnostic contracts
'on':
  pull_request:
    paths:
      - 'research/neuron_learning/laya_cell/**'
      - '.github/workflows/quote-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source under review
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify event source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run quote acceptance, provenance and source integrity checks
        env:
          PYTHONPATH: research/neuron_learning
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest -v \
            laya_cell.tests.test_native_quote_diagnostics \
            laya_cell.tests.test_feed_health \
            laya_cell.tests.test_shadow_source
          python3 -m unittest discover -v -s tests/python -p test_original_quote_transport_faults.py
