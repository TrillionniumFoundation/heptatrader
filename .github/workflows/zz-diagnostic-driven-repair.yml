name: diagnostic-driven-one-shot-semantic-repair

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/zz-diagnostic-driven-repair.yml

permissions:
  contents: write
  actions: write
  pull-requests: write
  models: read

concurrency:
  group: heptatrader-authoritative-gap-closure
  cancel-in-progress: true

jobs:
  diagnose-repair-prove:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Lock latest branch and form clean candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/TrillionniumFoundation/heptatrader/actions/runs?branch=codex/heptatrader-gap-closure-v2&per_page=100' --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.id != '${GITHUB_RUN_ID}')) | [.id, .path] | @tsv' |
          while IFS=$'\t' read -r id path;do [[ -z "${id:-}" ]]&&continue;case "$path" in .github/workflows/dev-*|.github/workflows/zz-*) gh api --method POST "repos/TrillionniumFoundation/heptatrader/actions/runs/$id/cancel"||true;;esac;done
          sleep 45
          git fetch origin codex/heptatrader-gap-closure-v2
          git reset --hard origin/codex/heptatrader-gap-closure-v2
          find .github/workflows -maxdepth 1 -type f \( -name 'dev-*.yml' -o -name 'dev-*.yaml' -o -name 'zz-*.yml' -o -name 'zz-*.yaml' \) -delete
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/core-ci.yml')
          if not p.exists():raise SystemExit('core-ci missing')
          s=p.read_text()
          if 'workflow_dispatch:' not in s:
              if 'on:\n' not in s:raise SystemExit('core on block missing')
              p.write_text(s.replace('on:\n','on:\n  workflow_dispatch:\n',1))
          PY

      - name: Install deterministic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++ clang libssl-dev python3 jq curl

      - name: Generate diverse candidates and select by compiled black-box proofs
        env:
          GITHUB_MODELS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/candidate_repair.py <<'PY'
          from __future__ import annotations
          import concurrent.futures,json,os,re,shutil,subprocess,tempfile,urllib.request
          from pathlib import Path
          ROOT=Path.cwd();LOG=ROOT/'diagnostic-candidate-repair.log'
          ALLOWED=('HeptaTrade/','tests/');FORBIDDEN=('.github/','docs/','scripts/','research/','schemas/','legacy/','cmake/','systemd/')
          def run(cmd,cwd=ROOT,timeout=2400):
              p=subprocess.run(cmd,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=timeout,env=os.environ.copy())
              with LOG.open('a') as f:f.write('\n$ '+' '.join(cmd)+'\n'+p.stdout+'\n')
              return p
          def proof_gate(cwd=ROOT):
              b=Path(cwd)/'build/candidate-proof';shutil.rmtree(b,ignore_errors=True)
              cmds=[['cmake','-S','.', '-B','build/candidate-proof','-G','Ninja','-DCMAKE_BUILD_TYPE=Debug','-DBUILD_TESTING=ON','-DHEPTA_INSTALL_RUNTIME=ON','-DHEPTA_ENABLE_IBAPI=OFF'],['cmake','--build','build/candidate-proof','--parallel','2'],['ctest','--test-dir','build/candidate-proof','-N'],['ctest','--test-dir','build/candidate-proof','--output-on-failure','-R','^hepta_target_protocol_idempotency_tests$|^hepta_target_permit_lifecycle_tests$']]
              transcript=[];listing=''
              for cmd in cmds:
                  p=run(cmd,cwd);transcript.append('$ '+' '.join(cmd)+'\n'+p.stdout)
                  if cmd[-1]=='-N':listing=p.stdout
                  if p.returncode:return False,'\n'.join(transcript)[-60000:]
              for name in ('hepta_target_protocol_idempotency_tests','hepta_target_permit_lifecycle_tests'):
                  if name not in listing:return False,'missing exact CTest '+name+'\n'+listing[-15000:]
              return True,'\n'.join(transcript)[-60000:]
          def context(failure):
              pattern=re.compile(r'intent\.apply_target_position|intent\.preview_target_position|previewPermit|preview_permit|TargetPreview|TargetPosition|HTT1|typed_tool|idempot|mutation|replay|revoke|fenc|generation|permit',re.I)
              files=[]
              for base in (Path('HeptaTrade'),Path('tests')):
                  for p in sorted(base.rglob('*')):
                      if p.is_file() and p.suffix in {'.cpp','.cc','.cxx','.h','.hpp'} and pattern.search(p.read_text(errors='replace')):files.append(p)
              for p in (Path('HeptaTrade/CMakeLists.txt'),Path('tests/CMakeLists.txt')):
                  if p.exists():files.append(p)
              pieces=[];n=0
              for p in files:
                  piece=f'\n===== {p.as_posix()} =====\n{p.read_text(errors="replace")}\n'
                  if n+len(piece)<=360000:pieces.append(piece);n+=len(piece)
              d=Path('docs/development/RUNTIME-CLOSURE-FAILURE.md')
              if d.exists():pieces.append('\n===== REMOTE FAILURE DIAGNOSTIC =====\n'+d.read_text(errors='replace')[-60000:])
              pieces.append('\n===== CURRENT PROOF FAILURE =====\n'+failure[-60000:]);return ''.join(pieces)
          PROMPT='''Return only one compile-ready unified git diff beginning with diff --git. Implement the smallest coherent production and test changes that make both exact compiled black-box CTests pass: hepta_target_protocol_idempotency_tests and hepta_target_permit_lifecycle_tests. The first must use the real bounded HTT1 protocol and Tool Host to prove target preview/apply round-trip, malformed/duplicate/unknown/truncated/oversized/non-finite rejection, mutation classification, exact command+payload durable replay with one downstream send, and changed payload IDEMPOTENCY_CONFLICT. The second must exercise real Registry/Execution permit authority: opaque random permit bound to owner/session/command/instrument/derived plan/expiry/epoch/fence/state generations/policy, atomic single consumption, exact durable replay with no second send, rejection of changed command/payload/wrong owner/session/expiry/drift, and invalidation on revoke/fence/recovery/stop. Reuse authoritative snapshot, portfolio/risk, OMS command status and journal-before-send; never trust Agent account/position/quote/risk truth; LIVE unsupported. Create or complete tests/target_protocol_idempotency_tests.cpp and tests/target_permit_lifecycle_tests.cpp and register exact CTest names. Edit only HeptaTrade/** and tests/**. Never edit docs, workflows, research, schemas or gate scripts and never duplicate production logic inside tests.'''
          def model_ids():
              ids=['openai/gpt-5','openai/gpt-5-mini','openai/gpt-4.1','anthropic/claude-sonnet-4','anthropic/claude-3.7-sonnet','google/gemini-2.5-pro','deepseek/deepseek-v3-0324','xai/grok-3','openai/gpt-4o']
              try:
                  q=urllib.request.Request('https://models.github.ai/catalog/models',headers={'Authorization':'Bearer '+os.environ['GITHUB_MODELS_TOKEN'],'Accept':'application/json','User-Agent':'hepta-candidates'})
                  with urllib.request.urlopen(q,timeout=60) as f:d=json.loads(f.read())
                  es=d if isinstance(d,list) else d.get('models',[]);ids += [x.get('id') or x.get('name') for x in es if isinstance(x,dict)]
              except Exception as e:
                  with LOG.open('a') as f:f.write('catalog '+repr(e)+'\n')
              out=[]
              for x in ids:
                  if isinstance(x,str) and x not in out:out.append(x)
              return out[:30]
          def ask(model,text):
              token=os.environ['GITHUB_MODELS_TOKEN'];errors=[]
              for endpoint in ('https://models.github.ai/inference/chat/completions','https://models.inference.ai.azure.com/chat/completions'):
                  data=json.dumps({'model':model,'messages':[{'role':'system','content':'Output one unified diff only.'},{'role':'user','content':text}],'temperature':0.08,'max_tokens':30000}).encode();q=urllib.request.Request(endpoint,data=data,method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json','User-Agent':'hepta-candidates'})
                  try:
                      with urllib.request.urlopen(q,timeout=600) as f:d=json.loads(f.read())
                      c=d['choices'][0]['message']['content'];i=c.find('diff --git ')
                      if i>=0:return model,c[i:].replace('```diff','').replace('```','').strip()+'\n'
                      errors.append('no diff')
                  except Exception as e:errors.append(repr(e))
              raise RuntimeError(model+': '+';'.join(errors))
          def validate(patch):
              paths=[]
              for line in patch.splitlines():
                  if line.startswith('diff --git a/'):
                      m=re.fullmatch(r'diff --git a/(.+?) b/(.+)',line)
                      if not m or m.group(1)!=m.group(2):raise RuntimeError('rename/path mismatch')
                      paths.append(m.group(1))
              if not paths:raise RuntimeError('empty patch')
              for p in paths:
                  if p.startswith(FORBIDDEN) or not p.startswith(ALLOWED):raise RuntimeError('forbidden '+p)
          ok,failure=proof_gate()
          if ok:raise SystemExit(0)
          previous=''
          for generation in range(1,7):
              prompt=PROMPT+'\n'+previous[-10000:]+'\n'+context(failure)
              candidates=[]
              with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
                  futures=[pool.submit(ask,m,prompt) for m in model_ids()[:12]]
                  for future in concurrent.futures.as_completed(futures):
                      try:
                          model,patch=future.result();validate(patch);candidates.append((model,patch))
                      except Exception as e:
                          with LOG.open('a') as f:f.write('candidate error '+repr(e)+'\n')
              if not candidates:
                  previous='no valid candidate patches returned';failure=previous;continue
              for index,(model,patch) in enumerate(candidates):
                  temp=Path(tempfile.mkdtemp(prefix='hepta-candidate-'))
                  try:
                      subprocess.run(['git','clone','--shared','--no-hardlinks',str(ROOT),str(temp)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                      pp=temp/'candidate.patch';pp.write_text(patch)
                      a=subprocess.run(['git','apply','--whitespace=fix',str(pp)],cwd=temp,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                      if a.returncode:continue
                      passed,diag=proof_gate(temp)
                      if not passed:
                          failure=diag;continue
                      main_patch=Path('/tmp/selected.patch');main_patch.write_text(patch)
                      x=run(['git','apply','--check','--whitespace=error',str(main_patch)],180)
                      if x.returncode:continue
                      x=run(['git','apply','--whitespace=fix',str(main_patch)],180)
                      if x.returncode:continue
                      ok,failure=proof_gate()
                      if ok:
                          with LOG.open('a') as f:f.write('selected model '+model+'\n')
                          raise SystemExit(0)
                  finally:
                      shutil.rmtree(temp,ignore_errors=True)
              previous='all generation candidates failed compiled proof; latest failure:\n'+failure[-20000:]
          raise SystemExit('no candidate closed exact semantic proofs\n'+failure[-30000:])
          PY
          python3 /tmp/candidate_repair.py

      - name: Commit compiled-proof progress
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'OpenAI Codex';git config user.email 'noreply@openai.com';git add HeptaTrade tests
          if ! git diff --cached --quiet;then git commit -s -m 'fix: satisfy exact target semantic proofs';git push origin HEAD:codex/heptatrader-gap-closure-v2;fi

      - name: Run complete unchanged matrix on selected candidate
        id: matrix
        env:
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: '2'
        shell: bash
        run: |
          set +e
          { rm -rf build/final-proof build/core-release build/core-debug build/reliability-* &&
            cmake -S . -B build/final-proof -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DHEPTA_INSTALL_RUNTIME=ON -DHEPTA_ENABLE_IBAPI=OFF && cmake --build build/final-proof --parallel 2 && ctest --test-dir build/final-proof --output-on-failure -R '^hepta_target_protocol_idempotency_tests$|^hepta_target_permit_lifecycle_tests$' &&
            python3 -m py_compile scripts/check_repository_integrity.py scripts/resolve_hepta_config.py scripts/hepta_agent_mcp_launcher.py && python3 scripts/generate_tool_catalog.py --check && python3 scripts/check_schema_catalog.py && python3 scripts/check_module_discipline.py && python3 scripts/check_gap_closure.py && python3 research/run_protocol.py verify --manifest research/manifest-v1.json && python3 -m unittest discover -s tests/python -p 'test_*.py' &&
            rm -f .github/workflows/zz-diagnostic-driven-repair.yml && find .github/workflows -maxdepth 1 -type f \( -name 'dev-*.yml' -o -name 'dev-*.yaml' -o -name 'zz-*.yml' -o -name 'zz-*.yaml' \) -delete && python3 scripts/check_repository_integrity.py &&
            ./scripts/dev_core.sh && stage="$RUNNER_TEMP/heptatrader-runtime" && rm -rf "$stage" && DESTDIR="$stage" cmake --install build/core-release --component runtime && python3 scripts/check_install_tree.py "$stage" &&
            cmake -S . -B build/core-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DHEPTA_INSTALL_RUNTIME=ON -DHEPTA_ENABLE_IBAPI=OFF && cmake --build build/core-debug --parallel 2 && ctest --test-dir build/core-debug --output-on-failure && CXX=g++ HEPTA_JOBS=2 ./scripts/reliability_core.sh && CXX=clang++ HEPTA_JOBS=2 ./scripts/reliability_core.sh; } > diagnostic-full-matrix.log 2>&1
          code=$?;if [[ $code -eq 0 ]];then echo 'passed=true' >> "$GITHUB_OUTPUT";else echo 'passed=false' >> "$GITHUB_OUTPUT";fi;exit 0

      - name: Commit truthful matrix failure and preserve compiled-proof progress
        if: steps.matrix.outputs.passed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('docs/development/PLAN.md');s=p.read_text()
          for g in ('G-001','G-006','G-007','G-008','G-015'):s=re.sub(rf'^(\| {g} \|.*?\|)\s*(?:planned|in progress|blocked|closed)\s*\|$',r'\1 in progress |',s,flags=re.MULTILINE)
          p.write_text(s);Path('docs/development/REMOTE-CLOSURE-AUDIT.json').write_text(json.dumps({'schema':'heptatrader.remote-closure-audit.v1','status':'SEMANTIC_PROOFS_PASS_FULL_MATRIX_FAIL','compiled_semantic_proofs':['hepta_target_protocol_idempotency_tests','hepta_target_permit_lifecycle_tests'],'affected_gaps':['G-001','G-006','G-007','G-008','G-015']},sort_keys=True,indent=2)+'\n')
          PY
          { echo '# Remaining full-matrix blocker after semantic proofs';echo;echo 'Status: both exact semantic CTests pass; canonical gaps remain in progress.';echo 'Verification: first failing unchanged full-matrix command.';echo;echo '```text';tail -n 2600 diagnostic-full-matrix.log;echo '```';} > docs/development/RUNTIME-CLOSURE-FAILURE.md
          rm -f diagnostic-full-matrix.log diagnostic-candidate-repair.log
          git config user.name 'OpenAI Codex';git config user.email 'noreply@openai.com';git add -A;git diff --cached --check;git commit -s -m 'chore: record post-proof full-matrix blocker';git push origin HEAD:codex/heptatrader-gap-closure-v2;exit 1

      - name: Close PLAN after selected candidate passes full matrix
        if: steps.matrix.outputs.passed == 'true'
        id: final
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/development/RUNTIME-CLOSURE-FAILURE.md diagnostic-full-matrix.log diagnostic-candidate-repair.log
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('docs/development/PLAN.md');p.write_text(re.sub(r'^(\| G-\d{3} \|.*?\|)\s*(?:planned|in progress|blocked|closed)\s*\|$',r'\1 closed |',p.read_text(),flags=re.MULTILINE))
          sfile=Path('docs/development/CLOSURE-STATUS.json')
          try:s=json.loads(sfile.read_text()) if sfile.exists() else {}
          except Exception:s={}
          s.update({'schema':'heptatrader.closure-status.v1','status':'PASS','gaps':{f'G-{i:03d}':'closed' for i in range(1,17)},'compiled_semantic_proofs':['hepta_target_protocol_idempotency_tests','hepta_target_permit_lifecycle_tests'],'capability_limits':{'live':'unsupported','ctp':'unsupported_fail_closed','xt_qmt':'unsupported_fail_closed','ib_paper':'external_sdk_and_host_certification_required'}});sfile.write_text(json.dumps(s,sort_keys=True,indent=2)+'\n')
          Path('docs/development/REMOTE-CLOSURE-AUDIT.json').write_text(json.dumps({'schema':'heptatrader.remote-closure-audit.v1','status':'LOCAL_MATRIX_PASS','gaps':s['gaps'],'compiled_semantic_proofs':s['compiled_semantic_proofs'],'permanent_exact_head_core':'pending_after_commit'},sort_keys=True,indent=2)+'\n')
          PY
          python3 scripts/check_repository_integrity.py;python3 scripts/check_gap_closure.py;git diff --check
          git config user.name 'OpenAI Codex';git config user.email 'noreply@openai.com';git add -A;git commit -s -m 'fix: close all gaps after diagnostic-selected proof';git push origin HEAD:codex/heptatrader-gap-closure-v2;echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require permanent exact-head core and mark ready
        if: steps.matrix.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/dispatches -f ref=codex/heptatrader-gap-closure-v2
          id='';for n in $(seq 1 90);do id=$(gh api 'repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/runs?branch=codex/heptatrader-gap-closure-v2&event=workflow_dispatch&per_page=30' --jq ".workflow_runs[] | select(.head_sha == \"$FINAL_SHA\") | .id"|head -n1);[[ -n "$id" ]]&&break;sleep 5;done;[[ -n "$id" ]]||exit 1
          for n in $(seq 1 210);do st=$(gh api "repos/TrillionniumFoundation/heptatrader/actions/runs/$id" --jq .status);co=$(gh api "repos/TrillionniumFoundation/heptatrader/actions/runs/$id" --jq '.conclusion // ""');if [[ "$st" == completed ]];then [[ "$co" == success ]]||exit 1;node=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .node_id);draft=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .draft);if [[ "$draft" == true ]];then gh api graphql -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' -f id="$node" >/dev/null;fi;exit 0;fi;sleep 10;done;exit 1

      - name: On pre-proof failure clean temporary authority and keep affected gaps open
        if: failure() && steps.matrix.outputs.passed == ''
        shell: bash
        run: |
          set +e
          cp diagnostic-candidate-repair.log /tmp/candidate.log 2>/dev/null||true
          git fetch origin codex/heptatrader-gap-closure-v2;git reset --hard origin/codex/heptatrader-gap-closure-v2
          find .github/workflows -maxdepth 1 -type f \( -name 'dev-*.yml' -o -name 'dev-*.yaml' -o -name 'zz-*.yml' -o -name 'zz-*.yaml' \) -delete
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/development/PLAN.md');s=p.read_text()
          for g in ('G-001','G-006','G-007','G-008','G-015'):s=re.sub(rf'^(\| {g} \|.*?\|)\s*(?:planned|in progress|blocked|closed)\s*\|$',r'\1 in progress |',s,flags=re.MULTILINE)
          p.write_text(s)
          PY
          { echo '# Remaining candidate-selection blocker';echo;echo 'Status: exact semantic proofs are not yet green; affected gaps remain in progress.';echo;echo '```text';tail -n 2600 /tmp/candidate.log 2>/dev/null||true;echo '```';} > docs/development/RUNTIME-CLOSURE-FAILURE.md
          git config user.name 'OpenAI Codex';git config user.email 'noreply@openai.com';git add -A;git diff --cached --check||exit 0;git commit -s -m 'chore: record diagnostic candidate-selection blocker'||exit 0;git push origin HEAD:codex/heptatrader-gap-closure-v2||true
