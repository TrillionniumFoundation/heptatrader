name: core-runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Temporary developer aid for the active gap-closure branch. It gives the
      # reviewing agent an exact local copy without granting CI repository write
      # permission. This step is removed before the PR becomes ready.
      - name: Pack exact source snapshot
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'codex/heptatrader-gap-closure-v2'
        run: |
          tar --exclude=.git --exclude=build \
            -czf "$RUNNER_TEMP/heptatrader-source.tgz" .

      - name: Upload exact source snapshot
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'codex/heptatrader-gap-closure-v2'
        uses: actions/upload-artifact@v4
        with:
          name: heptatrader-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/heptatrader-source.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ libssl-dev python3

      - name: Validate repository contracts and entry points
        run: |
          bash -n scripts/dev_core.sh
          python3 -m py_compile \
            scripts/check_repository_integrity.py \
            scripts/resolve_hepta_config.py \
            scripts/hepta_agent_mcp_launcher.py
          python3 -m json.tool CMakePresets.json >/dev/null
          python3 -m json.tool research/manifest-v1.json >/dev/null
          python3 -m json.tool \
            plugins/heptatrader-agent-os/.mcp.json >/dev/null
          python3 scripts/check_repository_integrity.py

      - name: Build and test the deterministic core
        env:
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: "2"
        run: ./scripts/dev_core.sh

      - name: Verify minimal runtime install tree
        run: |
          stage="$RUNNER_TEMP/heptatrader-runtime"
          DESTDIR="$stage" cmake --install build/core-release \
            --component runtime
          test -x "$stage/usr/local/bin/heptactl"
          test -x "$stage/usr/local/bin/hepta-sessionctl"
          test -x "$stage/usr/local/bin/hepta-agent-mcp-launcher"
          test -x "$stage/usr/local/libexec/heptatrader/hepta-tool-gatewayd"
          test -x "$stage/usr/local/libexec/heptatrader/hepta-executiond"
          test -x "$stage/usr/local/libexec/heptatrader/hepta-mcp-server"
          test -f "$stage/usr/local/lib/systemd/system/hepta-tool-gateway.service"
          test -f "$stage/usr/local/lib/systemd/system/hepta-execution-simulator.service"
          test -f "$stage/usr/local/share/heptatrader/research/manifest-v1.json"
          grep -F '/usr/local/libexec/heptatrader/hepta-tool-gatewayd' \
            "$stage/usr/local/lib/systemd/system/hepta-tool-gateway.service"
          grep -F '/usr/local/libexec/heptatrader/hepta-executiond' \
            "$stage/usr/local/lib/systemd/system/hepta-execution-simulator.service"
