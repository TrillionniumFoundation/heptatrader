name: Core Runtime CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: heptatrader-core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core-runtime-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev python3-yaml

      - name: Build and run canonical core tests
        env:
          HEPTA_BUILD_DIR: ${{ github.workspace }}/build/core
          HEPTA_JOBS: "2"
        run: ./scripts/dev_core.sh

      - name: Accept the exact core artifact through installed processes and systemd
        id: accept-core-artifact
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/accept_core_release.py --build-dir build/core --output-dir dist --source-sha "$EXPECTED_SHA"

      - name: Retain lifecycle diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: core-lifecycle-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/process-evidence/
            dist/systemd-evidence/
            dist/core-acceptance.json
            dist/release-simulator-smoke-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload immutable main-branch core package evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-core-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/heptatrader-*-core-*.tar.gz
            dist/heptatrader-*-core-*.tar.gz.sha256
            dist/heptatrader-*-core-*.tar.gz.receipt.json
            dist/release-simulator-smoke-*.json
            dist/core-acceptance.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Reassert clean exact source
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
