name: Core Runtime CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: heptatrader-core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core-runtime-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Retain exact tracked source for reproducible diagnosis
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          source="dist/heptatrader-source-${EXPECTED_SHA}.tar.gz"
          git archive --format=tar.gz --output="$source" "$EXPECTED_SHA"
          sha256sum "$source" > "$source.sha256"
          git cat-file commit "$EXPECTED_SHA" > "$source.git-commit"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev

      - name: Build and run canonical core tests
        env:
          HEPTA_BUILD_DIR: ${{ github.workspace }}/build/core
          HEPTA_JOBS: "2"
        run: ./scripts/dev_core.sh

      - name: Verify registered CMake install inventory under fresh DESTDIR
        env:
          HEPTA_RELEASE_INTEGRATION_BUILD_DIR: ${{ github.workspace }}/build/core
        run: python3 -m unittest discover -s tests/python -p 'test_cmake_install_integration.py'

      - name: Verify deployment unit contract without host mutation
        run: python3 scripts/check_systemd_units.py

      - name: Package, preflight, install, execute, roll back and re-promote the exact tested core
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          epoch="$(git show -s --format=%ct "$EXPECTED_SHA")"
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          package="dist/heptatrader-${version}-core-${EXPECTED_SHA}.tar.gz"
          python3 scripts/build_release_package.py \
            --build-dir build/core \
            --output "$package" \
            --version "$version" \
            --profile core \
            --source-sha "$EXPECTED_SHA" \
            --source-date-epoch "$epoch"
          digest="$(cut -d' ' -f1 "$package.sha256")"
          python3 scripts/run_release_simulator_smoke.py \
            --artifact "$package" \
            --expected-sha256 "$digest" \
            --profile core \
            --policy docs/preflight-policy-v1.json \
            --preflight scripts/hepta_preflight.py \
            --work-root "dist/release-simulator-smoke-${EXPECTED_SHA}" \
            --output "dist/release-simulator-smoke-${EXPECTED_SHA}.json"

      - name: Run Python contract tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Retain exact source, package and diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-core-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Reassert clean exact source
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
