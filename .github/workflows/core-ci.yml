name: Core Runtime CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: heptatrader-core-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core-runtime-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact event subject without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev

      - name: Build and run canonical core tests
        env:
          HEPTA_BUILD_DIR: ${{ github.workspace }}/build/core
          HEPTA_JOBS: "2"
        run: ./scripts/dev_core.sh

      - name: Verify registered CMake install inventory under fresh DESTDIR
        env:
          HEPTA_RELEASE_INTEGRATION_BUILD_DIR: ${{ github.workspace }}/build/core
        run: python3 scripts/run_python_tests.py --lane install

      - name: Package, preflight, component integration and same-artifact slot-switch smoke
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          epoch="$(git show -s --format=%ct "$EXPECTED_SHA")"
          version="$(tr -d '[:space:]' < VERSION)"
          test -n "$version"
          package="dist/heptatrader-${version}-core-${EXPECTED_SHA}.tar.gz"
          python3 scripts/build_release_package.py \
            --build-dir build/core \
            --output "$package" \
            --version "$version" \
            --profile core \
            --source-sha "$EXPECTED_SHA" \
            --source-date-epoch "$epoch"
          digest="$(cut -d' ' -f1 "$package.sha256")"
          python3 scripts/run_release_simulator_smoke.py \
            --artifact "$package" \
            --expected-sha256 "$digest" \
            --profile core \
            --policy docs/preflight-policy-v1.json \
            --preflight scripts/hepta_preflight.py \
            --work-root "dist/release-simulator-smoke-${EXPECTED_SHA}" \
            --output "dist/release-simulator-smoke-${EXPECTED_SHA}.json"

      - name: Build the reviewed rollback reference without credentials
        env:
          REFERENCE_SHA: d003f54c7c6c2bd19002627f2bcd9081228b01cd
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/hepta-rollback-reference"
          git init "$reference"
          git -C "$reference" remote add origin https://github.com/TrillionniumFoundation/heptatrader.git
          git -C "$reference" fetch --no-tags --depth=1 origin "$REFERENCE_SHA"
          git -C "$reference" checkout --detach FETCH_HEAD
          test "$(git -C "$reference" rev-parse HEAD)" = "$REFERENCE_SHA"
          cmake -S "$reference" -B "$RUNNER_TEMP/hepta-reference-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_IB_PROBE=OFF \
            -DHEPTA_ENABLE_IBAPI=OFF -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF
          cmake --build "$RUNNER_TEMP/hepta-reference-build" \
            --target hepta_core_test_binaries --parallel 2
          python3 scripts/build_release_package.py \
            --build-dir "$RUNNER_TEMP/hepta-reference-build" \
            --output "dist/rollback-reference-${REFERENCE_SHA}.tar.gz" \
            --version "$(tr -d '[:space:]' < "$reference/VERSION")" --profile core \
            --source-sha "$REFERENCE_SHA" \
            --source-date-epoch "$(git -C "$reference" show -s --format=%ct HEAD)"

      - name: Run installed multi-UID processes and distinct-artifact rollback
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REFERENCE_SHA: d003f54c7c6c2bd19002627f2bcd9081228b01cd
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          candidate="$GITHUB_WORKSPACE/dist/heptatrader-${version}-core-${EXPECTED_SHA}.tar.gz"
          previous="$GITHUB_WORKSPACE/dist/rollback-reference-${REFERENCE_SHA}.tar.gz"
          # Hosted disposable runner only. The fixture refuses an existing
          # /run/hepta-agent and never starts a broker-capable executable.
          sudo env -i PATH=/usr/bin:/bin LC_ALL=C PYTHONDONTWRITEBYTECODE=1 \
            HEPTA_ISOLATED_PROCESS_TESTS=1 \
            HEPTA_PROCESS_CANDIDATE_ARTIFACT="$candidate" \
            HEPTA_PROCESS_CANDIDATE_SHA256="$(cut -d' ' -f1 "$candidate.sha256")" \
            HEPTA_PROCESS_PREVIOUS_ARTIFACT="$previous" \
            HEPTA_PROCESS_PREVIOUS_SHA256="$(cut -d' ' -f1 "$previous.sha256")" \
            HEPTA_PROCESS_EVIDENCE_DIR="$GITHUB_WORKSPACE/dist/process-evidence" \
            python3 scripts/run_python_tests.py --lane process

      - name: Retain exact-pair process evidence and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-process-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/process-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Run core Python behavior partition (source and install run separately)
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python3 scripts/run_python_tests.py --lane core

      - name: Upload immutable main-branch core package evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-core-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Reassert clean exact source
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
