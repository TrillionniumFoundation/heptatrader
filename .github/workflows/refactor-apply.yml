name: Temporary Exact Refactor Materialization

on:
  push:
    branches:
      - codex/close-architecture-docs-ci-risk-gaps-20260907
    paths:
      - '.github/workflows/refactor-apply.yml'

permissions:
  contents: read

jobs:
  materialize:
    name: materialize-current-refactor-payload
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Decode and apply current reviewed payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          encoded = Path('scripts/refactor_apply.py.gz.b64').read_text(encoding='utf-8').strip()
          payload = gzip.decompress(base64.b64decode(encoded, validate=True))
          target = Path('/tmp/heptatrader-refactor-apply.py')
          target.write_bytes(payload)
          target.chmod(0o700)
          PY
          python3 /tmp/heptatrader-refactor-apply.py
          rm -f .github/workflows/refactor-apply.yml scripts/refactor_apply.py.gz.b64
          git diff --check
      - name: Validate source contracts before export
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/check_gap_register.py
          python3 scripts/verify_canonical_ib_paper_profile.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Package materialized candidate
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/heptatrader-materialized-source.tgz" \
            --exclude=.git --exclude=build .
      - name: Upload materialized candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-materialized-${{ github.sha }}
          path: ${{ runner.temp }}/heptatrader-materialized-source.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
