name: Temporary Exact Source Recovery

on:
  push:
    branches:
      - codex/close-architecture-docs-ci-risk-gaps-20260907
    paths:
      - '.github/workflows/refactor-apply.yml'

permissions:
  contents: read

jobs:
  snapshot:
    name: export-current-exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source head without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate and package untouched worktree
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- .
          git diff --cached --exit-code -- .
          python3 - <<'PY'
          import base64
          from pathlib import Path
          encoded = Path('scripts/refactor_apply.py.gz.b64').read_text(encoding='utf-8').strip()
          decoded = base64.b64decode(encoded, validate=True)
          Path('/tmp/refactor-payload.gz').write_bytes(decoded)
          print(f'payload_base64_chars={len(encoded)} payload_gzip_bytes={len(decoded)}')
          PY
          tar -czf "$RUNNER_TEMP/heptatrader-current-exact-source.tgz" \
            --exclude=.git --exclude=build .
      - name: Upload exact source recovery snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-current-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/heptatrader-current-exact-source.tgz
            /tmp/refactor-payload.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
