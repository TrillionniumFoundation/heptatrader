name: Validate and extract reviewed PR24 hardening payload

on:
  push:
    branches:
      - codex/harden-qualification-trust-boundary-20260904
    paths:
      - '.github/workflows/materialize-pr24-hardening.yml'
      - '.github/pr24-hardening-payload.part00'
      - '.github/pr24-hardening-payload.part01'
      - '.github/pr24-hardening-payload.part02'

permissions:
  contents: read

concurrency:
  group: validate-extract-pr24-hardening-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-extract:
    if: github.repository == 'TrillionniumFoundation/heptatrader' && github.ref == 'refs/heads/codex/harden-qualification-trust-boundary-20260904'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact extraction commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify and extract the closed patch payload
        env:
          EXPECTED_BOOTSTRAP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BOOTSTRAP_SHA"
          payload="$RUNNER_TEMP/pr24-hardening.tar.gz"
          cat \
            .github/pr24-hardening-payload.part00 \
            .github/pr24-hardening-payload.part01 \
            .github/pr24-hardening-payload.part02 \
            | base64 --decode > "$payload"
          printf '%s  %s\n' \
            'c1ce8d7e75dd7e9df32225e7afaa6733407724bc0f5fe17657b92282b561145d' \
            "$payload" | sha256sum --check --strict
          python3 - "$payload" <<'PY'
          import os
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          archive_path = Path(sys.argv[1])
          expected = {
              '.github/github-governance-policy-v1.json': 0o644,
              '.github/required-check-contexts-v1.json': 0o644,
              '.github/workflows/github-governance-qualification.yml': 0o644,
              '.github/workflows/ib-paper-qualification.yml': 0o644,
              'scripts/build_ib_candidate_artifact.sh': 0o755,
              'scripts/check_qualification_trust_boundary.py': 0o755,
              'scripts/github_qualification_evidence.py': 0o755,
              'scripts/run_ib_paper_artifact_qualification.sh': 0o755,
              'scripts/verify_github_governance.py': 0o755,
              'scripts/verify_ib_candidate_artifact.py': 0o755,
              'scripts/verify_qualification_candidate.py': 0o755,
              'tests/python/test_github_governance.py': 0o644,
              'tests/python/test_qualification_trust_boundary.py': 0o644,
          }
          with tarfile.open(archive_path, 'r:gz') as archive:
              members = archive.getmembers()
              names = [member.name for member in members]
              if len(names) != len(set(names)) or set(names) != set(expected):
                  raise SystemExit(f'payload member mismatch: {sorted(names)}')
              for member in members:
                  parsed = PurePosixPath(member.name)
                  if parsed.is_absolute() or '..' in parsed.parts or not member.isfile():
                      raise SystemExit(f'unsafe payload member: {member.name}')
                  if member.size < 0 or member.size > 2_000_000:
                      raise SystemExit(f'payload member size invalid: {member.name}')
                  source = archive.extractfile(member)
                  if source is None:
                      raise SystemExit(f'unreadable payload member: {member.name}')
                  data = source.read(2_000_001)
                  if len(data) != member.size:
                      raise SystemExit(f'payload member short read: {member.name}')
                  destination = Path(member.name)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  temporary = destination.with_name(destination.name + '.extract.tmp')
                  temporary.write_bytes(data)
                  os.chmod(temporary, expected[member.name])
                  os.replace(temporary, destination)
          PY
          git diff --check
      - name: Install hostile-isolation test dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Execute complete materialized security test set
        run: |
          set -euo pipefail
          bash -n scripts/build_ib_candidate_artifact.sh
          bash -n scripts/run_ib_paper_artifact_qualification.sh
          python3 -m py_compile \
            scripts/github_qualification_evidence.py \
            scripts/verify_github_governance.py \
            scripts/verify_ib_paper_qualification.py \
            scripts/verify_ib_candidate_artifact.py \
            scripts/verify_qualification_candidate.py \
            scripts/check_qualification_trust_boundary.py
          python3 scripts/check_qualification_trust_boundary.py --self-test
          python3 -m unittest discover -s tests/python -p 'test_github_governance.py'
          python3 -m unittest discover -s tests/python -p 'test_ib_paper_qualification.py'
          python3 -m unittest discover -s tests/python -p 'test_qualification_trust_boundary.py'
      - name: Package only the final static file set
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/pr24-final-static.tar.gz"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf "$output" \
            .github/github-governance-policy-v1.json \
            .github/required-check-contexts-v1.json \
            .github/workflows/github-governance-qualification.yml \
            .github/workflows/ib-paper-qualification.yml \
            scripts/build_ib_candidate_artifact.sh \
            scripts/check_qualification_trust_boundary.py \
            scripts/github_qualification_evidence.py \
            scripts/run_ib_paper_artifact_qualification.sh \
            scripts/verify_github_governance.py \
            scripts/verify_ib_candidate_artifact.py \
            scripts/verify_qualification_candidate.py \
            tests/python/test_github_governance.py \
            tests/python/test_qualification_trust_boundary.py
          sha256sum "$output" > "$RUNNER_TEMP/pr24-final-static.tar.gz.sha256"
      - name: Upload immutable extraction artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr24-final-static-${{ github.sha }}
          path: |
            ${{ runner.temp }}/pr24-final-static.tar.gz
            ${{ runner.temp }}/pr24-final-static.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
