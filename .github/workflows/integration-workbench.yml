name: HeptaDLL Integration Workbench
on:
  push:
    branches: [integration/heptadll-modular-20260921]
    paths: [.github/workflows/integration-workbench.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Export exact public source and Git index
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          tar -czf "$RUNNER_TEMP/heptatrader-source.tar.gz" --exclude=.git/hooks --exclude=.git/logs .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-source-${{ github.sha }}
          path: ${{ runner.temp }}/heptatrader-source.tar.gz
          retention-days: 1
          if-no-files-found: error
