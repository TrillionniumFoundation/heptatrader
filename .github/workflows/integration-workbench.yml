name: HeptaDLL Integration Workbench

# Temporary, explicitly branch-bound migration helper; never a main/PR authority.
on:
  push:
    branches: [integration/heptadll-modular-20260921]
    paths:
      - .github/workflows/integration-workbench.yml
      - .github/integration/refresh-research-projections.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heptadll-integration-metadata
  cancel-in-progress: false

jobs:
  integration:
    if: github.repository == 'TrillionniumFoundation/heptatrader' && github.ref == 'refs/heads/integration/heptadll-modular-20260921'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      INTEGRATION_BRANCH: integration/heptadll-modular-20260921
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact integration source
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$INTEGRATION_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
      - name: Export public source before any write credential is supplied
        run: tar -czf "$RUNNER_TEMP/heptatrader-source.tar.gz" --exclude=.git/hooks --exclude=.git/logs .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-source-${{ github.sha }}
          path: ${{ runner.temp }}/heptatrader-source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build make g++ libssl-dev zlib1g-dev python3-yaml
      - name: Refresh only the existing module and build projections
        id: refresh
        run: |
          set -euo pipefail
          python3 .github/integration/refresh-research-projections.py "$INTEGRATION_BRANCH"
          git diff --check
          python3 scripts/check_documentation.py
          python3 scripts/check_component_coverage.py
          python3 scripts/verify_build_ownership.py
      - name: Publish only four metadata files on the integration branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$INTEGRATION_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import subprocess
          allowed = {'docs/build-targets.json', 'docs/module-catalog.json',
                     'docs/modules/shadow-research.md', 'docs/modules/agent-entry.md'}
          actual = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if not actual <= allowed:
              raise SystemExit('refusing a non-metadata change')
          PY
          git add -- docs/build-targets.json docs/module-catalog.json docs/modules/shadow-research.md docs/modules/agent-entry.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs(integration): refresh observed research build and module projections'
            askpass="$(mktemp "$RUNNER_TEMP/hepta-askpass.XXXXXX")"
            trap 'rm -f "$askpass"' EXIT
            cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
            chmod 0700 "$askpass"
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$askpass" git push origin "HEAD:refs/heads/$INTEGRATION_BRANCH"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Dispatch unchanged acceptance suites on the resulting branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = 'https://api.github.com/repos/TrillionniumFoundation/heptatrader/actions/workflows/'
          failed = []
          for workflow in ['core-ci.yml', 'documentation-control-plane.yml', 'canonical-full-suite.yml']:
              request = urllib.request.Request(base + workflow + '/dispatches', method='POST',
                  data=json.dumps({'ref': os.environ['INTEGRATION_BRANCH']}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status not in (200, 204):
                          raise RuntimeError('unexpected dispatch status')
                  print('Dispatched', workflow)
              except (urllib.error.URLError, RuntimeError) as error:
                  failed.append(workflow)
                  print('Dispatch failed:', workflow, type(error).__name__)
          if failed:
              raise SystemExit('Some acceptance dispatches failed; no pass result is claimed')
          PY
      - name: Build and exercise the new modules on the exact published source
        if: always() && steps.publish.outcome == 'success'
        env:
          EXPECTED_SHA: ${{ steps.publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          cmake -S . -B build/integration -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DHEPTA_ENABLE_IBAPI=OFF
          cmake --build build/integration --target hepta_research hepta_research_core_tests hepta_research_client_tests --parallel 2
          ctest --test-dir build/integration --output-on-failure -L research
          git diff --exit-code
          git diff --cached --exit-code
      - name: Retain research diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/integration/Testing/Temporary/
          retention-days: 7
          if-no-files-found: warn
