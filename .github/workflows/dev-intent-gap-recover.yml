name: dev-intent-gap-recover

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/dev-intent-gap-recover.yml

permissions:
  contents: write

jobs:
  recover-intent:
    if: github.repository == 'TrillionniumFoundation/heptatrader' && github.event.head_commit.message == 'chore(dev): recover and compile authoritative intent closure'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++ libssl-dev python3
      - name: Recover and harden generated slice
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          target_source = root / "tests/target_position_tool_tests.cpp"
          launcher = root / ".github/workflows/dev-intent-gap-closure.yml"

          if not target_source.exists():
              if not launcher.exists():
                  raise RuntimeError("intent closure output and launcher are both absent")
              source = launcher.read_text(encoding="utf-8")
              marker = "          python3 - <<'PY'\n"
              start = source.find(marker)
              if start < 0:
                  raise RuntimeError("embedded intent closure program missing")
              start += len(marker)
              end = source.find("\n          PY\n", start)
              if end < 0:
                  raise RuntimeError("embedded intent closure terminator missing")
              lines = [line[10:] if line.startswith("          ") else line
                       for line in source[start:end].splitlines()]
              exec(compile("\n".join(lines), "embedded-intent-closure", "exec"), {})

          telemetry = root / "HeptaTrade/observability/runtime_telemetry.cpp"
          if telemetry.exists():
              text = telemetry.read_text(encoding="utf-8")
              if "#include <cctype>" not in text:
                  text = text.replace(
                      "#include <algorithm>\n",
                      "#include <algorithm>\n#include <cctype>\n", 1)
              text = text.replace(
                  r"out << '\\\"' << EscapeJson",
                  r'''out << '"' << EscapeJson''')
              telemetry.write_text(text, encoding="utf-8")

          registry = root / "HeptaTrade/tools/trading_tool_registry.cpp"
          text = registry.read_text(encoding="utf-8")
          if "#include <exception>" not in text:
              text = text.replace(
                  "#include <cstring>\n",
                  "#include <cstring>\n#include <exception>\n", 1)
          text = re.sub(
              r'(RegisterReadTool\("risk\.preview_order",[^\n]*\n\s*)"[^"]+",',
              r'\1"operator.risk.preview",', text, count=1)
          text = text.replace(
              'place.requiredCapability = "trade.place";',
              'place.requiredCapability = "operator.trade.place";')
          text = text.replace(
              'applyTarget.requiredCapability = "trade.place";',
              'applyTarget.requiredCapability = "intent.apply";')
          # Expiry is mandatory in the Execution preview response.
          text = text.replace(
              '''            (!JsonLongField(payload, "expires_at_ms", permitExpiry) &&
             permitExpiry <= now) ||''',
              '''            !JsonLongField(payload, "expires_at_ms", permitExpiry) ||
            permitExpiry <= now ||''')
          registry.write_text(text, encoding="utf-8")

          permit_test = root / "tests/execution_preview_permit_tests.cpp"
          if permit_test.exists():
              text = permit_test.read_text(encoding="utf-8")
              text = text.replace("long long NowMs()", "std::int64_t NowMs()")
              text = text.replace("long long& expiresAtMs", "std::int64_t& expiresAtMs")
              text = text.replace("long long expiry = 0;", "std::int64_t expiry = 0;")
              if "#include <cstdint>" not in text:
                  text = text.replace(
                      "#include <chrono>\n", "#include <chrono>\n#include <cstdint>\n", 1)
              permit_test.write_text(text, encoding="utf-8")

          target_test = root / "tests/target_position_tool_tests.cpp"
          text = target_test.read_text(encoding="utf-8")
          if "std::int64_t quoteObservedAtMs" not in text:
              text = text.replace(
                  "    double ask = 1.1002;\n",
                  "    double ask = 1.1002;\n"
                  "    std::int64_t quoteObservedAtMs = NowMs() - 10;\n", 1)
              text = text.replace(
                  '"\\\"observed_at_ms\\\":" + std::to_string(NowMs() - 1) +',
                  '"\\\"observed_at_ms\\\":" + std::to_string(quoteObservedAtMs) +')
          if "#include <cstdint>" not in text:
              text = text.replace(
                  "#include <chrono>\n", "#include <chrono>\n#include <cstdint>\n", 1)
          target_test.write_text(text, encoding="utf-8")

          tests_cmake = root / "tests/CMakeLists.txt"
          text = tests_cmake.read_text(encoding="utf-8")
          oms_link_old = "target_link_libraries(hepta_oms_journal_durability_tests pthread)"
          oms_link_new = (
              "target_link_libraries(hepta_oms_journal_durability_tests\n"
              "    pthread hepta_observability_core)")
          if oms_link_old in text:
              text = text.replace(oms_link_old, oms_link_new, 1)
          snapshot_block_old = '''add_executable(hepta_authoritative_decision_snapshot_tests
    authoritative_decision_snapshot_tests.cpp
    ../HeptaTrade/intent/authoritative_decision_snapshot.cpp
    ../HeptaTrade/intent/target_position_intent.cpp)'''
          snapshot_block_new = '''add_executable(hepta_authoritative_decision_snapshot_tests
    authoritative_decision_snapshot_tests.cpp
    ../HeptaTrade/intent/authoritative_decision_snapshot.cpp
    ../HeptaTrade/intent/bounded_json.cpp
    ../HeptaTrade/intent/target_position_intent.cpp)'''
          if snapshot_block_old in text:
              text = text.replace(snapshot_block_old, snapshot_block_new, 1)
          tests_cmake.write_text(text, encoding="utf-8")

          # Keep expected session-policy assertions aligned while raw placement
          # tests explicitly opt into the operator-only capabilities.
          for path in (root / "tests").glob("*.cpp"):
              text = path.read_text(encoding="utf-8-sig")
              # Initializer-list tests that were mechanically moved to operator
              # placement may also need the ordinary target-apply capability.
              if '"operator.trade.place"' in text and '"intent.apply"' not in text:
                  marker = '"operator.trade.place"'
                  text = text.replace(marker, marker + ', "intent.apply"', 1)
              path.write_text(text, encoding="utf-8")

          for relative in (
              ".github/workflows/dev-intent-gap-closure.yml",
              ".github/workflows/dev-intent-gap-recover.yml",
              ".github/workflows/dev-gap-closure-run.yml",
              ".github/workflows/dev-gap-closure-recover.yml",
              ".github/workflows/dev-source-export.yml",
          ):
              path = root / relative
              if path.exists():
                  path.unlink()
          PY
      - name: Verify exact resulting tree
        env:
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: "2"
        run: |
          rm -rf build/core-release
          python3 scripts/check_repository_integrity.py
          ./scripts/dev_core.sh
          stage="$RUNNER_TEMP/heptatrader-runtime"
          DESTDIR="$stage" cmake --install build/core-release --component runtime
          test -x "$stage/usr/local/libexec/heptatrader/hepta-tool-gatewayd"
          test -x "$stage/usr/local/libexec/heptatrader/hepta-executiond"
      - name: Commit verified intent tree
        run: |
          git config user.name "Tomasrgbsf"
          git config user.email "tomasbraynt@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m "feat: close authoritative target-position intent gaps"
          git push origin HEAD:codex/heptatrader-gap-closure-v2
