name: Fix PR 52 authority and exact-tree blockers

on:
  push:
    branches:
      - codex/owner-operated-gap-closure-20260909

permissions:
  contents: write

concurrency:
  group: heptatrader-fix-pr52-review-blockers
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event.head_commit.message == 'chore: stage PR52 authority and exact-tree remediation'
    name: remediate-pr52-review-blockers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact staging revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          clean: true
          submodules: false

      - name: Apply bounded remediation and remove temporary control files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/owner-operated-gap-closure-20260909'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .codex/fix_pr52_review_blockers.py.gz.b64
          base64 -d .codex/fix_pr52_review_blockers.py.gz.b64 | gzip -dc > /tmp/fix-pr52-review-blockers.py
          chmod 0700 /tmp/fix-pr52-review-blockers.py
          python3 /tmp/fix-pr52-review-blockers.py
          rm -rf .codex
          rm -f .github/workflows/codex-fix-pr52-review-blockers.yml
          test ! -e .codex
          test ! -e .github/workflows/codex-fix-pr52-review-blockers.yml
          git diff --check

      - name: Install deterministic validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev g++

      - name: Validate authority, exact-tree, docs, source and runtime
        shell: bash
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/verify_build_ownership.py
          python3 scripts/check_gap_register.py
          python3 scripts/verify_source_gap_closures.py
          python3 scripts/verify_canonical_ib_paper_profile.py
          python3 scripts/check_qualification_trust_boundary.py --self-test
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          ./scripts/dev_core.sh

      - name: Commit only the verified remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain=v1)"
          git commit -m 'security: bind PAPER mutation to owner and exact clean trees'

      - name: Reverify committed exact tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 scripts/verify_exact_git_index.py --root .
          python3 scripts/check_gap_register.py
          python3 scripts/check_qualification_trust_boundary.py
          python3 scripts/verify_source_gap_closures.py

      - name: Publish verified final Git objects without moving a ref
        shell: bash
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYOBJ'
          from __future__ import annotations

          import base64
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.error
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_API_TOKEN"]
          parent = os.environ["GITHUB_SHA"]
          local_head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          local_parent = subprocess.check_output(
              ["git", "rev-parse", "HEAD^"], text=True
          ).strip()
          if local_parent != parent:
              raise SystemExit(f"local parent drift: {local_parent} != {parent}")
          expected_tree = subprocess.check_output(
              ["git", "show", "-s", "--format=%T", "HEAD"], text=True
          ).strip()
          parent_tree = subprocess.check_output(
              ["git", "show", "-s", "--format=%T", parent], text=True
          ).strip()

          api = f"https://api.github.com/repos/{repository}/git"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "heptatrader-verified-object-publisher",
          }

          def request(path: str, payload: dict) -> dict:
              req = urllib.request.Request(
                  api + path,
                  data=json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = json.loads(response.read())
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  raise SystemExit(
                      f"Git data API {path} failed: HTTP {error.code}: {detail}"
                  ) from error
              if not isinstance(body, dict):
                  raise SystemExit(f"Git data API {path} returned invalid JSON")
              return body

          raw = subprocess.check_output(
              [
                  "git", "diff-tree", "--no-commit-id", "--name-status",
                  "--no-renames", "-r", "-z", "HEAD^", "HEAD",
              ]
          ).split(b"\0")
          if raw and raw[-1] == b"":
              raw.pop()
          if len(raw) % 2:
              raise SystemExit(f"unexpected diff-tree field count: {len(raw)}")

          entries: list[dict[str, object]] = []
          for index in range(0, len(raw), 2):
              status = raw[index].decode("ascii")
              path = raw[index + 1].decode("utf-8")
              if status == "D":
                  entries.append(
                      {"path": path, "mode": "100644", "type": "blob", "sha": None}
                  )
                  continue
              if status not in {"A", "M"}:
                  raise SystemExit(f"unsupported diff status {status}: {path}")
              record = subprocess.check_output(
                  ["git", "ls-tree", "HEAD", "--", path], text=True
              ).rstrip("\n")
              metadata, observed = record.split("\t", 1)
              mode, kind, _ = metadata.split(" ")
              if observed != path or kind != "blob" or mode not in {"100644", "100755"}:
                  raise SystemExit(f"unsupported final tree entry: {record}")
              content = subprocess.check_output(["git", "show", f"HEAD:{path}"])
              blob = request(
                  "/blobs",
                  {
                      "content": base64.b64encode(content).decode("ascii"),
                      "encoding": "base64",
                  },
              )
              sha = blob.get("sha")
              if not isinstance(sha, str) or len(sha) != 40:
                  raise SystemExit(f"invalid blob response for {path}: {blob}")
              entries.append(
                  {"path": path, "mode": mode, "type": "blob", "sha": sha}
              )

          tree = request("/trees", {"base_tree": parent_tree, "tree": entries})
          tree_sha = tree.get("sha")
          if tree_sha != expected_tree:
              raise SystemExit(
                  f"remote tree mismatch: {tree_sha} != verified {expected_tree}"
              )
          commit = request(
              "/commits",
              {
                  "message": "security: bind PAPER mutation to owner and exact clean trees",
                  "tree": tree_sha,
                  "parents": [parent],
              },
          )
          commit_sha = commit.get("sha")
          if not isinstance(commit_sha, str) or len(commit_sha) != 40:
              raise SystemExit(f"invalid commit response: {commit}")
          marker = {
              "schema": "heptatrader.verified-git-object.v1",
              "parent": parent,
              "local_validation_commit": local_head,
              "commit": commit_sha,
              "tree": tree_sha,
              "changed_paths": len(entries),
          }
          marker_path = Path(os.environ["RUNNER_TEMP"]) / "pr52-final-git-object.json"
          marker_path.write_text(
              json.dumps(marker, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print("[PR52-FINAL-GIT-OBJECT] " + json.dumps(marker, sort_keys=True))
          PYOBJ

      - name: Upload verified Git-object marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr52-final-git-object-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pr52-final-git-object.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
