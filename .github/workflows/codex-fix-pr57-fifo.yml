name: Remediate PR57 special-file admission

on:
  push:
    branches:
      - plan/p1-release-package-preflight-20260910
    paths:
      - .github/workflows/codex-fix-pr57-fifo.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr57-fifo
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact remediation carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply nonblocking descriptor admission repair
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
          PATCH_GZIP_B64: 
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          python3 - <<'PY'
          import base64, gzip, os
          payload = base64.b64decode(os.environ['PATCH_GZIP_B64'], validate=True)
          source = gzip.decompress(payload)
          compile(source, 'fix_pr57.py', 'exec')
          exec(source, {'__name__': '__main__'})
          PY

      - name: Run focused and release regression suites
        run: |
          set -euo pipefail
          python3 -m unittest tests.python.test_preflight_special_files -v
          python3 -m unittest tests.python.test_release_package -v
          python3 -m unittest tests.python.test_hepta_preflight -v
          python3 -m unittest tests.python.test_preflight_complete_namespace -v
          python3 -m py_compile \
            scripts/build_release_package.py \
            scripts/hepta_preflight.py \
            scripts/hepta_preflight_core.py

      - name: Publish final source and remove carrier
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          rm .github/workflows/codex-fix-pr57-fifo.yml
          git diff --check
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            scripts/build_release_package.py \
            scripts/hepta_preflight.py \
            scripts/hepta_preflight_core.py \
            tests/python/test_preflight_special_files.py \
            .github/workflows/codex-fix-pr57-fifo.yml
          git commit -m 'fix(release): bound special-file descriptor admission'
          git push origin "HEAD:$EXPECTED_BRANCH"
