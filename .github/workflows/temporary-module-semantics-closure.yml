name: temporary-module-semantics-closure

on:
  push:
    branches:
      - codex/final-blocker-closure-20260902
    paths:
      - '.github/workflows/temporary-module-semantics-closure.yml'

permissions:
  contents: write

concurrency:
  group: temporary-module-semantics-closure
  cancel-in-progress: false

jobs:
  patch:
    name: temporary-module-semantics-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install deterministic validation dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-jsonschema
      - name: Materialize concrete module semantics
        run: |
          set -euo pipefail
          python3 scripts/temporary_module_semantics_patch.py
          git rm \
            .github/workflows/temporary-module-semantics-closure.yml \
            scripts/temporary_module_semantics_patch.py
          python3 scripts/generate_documentation_views.py --write
      - name: Validate clean final tree
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-module-semantics-closure.yml
          test ! -e scripts/temporary_module_semantics_patch.py
          python3 scripts/generate_documentation_views.py --check
          python3 scripts/check_documentation_control_plane.py
          python3 scripts/check_module_discipline.py
          python3 tests/python/test_module_discipline.py
          python3 -m json.tool docs/modules/module-registry-v2.json >/dev/null
          python3 -m json.tool docs/modules/module-manifest-schema-v3.json >/dev/null
          python3 -m json.tool docs/program/gap-registry-v2.json >/dev/null
          python3 -m json.tool docs/verification/test-matrix-v2.json >/dev/null
          git diff --check
      - name: Commit exact hardening to canonical candidate
        run: |
          set -euo pipefail
          git config user.name 'heptatrader-ci'
          git config user.email 'heptatrader-ci@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'docs(modules): require concrete engineering semantics' \
            -m 'Signed-off-by: HeptaTrader CI <heptatrader-ci@users.noreply.github.com>'
          git push origin HEAD:codex/final-blocker-closure-20260902
