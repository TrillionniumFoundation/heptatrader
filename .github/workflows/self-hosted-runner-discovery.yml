name: Self-Hosted Runner Discovery

on:
  push:
    branches:
      - codex/self-hosted-runner-discovery-20260902

permissions:
  contents: read

concurrency:
  group: heptatrader-self-hosted-runner-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: self-hosted-runner-discovery
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout exact probe revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record non-sensitive assignment evidence
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/heptatrader-self-hosted-runner-discovery.json"
          python3 - <<'PY' > "$receipt"
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import socket
          import stat

          def state(name):
              raw = os.environ.get(name, "")
              result = {"present": bool(raw), "directory": False, "regular_file": False, "executable": False, "symlink": False}
              if not raw:
                  return result
              path = Path(raw)
              try:
                  info = path.lstat()
              except OSError:
                  return result
              result["directory"] = stat.S_ISDIR(info.st_mode)
              result["regular_file"] = stat.S_ISREG(info.st_mode)
              result["executable"] = bool(info.st_mode & 0o111)
              result["symlink"] = stat.S_ISLNK(info.st_mode)
              return result

          listeners = {}
          for port in (4001, 4002, 7496, 7497):
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              sock.settimeout(0.2)
              try:
                  listeners[str(port)] = sock.connect_ex(("127.0.0.1", port)) == 0
              finally:
                  sock.close()

          print(json.dumps({
              "schema": "heptatrader.self-hosted-runner-discovery.v1",
              "trigger_sha": os.environ.get("GITHUB_SHA", ""),
              "runner_name_sha256": hashlib.sha256(os.environ.get("RUNNER_NAME", "").encode()).hexdigest(),
              "runner_os": os.environ.get("RUNNER_OS", ""),
              "runner_arch": os.environ.get("RUNNER_ARCH", ""),
              "ibapi_root": state("IBAPI_ROOT"),
              "qualifier": state("HEPTA_IB_PAPER_QUALIFIER"),
              "loopback_gateway_ports": listeners,
              "tools": {name: bool(shutil.which(name)) for name in ("cmake", "ninja", "g++", "python3")},
          }, sort_keys=True, separators=(",", ":")))
          PY
          chmod 0600 "$receipt"

      - name: Upload discovery receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: self-hosted-runner-discovery-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/heptatrader-self-hosted-runner-discovery.json
          if-no-files-found: error
          retention-days: 7
