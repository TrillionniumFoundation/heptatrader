name: gap-closure-stage

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-work
    paths:
      - .github/workflows/gap-closure-stage.yml

permissions:
  contents: write

jobs:
  close-m2-ownership:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-work
          fetch-depth: 0
      - name: Apply ownership closure
        run: python3 scripts/m2_close_patch.py
      - name: Register the new session manifest document
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/document-registry-v2.json')
          value = json.loads(path.read_text())
          entry = {
              'path': 'modules/manifests/hepta-session-runtime.json',
              'class': 'machine-registry',
              'owner': '@hepta/platform',
          }
          documents = value['documents']
          assert not any(item['path'] == entry['path'] for item in documents)
          documents.append(entry)
          documents.sort(key=lambda item: item['path'])
          path.write_text(json.dumps(value, separators=(',', ':')) + '\n')
          PY
      - name: Make migration-schema fixture independent of live debt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/python/test_documentation_control_plane.py')
          text = path.read_text()
          old = '''    def test_module_schema_enforces_migration_conditionals(self) -> None:
        manifest = self._manifest()
        manifest.pop("migration_gap")
        self.assertTrue(self._schema_errors(manifest))
'''
          new = '''    def test_module_schema_enforces_migration_conditionals(self) -> None:
        manifest = self._manifest()
        manifest["ownership_mode"] = "shared-migration"
        manifest["migration_gap"] = "G-MOD-002"
        manifest.pop("migration_gap")
        self.assertTrue(self._schema_errors(manifest))
'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
      - name: Validate deterministic core
        run: ./scripts/dev_core.sh
      - name: Assert exception-free ownership
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('docs/modules/source-ownership-registry-v1.json').read_text())
          assert registry['source_overlap_exceptions'] == []
          assert registry['compilation_exceptions'] == []
          PY
      - name: Commit tested closure
        run: |
          set -euo pipefail
          git config user.name "Hepta Gap Closure Bot"
          git config user.email "hepta-gap-closure-bot@users.noreply.github.com"
          git add -A
          git commit -m "refactor: close module ownership and compilation exceptions"
          git push origin HEAD:codex/heptatrader-gap-closure-work
