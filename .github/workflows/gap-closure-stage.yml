name: gap-closure-stage

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-work
    paths:
      - .github/workflows/gap-closure-stage.yml

permissions:
  contents: write

jobs:
  close-m2-ownership:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-work
          fetch-depth: 0
      - name: Apply ownership closure
        run: python3 scripts/m2_close_patch.py
      - name: Validate deterministic core
        run: ./scripts/dev_core.sh
      - name: Assert exception-free ownership
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('docs/modules/source-ownership-registry-v1.json').read_text())
          assert registry['source_overlap_exceptions'] == []
          assert registry['compilation_exceptions'] == []
          PY
      - name: Commit tested closure
        run: |
          set -euo pipefail
          git config user.name "Hepta Gap Closure Bot"
          git config user.email "hepta-gap-closure-bot@users.noreply.github.com"
          git add -A
          git commit -m "refactor: close module ownership and compilation exceptions"
          git push origin HEAD:codex/heptatrader-gap-closure-work
