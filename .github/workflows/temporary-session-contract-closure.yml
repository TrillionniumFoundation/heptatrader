# one-shot revision: 2
name: temporary-session-contract-closure

on:
  push:
    branches:
      - codex/final-blocker-closure-20260902
    paths:
      - '.github/workflows/temporary-session-contract-closure.yml'

permissions:
  contents: write

concurrency:
  group: temporary-session-contract-closure
  cancel-in-progress: false

jobs:
  patch:
    name: temporary-session-contract-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialize and validate formal session contract
        run: |
          set -euo pipefail
          python3 scripts/temporary_session_contract_patch.py
          python3 scripts/generate_documentation_views.py --write
          python3 scripts/generate_documentation_views.py --check
          python3 -m json.tool docs/contracts/contract-registry-v2.json >/dev/null
          python3 -m json.tool docs/program/gap-registry-v2.json >/dev/null
          python3 -m json.tool docs/verification/test-matrix-v2.json >/dev/null
          git diff --check
      - name: Commit exact closure to canonical candidate
        run: |
          set -euo pipefail
          git config user.name 'heptatrader-ci'
          git config user.email 'heptatrader-ci@users.noreply.github.com'
          git add \
            docs/contracts/IDENTITY-CAPABILITY-CONTRACT.md \
            docs/contracts/CONTRACT-INDEX.md \
            docs/contracts/contract-registry-v2.json \
            docs/modules/manifests/hepta-session-runtime.json \
            docs/modules/manifests/hepta-client-runtime.json \
            docs/modules/manifests/hepta-gateway-runtime.json \
            docs/modules/technical/hepta-session-runtime.md \
            docs/modules/technical/hepta-client-runtime.md \
            docs/modules/technical/hepta-gateway-runtime.md \
            docs/program/gap-registry-v2.json \
            docs/verification/test-matrix-v2.json
          git commit -m 'docs(session): register durable supervisor contract' \
            -m 'Signed-off-by: HeptaTrader CI <heptatrader-ci@users.noreply.github.com>'
          git push origin HEAD:codex/final-blocker-closure-20260902
