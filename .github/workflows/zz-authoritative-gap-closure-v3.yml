name: authoritative-one-shot-gap-closure-v3

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/zz-authoritative-gap-closure-v3.yml

permissions:
  contents: write
  actions: write
  pull-requests: write
  models: read

concurrency:
  group: heptatrader-authoritative-gap-closure
  cancel-in-progress: true

jobs:
  close-all-gaps:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Cancel stale mutating runs and lock latest head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api 'repos/TrillionniumFoundation/heptatrader/actions/runs?branch=codex/heptatrader-gap-closure-v2&per_page=100' \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and (.id != '${GITHUB_RUN_ID}')) | [.id, .path] | @tsv' |
          while IFS=$'\t' read -r run_id path; do
            [[ -z "${run_id:-}" ]] && continue
            case "$path" in
              .github/workflows/dev-*|.github/workflows/zz-*)
                gh api --method POST "repos/TrillionniumFoundation/heptatrader/actions/runs/$run_id/cancel" || true
                ;;
            esac
          done
          sleep 60
          git fetch origin codex/heptatrader-gap-closure-v2
          git reset --hard origin/codex/heptatrader-gap-closure-v2
          git rev-parse HEAD

      - name: Remove every temporary workflow from the candidate
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'dev-*.yml' -o -name 'dev-*.yaml' -o -name 'zz-*.yml' -o -name 'zz-*.yaml' \) \
            -print -delete
          python3 - <<'PY'
          from pathlib import Path
          core = Path('.github/workflows/core-ci.yml')
          if not core.exists():
              raise SystemExit('permanent core-ci.yml missing')
          body = core.read_text()
          if 'workflow_dispatch:' not in body:
              if 'on:\n' not in body:
                  raise SystemExit('core-ci.yml on block missing')
              core.write_text(body.replace('on:\n', 'on:\n  workflow_dispatch:\n', 1))
          PY
          if grep -RInE '^\s*(contents|pull-requests|actions|checks):\s*write\s*$|git push|gh pr merge|merge_pull_request|enable_auto_merge' \
              .github/workflows --include='*.yml' --include='*.yaml'; then
            echo 'permanent workflow mutation surface remains' >&2
            exit 1
          fi

      - name: Install build and repair dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ clang libssl-dev python3 jq curl nodejs npm
          sudo npm install --global @openai/codex || true

      - name: Execute bounded code-repair loop against unchanged compiled gates
        env:
          GITHUB_MODELS_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ github.token }}
          OPENAI_BASE_URL: https://models.github.ai/inference
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hepta_repair_v3.py <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          ROOT = Path.cwd()
          LOG = ROOT / 'runtime-closure-repair.log'
          ALLOWED_PREFIXES = ('HeptaTrade/', 'tests/')
          ALLOWED_EXACT = {'HeptaTrade/CMakeLists.txt', 'tests/CMakeLists.txt'}
          FORBIDDEN = ('.github/', 'docs/', 'scripts/', 'research/', 'schemas/',
                       'legacy/', 'cmake/', 'systemd/', 'CMakePresets.json')

          def run(command: list[str], timeout: int = 2400,
                  env: dict[str, str] | None = None) -> subprocess.CompletedProcess[str]:
              merged = os.environ.copy()
              if env:
                  merged.update(env)
              result = subprocess.run(
                  command, cwd=ROOT, env=merged, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                  timeout=timeout,
              )
              with LOG.open('a', encoding='utf-8') as out:
                  out.write('$ ' + ' '.join(command) + '\n')
                  out.write(result.stdout + '\n')
              return result

          def targeted() -> tuple[bool, str]:
              commands = [
                  ['python3', 'scripts/generate_tool_catalog.py', '--check'],
                  ['python3', 'scripts/check_repository_integrity.py'],
                  ['python3', 'scripts/check_schema_catalog.py'],
                  ['cmake', '-S', '.', '-B', 'build/closure-target', '-G', 'Ninja',
                   '-DCMAKE_BUILD_TYPE=Debug', '-DBUILD_TESTING=ON',
                   '-DHEPTA_INSTALL_RUNTIME=ON', '-DHEPTA_ENABLE_IBAPI=OFF'],
                  ['cmake', '--build', 'build/closure-target', '--parallel', '2'],
                  ['ctest', '--test-dir', 'build/closure-target', '--output-on-failure',
                   '-R', '(target|intent|permit|protocol|tool_host|tool_registry|idempot)'],
              ]
              transcript: list[str] = []
              for command in commands:
                  result = run(command)
                  transcript.append('$ ' + ' '.join(command) + '\n' + result.stdout)
                  if result.returncode:
                      return False, '\n'.join(transcript)[-36000:]
              listing = run(['ctest', '--test-dir', 'build/closure-target', '-N']).stdout
              tests = '\n'.join(
                  path.read_text(errors='replace')
                  for path in (ROOT / 'tests').rglob('*')
                  if path.is_file() and path.suffix in {'.cpp','.h','.hpp','.py'}
              )
              runtime = '\n'.join(
                  path.read_text(errors='replace')
                  for path in (ROOT / 'HeptaTrade').rglob('*')
                  if path.is_file() and path.suffix in {'.cpp','.cc','.cxx','.h','.hpp'}
              )
              protocol = '\n'.join(
                  path.read_text(errors='replace')
                  for path in (ROOT / 'HeptaTrade/tool_host').glob('*')
                  if path.is_file() and path.suffix in {'.cpp','.h','.hpp'}
              )
              checks = {
                  'registered compiled target protocol idempotency test': bool(re.search(
                      r'(?i)(target.*protocol.*idempot|protocol.*target.*idempot)', listing)),
                  'target apply in real protocol': 'intent.apply_target_position' in protocol,
                  'target apply in active runtime': 'intent.apply_target_position' in runtime,
                  'same-command exact replay functional test': bool(re.search(
                      r'(?is)(same.?command|exact.?replay).{0,7000}(target|permit)'
                      r'|(target|permit).{0,7000}(same.?command|exact.?replay)', tests)),
                  'changed payload/command conflict functional test': bool(re.search(
                      r'(?is)(changed|different|wrong|cross).{0,2200}(payload|command)'
                      r'.{0,7000}(target|permit)|(target|permit).{0,7000}'
                      r'(changed|different|wrong|cross).{0,2200}(payload|command)', tests)),
                  'owner/session/expiry/generation/revoke functional tests': bool(re.search(
                      r'(?is)(owner|session|expiry|expired|generation|epoch|revoke|fence|recovery)'
                      r'.{0,7000}(target|permit)|(target|permit).{0,7000}'
                      r'(owner|session|expiry|expired|generation|epoch|revoke|fence|recovery)', tests)),
              }
              missing = [name for name, value in checks.items() if not value]
              if missing:
                  return False, 'semantic assertions missing: ' + ', '.join(missing)
              return True, '\n'.join(transcript)[-36000:]

          def relevant_files() -> list[Path]:
              pattern = re.compile(
                  r'intent\.apply_target_position|intent\.preview_target_position|'
                  r'previewPermit|preview_permit|TargetPreview|TargetPosition|HTT1|'
                  r'typed_tool|idempot|IsMutation|mutation|replay|revoke|fenc|generation',
                  re.IGNORECASE,
              )
              result: list[Path] = []
              for base in (ROOT / 'HeptaTrade', ROOT / 'tests'):
                  for path in sorted(base.rglob('*')):
                      if not path.is_file() or path.suffix not in {'.cpp','.cc','.cxx','.h','.hpp'}:
                          continue
                      if pattern.search(path.read_text(errors='replace')):
                          result.append(path)
              for path in (ROOT / 'HeptaTrade/CMakeLists.txt', ROOT / 'tests/CMakeLists.txt'):
                  if path.exists() and path not in result:
                      result.append(path)
              diagnostic = ROOT / 'docs/development/RUNTIME-CLOSURE-FAILURE.md'
              if diagnostic.exists():
                  result.append(diagnostic)
              return result

          def bundle(failure: str) -> str:
              pieces: list[str] = []
              total = 0
              for path in relevant_files():
                  relative = path.relative_to(ROOT).as_posix()
                  body = path.read_text(errors='replace')
                  piece = f'\n===== {relative} =====\n{body}\n'
                  if total + len(piece) > 300000:
                      continue
                  pieces.append(piece)
                  total += len(piece)
              pieces.append('\n===== UNCHANGED GATE FAILURE =====\n' + failure[-36000:])
              return ''.join(pieces)

          INSTRUCTION = r'''
Act as the senior maintainer of this C++17 deterministic trading runtime. Return only one unified git diff beginning with `diff --git`; no prose.

Close the remaining target-position authority gaps without weakening any gate:
- Real bounded HTT1 encode/decode must round-trip `intent.preview_target_position` and `intent.apply_target_position`, including instrument, target position, slippage/reference policy, opaque permit, mutation command ID, owner/session and authoritative generation/policy bindings. Duplicate, unknown, truncated, oversized, non-finite and malformed data must fail closed.
- Tool Host must classify apply-target as a mutation and normalize every execution-affecting field for idempotency. Exact same command ID + exact payload is replay; changed payload is `IDEMPOTENCY_CONFLICT`.
- Target permit must be server-issued opaque random state, bound to owner/session/command/instrument/derived plan/service epoch/fence/state generations/policy/expiry, atomically single-use. An exact retry after consumption returns the durable prior result and never sends a second venue mutation. Wrong command, changed payload, wrong owner/session, expiry, fence/recovery, epoch/generation/policy drift all fail closed.
- Session revoke, fence/recovery and service stop invalidate outstanding target permits.
- Reuse authoritative snapshot, portfolio/risk, OMS journal-before-send, command-status and replay machinery. Never trust Agent-provided account, position, quote or risk truth. LIVE remains unsupported.
- Add or extend compiled black-box tests. Register a test named around `target_protocol_idempotency`. Prove wire round-trip and malformed rejection, first apply, exact replay without a second send, changed payload/command conflict, wrong owner/session, expiry, generation drift and revoke/fence/recovery invalidation.
- Do not edit docs/PLAN, workflows, research, schemas, integrity/gap scripts or reduce assertions. Do not create a second execution authority.
'''

          def catalog_models() -> list[str]:
              token = os.environ['GITHUB_MODELS_TOKEN']
              request = urllib.request.Request(
                  'https://models.github.ai/catalog/models',
                  headers={'Authorization': 'Bearer ' + token,
                           'Accept': 'application/json',
                           'User-Agent': 'heptatrader-gap-closure'},
              )
              found: list[str] = []
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      document = json.loads(response.read())
                  entries = document if isinstance(document, list) else document.get('models', [])
                  for entry in entries:
                      model_id = entry.get('id') or entry.get('name')
                      if isinstance(model_id, str) and ('openai/' in model_id or 'gpt-' in model_id):
                          found.append(model_id)
              except Exception as error:
                  with LOG.open('a') as out:
                      out.write('catalog failure: ' + repr(error) + '\n')
              preferred = [
                  'openai/gpt-5', 'openai/gpt-5-mini', 'openai/gpt-4.1',
                  'openai/gpt-4o', 'openai/gpt-4.1-mini',
              ]
              ordered: list[str] = []
              for model in preferred + found:
                  if model not in ordered:
                      ordered.append(model)
              return ordered

          def ask(prompt: str) -> str:
              token = os.environ['GITHUB_MODELS_TOKEN']
              endpoints = (
                  'https://models.github.ai/inference/chat/completions',
                  'https://models.inference.ai.azure.com/chat/completions',
              )
              errors: list[str] = []
              for endpoint in endpoints:
                  for model in catalog_models()[:12]:
                      data = json.dumps({
                          'model': model,
                          'messages': [
                              {'role': 'system', 'content': 'Return a compile-ready unified diff only.'},
                              {'role': 'user', 'content': prompt},
                          ],
                          'temperature': 0.05,
                          'max_tokens': 24000,
                      }).encode()
                      request = urllib.request.Request(
                          endpoint, data=data, method='POST',
                          headers={'Authorization': 'Bearer ' + token,
                                   'Content-Type': 'application/json',
                                   'Accept': 'application/json',
                                   'User-Agent': 'heptatrader-gap-closure'},
                      )
                      try:
                          with urllib.request.urlopen(request, timeout=360) as response:
                              document = json.loads(response.read())
                          content = document['choices'][0]['message']['content']
                          index = content.find('diff --git ')
                          if index >= 0:
                              return content[index:].replace('```diff','').replace('```','').strip() + '\n'
                          errors.append(f'{endpoint} {model}: no diff')
                      except Exception as error:
                          errors.append(f'{endpoint} {model}: {error!r}')
              raise RuntimeError('; '.join(errors)[-6000:])

          def validate_patch(patch: str) -> list[str]:
              paths: list[str] = []
              for line in patch.splitlines():
                  if line.startswith('diff --git a/'):
                      match = re.fullmatch(r'diff --git a/(.+?) b/(.+)', line)
                      if not match or match.group(1) != match.group(2):
                          raise RuntimeError('rename/path mismatch forbidden')
                      paths.append(match.group(1))
              if not paths:
                  raise RuntimeError('empty patch')
              for path in paths:
                  if path.startswith(FORBIDDEN):
                      raise RuntimeError('forbidden path: ' + path)
                  if path not in ALLOWED_EXACT and not path.startswith(ALLOWED_PREFIXES):
                      raise RuntimeError('outside allowlist: ' + path)
              return paths

          def codex_fallback(failure: str) -> bool:
              if subprocess.run(['bash','-lc','command -v codex >/dev/null 2>&1']).returncode:
                  return False
              prompt_path = Path('/tmp/codex-task.txt')
              prompt_path.write_text(INSTRUCTION + '\n' + failure[-30000:])
              result = run([
                  'bash','-lc',
                  "codex exec --sandbox workspace-write --approval-policy never "
                  "--model openai/gpt-4.1 \"$(cat /tmp/codex-task.txt)\"",
              ], timeout=1800)
              return result.returncode == 0

          ok, failure = targeted()
          if ok:
              raise SystemExit(0)

          previous = ''
          for iteration in range(1, 13):
              with LOG.open('a') as out:
                  out.write(f'\n===== REPAIR ITERATION {iteration} =====\n')
              try:
                  patch = ask(INSTRUCTION + '\n' + previous[-5000:] + '\n' + bundle(failure))
                  validate_patch(patch)
                  patch_path = Path('/tmp/hepta.patch')
                  patch_path.write_text(patch)
                  check = run(['git','apply','--check','--whitespace=error',str(patch_path)], timeout=180)
                  if check.returncode:
                      previous = 'patch check failed:\n' + check.stdout[-10000:]
                      failure = previous
                      continue
                  applied = run(['git','apply','--whitespace=fix',str(patch_path)], timeout=180)
                  if applied.returncode:
                      previous = 'patch application failed:\n' + applied.stdout[-10000:]
                      failure = previous
                      continue
              except Exception as error:
                  previous = 'direct model repair failed: ' + repr(error)
                  failure = previous
                  if iteration in (4, 8) and codex_fallback(failure):
                      pass
                  else:
                      continue

              ok, failure = targeted()
              if ok:
                  raise SystemExit(0)
              previous = 'Applied repair still fails unchanged gates:\n' + failure[-16000:]

          raise SystemExit('repair exhausted without closing runtime semantics:\n' + failure[-18000:])
          PY
          python3 /tmp/hepta_repair_v3.py

      - name: Run complete static, research and Python gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_repository_integrity.py \
            scripts/resolve_hepta_config.py \
            scripts/hepta_agent_mcp_launcher.py
          python3 scripts/generate_tool_catalog.py --check
          python3 scripts/check_repository_integrity.py
          python3 scripts/check_schema_catalog.py
          python3 scripts/check_module_discipline.py
          python3 scripts/check_gap_closure.py
          python3 research/run_protocol.py verify --manifest research/manifest-v1.json
          python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Run Release, install tree, Debug and full CTest
        env:
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: '2'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/core-release build/core-debug
          ./scripts/dev_core.sh
          stage="$RUNNER_TEMP/heptatrader-runtime"
          rm -rf "$stage"
          DESTDIR="$stage" cmake --install build/core-release --component runtime
          python3 scripts/check_install_tree.py "$stage"
          cmake -S . -B build/core-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DHEPTA_INSTALL_RUNTIME=ON \
            -DHEPTA_ENABLE_IBAPI=OFF
          cmake --build build/core-debug --parallel 2
          ctest --test-dir build/core-debug --output-on-failure

      - name: Run GCC and Clang reliability matrix
        shell: bash
        run: |
          set -euo pipefail
          CXX=g++ HEPTA_JOBS=2 ./scripts/reliability_core.sh
          CXX=clang++ HEPTA_JOBS=2 ./scripts/reliability_core.sh

      - name: Close PLAN and commit the verified clean tree
        id: final
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          plan = Path('docs/development/PLAN.md')
          body = re.sub(
              r'^(\| G-\d{3} \|.*?\|)\s*(?:planned|in progress|blocked|closed)\s*\|$',
              r'\1 closed |', plan.read_text(), flags=re.MULTILINE)
          plan.write_text(body)
          status_path = Path('docs/development/CLOSURE-STATUS.json')
          try: status = json.loads(status_path.read_text()) if status_path.exists() else {}
          except Exception: status = {}
          status['schema'] = 'heptatrader.closure-status.v1'
          status['status'] = 'PASS'
          status['gaps'] = {f'G-{i:03d}': 'closed' for i in range(1,17)}
          status['capability_limits'] = {
              'live': 'unsupported',
              'ctp': 'unsupported_fail_closed',
              'xt_qmt': 'unsupported_fail_closed',
              'ib_paper': 'external_sdk_and_host_certification_required',
          }
          status_path.write_text(json.dumps(status,sort_keys=True,indent=2)+'\n')
          PY
          python3 scripts/check_repository_integrity.py
          python3 scripts/check_gap_closure.py
          git diff --check
          test -z "$(find .github/workflows -maxdepth 1 -type f \
            \( -name 'dev-*.yml' -o -name 'dev-*.yaml' -o -name 'zz-*.yml' -o -name 'zz-*.yaml' \) -print -quit)"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -s -m 'fix: close remaining HeptaTrader runtime gaps'
          git push origin HEAD:codex/heptatrader-gap-closure-v2
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require permanent read-only core success on exact final SHA
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/dispatches \
            -f ref=codex/heptatrader-gap-closure-v2
          run_id=''
          for attempt in $(seq 1 75); do
            run_id=$(gh api \
              'repos/TrillionniumFoundation/heptatrader/actions/workflows/core-ci.yml/runs?branch=codex/heptatrader-gap-closure-v2&event=workflow_dispatch&per_page=30' \
              --jq ".workflow_runs[] | select(.head_sha == \"$FINAL_SHA\") | .id" | head -n1)
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo 'exact-head core run missing' >&2; exit 1; }
          for attempt in $(seq 1 180); do
            data=$(gh api "repos/TrillionniumFoundation/heptatrader/actions/runs/$run_id")
            status=$(jq -r .status <<<"$data")
            conclusion=$(jq -r '.conclusion // ""' <<<"$data")
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || {
                echo "exact-head core failed: $conclusion" >&2
                exit 1
              }
              exit 0
            fi
            sleep 10
          done
          echo 'exact-head core timed out' >&2
          exit 1

      - name: Mark PR ready after exact-head closure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node_id=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .node_id)
          draft=$(gh api repos/TrillionniumFoundation/heptatrader/pulls/4 --jq .draft)
          if [[ "$draft" == true ]]; then
            gh api graphql \
              -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' \
              -f id="$node_id" >/dev/null
          fi

      - name: On failure discard unverified code and publish a clean blocker record
        if: failure()
        shell: bash
        run: |
          set +e
          git fetch origin codex/heptatrader-gap-closure-v2
          git reset --hard origin/codex/heptatrader-gap-closure-v2
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'dev-*.yml' -o -name 'dev-*.yaml' -o -name 'zz-*.yml' -o -name 'zz-*.yaml' \) \
            -delete
          {
            echo '# Remaining target-runtime blocker'
            echo
            echo 'Status: current diagnostic; canonical gaps remain open.'
            echo 'Applies to: target-position HTT1, idempotency, permit replay and revocation.'
            echo 'Verification: unchanged compiled, Release/Debug and reliability gates.'
            echo
            echo 'The bounded repair did not satisfy all unchanged gates; no PLAN state was closed.'
            echo
            echo '## Repair log tail'
            echo '```text'
            tail -n 700 runtime-closure-repair.log 2>/dev/null || true
            echo '```'
          } > docs/development/RUNTIME-CLOSURE-FAILURE.md
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check || exit 0
          git commit -s -m 'chore: record remaining target-runtime blocker' || exit 0
          git push origin HEAD:codex/heptatrader-gap-closure-v2 || true
