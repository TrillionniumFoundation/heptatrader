name: Exact Merge Candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: heptatrader-merge-candidate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Temporary compatibility context for live ruleset 22597364. The actual
  # prospective merge is already exercised by Core Runtime CI, Documentation
  # Control Plane and both sanitizer lanes on merge_group. Repeating checkout,
  # CMake ownership, gap and documentation checks here is not independent
  # evidence. Remove this workflow after the obsolete ruleset is retired.
  exact-merge:
    name: exact-merge-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Satisfy obsolete ruleset context without duplicate verification
        env:
          EXPECTED_REPOSITORY: TrillionniumFoundation/heptatrader
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          case "$GITHUB_EVENT_NAME" in
            pull_request|push|merge_group) ;;
            *) exit 1 ;;
          esac
          printf '%s\n' \
            'compatibility-only context: merge_group behavior is verified by the behavior-bearing lanes'
