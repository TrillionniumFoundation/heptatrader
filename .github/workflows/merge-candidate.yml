name: Exact Merge Candidate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: heptatrader-merge-candidate-compat-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# compatibility-only context: the active server-side ruleset still requires
# exact-merge-candidate. Core Runtime CI and Documentation Control Plane already
# execute on merge_group against the prospective merge SHA, so rebuilding or
# re-running source validators here adds no independent safety evidence.
jobs:
  exact-merge:
    name: exact-merge-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Emit compatibility-only context for the event subject
        env:
          SUBJECT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SUBJECT_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$EVENT_NAME" in
            pull_request|push|merge_group) ;;
            *) exit 64 ;;
          esac
          printf 'compatibility-only context for %s at %s\n' "$EVENT_NAME" "$SUBJECT_SHA"
