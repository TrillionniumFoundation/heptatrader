name: merge-candidate

on:
  pull_request: {}
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: merge-candidate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HEPTA_JOBS: "2"

jobs:
  candidate:
    name: exact-merge-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact candidate revision
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Install deterministic toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ libssl-dev python3 python3-jsonschema
      - name: Bind pull-request merge parents and derive module impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check_change_impact.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --merge-candidate "$MERGE_SHA" \
            --output "$RUNNER_TEMP/change-impact.json"
      - name: Assert merge-queue event identity
        if: github.event_name == 'merge_group'
        env:
          MERGE_GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          test -n "$MERGE_GROUP_SHA"
          test "$MERGE_GROUP_SHA" = "${{ github.sha }}"
      - name: Validate candidate deterministic core
        env:
          HEPTA_BUILD_TYPE: Release
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_BUILD_DIR: ${{ runner.temp }}/heptatrader-merge-core
        run: ./scripts/dev_core.sh
      - name: Validate candidate reliability and performance lane
        env:
          CXX: g++
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_RELIABILITY_BUILD_DIR: ${{ runner.temp }}/heptatrader-merge-reliability
        run: ./scripts/reliability_core.sh
      - name: Publish deterministic pull-request impact evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: change-impact-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: ${{ runner.temp }}/change-impact.json
          if-no-files-found: error
          retention-days: 30
