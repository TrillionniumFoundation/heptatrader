name: module-documentation-v3-bootstrap

on:
  push:
    branches:
      - codex/full-gap-closure-20260901

permissions:
  contents: write

concurrency:
  group: module-documentation-v3-bootstrap
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact closure head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Complete ModuleManifest V3 identity and normative documentation
        run: |
          python3 scripts/finalize_module_documentation_v3.py
          python3 scripts/generate_documentation_views.py --write
          python3 scripts/generate_documentation_views.py --check
          python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Remove one-shot migration surface and commit deterministic result
        run: |
          git rm .github/workflows/module-documentation-v3-bootstrap.yml
          git rm scripts/bootstrap_module_documentation_v3.py
          git rm scripts/finalize_module_documentation_v3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No finalization delta"
            exit 0
          fi
          git commit -m "docs: complete ModuleManifest V3 documentation control plane"
          git push origin "HEAD:${GITHUB_REF_NAME}"
