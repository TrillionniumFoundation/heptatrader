name: PR25 postflight staging materializer

on:
  push:
    branches:
      - codex/pr25-postflight-staging-20260906
    paths:
      - '.github/workflows/pr25-postflight-staging-materializer.yml'
      - '.github/workflows/github-governance-qualification.yml'
      - 'scripts/materialize_ib_postflight.py'
      - 'scripts/verify_bootstrap_postflight_contract.py'

permissions:
  contents: write

concurrency:
  group: pr25-postflight-staging-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact staging head without persistent credential
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/pr25-postflight-staging-20260906
          fetch-depth: 2
          persist-credentials: false
      - name: Patch, validate and create immutable IB workflow blob
        id: materialize
        env:
          EXPECTED_GOVERNANCE_BLOB: 9ab8c7d7f81ffed84b2a3707dc71d568c4a9bfef
          EXPECTED_IB_BASE_BLOB: 1ab812e5d963fdefc25fee2db0c3c28f382ed677
          EXPECTED_STATIC_CHECK_BLOB: daa83d2b20088783c53a936c00b0f41f1517b07c
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/ib-paper-qualification.yml)" = "$EXPECTED_IB_BASE_BLOB"
          test "$(git hash-object .github/workflows/github-governance-qualification.yml)" = "$EXPECTED_GOVERNANCE_BLOB"
          test "$(git hash-object scripts/verify_bootstrap_postflight_contract.py)" = "$EXPECTED_STATIC_CHECK_BLOB"
          python3 scripts/materialize_ib_postflight.py
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/ib-paper-qualification.yml')"
          python3 -m py_compile scripts/verify_bootstrap_postflight_contract.py
          python3 scripts/verify_bootstrap_postflight_contract.py --self-test
          git diff --check
          final_blob="$(git hash-object .github/workflows/ib-paper-qualification.yml)"
          test "$final_blob" != "$EXPECTED_IB_BASE_BLOB"
          FINAL_BLOB="$final_blob" python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import urllib.request

          path = Path('.github/workflows/ib-paper-qualification.yml')
          expected = os.environ['FINAL_BLOB']
          payload = json.dumps({
              'content': base64.b64encode(path.read_bytes()).decode('ascii'),
              'encoding': 'base64',
          }).encode('utf-8')
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",
              data=payload,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = json.load(response)
          if body.get('sha') != expected:
              raise SystemExit(f"blob mismatch: expected {expected}, got {body.get('sha')}")
          print(f"FINAL_IB_BLOB={expected}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"blob_sha={expected}\n")
          Path(os.environ['RUNNER_TEMP'], 'final-ib-blob.txt').write_text(
              expected + '\n', encoding='ascii'
          )
          PY
          cp .github/workflows/ib-paper-qualification.yml "$RUNNER_TEMP/ib-paper-qualification.yml"
      - name: Upload exact generated bytes and blob identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr25-ib-postflight-${{ steps.materialize.outputs.blob_sha }}
          path: |
            ${{ runner.temp }}/ib-paper-qualification.yml
            ${{ runner.temp }}/final-ib-blob.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
