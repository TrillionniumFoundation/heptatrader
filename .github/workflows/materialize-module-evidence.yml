name: materialize-module-evidence-sealed

on:
  push:
    branches:
      - codex/heptatrader-doc-evidence-materializer-20260903

permissions:
  contents: read

jobs:
  sealed:
    name: materialize-module-evidence-sealed-read-only
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm one-shot materializer is sealed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/codex/heptatrader-doc-evidence-materializer-20260903
          printf '%s\n' 'The one-shot CAS materializer completed successfully in run 33722338681.'
          printf '%s\n' 'This branch now has read-only permissions and cannot mutate the target branch.'
