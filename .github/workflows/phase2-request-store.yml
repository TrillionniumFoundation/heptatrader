name: One-shot request-store cleanup

on:
  push:
    branches:
      - remediation/full-convergence-20260916

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remediation/full-convergence-20260916
          fetch-depth: 1
      - name: Materialize final tree
        run: |
          python3 scripts/_phase2_request_store.py
          rm scripts/_phase2_request_store.py .github/workflows/phase2-request-store.yml
          git add -A
          git diff --cached --check
      - name: Validate behavior and source truth
        env:
          HEPTA_BUILD_DIR: ${{ github.workspace }}/build/core
          HEPTA_JOBS: "2"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev zlib1g-dev python3-yaml
          ./scripts/dev_core.sh
          python3 scripts/check_documentation.py
          python3 scripts/check_component_coverage.py
          python3 scripts/verify_build_ownership.py
          python3 scripts/run_python_tests.py --lane core
          python3 scripts/run_python_tests.py --lane source
      - name: Commit validated tree
        run: |
          git config user.name "HeptaTrader convergence materializer"
          git config user.email "noreply@github.com"
          git commit -m "refactor: make disk-backed command lookup explicit"
          git push origin HEAD:remediation/full-convergence-20260916
