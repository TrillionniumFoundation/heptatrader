name: Temporary Audited Branch Consolidation

on:
  push:
    branches:
      - codex/branch-consolidation-control-20260908

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact control revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Create audited multi-parent consolidation branch
        env:
          EXPECTED_MAIN_SHA: cc67cb231620363624b0efcfc6934e9a4b3297cc
          TARGET_BRANCH: codex/all-branches-to-main-20260908
          CONTROL_BRANCH: codex/branch-consolidation-control-20260908
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$CONTROL_BRANCH"
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          git fetch --force --prune --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import subprocess
          from typing import Iterable

          expected_main = os.environ["EXPECTED_MAIN_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          control_branch = os.environ["CONTROL_BRANCH"]
          control_sha = os.environ["CONTROL_SHA"]
          receipt_path = Path("docs/branch-consolidation-2026-09-08.json")

          def run(args: Iterable[str], *, input_text: str | None = None,
                  check: bool = True) -> subprocess.CompletedProcess[str]:
              result = subprocess.run(
                  list(args), input=input_text, text=True,
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )
              if check and result.returncode != 0:
                  raise RuntimeError(
                      f"command failed ({result.returncode}): {' '.join(args)}\n"
                      f"stdout={result.stdout}\nstderr={result.stderr}"
                  )
              return result

          def git(*args: str, input_text: str | None = None) -> str:
              return run(("git",) + args, input_text=input_text).stdout.strip()

          def is_ancestor(older: str, newer: str) -> bool:
              result = run(("git", "merge-base", "--is-ancestor", older, newer),
                           check=False)
              if result.returncode == 0:
                  return True
              if result.returncode == 1:
                  return False
              raise RuntimeError(result.stderr)

          git("config", "user.name", "heptatrader-branch-consolidation")
          git("config", "user.email",
              "heptatrader-branch-consolidation@users.noreply.github.com")

          remote_main = git("rev-parse", "refs/remotes/origin/main")
          if remote_main != expected_main:
              raise RuntimeError(f"main moved: {remote_main} != {expected_main}")
          if run(("git", "show-ref", "--verify", "--quiet",
                  f"refs/remotes/origin/{target_branch}"), check=False).returncode == 0:
              raise RuntimeError(f"target branch already exists: {target_branch}")

          main_tree = git("rev-parse", f"{expected_main}^{{tree}}")
          raw_refs = git(
              "for-each-ref", "--format=%(refname)%00%(objectname)",
              "refs/remotes/origin",
          )
          branches: list[dict[str, object]] = []
          for line in raw_refs.splitlines():
              ref, sha = line.split("\0", 1)
              prefix = "refs/remotes/origin/"
              if not ref.startswith(prefix):
                  continue
              name = ref[len(prefix):]
              if name == "HEAD":
                  continue
              tree = git("rev-parse", f"{sha}^{{tree}}")
              ancestor = is_ancestor(sha, expected_main)
              if name == "main":
                  resolution = "canonical-main"
              elif ancestor:
                  resolution = "already-reachable-from-main"
              elif tree == main_tree:
                  resolution = "merge-history-preserve-identical-canonical-tree"
              else:
                  resolution = "merge-history-resolve-tree-to-canonical-main"
              branches.append({
                  "branch": name,
                  "sha": sha,
                  "tree_sha": tree,
                  "already_reachable_from_main": ancestor,
                  "same_tree_as_main": tree == main_tree,
                  "resolution": resolution,
              })

          branches.sort(key=lambda item: str(item["branch"]).encode("utf-8"))
          if not any(item["branch"] == control_branch and
                     item["sha"] == control_sha for item in branches):
              raise RuntimeError("control branch identity missing from inventory")

          by_tip: dict[str, list[str]] = {}
          for item in branches:
              if item["branch"] == "main":
                  continue
              by_tip.setdefault(str(item["sha"]), []).append(str(item["branch"]))
          for names in by_tip.values():
              names.sort(key=lambda value: value.encode("utf-8"))

          receipt = {
              "schema": "heptatrader.branch-consolidation.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "generated_from_control_sha": control_sha,
              "main_before": expected_main,
              "canonical_tree_before": main_tree,
              "branch_count_at_inventory": len(branches),
              "non_main_branch_count_at_inventory": len(branches) - 1,
              "unique_non_main_tip_count": len(by_tip),
              "resolution_policy": {
                  "content_authority": "main tree established by reviewed PR #31",
                  "history_policy": "retain every unique branch tip as reachable ancestry",
                  "conflict_policy": "preserve canonical main contents; do not overlay superseded, experimental, probe, staging, export or pre-canonical trees",
                  "deletion_precondition": "delete a branch only after its recorded tip is reachable from final main",
              },
              "authorization": {
                  "paper_authorized": False,
                  "live_authorized": False,
                  "github_governance_evidence_required": True,
                  "protected_ib_paper_evidence_required": True,
              },
              "branches": branches,
              "merge_batches": [],
              "history_merge_head": None,
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          git("switch", "--force-create", "branch-consolidation-build",
              expected_main)
          git("add", receipt_path.as_posix())
          run(("git", "commit", "-m",
               "chore: record complete pre-consolidation branch inventory"))
          current = git("rev-parse", "HEAD")
          merge_tree = git("rev-parse", "HEAD^{tree}")

          pending: list[tuple[str, list[str]]] = []
          for sha, names in sorted(
              by_tip.items(), key=lambda item: item[1][0].encode("utf-8")
          ):
              if not is_ancestor(sha, current):
                  pending.append((sha, names))

          batches: list[dict[str, object]] = []
          batch_size = 12
          for offset in range(0, len(pending), batch_size):
              candidate_group = pending[offset:offset + batch_size]
              effective = [
                  (sha, names) for sha, names in candidate_group
                  if not is_ancestor(sha, current)
              ]
              if not effective:
                  continue
              parent_args: list[str] = ["-p", current]
              labels: list[str] = []
              for sha, names in effective:
                  parent_args.extend(("-p", sha))
                  labels.append(", ".join(names))
              batch_number = len(batches) + 1
              message = (
                  f"merge: absorb historical branch batch {batch_number}\n\n"
                  "Tree resolution: retain the reviewed canonical main tree plus "
                  "the consolidation receipt. Branch commit histories are joined "
                  "as parents without restoring superseded file states.\n\n"
                  + "\n".join(f"- {label}" for label in labels)
                  + "\n"
              )
              next_commit = git(
                  "commit-tree", merge_tree, *parent_args,
                  input_text=message,
              )
              batches.append({
                  "batch": batch_number,
                  "commit": next_commit,
                  "first_parent": current,
                  "additional_parents": [sha for sha, _ in effective],
                  "branches": [name for _, names in effective for name in names],
              })
              current = next_commit

          unreachable = []
          for item in branches:
              if item["branch"] == "main":
                  continue
              if not is_ancestor(str(item["sha"]), current):
                  unreachable.append(str(item["branch"]))
          if unreachable:
              raise RuntimeError(f"recorded tips not reachable: {unreachable}")

          git("reset", "--hard", current)
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          receipt["merge_batches"] = batches
          receipt["history_merge_head"] = current
          receipt["all_recorded_tips_reachable"] = True
          receipt["batch_count"] = len(batches)
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          git("add", receipt_path.as_posix())
          run(("git", "commit", "-m",
               "chore: finalize audited all-branch consolidation receipt"))
          final_head = git("rev-parse", "HEAD")
          run(("git", "push", "origin",
               f"HEAD:refs/heads/{target_branch}"))

          Path("branch-consolidation-final-head.txt").write_text(
              final_head + "\n", encoding="ascii"
          )
          Path("branch-consolidation-graph.txt").write_text(
              git("log", "--graph", "--oneline", "--decorate",
                  "--max-count=120", final_head) + "\n",
              encoding="utf-8",
          )
          Path("branch-consolidation-reachability.txt").write_text(
              "".join(
                  f"{item['branch']}\t{item['sha']}\treachable\n"
                  for item in branches if item["branch"] != "main"
              ),
              encoding="utf-8",
          )
          print(
              f"created {target_branch}@{final_head}; "
              f"{len(branches)-1} branch refs, {len(by_tip)} unique tips, "
              f"{len(batches)} history batches"
          )
          PY

      - name: Upload consolidation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptatrader-all-branch-consolidation-${{ github.sha }}
          path: |
            docs/branch-consolidation-2026-09-08.json
            branch-consolidation-final-head.txt
            branch-consolidation-graph.txt
            branch-consolidation-reachability.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
