name: External Governance Bootstrap Attempt

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  deployments: write
  issues: write
  pull-requests: write

concurrency:
  group: heptatrader-external-governance-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: external-governance-bootstrap-attempt
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact trusted main without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Attempt teams, protected environments, runner group, then ruleset
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ORGANIZATION: TrillionniumFoundation
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time
          import urllib.parse

          repo = os.environ['REPOSITORY']
          owner, name = repo.split('/', 1)
          org = os.environ['ORGANIZATION']
          token = os.environ['GH_TOKEN']
          source_sha = os.environ['SOURCE_SHA']
          api_version = '2022-11-28'

          def call(method: str, path: str, payload=None):
              url = path if path.startswith('https://') else f'https://api.github.com{path}'
              command = [
                  'curl', '--silent', '--show-error', '--write-out', '\n%{http_code}',
                  '-X', method,
                  '-H', 'Accept: application/vnd.github+json',
                  '-H', f'Authorization: Bearer {token}',
                  '-H', f'X-GitHub-Api-Version: {api_version}',
              ]
              if payload is not None:
                  command += ['-H', 'Content-Type: application/json', '-d', json.dumps(payload)]
              command.append(url)
              completed = subprocess.run(
                  command, text=True, stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT, check=False,
              )
              body, separator, status_text = completed.stdout.rpartition('\n')
              status = int(status_text) if separator and status_text.isdigit() else 0
              try:
                  value = json.loads(body) if body else None
              except json.JSONDecodeError:
                  value = {'unparsed_tail': body[-3000:]}
              return {
                  'method': method,
                  'path': path,
                  'status': status,
                  'body': value,
              }

          repo_packet = call('GET', f'/repos/{repo}')
          repo_id = (repo_packet.get('body') or {}).get('id')
          if not isinstance(repo_id, int):
              raise SystemExit(f'cannot resolve repository id: {repo_packet}')

          codeowners = Path('.github/CODEOWNERS').read_text(encoding='utf-8')
          team_slugs = sorted(set(re.findall(
              rf'@{re.escape(org)}/([A-Za-z0-9_.-]+)', codeowners,
          )))
          if not team_slugs:
              raise SystemExit('CODEOWNERS contains no organization team references')

          report = {
              'schema': 'heptatrader.governance-bootstrap-attempt.v1',
              'source_sha': source_sha,
              'repository': repo,
              'repository_id': repo_id,
              'team_slugs': team_slugs,
              'operations': [],
              'ruleset_created': False,
              'paper_authorized': False,
              'live_authorized': False,
          }

          known_members = ['ProfHepta', 'Franksudoman', 'Tomasrgbsf']
          team_ids = {}
          teams_ok = True
          for slug in team_slugs:
              lookup = call('GET', f'/orgs/{org}/teams/{slug}')
              report['operations'].append(lookup)
              team = lookup.get('body') if lookup['status'] == 200 else None
              if not isinstance(team, dict):
                  create = call('POST', f'/orgs/{org}/teams', {
                      'name': slug.replace('-', ' ').replace('_', ' ').title(),
                      'description': f'HeptaTrader CODEOWNERS team {slug}',
                      'privacy': 'closed',
                  })
                  report['operations'].append(create)
                  team = create.get('body') if create['status'] == 201 else None
              if not isinstance(team, dict) or not isinstance(team.get('id'), int):
                  teams_ok = False
                  continue
              actual_slug = team.get('slug') or slug
              team_ids[slug] = team['id']
              for username in known_members:
                  membership = call(
                      'PUT', f'/orgs/{org}/teams/{actual_slug}/memberships/{username}',
                      {'role': 'maintainer' if username == 'ProfHepta' else 'member'},
                  )
                  report['operations'].append(membership)
                  if membership['status'] not in {200, 201}:
                      teams_ok = False
              grant = call(
                  'PUT', f'/orgs/{org}/teams/{actual_slug}/repos/{repo}',
                  {'permission': 'push'},
              )
              report['operations'].append(grant)
              if grant['status'] not in {204}:
                  teams_ok = False

          reviewers = [
              {'type': 'User', 'id': 273670192},
              {'type': 'User', 'id': 273673612},
          ]
          environments_ok = True
          for environment in ('repository-governance', 'ib-paper'):
              encoded = urllib.parse.quote(environment, safe='')
              configure = call(
                  'PUT', f'/repos/{repo}/environments/{encoded}',
                  {
                      'wait_timer': 0,
                      'prevent_self_review': True,
                      'reviewers': reviewers,
                      'deployment_branch_policy': {
                          'protected_branches': False,
                          'custom_branch_policies': True,
                      },
                  },
              )
              report['operations'].append(configure)
              if configure['status'] not in {200, 201}:
                  environments_ok = False
                  continue
              policies = call(
                  'GET', f'/repos/{repo}/environments/{encoded}/deployment-branch-policies?per_page=100',
              )
              report['operations'].append(policies)
              existing = []
              if policies['status'] == 200 and isinstance(policies.get('body'), dict):
                  existing = [
                      item.get('name') for item in policies['body'].get('branch_policies', [])
                      if isinstance(item, dict)
                  ]
              if 'main' not in existing:
                  policy = call(
                      'POST', f'/repos/{repo}/environments/{encoded}/deployment-branch-policies',
                      {'name': 'main', 'type': 'branch'},
                  )
                  report['operations'].append(policy)
                  if policy['status'] != 200:
                      environments_ok = False

          runner_group = call('POST', f'/orgs/{org}/actions/runner-groups', {
              'name': 'heptatrader-protected-qualification',
              'visibility': 'selected',
              'selected_repository_ids': [repo_id],
              'allows_public_repositories': False,
              'restricted_to_workflows': True,
              'selected_workflows': [
                  f'{repo}/.github/workflows/github-governance-qualification.yml@refs/heads/main',
                  f'{repo}/.github/workflows/ib-paper-qualification.yml@refs/heads/main',
              ],
          })
          report['operations'].append(runner_group)
          runner_ok = runner_group['status'] in {201, 422}
          # 422 may mean the exact named group already exists; require readback.
          groups = call('GET', f'/orgs/{org}/actions/runner-groups?per_page=100')
          report['operations'].append(groups)
          matching_groups = []
          if groups['status'] == 200 and isinstance(groups.get('body'), dict):
              matching_groups = [
                  item for item in groups['body'].get('runner_groups', [])
                  if isinstance(item, dict)
                  and item.get('name') == 'heptatrader-protected-qualification'
              ]
          runner_ok = runner_ok and len(matching_groups) == 1

          prerequisites_ok = teams_ok and environments_ok and runner_ok
          required_contexts = [
              'documentation-control-plane-exact-head',
              'core-runtime-exact-head',
              'canonical-full-suite-core',
              'canonical-full-suite-reliability (g++)',
              'canonical-full-suite-reliability (clang++)',
              'exact-merge-candidate',
              'source-status-exact-head',
              'install-package-smoke',
              'thread-sanitizer-core',
              'source-admission-exact-head',
          ]
          if prerequisites_ok:
              ruleset_payload = {
                  'name': 'heptatrader-main-no-bypass',
                  'target': 'branch',
                  'enforcement': 'active',
                  'bypass_actors': [],
                  'conditions': {
                      'ref_name': {
                          'include': ['~DEFAULT_BRANCH'],
                          'exclude': [],
                      }
                  },
                  'rules': [
                      {'type': 'deletion'},
                      {'type': 'non_fast_forward'},
                      {'type': 'required_linear_history'},
                      {
                          'type': 'pull_request',
                          'parameters': {
                              'dismiss_stale_reviews_on_push': True,
                              'require_code_owner_review': True,
                              'require_last_push_approval': True,
                              'required_approving_review_count': 2,
                              'required_review_thread_resolution': True,
                          },
                      },
                      {
                          'type': 'required_status_checks',
                          'parameters': {
                              'do_not_enforce_on_create': False,
                              'required_status_checks': [
                                  {'context': context, 'integration_id': 15368}
                                  for context in required_contexts
                              ],
                              'strict_required_status_checks_policy': True,
                          },
                      },
                      {
                          'type': 'merge_queue',
                          'parameters': {
                              'check_response_timeout_minutes': 60,
                              'grouping_strategy': 'ALLGREEN',
                              'max_entries_to_build': 5,
                              'max_entries_to_merge': 1,
                              'merge_method': 'SQUASH',
                              'min_entries_to_merge': 1,
                              'min_entries_to_merge_wait_minutes': 0,
                          },
                      },
                  ],
              }
              existing = call('GET', f'/repos/{repo}/rulesets?includes_parents=true&per_page=100')
              report['operations'].append(existing)
              found = []
              if existing['status'] == 200 and isinstance(existing.get('body'), list):
                  found = [
                      item for item in existing['body']
                      if isinstance(item, dict)
                      and item.get('name') == ruleset_payload['name']
                  ]
              if not found:
                  created = call('POST', f'/repos/{repo}/rulesets', ruleset_payload)
                  report['operations'].append(created)
                  report['ruleset_created'] = created['status'] == 201
              else:
                  report['ruleset_created'] = True

          # Read back all predicates after the attempted transaction.
          time.sleep(2)
          report['readback'] = {
              'branch': call('GET', f'/repos/{repo}/branches/main'),
              'rulesets': call('GET', f'/repos/{repo}/rulesets?includes_parents=true&per_page=100'),
              'environments': call('GET', f'/repos/{repo}/environments?per_page=100'),
              'teams': call('GET', f'/repos/{repo}/teams?per_page=100'),
              'runner_groups': call('GET', f'/orgs/{org}/actions/runner-groups?per_page=100'),
          }
          report['prerequisites'] = {
              'teams_ok': teams_ok,
              'environments_ok': environments_ok,
              'runner_group_ok': runner_ok,
              'ruleset_attempted': prerequisites_ok,
          }
          Path('/tmp/governance-bootstrap-attempt.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          summary = [
              f"Exact trusted main: `{source_sha}`",
              f"Teams/grants: {'ready' if teams_ok else 'blocked'}",
              f"Protected environments: {'ready' if environments_ok else 'blocked'}",
              f"Protected runner group: {'ready' if runner_ok else 'blocked'}",
              f"No-bypass ruleset attempted: {prerequisites_ok}",
              "PAPER and LIVE authorization remain false pending verifier receipts.",
          ]
          # Include compact non-2xx evidence without secret headers or response dumps.
          failures = [
              f"{item['method']} {item['path']} -> HTTP {item['status']}"
              for item in report['operations']
              if item['status'] < 200 or item['status'] >= 300
              if item['status'] not in {404, 422}
          ]
          if failures:
              summary.append('Failed administration calls:\n' + '\n'.join(f'- `{item}`' for item in failures[:20]))
          Path('/tmp/governance-bootstrap-summary.md').write_text(
              '\n\n'.join(summary) + '\n', encoding='utf-8'
          )
          if not prerequisites_ok or not report['ruleset_created']:
              raise SystemExit('external governance transaction did not reach verified ruleset creation')
          PY

      - name: Comment exact administration result on G-TEAM-001 and G-IB-001
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -f /tmp/governance-bootstrap-summary.md || exit 0
          for issue in 8 9; do
            BODY="$(cat /tmp/governance-bootstrap-summary.md)" python3 - <<'PY' >/tmp/comment.json
          import json, os
          print(json.dumps({'body': os.environ['BODY']}))
          PY
            curl --fail-with-body --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -X POST "https://api.github.com/repos/$REPOSITORY/issues/$issue/comments" \
              --data-binary @/tmp/comment.json >/dev/null
          done

      - name: Upload administration-attempt evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-bootstrap-attempt-${{ github.sha }}
          path: /tmp/governance-bootstrap-attempt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Close and delete temporary probe refs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']
          probes={
              'administration-probe-do-not-use',
              'governance-bootstrap-probe',
              'ruleset-schema-probe-do-not-use',
              'environment-schema-probe-do-not-use',
              'team-schema-probe-do-not-use',
              'governance-bootstrap-20260908',
          }
          def curl(method,url,payload=None):
              cmd=['curl','--silent','--show-error','-X',method,
                   '-H','Accept: application/vnd.github+json',
                   '-H',f'Authorization: Bearer {token}',
                   '-H','X-GitHub-Api-Version: 2022-11-28']
              if payload is not None: cmd += ['-H','Content-Type: application/json','-d',json.dumps(payload)]
              cmd.append(url); subprocess.run(cmd,check=False,stdout=subprocess.DEVNULL)
          result=subprocess.run([
              'curl','--fail-with-body','--silent','--show-error',
              '-H','Accept: application/vnd.github+json',
              '-H',f'Authorization: Bearer {token}',
              '-H','X-GitHub-Api-Version: 2022-11-28',
              f'https://api.github.com/repos/{repo}/pulls?state=open&per_page=100'
          ],text=True,stdout=subprocess.PIPE,check=True)
          for pull in json.loads(result.stdout):
              if pull.get('head',{}).get('ref') in probes:
                  curl('PATCH',f"https://api.github.com/repos/{repo}/pulls/{pull['number']}",{'state':'closed'})
          for branch in probes:
              curl('DELETE',f'https://api.github.com/repos/{repo}/git/refs/heads/{urllib.parse.quote(branch,safe="")}')
          PY
