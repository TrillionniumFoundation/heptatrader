name: Remediate PR57 publication identity and endpoint ceiling

on:
  push:
    branches:
      - plan/p1-release-package-preflight-20260910
    paths:
      - .github/workflows/codex-fix-pr57-publication-endpoints.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr57-publication-endpoints
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact remediation carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact live branch object
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Apply inode-bound publication and compiled endpoint repairs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              updated, count = re.subn(
                  pattern,
                  lambda _match: replacement,
                  text,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex anchor, found {count}')
              file.write_text(updated, encoding='utf-8')

          same_file = '''def _same_file(left: os.stat_result, right: os.stat_result) -> bool:
              return _file_identity(left) == _file_identity(right)
          '''
          same_file_expanded = '''def _same_file(left: os.stat_result, right: os.stat_result) -> bool:
              return _file_identity(left) == _file_identity(right)


          def _same_inode(left: os.stat_result, right: os.stat_result) -> bool:
              return (
                  left.st_dev,
                  left.st_ino,
                  stat.S_IFMT(left.st_mode),
              ) == (
                  right.st_dev,
                  right.st_ino,
                  stat.S_IFMT(right.st_mode),
              )
          '''
          replace_once(
              'scripts/build_release_package.py',
              textwrap.dedent(same_file),
              textwrap.dedent(same_file_expanded),
          )

          build_publication = r'''def _open_output_directory(path: Path) -> tuple[int, os.stat_result]:
              path.parent.mkdir(parents=True, exist_ok=True)
              flags = (
                  os.O_RDONLY
                  | getattr(os, "O_DIRECTORY", 0)
                  | getattr(os, "O_CLOEXEC", 0)
                  | getattr(os, "O_NOFOLLOW", 0)
              )
              directory = os.open(path.parent, flags)
              try:
                  pinned = os.fstat(directory)
                  current = os.stat(path.parent, follow_symlinks=False)
                  if (
                      not stat.S_ISDIR(pinned.st_mode)
                      or not _same_inode(pinned, current)
                  ):
                      raise PackageError(
                          f"output parent is not a stable directory: {path.parent}"
                      )
                  if (
                      pinned.st_uid != os.geteuid()
                      or stat.S_IMODE(pinned.st_mode) & 0o022
                  ):
                      raise PackageError(
                          "output directory must be operator-custodied: owned by "
                          "the current user and not group/world writable"
                      )
                  return directory, pinned
              except Exception:
                  os.close(directory)
                  raise


          def _open_anonymous_staging(directory: int, mode: int) -> int:
              anonymous = getattr(os, "O_TMPFILE", 0)
              if not anonymous:
                  raise PackageError(
                      "output filesystem lacks anonymous inode-bound staging"
                  )
              try:
                  descriptor = os.open(
                      ".",
                      os.O_RDWR
                      | anonymous
                      | getattr(os, "O_CLOEXEC", 0),
                      mode,
                      dir_fd=directory,
                  )
              except OSError as error:
                  raise PackageError(
                      "output filesystem does not support anonymous "
                      "inode-bound staging"
                  ) from error
              metadata = os.fstat(descriptor)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 0:
                  os.close(descriptor)
                  raise PackageError(
                      "anonymous publication staging is not an unlinked regular file"
                  )
              os.fchmod(descriptor, mode)
              return descriptor


          def _write_all(descriptor: int, content: bytes) -> None:
              remaining = memoryview(content)
              while remaining:
                  try:
                      count = os.write(descriptor, remaining)
                  except InterruptedError:
                      continue
                  if count <= 0:
                      raise PackageError("publication staging write made no progress")
                  remaining = remaining[count:]


          def _descriptor_sha256(descriptor: int) -> str:
              digest = hashlib.sha256()
              offset = 0
              while True:
                  chunk = os.pread(descriptor, 1024 * 1024, offset)
                  if not chunk:
                      return digest.hexdigest()
                  digest.update(chunk)
                  offset += len(chunk)


          def _publish_noreplace(
              directory: int, descriptor: int, final_name: str
          ) -> None:
              # The source is the still-open anonymous inode, never a mutable
              # staging pathname. Destination creation remains atomic/no-replace.
              os.link(
                  f"/proc/self/fd/{descriptor}",
                  final_name,
                  dst_dir_fd=directory,
                  follow_symlinks=True,
              )


          def _validate_published_output(
              directory: int,
              descriptor: int,
              final_name: str,
              content: bytes,
              mode: int,
          ) -> None:
              pinned = os.fstat(descriptor)
              published = os.stat(
                  final_name, dir_fd=directory, follow_symlinks=False
              )
              if (
                  not stat.S_ISREG(published.st_mode)
                  or published.st_nlink != 1
                  or not _same_inode(pinned, published)
                  or published.st_size != len(content)
                  or stat.S_IMODE(published.st_mode) != mode
                  or _descriptor_sha256(descriptor) != sha256_bytes(content)
              ):
                  raise PackageError(
                      "published output identity, bytes or mode differ from "
                      "the fsynced staging inode"
                  )


          def _ensure_new_outputs'''
          sub_once(
              'scripts/build_release_package.py',
              r'def _open_output_directory\(path: Path\) -> int:\n.*?\n\ndef _ensure_new_outputs',
              textwrap.dedent(build_publication),
          )

          build_writer = r'''def _write_atomic(path: Path, content: bytes, mode: int) -> None:
              path = _absolute_output(path)
              directory, pinned_directory = _open_output_directory(path)
              descriptor = -1
              published = False
              try:
                  descriptor = _open_anonymous_staging(directory, mode)
                  _write_all(descriptor, content)
                  os.fsync(descriptor)
                  try:
                      _publish_noreplace(directory, descriptor, path.name)
                      published = True
                  except FileExistsError as error:
                      raise PackageError(
                          f"refusing to replace concurrently created output: {path}"
                      ) from error
                  _validate_published_output(
                      directory, descriptor, path.name, content, mode
                  )
                  current_directory = os.stat(
                      path.parent, follow_symlinks=False
                  )
                  if not _same_inode(pinned_directory, current_directory):
                      raise PackageError(
                          "output directory identity changed during publication"
                      )
                  os.fsync(directory)
              except Exception:
                  # Roll back only the exact inode published by this writer.
                  # Never unlink a replacement supplied by another publisher.
                  if published and descriptor >= 0:
                      try:
                          current = os.stat(
                              path.name,
                              dir_fd=directory,
                              follow_symlinks=False,
                          )
                          if _same_inode(os.fstat(descriptor), current):
                              os.unlink(path.name, dir_fd=directory)
                              os.fsync(directory)
                      except OSError:
                          pass
                  raise
              finally:
                  if descriptor >= 0:
                      os.close(descriptor)
                  os.close(directory)


          def package_install_root'''
          sub_once(
              'scripts/build_release_package.py',
              r'def _write_atomic\(path: Path, content: bytes, mode: int\) -> None:\n.*?\n\ndef package_install_root',
              textwrap.dedent(build_writer),
          )

          replace_once(
              'scripts/hepta_preflight_core.py',
              'import hashlib\nimport json\n',
              'import hashlib\nimport ipaddress\nimport json\n',
          )
          replace_once(
              'scripts/hepta_preflight_core.py',
              'HARD_PRIVATE_KEY_SUFFIXES = frozenset({".key", ".pem", ".p12", ".pfx", ".jks"})\n',
              'HARD_PRIVATE_KEY_SUFFIXES = frozenset({".key", ".pem", ".p12", ".pfx", ".jks"})\n'
              'HARD_ALLOWED_BROKER_HOSTS = frozenset({"127.0.0.1", "::1"})\n'
              'HARD_ALLOWED_BROKER_PORTS = frozenset({4002, 7497})\n',
          )
          replace_once(
              'scripts/hepta_preflight_core.py',
              textwrap.dedent(same_file),
              textwrap.dedent(same_file_expanded),
          )

          policy_helpers = r'''

          def _canonical_string_array(value: Any, label: str) -> list[str]:
              if (
                  not isinstance(value, list)
                  or not value
                  or any(
                      not isinstance(item, str)
                      or not item
                      or item.strip() != item
                      for item in value
                  )
                  or value != sorted(value)
                  or len(value) != len(set(value))
              ):
                  raise PreflightError(f"{label} must be a sorted unique string array")
              return value


          def _validate_profile_policy(profiles: dict[str, Any]) -> None:
              core = profiles.get("core")
              paper = profiles.get("ib-paper")
              if not isinstance(core, dict) or set(core) != {
                  "required_package_paths",
                  "required_host_commands",
              }:
                  raise PreflightError("core preflight profile fields are not canonical")
              if not isinstance(paper, dict) or set(paper) != {
                  "required_package_paths",
                  "required_host_commands",
                  "allowed_broker_hosts",
                  "allowed_broker_ports",
              }:
                  raise PreflightError("ib-paper preflight profile fields are not canonical")
              for name, profile in (("core", core), ("ib-paper", paper)):
                  _canonical_string_array(
                      profile.get("required_package_paths"),
                      f"{name}.required_package_paths",
                  )
                  _canonical_string_array(
                      profile.get("required_host_commands"),
                      f"{name}.required_host_commands",
                  )

              hosts = _canonical_string_array(
                  paper.get("allowed_broker_hosts"),
                  "ib-paper.allowed_broker_hosts",
              )
              for host in hosts:
                  try:
                      parsed = ipaddress.ip_address(host)
                  except ValueError as error:
                      raise PreflightError(
                          "broker policy hosts must be literal IP addresses"
                      ) from error
                  if str(parsed) != host:
                      raise PreflightError(
                          "broker policy hosts must use canonical literal IP form"
                      )
              ports = paper.get("allowed_broker_ports")
              if (
                  not isinstance(ports, list)
                  or not ports
                  or any(
                      not isinstance(port, int)
                      or isinstance(port, bool)
                      or port < 1
                      or port > 65535
                      for port in ports
                  )
                  or ports != sorted(ports)
                  or len(ports) != len(set(ports))
              ):
                  raise PreflightError(
                      "ib-paper.allowed_broker_ports must be a sorted unique port array"
                  )
          '''
          replace_once(
              'scripts/hepta_preflight_core.py',
              '\n\ndef _load_policy(path: Path) -> LoadedPolicy:\n',
              textwrap.dedent(policy_helpers)
              + '\n\ndef _load_policy(path: Path) -> LoadedPolicy:\n',
          )
          replace_once(
              'scripts/hepta_preflight_core.py',
              '''    profiles = value.get("profiles")
              if not isinstance(profiles, dict) or set(profiles) != {"core", "ib-paper"}:
                  raise PreflightError("preflight policy profiles are not canonical")
              return LoadedPolicy(value, raw_bytes, absolute)
          ''',
              '''    profiles = value.get("profiles")
              if not isinstance(profiles, dict) or set(profiles) != {"core", "ib-paper"}:
                  raise PreflightError("preflight policy profiles are not canonical")
              _validate_profile_policy(profiles)
              return LoadedPolicy(value, raw_bytes, absolute)
          ''',
          )

          preflight_publication = r'''def _open_receipt_output_directory(
              path: Path,
          ) -> tuple[int, os.stat_result]:
              path.parent.mkdir(parents=True, exist_ok=True)
              directory = os.open(
                  path.parent,
                  os.O_RDONLY
                  | getattr(os, "O_DIRECTORY", 0)
                  | getattr(os, "O_CLOEXEC", 0)
                  | getattr(os, "O_NOFOLLOW", 0),
              )
              try:
                  pinned = os.fstat(directory)
                  current = os.stat(path.parent, follow_symlinks=False)
                  if (
                      not stat.S_ISDIR(pinned.st_mode)
                      or not _same_inode(pinned, current)
                  ):
                      raise PreflightError(
                          f"receipt parent is not a stable directory: {path.parent}"
                      )
                  if (
                      pinned.st_uid != os.geteuid()
                      or stat.S_IMODE(pinned.st_mode) & 0o022
                  ):
                      raise PreflightError(
                          "receipt output directory must be operator-custodied: "
                          "owned by the current user and not group/world writable"
                      )
                  return directory, pinned
              except Exception:
                  os.close(directory)
                  raise


          def _open_anonymous_receipt(directory: int) -> int:
              anonymous = getattr(os, "O_TMPFILE", 0)
              if not anonymous:
                  raise PreflightError(
                      "receipt filesystem lacks anonymous inode-bound staging"
                  )
              try:
                  descriptor = os.open(
                      ".",
                      os.O_RDWR
                      | anonymous
                      | getattr(os, "O_CLOEXEC", 0),
                      0o600,
                      dir_fd=directory,
                  )
              except OSError as error:
                  raise PreflightError(
                      "receipt filesystem does not support anonymous "
                      "inode-bound staging"
                  ) from error
              metadata = os.fstat(descriptor)
              if not stat.S_ISREG(metadata.st_mode) or metadata.st_nlink != 0:
                  os.close(descriptor)
                  raise PreflightError(
                      "anonymous receipt staging is not an unlinked regular file"
                  )
              os.fchmod(descriptor, 0o600)
              return descriptor


          def _write_all_descriptor(descriptor: int, content: bytes) -> None:
              remaining = memoryview(content)
              while remaining:
                  try:
                      count = os.write(descriptor, remaining)
                  except InterruptedError:
                      continue
                  if count <= 0:
                      raise PreflightError(
                          "receipt staging write made no progress"
                      )
                  remaining = remaining[count:]


          def _descriptor_sha256(descriptor: int) -> str:
              digest = hashlib.sha256()
              offset = 0
              while True:
                  chunk = os.pread(descriptor, 1024 * 1024, offset)
                  if not chunk:
                      return digest.hexdigest()
                  digest.update(chunk)
                  offset += len(chunk)


          def _publish_noreplace(
              directory: int, descriptor: int, final_name: str
          ) -> None:
              os.link(
                  f"/proc/self/fd/{descriptor}",
                  final_name,
                  dst_dir_fd=directory,
                  follow_symlinks=True,
              )


          def _write_private_receipt(path: Path, value: dict[str, Any]) -> None:
              path = _absolute_path(path)
              content = canonical_json(value)
              directory, pinned_directory = _open_receipt_output_directory(path)
              descriptor = -1
              published = False
              try:
                  descriptor = _open_anonymous_receipt(directory)
                  _write_all_descriptor(descriptor, content)
                  os.fsync(descriptor)
                  try:
                      _publish_noreplace(directory, descriptor, path.name)
                      published = True
                  except FileExistsError as error:
                      raise PreflightError(
                          f"refusing to replace concurrently created receipt: {path}"
                      ) from error
                  pinned = os.fstat(descriptor)
                  current = os.stat(
                      path.name, dir_fd=directory, follow_symlinks=False
                  )
                  if (
                      not stat.S_ISREG(current.st_mode)
                      or current.st_nlink != 1
                      or not _same_inode(pinned, current)
                      or current.st_size != len(content)
                      or stat.S_IMODE(current.st_mode) != 0o600
                      or _descriptor_sha256(descriptor)
                      != hashlib.sha256(content).hexdigest()
                  ):
                      raise PreflightError(
                          "published receipt identity, bytes or mode differ "
                          "from the fsynced staging inode"
                      )
                  current_directory = os.stat(
                      path.parent, follow_symlinks=False
                  )
                  if not _same_inode(pinned_directory, current_directory):
                      raise PreflightError(
                          "receipt output directory identity changed during publication"
                      )
                  os.fsync(directory)
              except Exception:
                  if published and descriptor >= 0:
                      try:
                          current = os.stat(
                              path.name,
                              dir_fd=directory,
                              follow_symlinks=False,
                          )
                          if _same_inode(os.fstat(descriptor), current):
                              os.unlink(path.name, dir_fd=directory)
                              os.fsync(directory)
                      except OSError:
                          pass
                  raise
              finally:
                  if descriptor >= 0:
                      os.close(descriptor)
                  os.close(directory)


          def run_preflight'''
          sub_once(
              'scripts/hepta_preflight_core.py',
              r'def _publish_noreplace\(\n.*?\n\ndef run_preflight',
              textwrap.dedent(preflight_publication),
          )

          endpoint_old = '''        else:
                      hosts = set(selected.get("allowed_broker_hosts", []))
                      ports = set(selected.get("allowed_broker_ports", []))
                      if args.broker_host not in hosts or args.broker_port not in ports:
                          record("broker.reachability", "FAIL", "Broker endpoint is outside the PAPER policy")
                      else:
          '''
          endpoint_new = '''        elif (
                      args.broker_host not in HARD_ALLOWED_BROKER_HOSTS
                      or args.broker_port not in HARD_ALLOWED_BROKER_PORTS
                  ):
                      record(
                          "broker.reachability",
                          "FAIL",
                          "Broker endpoint is outside the compiled PAPER endpoint boundary",
                      )
                  else:
                      hosts = set(selected.get("allowed_broker_hosts", []))
                      ports = set(selected.get("allowed_broker_ports", []))
                      if args.broker_host not in hosts or args.broker_port not in ports:
                          record("broker.reachability", "FAIL", "Broker endpoint is outside the PAPER policy")
                      else:
          '''
          replace_once(
              'scripts/hepta_preflight_core.py',
              textwrap.dedent(endpoint_old),
              textwrap.dedent(endpoint_new),
          )

          endpoint_test = r'''

              def test_packaged_policy_cannot_widen_compiled_broker_endpoint_ceiling(
                  self,
              ) -> None:
                  with tempfile.TemporaryDirectory() as directory:
                      work = Path(directory)
                      policy_value = json.loads(
                          POLICY.read_text(encoding="utf-8")
                      )
                      paper = policy_value["profiles"]["ib-paper"]
                      paper["allowed_broker_hosts"] = sorted(
                          set(paper["allowed_broker_hosts"])
                          | {"192.0.2.1"}
                      )
                      paper["allowed_broker_ports"] = sorted(
                          set(paper["allowed_broker_ports"])
                          | {4001}
                      )
                      widened_policy = work / "widened-policy.json"
                      widened_policy.write_bytes(
                          preflight.canonical_json(policy_value)
                      )
                      root = fixture_tree(work / "root", ib=True)
                      packaged_policy = (
                          root
                          / "share/heptatrader/preflight-policy-v1.json"
                      )
                      packaged_policy.write_bytes(widened_policy.read_bytes())
                      artifact = work / "ib-paper.tar.gz"
                      package = release.package_install_root(
                          root,
                          artifact,
                          version=VERSION,
                          profile="ib-paper",
                          source_sha=SOURCE_SHA,
                          source_date_epoch=EPOCH,
                      )

                      for label, host, port in (
                          ("non-loopback", "192.0.2.1", 4002),
                          ("non-paper-port", "127.0.0.1", 4001),
                      ):
                          with self.subTest(label=label):
                              args = args_for(
                                  artifact,
                                  package["package_sha256"],
                                  profile="ib-paper",
                              )
                              args.policy = widened_policy
                              args.probe_broker = True
                              args.broker_host = host
                              args.broker_port = port
                              with mock.patch.object(
                                  preflight.socket, "create_connection"
                              ) as connect:
                                  receipt = preflight.run_preflight(args)
                              connect.assert_not_called()
                              self.assertEqual(
                                  check(receipt, "artifact.integrity")["status"],
                                  "PASS",
                              )
                              self.assertEqual(receipt["result"], "FAIL")
                              self.assertIn(
                                  "compiled PAPER endpoint boundary",
                                  check(receipt, "broker.reachability")["detail"],
                              )

                      args = args_for(
                          artifact,
                          package["package_sha256"],
                          profile="ib-paper",
                      )
                      args.policy = widened_policy
                      args.probe_broker = True
                      connection = mock.MagicMock()
                      with mock.patch.object(
                          preflight.socket,
                          "create_connection",
                          return_value=connection,
                      ) as connect:
                          receipt = preflight.run_preflight(args)
                      connect.assert_called_once_with(
                          ("127.0.0.1", 4002), timeout=0.1
                      )
                      self.assertEqual(
                          check(receipt, "broker.reachability")["status"],
                          "PASS",
                      )
          '''
          replace_once(
              'tests/python/test_hepta_preflight.py',
              '\n    def test_receipt_output_is_never_replaced(self) -> None:\n',
              textwrap.dedent(endpoint_test)
              + '\n    def test_receipt_output_is_never_replaced(self) -> None:\n',
          )
          replace_once(
              'tests/python/test_hepta_preflight.py',
              '            "test_static_host_owner_mismatch_is_rejected",\n',
              '            "test_static_host_owner_mismatch_is_rejected",\n'
              '            "test_packaged_policy_cannot_widen_compiled_broker_endpoint_ceiling",\n',
          )

          publication_tests = r'''from __future__ import annotations

          import os
          from pathlib import Path
          import stat
          import sys
          import tempfile
          import unittest
          from unittest import mock

          ROOT = Path(__file__).resolve().parents[2]
          sys.path.insert(0, str(ROOT / "scripts"))

          import build_release_package as release  # noqa: E402
          import hepta_preflight as preflight  # noqa: E402


          class PublicationIdentityTests(unittest.TestCase):
              def _exercise_decoy_attack(
                  self,
                  module,
                  writer,
                  final_name: str,
                  expected: bytes,
                  *,
                  symlink: bool,
              ) -> None:
                  with tempfile.TemporaryDirectory() as directory:
                      work = Path(directory)
                      output = work / final_name
                      attacker_target = work / "attacker-target"
                      attacker_target.write_bytes(b"attacker-controlled\n")
                      original_publish = module._publish_noreplace
                      decoy_name = f".{final_name}.attacker"
                      attacked = False

                      def interposed_publish(
                          directory_fd: int,
                          descriptor: int,
                          destination: str,
                      ) -> None:
                          nonlocal attacked
                          self.assertEqual(destination, final_name)
                          self.assertIsInstance(descriptor, int)
                          self.assertEqual(os.fstat(descriptor).st_nlink, 0)
                          self.assertFalse(
                              [
                                  name
                                  for name in os.listdir(directory_fd)
                                  if name.startswith(f".{final_name}.")
                              ]
                          )
                          if symlink:
                              os.symlink(
                                  attacker_target.name,
                                  decoy_name,
                                  dir_fd=directory_fd,
                              )
                          else:
                              decoy = os.open(
                                  decoy_name,
                                  os.O_WRONLY | os.O_CREAT | os.O_EXCL,
                                  0o600,
                                  dir_fd=directory_fd,
                              )
                              try:
                                  os.write(decoy, b"replacement-inode\n")
                                  os.fsync(decoy)
                              finally:
                                  os.close(decoy)
                          attacked = True
                          original_publish(
                              directory_fd, descriptor, destination
                          )

                      with mock.patch.object(
                          module,
                          "_publish_noreplace",
                          side_effect=interposed_publish,
                      ):
                          writer(output)
                      self.assertTrue(attacked)
