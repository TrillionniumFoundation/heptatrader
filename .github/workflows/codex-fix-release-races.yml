name: Codex Release Race Hardening

on:
  push:
    branches:
      - codex/close-source-blockers-v2-2026-09-08

permissions:
  contents: write

concurrency:
  group: codex-release-race-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'chore: stage one-shot release race hardening')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .codex/release-race-fix/part-* > "$RUNNER_TEMP/release-race-fix.b64"
          base64 --decode "$RUNNER_TEMP/release-race-fix.b64" | gzip --decompress > "$RUNNER_TEMP/codex_fix_release_races.py"
          python3 -m py_compile "$RUNNER_TEMP/codex_fix_release_races.py"
          python3 "$RUNNER_TEMP/codex_fix_release_races.py"
          python3 -m py_compile \
            scripts/build_release_package.py \
            scripts/hepta_preflight.py \
            tests/python/test_release_security_races.py

      - name: Run focused hostile regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/python -p 'test_release_package.py'
          python3 -m unittest discover -s tests/python -p 'test_hepta_preflight.py'
          python3 -m unittest discover -s tests/python -p 'test_release_security_races.py'
          python3 scripts/check_documentation.py

      - name: Commit exact remediation and remove one-shot machinery
        shell: bash
        env:
          BRANCH: codex/close-source-blockers-v2-2026-09-08
        run: |
          set -euo pipefail
          git rm -r .codex/release-race-fix .github/workflows/codex-fix-release-races.yml
          git add \
            scripts/build_release_package.py \
            scripts/hepta_preflight.py \
            tests/python/test_release_security_races.py \
            docs/module-catalog.json
          git diff --cached --check
          git config user.name 'Qian QI'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git commit -m 'fix(release): pin inputs and publish without replacement'
          git push origin "HEAD:$BRANCH"
