name: m7-integration
# revision: isolated-bootstrap-v3

on:
  push:
    branches:
      - codex/heptatrader-documentation-control-plane-v2
    paths:
      - .github/workflows/m7-integration.yml

permissions:
  contents: write

concurrency:
  group: heptatrader-m7-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-documentation-control-plane-v2
          fetch-depth: 0
      - name: Build durable M7 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hepta M7 Integration Bot"
          git config user.email "hepta-m7-integration-bot@users.noreply.github.com"
          python3 -m py_compile scripts/m7_integration_patch.py
          python3 scripts/m7_integration_patch.py
          rm -f scripts/m7_integration_patch.py
          python3 scripts/generate_documentation_views.py --write
          git add -A
          git commit -m "feat: enforce module-aware merge-candidate verification"
          test -z "$(git status --porcelain)"
      - name: Validate exact M7 candidate
        env:
          HEPTA_BUILD_DIR: ${{ runner.temp }}/heptatrader-m7-core
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: "2"
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          bootstrap="$RUNNER_TEMP/m7-integration.yml"
          mv .github/workflows/m7-integration.yml "$bootstrap"
          restore_bootstrap() {
            mv "$bootstrap" .github/workflows/m7-integration.yml
          }
          trap restore_bootstrap EXIT
          ./scripts/dev_core.sh
          restore_bootstrap
          trap - EXIT
          test -z "$(git status --porcelain)"
      - name: Publish exact tested revision
        run: git push origin HEAD:codex/heptatrader-documentation-control-plane-v2
