name: Remediate PR57 source snapshot topology

on:
  push:
    branches:
      - plan/p1-release-package-preflight-20260910
    paths:
      - .github/workflows/codex-fix-pr57-source-snapshot-topology.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr57-source-snapshot-topology
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout exact remediation carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact live branch object
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
          EXPECTED_PARENT: 86ef523b59f1f9efe4d446c081305ae6cbc3f6e9
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Pin install root, directory chain and leaf identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              updated, count = re.subn(
                  pattern,
                  lambda _match: replacement,
                  text,
                  count=1,
                  flags=re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one structural anchor, found {count}'
                  )
              target.write_text(updated, encoding='utf-8')

          snapshot_block = textwrap.dedent(r'''
          def _directory_flags() -> int:
              return (
                  os.O_RDONLY
                  | getattr(os, "O_DIRECTORY", 0)
                  | getattr(os, "O_CLOEXEC", 0)
                  | getattr(os, "O_NOFOLLOW", 0)
              )


          def _canonical_component(name: str, label: str) -> None:
              if (
                  not isinstance(name, str)
                  or not name
                  or name in {".", ".."}
                  or "/" in name
                  or "\\" in name
              ):
                  raise PackageError(f"{label} is not a canonical path component")
              _canonical_path_bytes(name, label)


          def _open_directory_absolute(
              path: Path, label: str
          ) -> tuple[int, os.stat_result, Path]:
              absolute = Path(os.path.abspath(os.fspath(path)))
              descriptor = os.open("/", _directory_flags())
              try:
                  for part in absolute.parts[1:]:
                      _canonical_component(part, label)
                      following = os.open(
                          part, _directory_flags(), dir_fd=descriptor
                      )
                      metadata = os.fstat(following)
                      if not stat.S_ISDIR(metadata.st_mode):
                          os.close(following)
                          raise PackageError(
                              f"{label} component is not a directory: {part}"
                          )
                      os.close(descriptor)
                      descriptor = following
                  pinned = os.fstat(descriptor)
                  current = os.stat(absolute, follow_symlinks=False)
                  if (
                      not stat.S_ISDIR(pinned.st_mode)
                      or not _same_file(pinned, current)
                  ):
                      raise PackageError(
                          f"{label} is not a stable no-follow directory"
                      )
                  return descriptor, pinned, absolute
              except Exception:
                  os.close(descriptor)
                  raise


          def _reopen_directory_chain(
              root_path: Path,
              root_pinned: os.stat_result,
              chain: tuple[tuple[str, os.stat_result], ...],
              relative: str,
          ) -> int:
              descriptor, fresh_root, _ = _open_directory_absolute(
                  root_path, "install root confirmation"
              )
              try:
                  if not _same_file(root_pinned, fresh_root):
                      raise PackageError(
                          "install root identity changed during payload snapshot"
                      )
                  for name, expected in chain:
                      following = os.open(
                          name, _directory_flags(), dir_fd=descriptor
                      )
                      actual = os.fstat(following)
                      if (
                          not stat.S_ISDIR(actual.st_mode)
                          or not _same_file(expected, actual)
                      ):
                          os.close(following)
                          raise PackageError(
                              "payload directory topology changed during "
                              f"snapshot: {relative}"
                          )
                      os.close(descriptor)
                      descriptor = following
                  return descriptor
              except Exception:
                  os.close(descriptor)
                  raise


          def _validate_directory_namespace(
              root_path: Path,
              root_pinned: os.stat_result,
              directory: int,
              directory_pinned: os.stat_result,
              chain: tuple[tuple[str, os.stat_result], ...],
              relative: str,
          ) -> None:
              try:
                  held = os.fstat(directory)
                  if not _same_file(directory_pinned, held):
                      raise PackageError(
                          "payload directory descriptor changed during "
                          f"snapshot: {relative}"
                      )
                  confirmation = _reopen_directory_chain(
                      root_path, root_pinned, chain, relative
                  )
                  try:
                      if not _same_file(
                          directory_pinned, os.fstat(confirmation)
                      ):
                          raise PackageError(
                              "payload directory path changed during "
                              f"snapshot: {relative}"
                          )
                  finally:
                      os.close(confirmation)
              except OSError as error:
                  raise PackageError(
                      "payload directory namespace changed during "
                      f"snapshot: {relative}: {error}"
                  ) from error


          def _validate_snapshot_namespace(
              root_path: Path,
              root_pinned: os.stat_result,
              directory: int,
              directory_pinned: os.stat_result,
              chain: tuple[tuple[str, os.stat_result], ...],
              name: str,
              pinned: os.stat_result,
              relative: str,
          ) -> None:
              try:
                  held_directory = os.fstat(directory)
                  held_leaf = os.stat(
                      name, dir_fd=directory, follow_symlinks=False
                  )
                  if (
                      not _same_file(directory_pinned, held_directory)
                      or not _same_file(pinned, held_leaf)
                  ):
                      raise PackageError(
                          "payload leaf or parent path changed after "
                          f"snapshot: {relative}"
                      )
                  confirmation = _reopen_directory_chain(
                      root_path, root_pinned, chain, relative
                  )
                  try:
                      fresh_leaf = os.stat(
                          name,
                          dir_fd=confirmation,
                          follow_symlinks=False,
                      )
                      if (
                          not _same_file(
                              directory_pinned,
                              os.fstat(confirmation),
                          )
                          or not _same_file(pinned, fresh_leaf)
                      ):
                          raise PackageError(
                              "payload namespace changed after snapshot: "
                              f"{relative}"
                          )
                  finally:
                      os.close(confirmation)
              except OSError as error:
                  raise PackageError(
                      "payload namespace changed after snapshot: "
                      f"{relative}: {error}"
                  ) from error


          def _validate_complete_payload_namespace(
              root_path: Path,
              root_pinned: os.stat_result,
              directories: list[
                  tuple[
                      tuple[tuple[str, os.stat_result], ...],
                      os.stat_result,
                      str,
                  ]
              ],
              leaves: list[
                  tuple[
                      tuple[tuple[str, os.stat_result], ...],
                      str,
                      os.stat_result,
                      str,
                  ]
              ],
          ) -> None:
              for chain, expected, relative in directories:
                  confirmation = _reopen_directory_chain(
                      root_path, root_pinned, chain, relative
                  )
                  try:
                      if not _same_file(expected, os.fstat(confirmation)):
                          raise PackageError(
                              "payload directory changed before namespace "
                              f"commit: {relative}"
                          )
                  finally:
                      os.close(confirmation)
              for chain, name, expected, relative in leaves:
                  confirmation = _reopen_directory_chain(
                      root_path, root_pinned, chain, relative
                  )
                  try:
                      current = os.stat(
                          name,
                          dir_fd=confirmation,
                          follow_symlinks=False,
                      )
                      if not _same_file(expected, current):
                          raise PackageError(
                              "payload leaf changed before namespace commit: "
                              f"{relative}"
                          )
                  except OSError as error:
                      raise PackageError(
                          "payload leaf namespace changed before commit: "
                          f"{relative}: {error}"
                      ) from error
                  finally:
                      os.close(confirmation)


          def _snapshot_source(
              root_path: Path,
              root_pinned: os.stat_result,
              directory: int,
              directory_pinned: os.stat_result,
              chain: tuple[tuple[str, os.stat_result], ...],
              name: str,
              observed: os.stat_result,
              relative: str,
          ) -> tuple[BinaryIO, os.stat_result, str]:
              descriptor = -1
              snapshot: BinaryIO | None = None
              try:
                  descriptor = os.open(
                      name,
                      _regular_file_flags(),
                      dir_fd=directory,
                  )
                  pinned = os.fstat(descriptor)
                  current = os.stat(
                      name, dir_fd=directory, follow_symlinks=False
                  )
                  if (
                      not stat.S_ISREG(pinned.st_mode)
                      or pinned.st_nlink != 1
                      or pinned.st_dev != directory_pinned.st_dev
                      or not _same_file(observed, pinned)
                      or not _same_file(pinned, current)
                  ):
                      raise PackageError(
                          "payload is not one stable regular single-link "
                          f"file: {relative}"
                      )
                  _clear_nonblocking(descriptor)
                  if pinned.st_mode & (stat.S_ISUID | stat.S_ISGID):
                      raise PackageError(
                          f"setuid/setgid file is forbidden: {relative}"
                      )
                  if pinned.st_size > MAX_FILE_BYTES:
                      raise PackageError(
                          f"file exceeds release size bound: {relative}"
                      )

                  snapshot = tempfile.TemporaryFile(mode="w+b")
                  digest = hashlib.sha256()
                  total = 0
                  while True:
                      try:
                          chunk = os.read(descriptor, 1024 * 1024)
                      except InterruptedError:
                          continue
                      if not chunk:
                          break
                      total += len(chunk)
                      if total > MAX_FILE_BYTES:
                          raise PackageError(
                              f"file exceeds release size bound: {relative}"
                          )
                      digest.update(chunk)
                      snapshot.write(chunk)
                  after = os.fstat(descriptor)
                  if (
                      not _same_file(pinned, after)
                      or total != pinned.st_size
                  ):
                      raise PackageError(
                          "file changed while being snapshotted: "
                          f"{relative}"
                      )
                  snapshot.flush()
                  _validate_snapshot_namespace(
                      root_path,
                      root_pinned,
                      directory,
                      directory_pinned,
                      chain,
                      name,
                      pinned,
                      relative,
                  )
                  snapshot.seek(0)
                  return snapshot, pinned, digest.hexdigest()
              except Exception:
                  if snapshot is not None:
                      snapshot.close()
                  raise
              finally:
                  if descriptor >= 0:
                      os.close(descriptor)


          def close_payload''')
          replace_regex(
              'scripts/build_release_package.py',
              r'def _snapshot_source\(\n.*?\n\ndef close_payload',
              snapshot_block,
          )

          collect_block = textwrap.dedent(r'''
          def collect_payload(root: Path) -> list[PayloadFile]:
              root_descriptor = -1
              payload: list[PayloadFile] = []
              admitted_paths: set[str] = set()
              directory_pins: list[
                  tuple[
                      tuple[tuple[str, os.stat_result], ...],
                      os.stat_result,
                      str,
                  ]
              ] = []
              leaf_pins: list[
                  tuple[
                      tuple[tuple[str, os.stat_result], ...],
                      str,
                      os.stat_result,
                      str,
                  ]
              ] = []
              total = 0
              try:
                  root_descriptor, root_pinned, root_path = (
                      _open_directory_absolute(root, "install root")
                  )
                  if root_path == Path("/"):
                      raise PackageError(
                          "filesystem root cannot be a release install root"
                      )
                  directory_pins.append((tuple(), root_pinned, "."))

                  def visit(
                      directory: int,
                      directory_pinned: os.stat_result,
                      chain: tuple[tuple[str, os.stat_result], ...],
                      parts: tuple[str, ...],
                  ) -> None:
                      nonlocal total
                      relative_directory = "/".join(parts) or "."
                      _validate_directory_namespace(
                          root_path,
                          root_pinned,
                          directory,
                          directory_pinned,
                          chain,
                          relative_directory,
                      )
                      try:
                          with os.scandir(directory) as iterator:
                              entries = [
                                  (
                                      entry.name,
                                      entry.stat(follow_symlinks=False),
                                  )
                                  for entry in iterator
                              ]
                      except OSError as error:
                          raise PackageError(
                              "cannot enumerate stable install directory "
                              f"{relative_directory}: {error}"
                          ) from error

                      for name, observed in sorted(
                          entries, key=lambda item: item[0]
                      ):
                          _canonical_component(name, "payload path")
                          child_parts = parts + (name,)
                          relative = "/".join(child_parts)
                          _canonical_path_bytes(relative, "payload path")
                          if stat.S_ISDIR(observed.st_mode):
                              _reject_generated_namespace_collision(relative)
                              child = -1
                              try:
                                  child = os.open(
                                      name,
                                      _directory_flags(),
                                      dir_fd=directory,
                                  )
                                  pinned = os.fstat(child)
                                  current = os.stat(
                                      name,
                                      dir_fd=directory,
                                      follow_symlinks=False,
                                  )
                                  if (
                                      not stat.S_ISDIR(pinned.st_mode)
                                      or pinned.st_dev
                                      != directory_pinned.st_dev
                                      or not _same_file(observed, pinned)
                                      or not _same_file(pinned, current)
                                  ):
                                      raise PackageError(
                                          "payload directory identity changed "
                                          f"before traversal: {relative}"
                                      )
                                  child_chain = chain + ((name, pinned),)
                                  directory_pins.append(
                                      (child_chain, pinned, relative)
                                  )
                                  visit(
                                      child,
                                      pinned,
                                      child_chain,
                                      child_parts,
                                  )
                                  after = os.fstat(child)
                                  current_after = os.stat(
                                      name,
                                      dir_fd=directory,
                                      follow_symlinks=False,
                                  )
                                  if (
                                      not _same_file(pinned, after)
                                      or not _same_file(
                                          pinned, current_after
                                      )
                                  ):
                                      raise PackageError(
                                          "payload directory changed during "
                                          f"traversal: {relative}"
                                      )
                                  _validate_directory_namespace(
                                      root_path,
                                      root_pinned,
                                      child,
                                      pinned,
                                      child_chain,
                                      relative,
                                  )
                              except OSError as error:
                                  raise PackageError(
                                      "payload directory namespace changed: "
                                      f"{relative}: {error}"
                                  ) from error
                              finally:
                                  if child >= 0:
                                      os.close(child)
                              continue

                          _admit_payload_path(relative, admitted_paths)
                          if (
                              len(admitted_paths)
                              + len(GENERATED_ARCHIVE_PATHS)
                              > MAX_ARCHIVE_MEMBERS
                          ):
                              raise PackageError(
                                  "release archive exceeds member-count bound "
                                  "including generated metadata"
                              )
                          if _looks_private(relative):
                              raise PackageError(
                                  "private-key or secret-like path is "
                                  f"forbidden: {relative}"
                              )
                          if (
                              not stat.S_ISREG(observed.st_mode)
                              or observed.st_nlink != 1
                          ):
                              raise PackageError(
                                  "only regular single-link files may be "
                                  f"packaged: {relative}"
                              )
                          snapshot, pinned, digest = _snapshot_source(
                              root_path,
                              root_pinned,
                              directory,
                              directory_pinned,
                              chain,
                              name,
                              observed,
                              relative,
                          )
                          total += pinned.st_size
                          if total > MAX_TOTAL_BYTES:
                              snapshot.close()
                              raise PackageError(
                                  "release payload exceeds total size bound"
                              )
                          payload.append(
                              PayloadFile(
                                  path=relative,
                                  snapshot=snapshot,
                                  size=pinned.st_size,
                                  mode=_file_mode(pinned),
                                  sha256=digest,
                              )
                          )
                          leaf_pins.append(
                              (chain, name, pinned, relative)
                          )

                      _validate_directory_namespace(
                          root_path,
                          root_pinned,
                          directory,
                          directory_pinned,
                          chain,
                          relative_directory,
                      )

                  visit(
                      root_descriptor,
                      root_pinned,
                      tuple(),
                      tuple(),
                  )
                  if not payload:
                      raise PackageError("install root is empty")
                  _validate_complete_payload_namespace(
                      root_path,
                      root_pinned,
                      directory_pins,
                      leaf_pins,
                  )
                  return sorted(payload, key=lambda item: item.path)
              except Exception:
                  close_payload(payload)
                  raise
              finally:
                  if root_descriptor >= 0:
                      os.close(root_descriptor)


          def build_manifest''')
          replace_regex(
              'scripts/build_release_package.py',
              r'def collect_payload\(root: Path\) -> list\[PayloadFile\]:\n.*?\n\ndef build_manifest',
              collect_block,
          )

          tests = Path('tests/python/test_release_package.py')
          text = tests.read_text(encoding='utf-8')
          marker = '\n    def test_source_mutation_after_snapshot_cannot_change_archive_bytes(self) -> None:\n'
          addition = textwrap.dedent(r'''
              def test_leaf_replacement_after_snapshot_copy_is_rejected(
                  self,
              ) -> None:
                  with tempfile.TemporaryDirectory() as directory:
                      work = Path(directory)
                      root = fixture_tree(work / "root")
                      output = work / "release.tar.gz"
                      target = root / "bin/heptactl"
                      original = release._validate_snapshot_namespace
                      replaced = False

                      def replacing_leaf(*args, **kwargs):
                          nonlocal replaced
                          relative = args[-1]
                          if not replaced and relative == "bin/heptactl":
                              replacement = target.with_name(
                                  "heptactl-replacement"
                              )
                              replacement.write_bytes(
                                  b"replacement-after-copy\n"
                              )
                              replacement.chmod(0o755)
                              os.replace(replacement, target)
                              replaced = True
                          return original(*args, **kwargs)

                      with mock.patch.object(
                          release,
                          "_validate_snapshot_namespace",
                          side_effect=replacing_leaf,
                      ):
                          with self.assertRaisesRegex(
                              release.PackageError,
                              "payload .*changed after snapshot|payload namespace",
                          ):
                              self.package(root, output)
                      self.assertTrue(replaced)
                      self.assertFalse(output.exists())
                      self.assertFalse(
                          Path(str(output) + ".sha256").exists()
                      )
                      self.assertFalse(
                          Path(str(output) + ".receipt.json").exists()
                      )

              def test_ancestor_directory_replacement_after_copy_is_rejected(
                  self,
              ) -> None:
                  with tempfile.TemporaryDirectory() as directory:
                      work = Path(directory)
                      root = fixture_tree(work / "root")
                      output = work / "release.tar.gz"
                      original = release._validate_snapshot_namespace
                      replaced = False

                      def replacing_ancestor(*args, **kwargs):
                          nonlocal replaced
                          relative = args[-1]
                          if (
                              not replaced
                              and relative
                              == "share/doc/heptatrader/index.md"
                          ):
                              original_share = root / "share"
                              displaced = root / "share-displaced"
                              original_share.rename(displaced)
                              replacement = (
                                  root
                                  / "share/doc/heptatrader/index.md"
                              )
                              replacement.parent.mkdir(parents=True)
                              replacement.write_bytes(
                                  b"replacement-tree\n"
                              )
                              replacement.chmod(0o644)
                              replaced = True
                          return original(*args, **kwargs)

                      with mock.patch.object(
                          release,
                          "_validate_snapshot_namespace",
                          side_effect=replacing_ancestor,
                      ):
                          with self.assertRaisesRegex(
                              release.PackageError,
                              "install root identity changed|directory topology changed|payload namespace",
                          ):
                              self.package(root, output)
                      self.assertTrue(replaced)
                      self.assertFalse(output.exists())
                      self.assertFalse(
                          Path(str(output) + ".sha256").exists()
                      )
                      self.assertFalse(
                          Path(str(output) + ".receipt.json").exists()
                      )

          ''')
          if text.count(marker) != 1:
              raise SystemExit('release hostile-test insertion anchor drifted')
          tests.write_text(
              text.replace(marker, '\n' + addition + marker, 1),
              encoding='utf-8',
          )

          security = Path('docs/RELEASE-PUBLICATION-SECURITY.md')
          doc = security.read_text(encoding='utf-8')
          old = (
              'Release payload files, the preflight policy and the release archive '
              'are opened through a no-follow parent directory descriptor. The '
              'implementation binds the opened descriptor to its device, inode, '
              'mode, link count, size, modification time and change time, copies '
              'the bytes once into an anonymous immutable snapshot, computes the '
              'digest while copying, and consumes that same snapshot for manifest '
              'construction, archive generation or archive inspection.\n\n'
              'The original descriptor and path identity are checked again after '
              'the copy or inspection. Path replacement, in-place mutation, '
              'link-count change, metadata change, disappearance or size drift '
              'fails closed. Hashing one pathname open and parsing another is '
              'forbidden.\n'
          )
          new = (
              'The release builder opens the install root component by component '
              'with no-follow directory descriptors and keeps that root pinned for '
              'the complete payload snapshot. Every child directory is opened '
              'relative to its pinned parent; every leaf is opened nonblocking and '
              'no-follow relative to that directory. The implementation binds root, '
              'directory and leaf objects to device, inode, mode, link count, size, '
              'modification time and change time, copies each leaf once into an '
              'anonymous immutable snapshot, and computes the digest while copying.\n\n'
              'After every copy, the still-open leaf descriptor, leaf name under the '
              'held parent, freshly reopened install-root path, complete logical '
              'directory chain and leaf name under that fresh chain must all resolve '
              'to the pinned objects. A final full-tree namespace pass repeats the '
              'directory and leaf checks before the payload snapshot is committed. '
              'Leaf replacement, ancestor-directory replacement, root replacement, '
              'in-place mutation, link-count change, disappearance or metadata drift '
              'fails closed. The policy and archive inspection paths use the same '
              'descriptor/path identity discipline; hashing one pathname open and '
              'parsing another is forbidden.\n'
          )
          if doc.count(old) != 1:
              raise SystemExit('security input-contract anchor drifted')
          doc = doc.replace(old, new, 1)
          doc = doc.replace(
              '- a release payload source changes after it has been snapshotted and hashed;\n',
              '- a release payload source changes after it has been snapshotted and hashed;\n'
              '- a payload leaf pathname is replaced after its bytes are copied but before namespace commitment;\n'
              '- an ancestor directory is renamed and replaced after a descendant leaf is copied;\n',
              1,
          )
          security.write_text(doc, encoding='utf-8')

          procedure = Path('docs/operations/release-package.md')
          doc = procedure.read_text(encoding='utf-8')
          anchor = (
              'The output path, `.sha256` sidecar and `.receipt.json` sidecar '
              'must not already exist.'
          )
          prefix = (
              'The install root is a stable snapshot boundary. The builder pins '
              'the no-follow root and every traversed directory, opens each leaf '
              'relative to those descriptors, and revalidates the full root/'
              'ancestor/leaf namespace after every copy and again before manifest '
              'construction. Concurrent leaf or ancestor replacement fails before '
              'any output is published.\n\n'
          )
          if prefix not in doc:
              if doc.count(anchor) != 1:
                  raise SystemExit('release procedure anchor drifted')
              doc = doc.replace(anchor, prefix + anchor, 1)
          procedure.write_text(doc, encoding='utf-8')
          PY
          rm .github/workflows/codex-fix-pr57-source-snapshot-topology.yml
          python3 -m py_compile \
            scripts/build_release_package.py \
            tests/python/test_release_package.py
          git diff --check

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ libssl-dev

      - name: Run release identity hostile regressions
        run: |
          set -euo pipefail
          python3 -m unittest tests.python.test_release_package -v
          python3 -m unittest tests.python.test_preflight_special_files -v
          python3 -m unittest tests.python.test_publication_identity -v
          python3 -m unittest tests.python.test_hepta_preflight -v

      - name: Run complete canonical validation
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          ./scripts/dev_core.sh
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          HEPTA_RELEASE_INTEGRATION_BUILD_DIR="$PWD/build/core" \
            python3 -m unittest \
              tests.python.test_cmake_install_integration -v

      - name: Publish carrier-free repaired source
        env:
          EXPECTED_BRANCH: plan/p1-release-package-preflight-20260910
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          git commit -m 'fix(release): pin install-root snapshot topology'
          git push origin "HEAD:$EXPECTED_BRANCH"
