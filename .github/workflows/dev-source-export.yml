name: dev-source-export

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Record exact revision
        run: git rev-parse HEAD > SOURCE_HEAD
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: heptatrader-source-${{ github.sha }}
          path: |
            .
            !.git
            !build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
