name: Remediate PR58 atomic flatten envelope

on:
  push:
    branches:
      - plan/p2-bounded-paper-v5-source-20260910
    paths:
      - .github/workflows/codex-fix-pr58-v5-envelope.yml

permissions:
  contents: write

concurrency:
  group: codex-fix-pr58-v5-envelope
  cancel-in-progress: false

jobs:
  remediate:
    if: github.repository == 'TrillionniumFoundation/heptatrader'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact remediation carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact live branch object
        env:
          EXPECTED_BRANCH: plan/p2-bounded-paper-v5-source-20260910
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$GITHUB_SHA"

      - name: Apply bounded V5 and intermediate-slice repairs
        env:
          PATCH_GZIP_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import os

          payload = base64.b64decode(os.environ['PATCH_GZIP_B64'], validate=True)
          source = gzip.decompress(payload)
          compile(source, 'fix_pr58.py', 'exec')
          exec(source, {'__name__': '__main__'})
          PY

      - name: Remove the one-shot carrier before whole-tree validation
        run: |
          set -euo pipefail
          rm .github/workflows/codex-fix-pr58-v5-envelope.yml
          git diff --check

      - name: Build and run the complete canonical core and Python suites
        env:
          HEPTA_JOBS: '2'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build libssl-dev
          ./scripts/dev_core.sh
          python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Publish the final source slice
        env:
          EXPECTED_BRANCH: plan/p2-bounded-paper-v5-source-20260910
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'ProfHepta'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add \
            HeptaTrade/execution/ib_paper_execution_profile.cpp \
            tests/ib_paper_execution_profile_tests.cpp \
            docs/modules/deployment.md \
            tests/python/test_hepta_broker_egress_policy.py \
            .github/workflows/codex-fix-pr58-v5-envelope.yml
          git commit -m 'fix(ib-paper): keep V5 exposure atomically flattenable'
          git push origin "HEAD:$EXPECTED_BRANCH"
