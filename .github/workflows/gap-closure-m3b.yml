name: gap-closure-m3b

on:
  push:
    branches:
      - codex/heptatrader-m3-work
    paths:
      - .github/workflows/gap-closure-m3b.yml

permissions:
  contents: write

jobs:
  sharded-data-and-features:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout M3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-m3-work
          fetch-depth: 0
      - name: Apply M3-B integration
        run: python3 scripts/m3b_patch.py
      - name: Validate deterministic core
        run: ./scripts/dev_core.sh
      - name: Commit exact tested implementation
        run: |
          set -euo pipefail
          git config user.name "Hepta Gap Closure Bot"
          git config user.email "hepta-gap-closure-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: add sharded market data and deterministic features"
          git push origin HEAD:codex/heptatrader-m3-work
