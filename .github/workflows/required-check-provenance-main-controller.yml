name: One-shot Main Required Check Provenance

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: heptatrader-main-required-check-provenance
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake make g++ libssl-dev

      - name: Read workflow IDs and update required-check policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, subprocess
          from pathlib import Path

          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']
          targets={
              'source-status-exact-head': '.github/workflows/source-status.yml',
              'install-package-smoke': '.github/workflows/install-package-smoke.yml',
              'thread-sanitizer-core': '.github/workflows/thread-sanitizer.yml',
              'source-admission-exact-head': '.github/workflows/source-admission.yml',
          }
          result=subprocess.run([
              'curl','--fail-with-body','--silent','--show-error',
              '-H','Accept: application/vnd.github+json',
              '-H',f'Authorization: Bearer {token}',
              '-H','X-GitHub-Api-Version: 2022-11-28',
              f'https://api.github.com/repos/{repo}/actions/workflows?per_page=100'
          ],text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,check=False)
          if result.returncode:
              raise SystemExit(result.stdout[-4000:])
          workflows=json.loads(result.stdout).get('workflows',[])
          by_path={item.get('path'):item for item in workflows if isinstance(item,dict)}
          missing=sorted(set(targets.values())-set(by_path))
          if missing: raise SystemExit(f'live Actions API misses workflows: {missing}')

          path=Path('.github/required-check-contexts-v1.json')
          policy=json.loads(path.read_text(encoding='utf-8'))
          ordered=list(targets)
          for field in (
              'required_branch_contexts',
              'required_pull_request_contexts',
              'required_merge_group_contexts',
          ):
              values=policy[field]
              for context in ordered:
                  if context not in values: values.append(context)
          provenance=policy['required_check_provenance']['contexts']
          for context,workflow_path in targets.items():
              provenance[context]={
                  'workflow_id': int(by_path[workflow_path]['id']),
                  'workflow_path': workflow_path,
                  'job_name': context,
              }
          observations=policy.get('non_required_observation_contexts',[])
          policy['non_required_observation_contexts']=[
              item for item in observations if item not in targets
          ]
          path.write_text(json.dumps(policy,indent=2)+'\n',encoding='utf-8')
          Path('/tmp/required-check-workflows.json').write_text(
              json.dumps({context:provenance[context] for context in ordered},indent=2)+'\n',
              encoding='utf-8'
          )
          PY

      - name: Validate required-check trust boundary
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/check_module_documentation_depth.py
          python3 scripts/check_gap_register.py
          python3 scripts/check_qualification_trust_boundary.py
          python3 -m unittest discover -s tests/python -p 'test_github_governance*.py'
          python3 -m unittest discover -s tests/python -p 'test_qualification_trust_boundary.py'
          python3 -m unittest discover -s tests/python -p 'test_gap_register.py'
          git diff --check

      - name: Commit observed provenance and remove controller
        run: |
          set -euo pipefail
          rm .github/workflows/required-check-provenance-main-controller.yml
          git add -A
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: bind required checks to live workflow provenance'
          git push origin HEAD:main
