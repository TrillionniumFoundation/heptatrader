name: HeptaDLL Modular Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/heptadll-integration.yml'
      - 'CMakeLists.txt'
      - 'cmake/HeptaStrategyClient*'
      - 'cmake/strategy-client-build-info.txt.in'
      - 'VERSION'
      - 'research/**'
      - 'tests/research/**'
      - 'docs/modules/research-sdk.md'
      - 'docs/technical/heptadll-integration.md'

  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heptadll-integration-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [gcc-release, clang-asan-ubsan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Build and test the exact public source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROFILE: ${{ matrix.profile }}
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang python3
          mkdir -p build/research-ci
          printf '%s\n' "$EXPECTED_SHA" > build/research-ci/SOURCE_COMMIT
          flags='-Wall -Wextra -Wpedantic -Werror'
          if [ "$PROFILE" = clang-asan-ubsan ]; then
            cmake -S research -B build/research-ci -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ \
              "-DCMAKE_CXX_FLAGS=$flags -fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined
          else
            cmake -S research -B build/research-ci -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ \
              "-DCMAKE_CXX_FLAGS=$flags"
          fi
          cmake --build build/research-ci --parallel 2
          ctest --test-dir build/research-ci --no-tests=error --output-on-failure \
            --output-junit results.xml
          git diff --exit-code
      - name: Stage the verified offline GCC SDK
        if: success() && matrix.profile == 'gcc-release'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(uname -m)" = x86_64
          test -z "$(git status --porcelain --untracked-files=normal)"
          cmake --install build/research-ci --prefix "$PWD/build/research-sdk-stage" --component ResearchSDK
          grep -Fx "source_sha=$EXPECTED_SHA" build/research-sdk-stage/share/HeptaResearch/sdk-build-info.txt
          grep -Fx 'source_tree_state=clean' build/research-sdk-stage/share/HeptaResearch/sdk-build-info.txt
          mkdir -p build/research-sdk-artifacts
          archive="hepta-research-sdk-linux-x86_64-$EXPECTED_SHA.tar.gz"
          tar -czf "build/research-sdk-artifacts/$archive" -C build/research-sdk-stage .
          (cd build/research-sdk-artifacts && sha256sum "$archive" > "$archive.sha256")
          cp build/research-ci/SOURCE_COMMIT build/research-sdk-artifacts/
          git archive --format=tar.gz --output=build/research-sdk-artifacts/heptatrader-source.tar.gz HEAD
          git rev-parse 'HEAD^{tree}' > build/research-sdk-artifacts/SOURCE_TREE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: success() && matrix.profile == 'gcc-release'
        with:
          name: research-sdk-linux-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/research-sdk-artifacts/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: research-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/research-ci/SOURCE_COMMIT
            build/research-ci/results.xml
            build/research-ci/Testing/Temporary/
          if-no-files-found: warn
          retention-days: 7

  offline-platform:
    # Additive OS/toolchain acceptance. Existing Linux/sanitizer/client jobs stay intact.
    name: offline-sdk-${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: macos-arm64, os: macos-14}
          - {profile: macos-x86_64, os: macos-15-intel}
          - {profile: windows-msvc, os: windows-2022}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Native AppleClang offline SDK and relocated consumer
        if: runner.os == 'macOS'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python3 tests/research/platform_sdk_acceptance.py --profile "$PROFILE" --source-sha "$EXPECTED_SHA"
      - name: Native MSVC offline SDK and relocated consumer
        if: runner.os == 'Windows'
        shell: cmd
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROFILE: ${{ matrix.profile }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          python tests/research/platform_sdk_acceptance.py --profile "%PROFILE%" --source-sha "%EXPECTED_SHA%"
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: offline-platform-${{ matrix.profile }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/platform-artifacts-${{ matrix.profile }}/
            build/offline-${{ matrix.profile }}/Testing/Temporary/
          if-no-files-found: error
          retention-days: 7
