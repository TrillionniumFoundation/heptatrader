name: Temporary Unix Cancel Test Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: validate-and-publish-deterministic-cancel-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Assert exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}" --depth=1
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_SHA"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake ninja-build g++ libssl-dev

      - name: Materialize final clean test repair
        run: |
          set -euo pipefail
          python3 scripts/apply_unix_cancel_test_fix.py
          rm -f \
            .github/workflows/unix-cancel-test-repair.yml \
            scripts/apply_unix_cancel_test_fix.py
          git diff --check
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/unix-cancel-test-repair.yml \
            scripts/apply_unix_cancel_test_fix.py \
            tests/unix_tool_server_tests.cpp | LC_ALL=C sort)"
          test "$actual" = "$expected"

      - name: Validate contracts and ordinary core suite
        run: |
          set -euo pipefail
          python3 scripts/check_documentation.py
          python3 scripts/verify_build_ownership.py
          python3 scripts/check_gap_register.py
          python3 scripts/verify_source_gap_closures.py
          python3 scripts/verify_canonical_ib_paper_profile.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'
          ./scripts/dev_core.sh

      - name: Reproduce GCC sanitizer lane and repeat cancellation test
        env:
          CC: gcc
          CXX: g++
          CXXFLAGS: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -euo pipefail
          cmake -S . -B build/cancel-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DBUILD_TESTING=ON \
            -DHEPTA_ENABLE_IBAPI=OFF \
            -DHEPTA_ENABLE_LEGACY_0DTE_BRIDGE=OFF \
            -DHEPTA_BUILD_LEGACY_MONOLITH=OFF \
            -DHEPTA_BUILD_LEGACY_SIMULATOR=OFF
          cmake --build build/cancel-gcc \
            --target hepta_unix_tool_server_tests --parallel 2
          ctest --test-dir build/cancel-gcc --output-on-failure \
            -R '^hepta_unix_tool_server_tests$' --repeat until-fail:20

      - name: Publish only the verified fast-forward source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}" --depth=1
          test "$(git rev-parse refs/remotes/origin/${HEAD_REF})" = "$EXPECTED_SHA"
          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/unix-cancel-test-repair.yml \
            scripts/apply_unix_cancel_test_fix.py \
            tests/unix_tool_server_tests.cpp | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git config user.name 'heptatrader-gap-closure-bot'
          git config user.email 'heptatrader-gap-closure-bot@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'test: synchronize queued cancellation deterministically'
          git push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Record terminal worktree state
        if: always()
        run: |
          git status --short
          git log -2 --format='%H %s'
