      - name: Verify every canonical closure contract on the generated tree
        env:
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: "2"
        run: |
          rm -rf build/core-release build/reliability-*
          python3 scripts/generate_tool_catalog.py --check
          python3 scripts/check_repository_integrity.py
          python3 scripts/check_schema_catalog.py
          python3 scripts/check_module_discipline.py
          python3 scripts/check_gap_closure.py
          python3 research/run_protocol.py verify \
            --manifest research/manifest-v1.json
          ./scripts/dev_core.sh
          stage="$RUNNER_TEMP/heptatrader-runtime"
          DESTDIR="$stage" cmake --install build/core-release \
            --component runtime
          python3 scripts/check_install_tree.py "$stage"
          CXX=g++ ./scripts/reliability_core.sh

      - name: Record exact source digest and commit the clean candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          root = Path.cwd()
          target = root / "docs/development/FINAL-VERIFICATION.json"
          digest = hashlib.sha256()
          for path in sorted(
              item for item in root.rglob("*")
              if item.is_file()
              and ".git" not in item.parts
              and "build" not in item.parts
              and item != target
          ):
              relative = path.relative_to(root).as_posix()
              digest.update(relative.encode("utf-8"))
              digest.update(b"\0")
              digest.update(path.read_bytes())
              digest.update(b"\0")

          record = {
              "schema": "heptatrader.final-verification.v1",
              "status": "PASS",
              "verified_parent_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "verified_source_tree_sha256": "sha256:" + digest.hexdigest(),
              "gaps": {
                  f"G-{index:03d}": "closed"
                  for index in range(1, 17)
              },
              "commands": [
                  "python3 scripts/generate_tool_catalog.py --check",
                  "python3 scripts/check_repository_integrity.py",
                  "python3 scripts/check_schema_catalog.py",
                  "python3 scripts/check_module_discipline.py",
                  "python3 scripts/check_gap_closure.py",
                  "python3 research/run_protocol.py verify --manifest research/manifest-v1.json",
                  "./scripts/dev_core.sh",
                  "staged runtime install plus scripts/check_install_tree.py",
                  "CXX=g++ ./scripts/reliability_core.sh",
              ],
              "capability_limits": {
                  "ib_paper": "experimental_external_sdk_and_host_required",
                  "live": "unsupported",
                  "ctp": "unsupported_fail_closed",
                  "xt_qmt": "unsupported_fail_closed",
              },
          }
          target.write_text(
              json.dumps(record, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 scripts/check_gap_closure.py
          git config user.name "Tomasrgbsf"
          git config user.email "tomasbraynt@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m \
            "feat: close and verify all canonical HeptaTrader gaps"
          git push origin HEAD:codex/heptatrader-gap-closure-v2

# trigger: canonical schema checker v8
