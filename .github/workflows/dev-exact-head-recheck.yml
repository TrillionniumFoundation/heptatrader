name: dev-exact-head-recheck

on:
  push:
    branches:
      - codex/heptatrader-gap-closure-v2
    paths:
      - .github/workflows/dev-exact-head-recheck.yml

permissions:
  contents: write

jobs:
  exact-head-recheck:
    if: "${{ github.repository == 'TrillionniumFoundation/heptatrader' && github.event.head_commit.message == 'chore(dev): launch exact head closure recheck' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/heptatrader-gap-closure-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build g++ clang libssl-dev python3

      - name: Reconstruct all implementation slices and remove temporary workflows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              ".github/workflows/dev-gap-closure-guardian.yml"
          ).read_text(encoding="utf-8")
          marker = "          python3 - <<'PY'\n"
          start = source.find(marker)
          if start < 0:
              raise RuntimeError("gap closure guardian marker missing")
          start += len(marker)
          end = source.find("\n          PY\n", start)
          if end < 0:
              raise RuntimeError("gap closure guardian terminator missing")
          program = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in source[start:end].splitlines()
          )
          exec(compile(program, "exact-gap-closure-guardian", "exec"), {})

          generator = Path("scripts/generate_tool_catalog.py")
          text = generator.read_text(encoding="utf-8")
          text = text.replace("DIGEST_PATH", "DIGEST")
          text = text.replace("def digest(", "def catalog_digest(")
          text = text.replace(
              "expected_digest(value)", "catalog_digest(value)"
          )
          text = re.sub(
              r"(?<![A-Za-z0-9_])digest\(value\)",
              "catalog_digest(value)",
              text,
          )
          generator.write_text(text, encoding="utf-8")
          compile(text, str(generator), "exec")
          PY

      - name: Verify every canonical closure contract on the generated tree
        env:
          HEPTA_CMAKE_GENERATOR: Ninja
          HEPTA_JOBS: "2"
        run: |
          rm -rf build/core-release build/reliability-*
          python3 scripts/generate_tool_catalog.py --check
          python3 scripts/check_repository_integrity.py
          python3 scripts/check_schema_catalog.py
          python3 scripts/check_module_discipline.py
          python3 scripts/check_gap_closure.py
          python3 research/run_protocol.py verify \
            --manifest research/manifest-v1.json
          ./scripts/dev_core.sh
          stage="$RUNNER_TEMP/heptatrader-runtime"
          DESTDIR="$stage" cmake --install build/core-release \
            --component runtime
          python3 scripts/check_install_tree.py "$stage"
          CXX=g++ ./scripts/reliability_core.sh

      - name: Record exact source digest and commit the clean candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          root = Path.cwd()
          target = root / "docs/development/FINAL-VERIFICATION.json"
          digest = hashlib.sha256()
          for path in sorted(
              item for item in root.rglob("*")
              if item.is_file()
              and ".git" not in item.parts
              and "build" not in item.parts
              and item != target
          ):
              relative = path.relative_to(root).as_posix()
              digest.update(relative.encode("utf-8"))
              digest.update(b"\0")
              digest.update(path.read_bytes())
              digest.update(b"\0")

          record = {
              "schema": "heptatrader.final-verification.v1",
              "status": "PASS",
              "verified_parent_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "verified_source_tree_sha256": "sha256:" + digest.hexdigest(),
              "gaps": {
                  f"G-{index:03d}": "closed"
                  for index in range(1, 17)
              },
              "commands": [
                  "python3 scripts/generate_tool_catalog.py --check",
                  "python3 scripts/check_repository_integrity.py",
                  "python3 scripts/check_schema_catalog.py",
                  "python3 scripts/check_module_discipline.py",
                  "python3 scripts/check_gap_closure.py",
                  "python3 research/run_protocol.py verify --manifest research/manifest-v1.json",
                  "./scripts/dev_core.sh",
                  "staged runtime install plus scripts/check_install_tree.py",
                  "CXX=g++ ./scripts/reliability_core.sh",
              ],
              "capability_limits": {
                  "ib_paper": "experimental_external_sdk_and_host_required",
                  "live": "unsupported",
                  "ctp": "unsupported_fail_closed",
                  "xt_qmt": "unsupported_fail_closed",
              },
          }
          target.write_text(
              json.dumps(record, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 scripts/check_gap_closure.py
          git config user.name "Tomasrgbsf"
          git config user.email "tomasbraynt@gmail.com"
          git add -A
          git diff --cached --check
          git commit -s -m \
            "feat: close and verify all canonical HeptaTrader gaps"
          git push origin HEAD:codex/heptatrader-gap-closure-v2

